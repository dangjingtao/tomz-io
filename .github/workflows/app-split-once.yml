name: One-time App split

on:
  push:
    branches:
      - preview/weekly-v0-1
    paths:
      - .github/workflows/app-split-once.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies without creating a second lockfile
        run: npm install --package-lock=false

      - name: Split App.tsx by responsibility
        run: |
          python <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          source = app_path.read_text(encoding='utf-8')

          def block(start, end=None):
              a = source.index(start)
              b = source.index(end, a) if end else len(source)
              return source[a:b].strip() + '\n'

          def export_decl(text, declarations):
              for decl in declarations:
                  needle = decl
                  replacement = 'export ' + decl
                  if needle not in text:
                      raise SystemExit(f'missing declaration: {decl}')
                  text = text.replace(needle, replacement, 1)
              return text

          # Shared site runtime/model. Keep data logic in one place and out of App.tsx.
          runtime = block('type LinkItem =', 'function escapeHtml')
          runtime = export_decl(runtime, [
              'type LinkItem =',
              'type ThemeName =',
              'const themeOptions:',
              'type SiteArea =',
              'const githubUrl =',
              'const appBase =',
              'function navigationDirectory(',
              'function docHref(',
              'function decodedPathname(',
              'function resolveCoverSource(',
              'const siteAreas:',
              'const articleDocs =',
              'const tomzMarkSrc =',
              'const localMiraAvatarUrl =',
              'function handleMiraAvatarError(',
              'const siteTitle =',
              'function getPageTitle(',
              'const authorProfiles:',
              'function getDocAuthors(',
              'function getDocAuthorLabel(',
              'function getDocAuthorAvatars(',
              'function getDocSignature(',
              'const blogNavCategories =',
          ])
          nav = block('const content = {', 'function ShareButton')
          nav = nav.replace('const content = {', 'export const siteContent = {', 1)
          nav = nav.replace('content.nav = [', 'siteContent.nav = [', 1)
          runtime_file = '''import type { SyntheticEvent } from "react";
          import {
            authorAvatarUrl,
            githubProfileUrl,
            miraAvatarUrl,
            siteName,
            topNavigationOrder,
          } from "../site.config";
          import {
            allDocs,
            pageDirectories,
            compareDocs,
            type AuthorKey,
            type Doc,
          } from "../content/mira-docs-adapter";

          ''' + runtime + '\n' + nav
          runtime_file = '\n'.join(line[10:] if line.startswith('          ') else line for line in runtime_file.splitlines()) + '\n'
          Path('src/app').mkdir(parents=True, exist_ok=True)
          Path('src/app/site-runtime.ts').write_text(runtime_file, encoding='utf-8')

          # Markdown engine + Mermaid renderer.
          markdown = block('function escapeHtml', 'const content = {')
          markdown = export_decl(markdown, ['function renderMarkdown(', 'function RenderedMarkdown('])
          markdown_file = '''import { useEffect, useRef } from "react";
          import { marked } from "marked";
          import hljs from "highlight.js/lib/common";
          import { slug } from "../content/mira-docs-adapter";

          ''' + markdown
          markdown_file = '\n'.join(line[10:] if line.startswith('          ') else line for line in markdown_file.splitlines()) + '\n'
          Path('src/components/MarkdownContent.tsx').write_text(markdown_file, encoding='utf-8')

          share = export_decl(block('function ShareButton', 'function PwaUpdatePrompt'), ['function ShareButton('])
          Path('src/components/ShareButton.tsx').write_text(
              'import { useState } from "react";\nimport { Share2 } from "lucide-react";\n\n' + share,
              encoding='utf-8',
          )

          pwa = export_decl(block('function PwaUpdatePrompt', 'function SiteHeaderBase'), ['function PwaUpdatePrompt('])
          Path('src/app/PwaUpdatePrompt.tsx').write_text(
              'import { useEffect, useState } from "react";\n\n' + pwa,
              encoding='utf-8',
          )

          header = export_decl(block('function SiteHeaderBase', 'function NotFoundPage'), ['function SiteHeaderBase('])
          header = header.replace('content.nav', 'siteContent.nav')
          header_file = '''import { useEffect, useRef, useState } from "react";
          import {
            Archive,
            BookOpen,
            ChevronDown,
            Code2,
            Compass,
            Menu,
            Moon,
            Network,
            Sun,
            X,
          } from "lucide-react";
          import { Link, useLocation } from "react-router-dom";
          import {
            appBase,
            blogNavCategories,
            githubUrl,
            siteContent,
            tomzMarkSrc,
            type LinkItem,
          } from "./site-runtime";

          ''' + header
          header_file = '\n'.join(line[10:] if line.startswith('          ') else line for line in header_file.splitlines()) + '\n'
          Path('src/app/SiteHeader.tsx').write_text(header_file, encoding='utf-8')

          not_found = export_decl(block('function NotFoundPage', 'function SearchOverlay'), ['function NotFoundPage('])
          Path('src/app/NotFoundPage.tsx').write_text(
              'import { useEffect } from "react";\nimport { Link, useLocation } from "react-router-dom";\nimport { decodedPathname } from "./site-runtime";\n\n' + not_found,
              encoding='utf-8',
          )

          search = export_decl(block('function SearchOverlay', 'function RoutedApp'), ['function SearchOverlay('])
          search_file = '''import {
            useEffect,
            useMemo,
            useRef,
            useState,
            type KeyboardEvent as ReactKeyboardEvent,
          } from "react";
          import { Link, useNavigate } from "react-router-dom";
          import { articleDocs } from "./site-runtime";

          ''' + search
          search_file = '\n'.join(line[10:] if line.startswith('          ') else line for line in search_file.splitlines()) + '\n'
          Path('src/app/SearchOverlay.tsx').write_text(search_file, encoding='utf-8')

          # Docs/navigation shell. The old blog thumbnail helper was unreachable and is intentionally not carried forward.
          docs_a = block('function directoryTitle', 'function blogCategoryIcon')
          docs_b = block('function projectNavTitle', 'function BlogListPage')
          docs = docs_a + '\n' + docs_b
          docs = export_decl(docs, [
              'function directoryTitle(',
              'function docsByDirectory(',
              'function projectIdFromPath(',
              'function docsByProjectDirectory(',
              'function isProjectArea(',
              'function DocsLayout(',
          ])
          docs_file = '''import { useEffect, useState } from "react";
          import { ChevronDown, ChevronUp, Menu, X } from "lucide-react";
          import { Link, Outlet, useLocation } from "react-router-dom";
          import { compareDocs, type Doc } from "../../content/mira-docs-adapter";
          import {
            decodedPathname,
            navigationDirectory,
            siteAreas,
            type SiteArea,
          } from "../../app/site-runtime";

          ''' + docs
          docs_file = '\n'.join(line[10:] if line.startswith('          ') else line for line in docs_file.splitlines()) + '\n'
          Path('src/features/docs').mkdir(parents=True, exist_ok=True)
          Path('src/features/docs/DocsLayout.tsx').write_text(docs_file, encoding='utf-8')

          # Blog UI and article page.
          blog_visual = block('function BlogHeaderVisual', 'function BlogThumbVisual')
          blog_pages = block('function BlogListPage', 'function weeklyIssueNumber')
          blog = export_decl(blog_visual + '\n' + blog_pages, ['function BlogListPage(', 'function BlogPostPage('])
          blog_file = '''import { useEffect, useMemo, useState } from "react";
          import { Link, useLocation, useNavigate } from "react-router-dom";
          import AuthorSignature from "../../components/AuthorSignature";
          import { RenderedMarkdown, renderMarkdown } from "../../components/MarkdownContent";
          import { ShareButton } from "../../components/ShareButton";
          import { compareBlogDocs, type Doc } from "../../content/mira-docs-adapter";
          import {
            authorProfiles,
            getDocAuthorAvatars,
            getDocAuthorLabel,
            getDocAuthors,
            getDocSignature,
            handleMiraAvatarError,
            resolveCoverSource,
            type SiteArea,
          } from "../../app/site-runtime";

          ''' + blog
          blog_file = '\n'.join(line[10:] if line.startswith('          ') else line for line in blog_file.splitlines()) + '\n'
          Path('src/features/blog').mkdir(parents=True, exist_ok=True)
          Path('src/features/blog/BlogPages.tsx').write_text(blog_file, encoding='utf-8')

          weekly = export_decl(block('function weeklyIssueNumber', 'function AreaPage'), [
              'function weeklyIssueNumber(',
              'function WeeklyListPage(',
              'function WeeklyIssuePage(',
          ])
          weekly_file = '''import { Link } from "react-router-dom";
          import { compareWeeklyDocs, type Doc } from "../../content/mira-docs-adapter";
          import { RenderedMarkdown } from "../../components/MarkdownContent";
          import { ShareButton } from "../../components/ShareButton";
          import { getDocAuthorLabel, type SiteArea } from "../../app/site-runtime";

          ''' + weekly
          weekly_file = '\n'.join(line[10:] if line.startswith('          ') else line for line in weekly_file.splitlines()) + '\n'
          Path('src/features/weekly').mkdir(parents=True, exist_ok=True)
          Path('src/features/weekly/WeeklyPages.tsx').write_text(weekly_file, encoding='utf-8')

          about = export_decl(block('function AboutPage', 'function DocPage'), ['function AboutPage('])
          about_file = '''import { ArrowUpRight } from "lucide-react";
          import { Link } from "react-router-dom";
          import { githubProfileUrl } from "../../site.config";
          import { authorProfiles, handleMiraAvatarError } from "../../app/site-runtime";

          ''' + about
          about_file = '\n'.join(line[10:] if line.startswith('          ') else line for line in about_file.splitlines()) + '\n'
          Path('src/features/about').mkdir(parents=True, exist_ok=True)
          Path('src/features/about/AboutPage.tsx').write_text(about_file, encoding='utf-8')

          area = block('function AreaPage', 'function AboutPage')
          doc_page = block('function DocPage')
          content_pages = export_decl(area + '\n' + doc_page, ['function AreaPage(', 'function DocPage('])
          content_file = '''import { useMemo } from "react";
          import { FileQuestion } from "lucide-react";
          import { Link } from "react-router-dom";
          import { allDocs, compareDocs } from "../../content/mira-docs-adapter";
          import { RenderedMarkdown, renderMarkdown } from "../../components/MarkdownContent";
          import { ShareButton } from "../../components/ShareButton";
          import { articleDocs, type SiteArea } from "../../app/site-runtime";
          import {
            directoryTitle,
            docsByDirectory,
            docsByProjectDirectory,
            isProjectArea,
            projectIdFromPath,
          } from "../docs/DocsLayout";
          import { BlogListPage, BlogPostPage } from "../blog/BlogPages";
          import {
            WeeklyIssuePage,
            WeeklyListPage,
            weeklyIssueNumber,
          } from "../weekly/WeeklyPages";

          ''' + content_pages
          content_file = '\n'.join(line[10:] if line.startswith('          ') else line for line in content_file.splitlines()) + '\n'
          Path('src/features/content').mkdir(parents=True, exist_ok=True)
          Path('src/features/content/ContentPages.tsx').write_text(content_file, encoding='utf-8')

          routed = block('function RoutedApp()', 'function directoryTitle')
          app_imports = '''import { useEffect, useState } from "react";
          import { Route, Routes, useLocation } from "react-router-dom";
          import { allDocs } from "./content/mira-docs-adapter";
          import HomepageV1, { HomepageFooter } from "./HomepageV1";
          import { bookEntries, books } from "./content/bookshelf";
          import BookshelfHub from "./features/bookshelf/BookshelfHub";
          import { AboutPage } from "./features/about/AboutPage";
          import DocsLayout from "./features/docs/DocsLayout";
          import { AreaPage, DocPage } from "./features/content/ContentPages";
          import { SiteHeaderBase } from "./app/SiteHeader";
          import { SearchOverlay } from "./app/SearchOverlay";
          import { NotFoundPage } from "./app/NotFoundPage";
          import { PwaUpdatePrompt } from "./app/PwaUpdatePrompt";
          import {
            getPageTitle,
            siteAreas,
            siteTitle,
            themeOptions,
            type ThemeName,
          } from "./app/site-runtime";

          '''
          app_imports = '\n'.join(line[10:] if line.startswith('          ') else line for line in app_imports.splitlines()) + '\n'
          app_path.write_text(app_imports + routed, encoding='utf-8')

          # Remove the temporary workflow from the validated result.
          Path('.github/workflows/app-split-once.yml').unlink()

          # Guard the architecture we intend to create.
          assert 'marked' not in app_path.read_text(encoding='utf-8')
          assert 'function BlogPostPage' not in app_path.read_text(encoding='utf-8')
          assert 'function DocsLayout' not in app_path.read_text(encoding='utf-8')
          assert 'function WeeklyListPage' not in app_path.read_text(encoding='utf-8')
          assert 'function AboutPage' not in app_path.read_text(encoding='utf-8')
          assert 'function RoutedApp' in app_path.read_text(encoding='utf-8')
          PY

      - name: Verify type contracts
        run: npx tsc -b

      - name: Validate production build
        run: npm run build

      - name: Validate GitHub Pages build
        run: npm run build:github-pages

      - name: Validate media pipeline
        run: |
          npm run media:test
          npm run media:prepare

      - name: Ensure no npm lockfile or unexpected generated source appeared
        run: |
          test ! -e package-lock.json
          git diff --exit-code -- src/content/content-times.generated.ts src/content/home-focus.generated.ts src/content/home-recent.generated.ts

      - name: Commit validated split
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/App.tsx \
            src/app \
            src/components/MarkdownContent.tsx \
            src/components/ShareButton.tsx \
            src/features/about \
            src/features/blog \
            src/features/content \
            src/features/docs/DocsLayout.tsx \
            src/features/weekly \
            .github/workflows/app-split-once.yml
          git diff --cached --check
          git commit -m "refactor(app): split site responsibilities from App"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push split
        run: git push origin HEAD:preview/weekly-v0-1

      - name: Publish split preview
        env:
          PREVIEW_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          # build:github-pages already produced dist in the validation step.
          node scripts/prepare-pages-preview.mjs
          grep -q 'noindex,nofollow' dist/index.html
          grep -q 'noindex,nofollow' dist/blogs/shared-thinking/matter-awakens/index.html
          grep -q 'Disallow: /' dist/robots.txt
          cp -a dist /tmp/pages-dist
          git fetch origin gh-pages
          git switch --detach origin/gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pages-dist/. .
          touch .nojekyll
          printf '%s\n' "$PREVIEW_SHA" > .preview-source-sha
          printf '%s\n' "$PREVIEW_SHA" > preview-source-sha.txt
          git add -A
          git commit -m "deploy: homepage v1 preview $PREVIEW_SHA"
          git push --force origin HEAD:gh-pages
