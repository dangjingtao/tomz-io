name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_home_focus:
        description: Force refresh homepage long-term focus
        required: false
        type: boolean
        default: false

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm run build
        env:
          CF_PAGES: "1"
          HOMEPAGE_AI_BASE_URL: ${{ secrets.HOMEPAGE_AI_BASE_URL }}
          HOMEPAGE_AI_API_KEY: ${{ secrets.HOMEPAGE_AI_API_KEY }}
          HOMEPAGE_AI_MODEL: ${{ secrets.HOMEPAGE_AI_MODEL }}
          HOMEPAGE_AI_FORCE: ${{ inputs.force_home_focus || false }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Persist refreshed homepage focus snapshot
        run: |
          set -euo pipefail
          FILE="src/content/home-focus.generated.ts"

          if git diff --quiet -- "$FILE"; then
            echo "Homepage focus snapshot unchanged; nothing to persist."
            exit 0
          fi

          if ! grep -q 'generatedBy: "ai"' "$FILE"; then
            echo "Homepage focus changed without a successful AI generation; not persisting fallback state."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(home): refresh long-term focus [skip ci]"
          git push origin HEAD:main

      - name: Ensure dedicated Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          STATUS="$(curl -sS -o /tmp/tomz-project.json -w '%{http_code}' \
            "$API/tomz-io" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

          if [ "$STATUS" = "200" ]; then
            jq -e '.success == true' /tmp/tomz-project.json >/dev/null
            echo "Cloudflare Pages project tomz-io already exists."
          elif [ "$STATUS" = "404" ]; then
            CREATE_STATUS="$(curl -sS -o /tmp/tomz-project-create.json -w '%{http_code}' \
              -X POST "$API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"name":"tomz-io","production_branch":"main"}')"
            if [ "$CREATE_STATUS" != "200" ] && [ "$CREATE_STATUS" != "201" ]; then
              cat /tmp/tomz-project-create.json
              exit 1
            fi
            jq -e '.success == true' /tmp/tomz-project-create.json >/dev/null
            echo "Created Cloudflare Pages project tomz-io."
          else
            cat /tmp/tomz-project.json
            exit 1
          fi

      - name: Deploy to tomz.io Cloudflare Pages project
        run: npx --yes wrangler@3.90.0 pages deploy dist --project-name=tomz-io --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Wait for tomz.io Pages domain activation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DOMAIN_API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/tomz-io/domains/tomz.io"

          for ATTEMPT in $(seq 1 30); do
            STATUS="$(curl -sS -o /tmp/tomz-domain-status.json -w '%{http_code}' \
              "$DOMAIN_API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

            if [ "$STATUS" = "404" ]; then
              echo "tomz.io is not attached to the tomz-io Pages project."
              exit 1
            elif [ "$STATUS" != "200" ]; then
              cat /tmp/tomz-domain-status.json
              exit 1
            fi

            DOMAIN_STATUS="$(jq -r '.result.status // empty' /tmp/tomz-domain-status.json)"
            VERIFY_STATUS="$(jq -r '.result.verification_data.status // empty' /tmp/tomz-domain-status.json)"
            ERROR_MESSAGE="$(jq -r '.result.error_message // .result.verification_data.error_message // empty' /tmp/tomz-domain-status.json)"

            echo "Attempt $ATTEMPT/30: domain=$DOMAIN_STATUS verification=$VERIFY_STATUS${ERROR_MESSAGE:+ error=$ERROR_MESSAGE}"

            if [ "$DOMAIN_STATUS" = "active" ]; then
              echo "tomz.io is active on Cloudflare Pages."
              exit 0
            fi

            if [ "$DOMAIN_STATUS" = "error" ] || [ "$VERIFY_STATUS" = "error" ] || [ "$VERIFY_STATUS" = "blocked" ]; then
              cat /tmp/tomz-domain-status.json
              exit 1
            fi

            sleep 10
          done

          echo "tomz.io did not become active within 5 minutes."
          cat /tmp/tomz-domain-status.json
          exit 1
