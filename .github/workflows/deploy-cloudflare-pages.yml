name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm run build
        env:
          CF_PAGES: "1"

      - name: Ensure dedicated Cloudflare Pages project exists
        run: |
          set -euo pipefail
          npx --yes wrangler@3.90.0 pages project list --json > /tmp/cloudflare-pages-projects.json
          if node -e '
            const fs = require("fs");
            const projects = JSON.parse(fs.readFileSync("/tmp/cloudflare-pages-projects.json", "utf8"));
            process.exit(projects.some((project) => project.name === "tomz-io") ? 0 : 1);
          '; then
            echo "Cloudflare Pages project tomz-io already exists."
          else
            npx --yes wrangler@3.90.0 pages project create tomz-io --production-branch=main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to tomz.io Cloudflare Pages project
        run: npx --yes wrangler@3.90.0 pages deploy dist --project-name=tomz-io --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
