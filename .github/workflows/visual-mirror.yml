name: Verify BR003A Visual Mirror

on:
  pull_request:

permissions:
  contents: read

jobs:
  visual-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch pinned mature source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/dangjingtao/uichat-mira-docs.git /tmp/br003a-visual-source
          git -C /tmp/br003a-visual-source fetch --depth 1 origin "$(cat .br003a-source-sha)"
          git -C /tmp/br003a-visual-source checkout --detach "$(cat .br003a-source-sha)"

      - name: Install shared dependencies and Chromium
        run: |
          npm install
          npm install --no-save --no-package-lock playwright@1.55.0 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/br003a-visual-source/node_modules

      - name: Build source and target root sites
        run: |
          npm run build
          (cd /tmp/br003a-visual-source && npm run build)

      - name: Start both previews
        run: |
          "$GITHUB_WORKSPACE/node_modules/.bin/vite" preview --host 127.0.0.1 --port 4173 > /tmp/br003a-target-preview.log 2>&1 &
          echo $! > /tmp/br003a-target-preview.pid
          (cd /tmp/br003a-visual-source && "$GITHUB_WORKSPACE/node_modules/.bin/vite" preview --host 127.0.0.1 --port 4174 > /tmp/br003a-source-preview.log 2>&1 & echo $! > /tmp/br003a-source-preview.pid)
          for port in 4173 4174; do
            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$port/" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/" >/dev/null
          done

      - name: Compare desktop, mobile and navigation states
        run: |
          mkdir -p visual-evidence
          cat > /tmp/br003a-visual-compare.mjs <<'EOF'
          import { chromium } from 'playwright';
          import pixelmatch from 'pixelmatch';
          import { PNG } from 'pngjs';
          import fs from 'node:fs';
          import path from 'node:path';

          const sourceBase = 'http://127.0.0.1:4174';
          const targetBase = 'http://127.0.0.1:4173';
          const outDir = path.resolve('visual-evidence');
          const maxDiffRatio = 0.005;

          const routes = [
            ['home', '/'],
            ['blogs', '/blogs/'],
            ['mira-letter', '/blogs/mira-letters/a-seat-at-the-writing-table/'],
            ['shared-thinking', '/blogs/shared-thinking/matter-awakens/'],
            ['product-journal', '/blogs/product-journal/2026-07-05-open-source-agent-ecosystem/'],
            ['engineering', '/blogs/engineering/insight-capture-pipeline/'],
            ['docs', '/about/author/'],
            ['mira-docs-api', '/mira-docs-api/guide/what-is-mira-docs/'],
            ['design-md', '/design-md/%E8%A7%86%E8%A7%89/product-design-system/'],
          ];

          const viewports = [
            ['desktop', { width: 1440, height: 1000 }],
            ['mobile', { width: 390, height: 844 }],
          ];

          function imagePath(name, side) {
            return path.join(outDir, `${name}-${side}.png`);
          }

          async function preparePage(context, base, route) {
            const page = await context.newPage();
            await page.route('**/*', async (requestRoute) => {
              const request = requestRoute.request();
              const url = new URL(request.url());
              const local = url.hostname === '127.0.0.1' || url.hostname === 'localhost';
              if (!local && request.resourceType() === 'image') {
                await requestRoute.abort();
                return;
              }
              await requestRoute.continue();
            });
            await page.goto(`${base}${route}`, { waitUntil: 'networkidle' });
            await page.addStyleTag({ content: `
              *, *::before, *::after {
                animation: none !important;
                transition: none !important;
                caret-color: transparent !important;
              }
            ` });
            await page.evaluate(async () => { if (document.fonts?.ready) await document.fonts.ready; });
            await page.waitForTimeout(120);
            return page;
          }

          function compare(name) {
            const source = PNG.sync.read(fs.readFileSync(imagePath(name, 'source')));
            const target = PNG.sync.read(fs.readFileSync(imagePath(name, 'target')));
            if (source.width !== target.width || source.height !== target.height) {
              throw new Error(`${name}: screenshot dimensions differ source=${source.width}x${source.height} target=${target.width}x${target.height}`);
            }
            const diff = new PNG({ width: source.width, height: source.height });
            const count = pixelmatch(source.data, target.data, diff.data, source.width, source.height, { threshold: 0.1 });
            const ratio = count / (source.width * source.height);
            fs.writeFileSync(imagePath(name, 'diff'), PNG.sync.write(diff));
            console.log(`${name}: ${count} pixels differ (${(ratio * 100).toFixed(4)}%)`);
            if (ratio > maxDiffRatio) throw new Error(`${name}: visual diff ${(ratio * 100).toFixed(4)}% exceeds ${(maxDiffRatio * 100).toFixed(2)}%`);
          }

          const browser = await chromium.launch();
          try {
            for (const [viewportName, viewport] of viewports) {
              const sourceContext = await browser.newContext({ viewport, serviceWorkers: 'block', colorScheme: 'light' });
              const targetContext = await browser.newContext({ viewport, serviceWorkers: 'block', colorScheme: 'light' });
              try {
                for (const [routeName, route] of routes) {
                  const name = `${viewportName}-${routeName}`;
                  const sourcePage = await preparePage(sourceContext, sourceBase, route);
                  const targetPage = await preparePage(targetContext, targetBase, route);
                  await sourcePage.screenshot({ path: imagePath(name, 'source'), fullPage: true });
                  await targetPage.screenshot({ path: imagePath(name, 'target'), fullPage: true });
                  await sourcePage.close();
                  await targetPage.close();
                  compare(name);
                }

                if (viewportName === 'mobile') {
                  {
                    const name = 'mobile-header-nav-open';
                    const sourcePage = await preparePage(sourceContext, sourceBase, '/');
                    const targetPage = await preparePage(targetContext, targetBase, '/');
                    await sourcePage.locator('button.mobile-menu-button').click();
                    await targetPage.locator('button.mobile-menu-button').click();
                    if ((await sourcePage.locator('.mobile-header-panel').count()) !== 1 || (await targetPage.locator('.mobile-header-panel').count()) !== 1) {
                      throw new Error('mobile header navigation panel did not open on both builds');
                    }
                    await sourcePage.screenshot({ path: imagePath(name, 'source') });
                    await targetPage.screenshot({ path: imagePath(name, 'target') });
                    await sourcePage.close();
                    await targetPage.close();
                    compare(name);
                  }

                  {
                    const name = 'mobile-doc-drawer-open';
                    const route = '/mira-docs-api/guide/what-is-mira-docs/';
                    const sourcePage = await preparePage(sourceContext, sourceBase, route);
                    const targetPage = await preparePage(targetContext, targetBase, route);
                    await sourcePage.getByRole('button', { name: '打开文档菜单' }).click();
                    await targetPage.getByRole('button', { name: '打开文档菜单' }).click();
                    if ((await sourcePage.locator('.mobile-docs-drawer').count()) !== 1 || (await targetPage.locator('.mobile-docs-drawer').count()) !== 1) {
                      throw new Error('mobile document drawer did not open on both builds');
                    }
                    await sourcePage.screenshot({ path: imagePath(name, 'source') });
                    await targetPage.screenshot({ path: imagePath(name, 'target') });
                    await sourcePage.close();
                    await targetPage.close();
                    compare(name);
                  }

                  {
                    const name = 'mobile-doc-toc-open';
                    const route = '/mira-docs-api/guide/what-is-mira-docs/';
                    const sourcePage = await preparePage(sourceContext, sourceBase, route);
                    const targetPage = await preparePage(targetContext, targetBase, route);
                    await sourcePage.getByRole('button', { name: /页面导航/ }).click();
                    await targetPage.getByRole('button', { name: /页面导航/ }).click();
                    if ((await sourcePage.locator('.mobile-page-toc').count()) !== 1 || (await targetPage.locator('.mobile-page-toc').count()) !== 1) {
                      throw new Error('mobile page TOC did not open on both builds');
                    }
                    await sourcePage.screenshot({ path: imagePath(name, 'source') });
                    await targetPage.screenshot({ path: imagePath(name, 'target') });
                    await sourcePage.close();
                    await targetPage.close();
                    compare(name);
                  }
                }
              } finally {
                await sourceContext.close();
                await targetContext.close();
              }
            }
          } finally {
            await browser.close();
          }

          console.log('BR003A visual mirror passed: 9 representative routes at desktop/mobile plus opened mobile header nav, docs drawer and TOC; max diff <= 0.5%.');
          EOF
          node /tmp/br003a-visual-compare.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: br003a-visual-evidence
          path: visual-evidence
          if-no-files-found: error
