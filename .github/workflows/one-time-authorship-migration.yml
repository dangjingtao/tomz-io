name: One-time authorship migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-authorship-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Apply authorship and bookshelf migration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const read = (file) => fs.readFileSync(file, 'utf8');
          const write = (file, content) => {
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, content, 'utf8');
          };

          function setFrontmatter(file, updates) {
            const source = read(file);
            const match = source.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
            if (!match) throw new Error(`Missing frontmatter: ${file}`);
            let lines = match[1].split(/\r?\n/);

            for (const [key, value] of Object.entries(updates)) {
              const next = [];
              let replaced = false;
              for (let index = 0; index < lines.length; index += 1) {
                const keyMatch = lines[index].match(/^([A-Za-z][A-Za-z0-9_-]*):(?:\s|$)/);
                if (keyMatch?.[1] === key) {
                  if (!replaced) {
                    next.push(`${key}: ${value}`);
                    replaced = true;
                  }
                  while (index + 1 < lines.length && /^\s+/.test(lines[index + 1])) index += 1;
                  continue;
                }
                next.push(lines[index]);
              }
              if (!replaced) next.push(`${key}: ${value}`);
              lines = next;
            }

            write(file, `---\n${lines.join('\n')}\n---\n${source.slice(match[0].length)}`);
          }

          function markdownFiles(directory) {
            if (!fs.existsSync(directory)) return [];
            return fs.readdirSync(directory, { withFileTypes: true })
              .filter((entry) => entry.isFile() && entry.name.endsWith('.md'))
              .map((entry) => path.join(directory, entry.name));
          }

          // Developer Life: public authorship is always Tomz.
          for (const file of markdownFiles('src/pages/blogs/developer-life')) {
            setFrontmatter(file, { author: 'tomz', writtenBy: 'tomz' });
          }

          // Shared Thinking: Tomz × Mira, Tomz first.
          for (const file of markdownFiles('src/pages/blogs/shared-thinking')) {
            setFrontmatter(file, {
              author: 'tomz | mira',
              writingMode: 'co-authored',
              writtenBy: 'tomz | mira',
              reviewedBy: 'tomz',
            });
          }

          // Together Learning Agents: Mira × Tomz, Mira first.
          for (const file of markdownFiles('src/pages/books/agent')) {
            setFrontmatter(file, {
              author: 'mira | tomz',
              writingMode: 'co-authored',
              writtenBy: 'mira | tomz',
              reviewedBy: 'tomz',
            });
          }

          // Psalms 1–7 were read and written together: Tomz × Mira, Tomz first.
          for (const file of markdownFiles('src/pages/books/psalms')) {
            setFrontmatter(file, {
              author: 'tomz | mira',
              writingMode: 'co-authored',
              writtenBy: 'tomz | mira',
              reviewedBy: 'tomz',
            });
          }

          // Projects always belong to Tomz publicly.
          for (const file of markdownFiles('src/pages/projects')) {
            setFrontmatter(file, { author: 'tomz', writtenBy: 'tomz' });
          }

          // Comics remain outside the bookshelf, with Tomz first when co-authored.
          setFrontmatter('src/pages/works/yuguang-vol-1.md', {
            author: 'tomz | mira',
            writingMode: 'co-authored',
            writtenBy: 'tomz | mira',
          });

          // Move the four connected stories out of Mira Letters and into one real book: 《谎颜》.
          const huangyan = [
            ['witness.md', 1],
            ['after-june.md', 2],
            ['between-glances.md', 3],
            ['peripheral-glance.md', 4],
          ];
          fs.mkdirSync('src/pages/books/huangyan', { recursive: true });
          for (const [name, order] of huangyan) {
            const oldFile = path.join('src/pages/blogs/mira-letters', name);
            const newFile = path.join('src/pages/books/huangyan', name);
            setFrontmatter(oldFile, {
              group: '谎颜',
              order: String(order),
              author: 'tomz | mira',
              writingMode: 'co-authored',
              writtenBy: 'tomz | mira',
              reviewedBy: 'tomz',
            });
            write(newFile, read(oldFile));
            fs.unlinkSync(oldFile);
          }
          write(
            'src/pages/books/huangyan/_book.yml',
            [
              'id: huangyan',
              'title: 谎颜',
              'description: Tomz 与 Mira 共同完成的四篇相连故事。',
              'category: 小说',
              'kind: collection',
              'order: 30',
              'status: completed',
              '',
            ].join('\n'),
          );

          // 《免责》 is removed, not migrated.
          const disclaimer = 'src/pages/blogs/mira-letters/disclaimer.md';
          if (fs.existsSync(disclaimer)) fs.unlinkSync(disclaimer);

          // What remains in this directory must be a real Mira Letter.
          for (const file of markdownFiles('src/pages/blogs/mira-letters')) {
            setFrontmatter(file, { author: 'mira', writtenBy: 'mira' });
          }

          // writtenBy is ordered authorship metadata, not a single-author field.
          const adapterPath = 'src/content/mira-docs-adapter.ts';
          let adapter = read(adapterPath);
          const replacements = [
            [
              'writtenBy?: AuthorKey;',
              'writtenBy?: AuthorKey[];',
            ],
            [
              'const explicitWrittenBy = normalizeAuthorKey(dataString(data, "writtenBy"));',
              'const explicitWrittenBy = dataList(data, "writtenBy")\n    .map((item) => normalizeAuthorKey(item))\n    .filter(Boolean) as AuthorKey[];',
            ],
            [
              'if (group === "Mira 来信") {\n    return {\n      author: ["mira"],\n      writingMode: "authored",\n      writtenBy: "mira",',
              'if (group === "Mira 来信") {\n    return {\n      author: ["mira"],\n      writingMode: "authored",\n      writtenBy: ["mira"],',
            ],
            [
              'if (group === "共同思考") {\n    return {\n      author: ["tomz", "mira"],\n      writingMode: "co-authored",\n      writtenBy: "mira",',
              'if (group === "共同思考") {\n    return {\n      author: ["tomz", "mira"],\n      writingMode: "co-authored",\n      writtenBy: ["tomz", "mira"],',
            ],
            [
              'writtenBy: path.includes("/mira-letters/") ? "mira" : "tomz",',
              'writtenBy: [path.includes("/mira-letters/") ? "mira" : "tomz"],',
            ],
          ];
          for (const [before, after] of replacements) {
            if (!adapter.includes(before)) throw new Error(`Adapter migration target not found: ${before}`);
            adapter = adapter.replace(before, after);
          }
          write(adapterPath, adapter);

          // Co-author UI must not reintroduce a hidden "Mira wrote / Tomz reviewed" ownership claim.
          const appPath = 'src/App.tsx';
          let app = read(appPath);
          const oldSignature = 'title: `${authorProfiles.tomz.name} × ${authorProfiles.mira.name}`,\n      body: "这篇文章来自两人的共同讨论，由 Mira 完成写作，Tomz Dang 审定发布。",';
          const newSignature = 'title: authors.map((author) => authorProfiles[author].name).join(" × "),\n      body: "这篇文章来自署名作者之间的共同讨论与写作。",';
          if (!app.includes(oldSignature)) throw new Error('Co-author signature migration target not found');
          app = app.replace(oldSignature, newSignature);
          write(appPath, app);

          // Old contributor skill may not override the canonical authorship rules.
          write(
            '.agents/skills/mira-blog-contributor/SKILL.md',
            `# Mira Blog Contributor\n\n## Mandatory rule\n\nBefore adding, editing, moving, publishing, or reviewing site content, read:\n\n1. \`docs/AUTHORSHIP.md\` — canonical authorship, ownership, directory, URL, and metadata rules.\n2. \`AGENTS.md\` — repository execution and verification rules.\n\nDo not infer authorship from who drafted the Markdown, who used tools, historical paths, old frontmatter, or previous conventions. When this skill conflicts with \`docs/AUTHORSHIP.md\`, the authorship document wins.\n\n## Content workflow\n\n- Read the target content and neighboring content before editing.\n- Keep physical directory, public URL, visible author, \`writtenBy\`, SEO, and structured data semantically aligned.\n- Do not create a \`创作\` category. The four connected stories belong to the bookshelf book 《谎颜》.\n- Keep true Mira Letters under \`src/pages/blogs/mira-letters/\`; do not use that directory as a private bucket for other work.\n- For any new content type not covered by \`docs/AUTHORSHIP.md\`, ask Tomz to define authorship before publishing.\n- Run the repository checks required by \`AGENTS.md\` after content changes.\n`,
          );

          // The principle doc should describe the post-migration state.
          const principlePath = 'docs/AUTHORSHIP.md';
          let principle = read(principlePath);
          principle = principle.replace(
            '《免责》不保留，未来应从站点、索引与 SEO 中删除。',
            '《免责》已从站点、索引与 SEO 中删除，不得恢复。',
          );
          write(principlePath, principle);

          // Preserve old inbound links only as 301 redirects; they are not current ownership paths.
          const redirectsPath = 'public/_redirects';
          let redirects = read(redirectsPath).trimEnd();
          const redirectLines = [
            '/blogs/mira-letters/witness /books/huangyan/witness 301',
            '/blogs/mira-letters/after-june /books/huangyan/after-june 301',
            '/blogs/mira-letters/between-glances /books/huangyan/between-glances 301',
            '/blogs/mira-letters/peripheral-glance /books/huangyan/peripheral-glance 301',
          ];
          for (const line of redirectLines) {
            if (!redirects.includes(line)) redirects += `\n${line}`;
          }
          write(redirectsPath, `${redirects}\n`);

          // Assertions: fail before build if the repository is left in a half-migrated state.
          const mustExist = huangyan.map(([name]) => `src/pages/books/huangyan/${name}`);
          for (const file of mustExist) {
            if (!fs.existsSync(file)) throw new Error(`Missing migrated story: ${file}`);
          }
          for (const [name] of huangyan) {
            if (fs.existsSync(`src/pages/blogs/mira-letters/${name}`)) throw new Error(`Old fiction path still exists: ${name}`);
          }
          if (fs.existsSync(disclaimer)) throw new Error('Disclaimer still exists');

          const allMarkdown = [];
          function walk(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const full = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.md')) allMarkdown.push(full);
            }
          }
          walk('src/pages');
          for (const file of allMarkdown) {
            if (/^group:\s*创作\s*$/m.test(read(file))) throw new Error(`Deprecated 创作 group remains: ${file}`);
          }

          const expected = new Map([
            ...markdownFiles('src/pages/blogs/developer-life').map((file) => [file, ['author: tomz', 'writtenBy: tomz']]),
            ...markdownFiles('src/pages/blogs/shared-thinking').map((file) => [file, ['author: tomz | mira', 'writtenBy: tomz | mira']]),
            ...markdownFiles('src/pages/books/agent').map((file) => [file, ['author: mira | tomz', 'writtenBy: mira | tomz']]),
            ...markdownFiles('src/pages/books/psalms').map((file) => [file, ['author: tomz | mira', 'writtenBy: tomz | mira']]),
            ...markdownFiles('src/pages/projects').map((file) => [file, ['author: tomz', 'writtenBy: tomz']]),
            ...markdownFiles('src/pages/blogs/mira-letters').map((file) => [file, ['author: mira', 'writtenBy: mira']]),
            ...mustExist.map((file) => [file, ['group: 谎颜', 'author: tomz | mira', 'writtenBy: tomz | mira']]),
            ['src/pages/works/yuguang-vol-1.md', ['author: tomz | mira', 'writtenBy: tomz | mira']],
          ]);
          for (const [file, lines] of expected) {
            const source = read(file);
            for (const line of lines) {
              if (!source.split(/\r?\n/).includes(line)) throw new Error(`Expected ${line} in ${file}`);
            }
          }

          console.log(`Authorship migration prepared across ${expected.size} content files.`);
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify content
        run: pnpm run verify:mira-docs

      - name: Build production site
        run: pnpm run build

      - name: Build GitHub Pages mode
        run: pnpm run build:github-pages

      - name: Verify static output
        run: pnpm run verify:static-output

      - name: Commit migration
        shell: bash
        run: |
          rm -f .github/workflows/one-time-authorship-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: align authorship and move 谎颜 into bookshelf"
          git push origin HEAD:main
