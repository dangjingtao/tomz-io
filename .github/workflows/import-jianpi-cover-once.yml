name: Import Jianpi Cover Once

on:
  push:
    branches:
      - preview/weekly-v0-1
    paths:
      - .github/workflows/import-jianpi-cover-once.yml

permissions:
  contents: write

jobs:
  import-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/weekly-v0-1
          fetch-depth: 0

      - name: Fetch original cover
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://oaisdmntpraustraliaeast.blob.core.windows.net/files/00000000-e46c-81fa-834a-c6ad8dcd08b3/raw?se=2026-09-13T02%3A00%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=5a748f39-12bf-404a-8e68-bdb7089b7fe4&skoid=b7fc319f-b93c-4fac-ba5f-14fdc3f9209f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T22%3A54%3A25Z&ske=2026-09-13T22%3A54%3A25Z&sks=b&skv=2026-02-06&sig=Qbr/JMopRAyucqdpde5HYxG6z8hh2vqJKohCY%2BCNEXQ%3D' \
            --output /tmp/jianpi-cover-original.png
          test "$(stat -c%s /tmp/jianpi-cover-original.png)" -gt 1000000

      - name: Encode pixel-lossless WebP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          cwebp -quiet -lossless -m 6 /tmp/jianpi-cover-original.png -o public/assets/jianpi-cover-001.webp
          test "$(stat -c%s public/assets/jianpi-cover-001.webp)" -gt 500000

      - name: Commit cover and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/jianpi-cover-001.webp
          git rm .github/workflows/import-jianpi-cover-once.yml
          git commit -m 'assets(weekly): restore full-quality 见π cover'
          git push origin HEAD:preview/weekly-v0-1
