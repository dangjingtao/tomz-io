name: BR003A Mirror Bootstrap

on:
  push:
    branches:
      - work/br003a-full-mirror
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: br003a-mirror-bootstrap
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror mature source main
        env:
          SOURCE_SHA: 6c43a5d775e026a72134a39ba8ed7e3f825c912b
          TARGET_BRANCH: work/br003a-full-mirror
        run: |
          set -euo pipefail

          git clone --filter=blob:none --no-checkout https://github.com/dangjingtao/uichat-mira-docs.git /tmp/br003a-source
          git -C /tmp/br003a-source fetch --depth 1 origin "$SOURCE_SHA"
          git -C /tmp/br003a-source checkout --detach "$SOURCE_SHA"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/br003a-source/ ./
          mkdir -p .github/workflows scripts

          python <<'PY'
          from pathlib import Path

          vite = Path('vite.config.ts')
          text = vite.read_text(encoding='utf-8')
          old = 'const base = isGitHubPagesBuild ? "/uichat-mira-docs/" : "/";'
          new = 'const base = isGitHubPagesBuild ? "/tomz-io/" : "/";'
          if old not in text:
              raise SystemExit('expected source GitHub Pages base line not found')
          vite.write_text(text.replace(old, new, 1), encoding='utf-8')

          verify = Path('scripts/verify-mira-docs-static-output.mjs')
          text = verify.read_text(encoding='utf-8')
          lines = text.splitlines()
          replaced = False
          output = []
          for line in lines:
              if line.startswith('const expectedBase = '):
                  output.extend([
                      'const baseArg = process.argv.find((arg) => arg.startsWith("--base="));',
                      'const requestedBase = baseArg ? baseArg.slice("--base=".length) : "/";',
                      'const expectedBase =',
                      '  requestedBase === "/" ? "" : `/${requestedBase.replace(/^\\/+|\\/+$/g, "")}`;',
                  ])
                  replaced = True
              else:
                  output.append(line)
          if not replaced:
              raise SystemExit('expected source static verifier base line not found')
          verify.write_text('\n'.join(output) + '\n', encoding='utf-8')

          Path('.br003a-source-sha').write_text('6c43a5d775e026a72134a39ba8ed7e3f825c912b\n', encoding='utf-8')
          PY

          cat > scripts/verify-br003a-mirror.mjs <<'EOF'
          import { createHash } from "node:crypto";
          import { existsSync, readFileSync, readdirSync, statSync } from "node:fs";
          import { relative, resolve } from "node:path";

          const root = process.cwd();
          const sourceRoot = resolve(process.argv[2] || "/tmp/br003a-source");
          const expectedSourceSha = readFileSync(resolve(root, ".br003a-source-sha"), "utf8").trim();
          const failures = [];

          function filesUnder(base) {
            if (!existsSync(base)) return [];
            return readdirSync(base, { withFileTypes: true }).flatMap((entry) => {
              const path = resolve(base, entry.name);
              return entry.isDirectory() ? filesUnder(path) : [path];
            });
          }

          function sha256(path) {
            return createHash("sha256").update(readFileSync(path)).digest("hex");
          }

          function compareTree(relativeRoot) {
            const sourceBase = resolve(sourceRoot, relativeRoot);
            const targetBase = resolve(root, relativeRoot);
            const sourceFiles = filesUnder(sourceBase).map((path) => relative(sourceBase, path).replaceAll("\\", "/")).sort();
            const targetFiles = filesUnder(targetBase).map((path) => relative(targetBase, path).replaceAll("\\", "/")).sort();
            if (JSON.stringify(sourceFiles) !== JSON.stringify(targetFiles)) {
              const sourceSet = new Set(sourceFiles);
              const targetSet = new Set(targetFiles);
              const missing = sourceFiles.filter((path) => !targetSet.has(path));
              const extra = targetFiles.filter((path) => !sourceSet.has(path));
              failures.push(`${relativeRoot}: file set differs; missing=${missing.join(",") || "none"}; extra=${extra.join(",") || "none"}`);
            }
            for (const path of sourceFiles) {
              const target = resolve(targetBase, path);
              if (!existsSync(target)) continue;
              if (sha256(resolve(sourceBase, path)) !== sha256(target)) failures.push(`${relativeRoot}/${path}: content differs`);
            }
          }

          compareTree("src");
          compareTree("public");

          const exactRootFiles = [
            "index.html",
            "docs.html",
            "mira-docs-static.ts",
            "package.json",
            "pnpm-lock.yaml",
            "pnpm-workspace.yaml",
            "tsconfig.json",
            "tsconfig.node.json",
          ];
          for (const path of exactRootFiles) {
            const source = resolve(sourceRoot, path);
            const target = resolve(root, path);
            if (!existsSync(source) || !existsSync(target)) failures.push(`${path}: missing in source or target`);
            else if (sha256(source) !== sha256(target)) failures.push(`${path}: content differs from source`);
          }

          const sourceMarkdown = filesUnder(resolve(sourceRoot, "src/pages"))
            .filter((path) => path.endsWith(".md"))
            .map((path) => relative(resolve(sourceRoot, "src/pages"), path).replaceAll("\\", "/"))
            .sort();
          const targetMarkdown = filesUnder(resolve(root, "src/pages"))
            .filter((path) => path.endsWith(".md"))
            .map((path) => relative(resolve(root, "src/pages"), path).replaceAll("\\", "/"))
            .sort();

          if (sourceMarkdown.length < 66) failures.push(`source Markdown count unexpectedly below BR003A baseline: ${sourceMarkdown.length}`);
          if (JSON.stringify(sourceMarkdown) !== JSON.stringify(targetMarkdown)) failures.push("src/pages Markdown file set differs from pinned source");
          let identicalMarkdown = 0;
          for (const path of sourceMarkdown) {
            const target = resolve(root, "src/pages", path);
            if (existsSync(target) && sha256(resolve(sourceRoot, "src/pages", path)) === sha256(target)) identicalMarkdown += 1;
          }

          const historical13 = [
            "blogs/mira-letters/a-seat-at-the-writing-table.md",
            "blogs/mira-letters/to-those-who-still-believe-in-their-work.md",
            "blogs/shared-thinking/evolution-to-a-real-person.md",
            "blogs/shared-thinking/future-after-humanity.md",
            "blogs/shared-thinking/matter-awakens.md",
            "blogs/product-journal/2026-07-05-open-source-agent-ecosystem.md",
            "blogs/product-journal/codex-app-server-automation-notes.md",
            "blogs/product-journal/mira-tts-provider-notes.md",
            "blogs/product-journal/qingcheng-mcp-bridge-notes.md",
            "blogs/engineering/insight-capture-pipeline.md",
            "blogs/engineering/insight-rebuild-pipeline.md",
            "blogs/engineering/mcp-marketplace-agent-integration.md",
            "blogs/engineering/media-capability-packaging.md",
          ];
          for (const path of historical13) {
            if (!existsSync(resolve(root, "src/pages", path))) failures.push(`historical BR003 route source missing: ${path}`);
          }

          const representatives = [
            "docs/about/author.md",
            "mira-docs-api/guide/what-is-mira-docs.md",
            "design-md/视觉/product-design-system.md",
          ];
          for (const path of representatives) {
            if (!existsSync(resolve(root, "src/pages", path))) failures.push(`representative content missing: ${path}`);
          }

          const adaptedVite = readFileSync(resolve(root, "vite.config.ts"), "utf8");
          if (!adaptedVite.includes('isGitHubPagesBuild ? "/tomz-io/" : "/"')) failures.push("vite.config.ts: /tomz-io/ Pages base adaptation missing");
          if (adaptedVite.includes('isGitHubPagesBuild ? "/uichat-mira-docs/" : "/"')) failures.push("vite.config.ts: upstream Pages base leaked into target");

          if (failures.length) {
            console.error("BR003A mirror integrity failed:");
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }

          console.log(`BR003A mirror integrity passed: source=${expectedSourceSha}; Markdown=${sourceMarkdown.length}; identical=${identicalMarkdown}; differing=${sourceMarkdown.length - identicalMarkdown}; src/public trees byte-identical; historical13=13/13.`);
          EOF

          cat > scripts/prepare-pages-preview.mjs <<'EOF'
          import { existsSync, readFileSync, readdirSync, statSync, writeFileSync } from "node:fs";
          import { resolve } from "node:path";

          const dist = resolve(process.cwd(), "dist");
          if (!existsSync(dist)) throw new Error("dist does not exist");

          function filesUnder(dir) {
            return readdirSync(dir).flatMap((name) => {
              const path = resolve(dir, name);
              return statSync(path).isDirectory() ? filesUnder(path) : [path];
            });
          }

          let htmlCount = 0;
          for (const path of filesUnder(dist).filter((path) => path.endsWith(".html"))) {
            let html = readFileSync(path, "utf8");
            const robots = '<meta name="robots" content="noindex,nofollow">';
            if (/<meta\s+name=["']robots["'][^>]*>/i.test(html)) {
              html = html.replace(/<meta\s+name=["']robots["'][^>]*>/i, robots);
            } else {
              html = html.replace(/<head([^>]*)>/i, `<head$1>\n    ${robots}`);
            }
            writeFileSync(path, html);
            htmlCount += 1;
          }
          writeFileSync(resolve(dist, "robots.txt"), "User-agent: *\nDisallow: /\n");
          console.log(`BR003A preview noindex applied to ${htmlCount} HTML files; robots.txt disallows crawling.`);
          EOF

          cat > .github/workflows/verify.yml <<'EOF'
          name: Verify BR003A

          on:
            push:
              branches:
                - work/br003a-full-mirror
            pull_request:

          permissions:
            contents: read

          jobs:
            mirror-and-build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - name: Fetch pinned mature source
                  run: |
                    git clone --filter=blob:none --no-checkout https://github.com/dangjingtao/uichat-mira-docs.git /tmp/br003a-source
                    git -C /tmp/br003a-source fetch --depth 1 origin "$(cat .br003a-source-sha)"
                    git -C /tmp/br003a-source checkout --detach "$(cat .br003a-source-sha)"
                - name: Verify mirror integrity
                  run: node scripts/verify-br003a-mirror.mjs /tmp/br003a-source
                - run: npm install
                - name: MiraDocs parse
                  run: npm run verify:mira-docs
                - name: Root build
                  run: npm run build
                - name: Root static output
                  run: npm run verify:static-output -- --base=/
                - name: GitHub Pages build
                  run: npm run build:github-pages
                - name: GitHub Pages static output
                  run: npm run verify:static-output -- --base=/tomz-io/
          EOF

          cat > .github/workflows/pages-preview.yml <<'EOF'
          name: BR003A Pages Preview

          on:
            push:
              branches:
                - work/br003a-full-mirror
            workflow_dispatch:

          permissions:
            contents: write

          concurrency:
            group: br003a-pages-preview
            cancel-in-progress: true

          jobs:
            deploy-preview:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: npm install
                - run: npm run build:github-pages
                - run: npm run verify:static-output -- --base=/tomz-io/
                - name: Apply preview-only noindex
                  run: node scripts/prepare-pages-preview.mjs
                - name: Verify preview noindex
                  run: |
                    grep -q 'noindex,nofollow' dist/index.html
                    grep -q 'Disallow: /' dist/robots.txt
                - name: Publish build:github-pages output to gh-pages
                  env:
                    PREVIEW_SHA: ${{ github.sha }}
                  run: |
                    cp -a dist /tmp/pages-dist
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git fetch origin gh-pages
                    git switch --detach origin/gh-pages
                    find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
                    cp -a /tmp/pages-dist/. .
                    touch .nojekyll
                    printf '%s\n' "$PREVIEW_SHA" > .preview-source-sha
                    git add -A
                    git commit -m "deploy: BR003A mirror preview $PREVIEW_SHA"
                    git push --force origin HEAD:gh-pages
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: mirror mature Mira docs site for BR003A"
          git push origin "HEAD:$TARGET_BRANCH"
