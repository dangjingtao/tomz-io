name: Verify

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run verify:static-output
      - run: npm run build:github-pages
      - run: npm run verify:static-output -- --base=/tomz-io/
