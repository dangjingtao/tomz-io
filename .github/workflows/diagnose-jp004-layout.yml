name: Diagnose JP004 Layout

on:
  push:
    branches:
      - content/jp004
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for current preview commit
        env:
          PREVIEW_ROOT: https://preview-content-jp004.tomz-io.pages.dev
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 40); do
            SOURCE_SHA="$(curl -fsS "$PREVIEW_ROOT/preview-source-sha.txt" || true)"
            if [ "$SOURCE_SHA" = "$GITHUB_SHA" ]; then
              echo "Preview is serving $GITHUB_SHA"
              exit 0
            fi
            echo "Attempt $ATTEMPT/40: preview still serves $SOURCE_SHA"
            sleep 2
          done
          echo "Preview did not converge to $GITHUB_SHA"
          exit 1
      - name: Run layout regression test
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm vitest run src/site-header-layout.test.ts
      - name: Install selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Diagnose horizontal overflow
        env:
          PREVIEW_URL: https://preview-content-jp004.tomz-io.pages.dev/weekly/004/
        run: |
          python - <<'PY'
          import json, os, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          url = os.environ["PREVIEW_URL"]
          opts = Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--disable-gpu")

          driver = webdriver.Chrome(options=opts)
          try:
              for width in [1440, 1280, 1180, 1024, 960, 900, 821, 820, 390]:
                  driver.set_window_size(width, 1000)
                  driver.get(url)
                  WebDriverWait(driver, 20).until(
                      lambda d: d.execute_script("return document.readyState") == "complete"
                  )
                  time.sleep(0.5)
                  result = driver.execute_script("""
                    const vw = document.documentElement.clientWidth;
                    const sw = document.documentElement.scrollWidth;
                    const offenders = [...document.querySelectorAll('body *')]
                      .map((el) => {
                        const r = el.getBoundingClientRect();
                        const cs = getComputedStyle(el);
                        return {
                          tag: el.tagName,
                          cls: el.className && typeof el.className === 'string' ? el.className : '',
                          id: el.id || '',
                          text: (el.innerText || '').trim().replace(/\s+/g,' ').slice(0,140),
                          left: Math.round(r.left * 10) / 10,
                          right: Math.round(r.right * 10) / 10,
                          width: Math.round(r.width * 10) / 10,
                          position: cs.position,
                          overflowX: cs.overflowX,
                          whiteSpace: cs.whiteSpace,
                          minWidth: cs.minWidth,
                          maxWidth: cs.maxWidth,
                          display: cs.display
                        };
                      })
                      .filter((x) => x.right > vw + 1 || x.left < -1)
                      .sort((a,b) => Math.max(b.right-vw, -b.left) - Math.max(a.right-vw, -a.left))
                      .slice(0,25);
                    return {vw, sw, delta: sw-vw, offenders};
                  """)
                  print("\nVIEWPORT", width)
                  print(json.dumps(result, ensure_ascii=False, indent=2))

                  if width > 820:
                      driver.execute_script("""
                        const menus = [...document.querySelectorAll('.menu-dropdown')];
                        const about = menus[menus.length - 1];
                        about?.dispatchEvent(new MouseEvent('mouseover', {bubbles:true}));
                      """)
                      time.sleep(0.2)
                      opened = driver.execute_script("""
                        const vw = document.documentElement.clientWidth;
                        const sw = document.documentElement.scrollWidth;
                        const panel = [...document.querySelectorAll('.menu-dropdown')].at(-1)?.querySelector('.menu-dropdown-panel');
                        const r = panel?.getBoundingClientRect();
                        return {
                          vw, sw, delta: sw-vw,
                          panel: r ? {left:r.left, right:r.right, width:r.width, display:getComputedStyle(panel).display} : null
                        };
                      """)
                      print("OPEN_ABOUT", width)
                      print(json.dumps(opened, ensure_ascii=False, indent=2))
                      driver.execute_script("""
                        const menus = [...document.querySelectorAll('.menu-dropdown')];
                        const about = menus[menus.length - 1];
                        about?.dispatchEvent(new MouseEvent('mouseout', {bubbles:true}));
                      """)
                      time.sleep(0.1)
          finally:
              driver.quit()
          PY
