name: BR003A PR Mirror

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  mirror:
    if: github.head_ref == 'work/br003a-full-mirror'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/br003a-full-mirror
          fetch-depth: 0

      - name: Mirror pinned mature source
        env:
          SOURCE_SHA: 6c43a5d775e026a72134a39ba8ed7e3f825c912b
        run: |
          set -euo pipefail
          if [ -f .br003a-mirrored ]; then
            echo "BR003A source mirror already applied."
            exit 0
          fi

          git clone --filter=blob:none --no-checkout https://github.com/dangjingtao/uichat-mira-docs.git /tmp/br003a-source
          git -C /tmp/br003a-source fetch --depth 1 origin "$SOURCE_SHA"
          git -C /tmp/br003a-source checkout --detach "$SOURCE_SHA"

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/br003a-source/ ./

          python <<'PY'
          from pathlib import Path
          p = Path('vite.config.ts')
          text = p.read_text(encoding='utf-8')
          old = 'const base = isGitHubPagesBuild ? "/uichat-mira-docs/" : "/";'
          new = 'const base = isGitHubPagesBuild ? "/tomz-io/" : "/";'
          if old not in text:
              raise SystemExit('expected source Pages base not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.br003a-source-sha').write_text('6c43a5d775e026a72134a39ba8ed7e3f825c912b\n', encoding='utf-8')
          Path('.br003a-mirrored').write_text('full-source-mirror\n', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply BR003A full source mirror"
          git push origin HEAD:work/br003a-full-mirror
