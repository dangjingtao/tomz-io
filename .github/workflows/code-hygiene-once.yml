name: One-time code hygiene cleanup

on:
  push:
    branches:
      - preview/weekly-v0-1
    paths:
      - .github/workflows/code-hygiene-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply bounded hygiene cleanup
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              Path(path).write_text(content, encoding="utf-8")

          def remove_between(text, start_marker, end_marker, label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"missing start marker for {label}: {start_marker!r}")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"missing end marker for {label}: {end_marker!r}")
              return text[:start] + text[end:]

          app = read("src/App.tsx")
          app = remove_between(app, "function MobileHeaderPanel({", "function NotFoundPage({", "legacy header")
          app, count = re.subn(
              r"<HomepageV1\s+showHeader=\{false\}\s+darkMode=\{darkMode\}\s+themeName=\{themeName\}\s*/>",
              "<HomepageV1 darkMode={darkMode} />",
              app,
              count=1,
          )
          if count != 1:
              raise SystemExit("expected one routed HomepageV1 legacy prop block")
          app = app.replace(
              "const [themeName, setThemeName] = useState<ThemeName>(() => {",
              "const [themeName] = useState<ThemeName>(() => {",
              1,
          )
          write("src/App.tsx", app)

          home = read("src/HomepageV1.tsx")
          home = home.replace('import { useEffect, useMemo, useState } from "react";', 'import { useEffect, useMemo } from "react";', 1)
          home = home.replace('import { ArrowUpRight, Menu, Moon, Sun, X } from "lucide-react";', 'import { ArrowUpRight } from "lucide-react";', 1)
          home = re.sub(r'^const tomzMarkSrc = `\$\{import\.meta\.env\.BASE_URL\}brand/tomz-mark\.png`;\n', '', home, count=1, flags=re.M)
          home = home.replace('type ThemeName = "claude" | "apple" | "supabase";\n\n', '', 1)
          home = remove_between(home, 'const themeOptions:', 'function RecentItem(', 'HomepageV1 private theme state')
          home = remove_between(home, 'function HomepageHeader({', 'export default function HomepageV1({', 'HomepageV1 private header')
          home, count = re.subn(
              r"export default function HomepageV1\(\{[\s\S]*?\n  const latestWriting = useMemo\(",
              "export default function HomepageV1({ darkMode }: { darkMode: boolean }) {\n  const latestWriting = useMemo(",
              home,
              count=1,
          )
          if count != 1:
              raise SystemExit("failed to simplify HomepageV1 props")
          home = remove_between(home, '      {showHeader ? (', '      <main>', 'HomepageV1 hidden header mount')
          write("src/HomepageV1.tsx", home)

          main = read("src/main.tsx")
          main = main.replace('import LegacyHeaderCompat from "./components/LegacyHeaderCompat";\n', '', 1)
          main = main.replace('      <LegacyHeaderCompat />\n', '', 1)
          write("src/main.tsx", main)

          css = read("src/homepage-v1.css")
          css = remove_between(css, '.home-v1-nav {', '.home-v1-hero {', 'desktop homepage nav CSS')
          css = remove_between(css, '  .home-v1-nav-links,', '  .home-v1-hero-inner {', 'tablet homepage nav CSS')
          css = remove_between(css, '  .home-v1-nav-inner {', '  .home-v1-hero-inner {', 'mobile homepage nav CSS')
          css = re.sub(r'\n\[data-theme="claude"\]\.dark \.home-v1-nav-popover,\n\[data-theme="claude"\]\.dark \.home-v1-theme-toggle,\n\[data-theme="claude"\]\.dark \.home-v1-mobile-toggle \{[^{}]*\}\n', '\n', css, count=1)
          css = re.sub(r'\n\s*\.home-v1-(?:hero-note|about-note)(?:[^\{,\n]*)\s*\{[^{}]*\}\n', '\n', css)
          write("src/homepage-v1.css", css)

          styles = read("src/styles.css")
          styles = styles.replace('    .mobile-header-panel,\n    .mobile-doc-share {', '    .mobile-header-panel {', 1)
          styles = re.sub(r'\n\s*\.mobile-doc-share(?:[^\{,\n]*)\s*\{[^{}]*\}\n', '\n', styles)
          write("src/styles.css", styles)

          redirects = read("public/_redirects").rstrip() + "\n"
          redirect_lines = [
              "/submissions/t-zt/why-mobile-agents-dont-allow-custom-api /blogs/guest-contributions/why-mobile-agents-dont-allow-custom-api 301",
              "/submissions/t-zt/why-mobile-agents-dont-allow-custom-api/ /blogs/guest-contributions/why-mobile-agents-dont-allow-custom-api 301",
              "/submissions/t-zt/why-agent-chat-sync-feels-laggy /blogs/guest-contributions/why-agent-chat-sync-feels-laggy 301",
              "/submissions/t-zt/why-agent-chat-sync-feels-laggy/ /blogs/guest-contributions/why-agent-chat-sync-feels-laggy 301",
          ]
          for line in redirect_lines:
              if line not in redirects:
                  redirects += line + "\n"
          write("public/_redirects", redirects)

          vite = read("vite.config.ts")
          replacements = {
              '"/blogs/shared-thinking/why-mobile-agents-dont-allow-custom-api /submissions/t-zt/why-mobile-agents-dont-allow-custom-api 301"': '"/blogs/shared-thinking/why-mobile-agents-dont-allow-custom-api /blogs/guest-contributions/why-mobile-agents-dont-allow-custom-api 301"',
              '"/blogs/shared-thinking/why-mobile-agents-dont-allow-custom-api/ /submissions/t-zt/why-mobile-agents-dont-allow-custom-api 301"': '"/blogs/shared-thinking/why-mobile-agents-dont-allow-custom-api/ /blogs/guest-contributions/why-mobile-agents-dont-allow-custom-api 301"',
              '"/blogs/shared-thinking/why-agent-chat-sync-feels-laggy /submissions/t-zt/why-agent-chat-sync-feels-laggy 301"': '"/blogs/shared-thinking/why-agent-chat-sync-feels-laggy /blogs/guest-contributions/why-agent-chat-sync-feels-laggy 301"',
              '"/blogs/shared-thinking/why-agent-chat-sync-feels-laggy/ /submissions/t-zt/why-agent-chat-sync-feels-laggy 301"': '"/blogs/shared-thinking/why-agent-chat-sync-feels-laggy/ /blogs/guest-contributions/why-agent-chat-sync-feels-laggy 301"',
          }
          for old, new in replacements.items():
              if old not in vite:
                  raise SystemExit(f"expected legacy redirect missing: {old}")
              vite = vite.replace(old, new, 1)
          write("vite.config.ts", vite)

          for path in [
              "AGENT.MD",
              ".github/workflows/migrate-tomz-domain.yml",
              "src/components/LegacyHeaderCompat.tsx",
              "src/pages/submissions/t-zt/why-mobile-agents-dont-allow-custom-api.md",
              "src/pages/submissions/t-zt/why-agent-chat-sync-feels-laggy.md",
              ".github/workflows/code-hygiene-once.yml",
          ]:
              target = Path(path)
              if not target.exists():
                  raise SystemExit(f"expected cleanup target missing: {path}")
              target.unlink()

          assert not Path("AGENT.MD").exists()
          assert not Path("src/components/LegacyHeaderCompat.tsx").exists()
          assert "LegacyHeaderCompat" not in read("src/main.tsx")
          assert "function SiteHeader(" not in read("src/App.tsx")
          assert "function MobileHeaderPanel(" not in read("src/App.tsx")
          assert "HomepageHeader" not in read("src/HomepageV1.tsx")
          assert "showHeader" not in read("src/HomepageV1.tsx")
          assert "HomepageFooter" in read("src/HomepageV1.tsx")
          assert ".home-v1-nav" not in read("src/homepage-v1.css")
          assert ".mobile-doc-share" not in read("src/styles.css")
          assert "/submissions/t-zt/why-mobile-agents-dont-allow-custom-api" not in read("vite.config.ts")
          assert "/submissions/t-zt/why-agent-chat-sync-feels-laggy" not in read("vite.config.ts")
          PY

      - name: Validate media pipeline
        run: |
          npm run media:test
          npm run media:prepare

      - name: Generate content times
        run: npm run generate:content-times

      - name: Verify MiraDocs compatibility
        run: npm run verify:mira-docs

      - name: Generate homepage recent snapshot
        run: npm run generate:home-recent

      - name: Generate homepage focus snapshot
        run: npm run generate:home-focus

      - name: TypeScript check
        run: npx tsc -b

      - name: Commit validated source cleanup
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove obsolete compatibility and duplicate paths"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate production Vite build
        run: |
          npx vite build
          node scripts/apply-content-times-to-static.mjs
          npm run verify:static-output

      - name: Validate GitHub Pages build
        run: |
          npx vite build --mode github-pages
          node scripts/apply-content-times-to-static.mjs

      - name: Verify GitHub Pages static output
        env:
          EXPECTED_BASE: tomz-io
        run: npm run verify:static-output

      - name: Ensure validation did not dirty tracked source
        run: git diff --exit-code

      - name: Push validated cleanup
        run: git push origin HEAD:preview/weekly-v0-1

      - name: Publish cleaned preview
        env:
          PREVIEW_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/prepare-pages-preview.mjs
          grep -q 'noindex,nofollow' dist/index.html
          grep -q 'noindex,nofollow' dist/blogs/shared-thinking/matter-awakens/index.html
          grep -q 'Disallow: /' dist/robots.txt
          cp -a dist /tmp/pages-dist
          git fetch origin gh-pages
          git switch --detach origin/gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pages-dist/. .
          touch .nojekyll
          printf '%s\n' "$PREVIEW_SHA" > .preview-source-sha
          printf '%s\n' "$PREVIEW_SHA" > preview-source-sha.txt
          git add -A
          git commit -m "deploy: homepage v1 preview $PREVIEW_SHA"
          git push --force origin HEAD:gh-pages
