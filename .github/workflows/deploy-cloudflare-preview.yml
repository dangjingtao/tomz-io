name: Cloudflare Branch Preview

on:
  push:
    branches:
      - "content/**"
      - "preview/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Media pipeline unit tests
        run: pnpm run media:test

      - name: Media production scan (no upload, no source rewrite)
        run: pnpm run media:prepare
        env:
          R2_PUBLIC_BASE_URL: https://assets.tomz.io

      - name: Build root preview (content times, static metadata, RSS)
        run: pnpm run build
        env:
          CF_PAGES: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify root static output
        run: pnpm run verify:static-output

      - name: Apply preview-only noindex
        run: node scripts/prepare-pages-preview.mjs

      - name: Verify preview isolation
        run: |
          set -euo pipefail
          grep -q 'noindex,nofollow' dist/index.html
          grep -q 'noindex,nofollow' dist/blogs/shared-thinking/matter-awakens/index.html
          grep -q 'Disallow: /' dist/robots.txt

      - name: Write preview provenance
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > dist/.preview-source-sha
          printf '%s\n' "$GITHUB_SHA" > dist/preview-source-sha.txt
          printf '%s\n' "$GITHUB_REF_NAME" > dist/preview-source-branch.txt

      - name: Resolve preview alias
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_ALIAS="$(printf '%s' "$GITHUB_REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          printf 'url=https://%s.tomz-io.pages.dev\n' "$BRANCH_ALIAS" >> "$GITHUB_OUTPUT"

      - name: Deploy branch preview to Cloudflare Pages
        run: |
          set -euo pipefail
          npx --yes wrangler@3.90.0 pages deploy dist \
            --project-name=tomz-io \
            --branch="$GITHUB_REF_NAME" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="preview $GITHUB_REF_NAME@$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed preview
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 30); do
            HEADERS="$(curl -fsSI "$PREVIEW_URL/" || true)"
            SOURCE_SHA="$(curl -fsS "$PREVIEW_URL/preview-source-sha.txt" || true)"
            if printf '%s\n' "$HEADERS" | grep -qi '^x-robots-tag:.*noindex' \
              && [ "$SOURCE_SHA" = "$GITHUB_SHA" ]; then
              echo "Verified $PREVIEW_URL at $GITHUB_SHA"
              exit 0
            fi
            echo "Attempt $ATTEMPT/30: waiting for preview alias to serve $GITHUB_SHA"
            sleep 2
          done
          echo "Preview alias did not converge to $GITHUB_SHA with noindex."
          exit 1

      - name: Write preview address
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          {
            echo "### Cloudflare branch preview"
            echo
            echo "$PREVIEW_URL"
            echo
            echo "Branch: \`$GITHUB_REF_NAME\`"
            echo "Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
