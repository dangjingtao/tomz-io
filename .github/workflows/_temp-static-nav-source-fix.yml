name: Temporary static nav source fix

on:
  push:
    branches:
      - preview/weekly-v0-1

permissions:
  contents: write

jobs:
  apply-source-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/weekly-v0-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Align static navigation generators
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          vite_path = Path("vite.config.ts")
          vite = vite_path.read_text()
          vite = replace_once(vite, '    ["首页", "/"],\n', '', "vite bookshelf 首页")
          vite = replace_once(vite, '    ["周刊", "/weekly"],\n', '    ["见π", "/weekly"],\n', "vite bookshelf 见π")
          vite = replace_once(vite, '    ["关于", "/#about"],\n', '    ["关于", "/about"],\n', "vite bookshelf 关于")
          vite = replace_once(vite, '<li><a href="${href("/weekly")}">周刊</a></li>', '<li><a href="${href("/weekly")}">见π</a></li>', "vite home 见π")
          vite = replace_once(vite, '<li><a href="#about">关于</a></li>', '<li><a href="${href("/about")}">关于</a></li>', "vite home 关于")
          vite_path.write_text(vite)

          static_path = Path("mira-docs-static.ts")
          static = static_path.read_text()
          static = replace_once(static, '    ["首页", "/"],\n', '', "docs static 首页")
          static = replace_once(static, '    ["投稿", "/submissions"],\n', '', "docs static 投稿")
          static = replace_once(static, '    ["关于", "/#about"],\n', '    ["关于", "/about"],\n', "docs static 关于")
          static_path.write_text(static)
          PY
      - name: Commit source fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.config.ts mira-docs-static.ts
          git rm .github/workflows/_temp-static-nav-source-fix.yml
          git diff --cached --check
          git commit -m "fix(nav): align static shell navigation"
          git push origin HEAD:preview/weekly-v0-1
