name: Fix one-time App split

on:
  push:
    branches:
      - preview/weekly-v0-1
    paths:
      - .github/workflows/app-split-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  fix-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix split workflow contract
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/app-split-once.yml')
          text = path.read_text(encoding='utf-8')
          old = 'import DocsLayout from "./features/docs/DocsLayout";'
          new = 'import { DocsLayout } from "./features/docs/DocsLayout";'
          if old not in text:
              raise SystemExit('expected DocsLayout default import not found')
          text = text.replace(old, new, 1)
          if '  workflow_dispatch:\n' not in text:
              text = text.replace('on:\n', 'on:\n  workflow_dispatch:\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/app-split-once.yml
          git commit -m "fix: correct App split module import"
          git push origin HEAD:preview/weekly-v0-1

      - name: Dispatch corrected split
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          gh api \
            --method POST \
            repos/${{ github.repository }}/actions/workflows/app-split-once.yml/dispatches \
            -f ref='preview/weekly-v0-1'
