name: BR003A Pages Preview

on:
  push:
    branches:
      - work/br003a-full-mirror
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: br003a-pages-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:github-pages
      - name: Verify GitHub Pages static output
        env:
          EXPECTED_BASE: tomz-io
        run: npm run verify:static-output
      - name: Apply preview-only noindex
        run: node scripts/prepare-pages-preview.mjs
      - name: Verify preview isolation
        run: |
          grep -q 'noindex,nofollow' dist/index.html
          grep -q 'noindex,nofollow' dist/blogs/shared-thinking/matter-awakens/index.html
          grep -q 'Disallow: /' dist/robots.txt
      - name: Publish build:github-pages output to gh-pages
        env:
          PREVIEW_SHA: ${{ github.sha }}
        run: |
          cp -a dist /tmp/pages-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git switch --detach origin/gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pages-dist/. .
          touch .nojekyll
          printf '%s\n' "$PREVIEW_SHA" > .preview-source-sha
          printf '%s\n' "$PREVIEW_SHA" > preview-source-sha.txt
          git add -A
          git commit -m "deploy: BR003A mirror preview $PREVIEW_SHA"
          git push --force origin HEAD:gh-pages

      - name: Smoke public GitHub Pages runtime
        env:
          PREVIEW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="https://dangjingtao.github.io/tomz-io"

          published=""
          for attempt in $(seq 1 18); do
            published="$(curl -fsSL --max-time 15 "$base/preview-source-sha.txt" 2>/dev/null || true)"
            if [ "$published" = "$PREVIEW_SHA" ]; then
              break
            fi
            sleep 5
          done
          test "$published" = "$PREVIEW_SHA"

          check_html() {
            route="$1"
            needle="$2"
            file="$(mktemp)"
            status="$(curl -sS -L --max-time 20 -o "$file" -w '%{http_code}' "$base$route")"
            test "$status" = "200"
            grep -Fq "$needle" "$file"
            grep -Fq 'noindex,nofollow' "$file"
            grep -Fq '/tomz-io/assets/' "$file"
            rm -f "$file"
          }

          check_html "/" "本地优先的多模型智能体"
          check_html "/blogs/" "博客"
          check_html "/blogs/shared-thinking/matter-awakens/" "物质为什么会醒来"
          check_html "/blogs/mira-letters/a-seat-at-the-writing-table/" "Mira"
          check_html "/blogs/product-journal/2026-07-05-open-source-agent-ecosystem/" "Article"
          check_html "/blogs/engineering/insight-capture-pipeline/" "Article"
          check_html "/about/author/" "Tomz"
          check_html "/mira-docs-api/guide/what-is-mira-docs/" "MiraDocs"
          check_html "/design-md/%E8%A7%86%E8%A7%89/product-design-system/" "MiraDocs"

          # Directory-style deep routes must also survive direct requests without
          # a trailing slash; curl follows the Pages redirect and still reaches content.
          check_html "/blogs/shared-thinking/matter-awakens" "物质为什么会醒来"
          check_html "/mira-docs-api/guide/what-is-mira-docs" "MiraDocs"

          curl -fsSL --max-time 20 "$base/mira-logo.png" -o /tmp/mira-logo.png
          test -s /tmp/mira-logo.png
          curl -fsSL --max-time 20 "$base/robots.txt" | grep -Fq 'Disallow: /'
          echo "Public Pages runtime smoke passed for final source $PREVIEW_SHA."
