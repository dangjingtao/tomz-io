name: Pages Preview

on:
  push:
    branches:
      - work/br003-content-migration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:github-pages
      - run: npm run verify:static-output -- --base=/tomz-io/
      - name: Publish build:github-pages output to gh-pages
        env:
          PREVIEW_SHA: ${{ github.sha }}
        run: |
          cp -a dist /tmp/pages-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git switch --detach origin/gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pages-dist/. .
          touch .nojekyll
          printf '%s\n' "$PREVIEW_SHA" > .preview-source-sha
          git add -A
          git commit -m "deploy: BR003 preview $PREVIEW_SHA"
          git push --force origin HEAD:gh-pages
