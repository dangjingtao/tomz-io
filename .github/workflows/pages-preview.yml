name: GitHub Pages Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-compat
  cancel-in-progress: false

jobs:
  verify-github-pages-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Media pipeline unit tests
        run: npm run media:test

      - name: Media production scan (no upload, no source rewrite)
        run: npm run media:prepare

      - name: Build GitHub Pages compatibility output
        run: npm run build:github-pages

      - name: Verify GitHub Pages static output
        env:
          EXPECTED_BASE: tomz-io
        run: npm run verify:static-output
