name: Verify Homepage V1 Pages Runtime

on:
  pull_request:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build GitHub Pages output
        run: npm run build:github-pages

      - name: Verify GitHub Pages static output
        env:
          EXPECTED_BASE: tomz-io
        run: npm run verify:static-output

      - name: Apply preview-only noindex
        run: node scripts/prepare-pages-preview.mjs

      - name: Verify Pages-like runtime
        run: |
          set -euo pipefail
          base="http://127.0.0.1:4173/tomz-io"

          node scripts/serve-pages-like.mjs dist /tomz-io 4173 >/tmp/pages-like.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=""
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 2 "$base/" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            cat /tmp/pages-like.log
            exit 1
          fi

          check_html() {
            route="$1"
            needle="$2"
            file="$(mktemp)"
            status="$(curl -sS -L --max-time 20 -o "$file" -w '%{http_code}' "$base$route")"
            echo "$route -> $status"
            test "$status" = "200"
            grep -Fq "$needle" "$file"
            grep -Fq 'noindex,nofollow' "$file"
            grep -Fq '/tomz-io/assets/' "$file"
            rm -f "$file"
          }

          check_removed() {
            route="$1"
            file="$(mktemp)"
            status="$(curl -sS --max-time 20 -o "$file" -w '%{http_code}' "$base$route")"
            echo "$route -> $status (expected removed)"
            test "$status" = "404"
            grep -Fq 'noindex,nofollow' "$file"
            rm -f "$file"
          }

          check_html "/" "我是 Tomz，一名独立开发者和产品设计师"
          check_html "/blogs/" "博客"
          check_html "/blogs/shared-thinking/matter-awakens/" "物质为什么会醒来"
          check_html "/blogs/mira-letters/a-seat-at-the-writing-table/" "Mira"
          check_html "/blogs/shared-thinking/matter-awakens" "物质为什么会醒来"

          check_removed "/about/origin/"
          check_removed "/about/author/"
          check_removed "/mira-docs-api/"
          check_removed "/mira-docs-api/guide/what-is-mira-docs/"
          check_removed "/design-md/"
          check_removed "/design-md/%E8%A7%86%E8%A7%89/product-design-system/"
          check_removed "/blogs/product-journal/"
          check_removed "/blogs/product-journal/2026-07-05-open-source-agent-ecosystem/"
          check_removed "/blogs/engineering/"
          check_removed "/blogs/engineering/insight-capture-pipeline/"

          curl -fsSL --max-time 20 "$base/mira-logo.png" -o /tmp/mira-logo.png
          test -s /tmp/mira-logo.png
          curl -fsSL --max-time 20 "$base/robots.txt" | grep -Fq 'Disallow: /'

          file="$(mktemp)"
          status="$(curl -sS --max-time 20 -o "$file" -w '%{http_code}' "$base/__br003b_not_found__")"
          echo "/__br003b_not_found__ -> $status"
          test "$status" = "404"
          grep -Fq 'noindex,nofollow' "$file"
          rm -f "$file"

          echo "Homepage V1 Pages-like runtime smoke passed."
