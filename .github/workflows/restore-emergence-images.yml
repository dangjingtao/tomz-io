name: Restore emergence image references

on:
  push:
    branches:
      - fix/emergence-image-assets

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/emergence-image-assets
      - name: Restore last known good image URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/books/huangyan/emergence.md')
          s = p.read_text()
          s = s.replace('](/assets/emergence-collab-01.webp)', '](https://assets.tomz.io/images/emergence-collab-01.webp)')
          s = s.replace('](/assets/emergence-collab-02.webp)', '](https://assets.tomz.io/images/emergence-collab-02.webp)')
          p.write_text(s)
          PY
          rm -f public/assets/emergence-collab-01.webp public/assets/emergence-collab-02.webp
          rm -f .github/workflows/restore-emergence-images.yml
      - name: Commit restoration
        run: |
          git config user.name 'tomz-io bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m '恢复《涌现》上一版可用插图'
          git push origin HEAD:fix/emergence-image-assets
