name: AI Review Fallback Controller

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: write
  statuses: write

jobs:
  fallback-review:
    name: AI Review Fallback Controller
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Review with trusted gate implementation
        run: node scripts/ai-review-fallback.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_REVIEW_BASE_URL: ${{ secrets.AI_REVIEW_BASE_URL || secrets.HOMEPAGE_AI_BASE_URL }}
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY || secrets.HOMEPAGE_AI_API_KEY }}
          AI_REVIEW_MODEL: ${{ secrets.AI_REVIEW_MODEL || secrets.HOMEPAGE_AI_MODEL }}
