name: Apply topnav projects/about patch

on:
  push:
    branches:
      - work/topnav-projects-about
    paths:
      - .nav-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/topnav-projects-about
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch legacy App navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          old_nav = '''const configuredHeaderNav: ConfiguredNavGroup[] = [
  {
    label: "项目",
    items: [
      { label: "UIChat", href: "https://docs.uichat.tomz.io/" },
      {
        label: "open-proxy-apis",
        href: "https://github.com/dangjingtao/open-proxy-apis",
      },
      {
        label: "local-rerank",
        href: "https://github.com/dangjingtao/local-rerank",
      },
      { label: "typora-r2", href: "https://github.com/dangjingtao/typora-r2" },
    ],
  },
];'''
          if old_nav not in text:
              raise SystemExit('legacy configuredHeaderNav block not found')
          text = text.replace(old_nav, 'const configuredHeaderNav: ConfiguredNavGroup[] = [];', 1)

          old_content_nav = '''content.nav = [
  { label: "文档", href: docHref("/about/origin") },
  ...siteAreas.map((area) => ({ label: area.title, href: area.href })),
].sort((a, b) => {'''
          new_content_nav = '''content.nav = [
  { label: "文档", href: docHref("/about/origin") },
  ...siteAreas.map((area) => ({ label: area.title, href: area.href })),
  { label: "项目", href: docHref("/projects") },
  { label: "关于", href: docHref("/about") },
].sort((a, b) => {'''
          if old_content_nav not in text:
              raise SystemExit('content.nav block not found')
          text = text.replace(old_content_nav, new_content_nav, 1)

          old_titles = '''  if (pathname === "/") return defaultPageTitle;
  if (pathname === "/sitemap") return "站点地图";'''
          new_titles = '''  if (pathname === "/") return defaultPageTitle;
  if (pathname === "/projects") return "项目";
  if (pathname === "/about") return "关于";
  if (pathname === "/sitemap") return "站点地图";'''
          if old_titles not in text:
              raise SystemExit('title block not found')
          text = text.replace(old_titles, new_titles, 1)

          marker = '''function NotFoundPage({ onSearch }: { onSearch: () => void }) {'''
          holding = '''function HoldingPage({ kind }: { kind: "projects" | "about" }) {
  const isProjects = kind === "projects";
  return (
    <main className="not-found-page">
      <div className="not-found-card">
        <div className="doc-eyebrow">{isProjects ? "PROJECTS" : "ABOUT"}</div>
        <h1>{isProjects ? "项目" : "关于"}</h1>
        <p>{isProjects ? "这里先留作项目入口。具体展示什么，我们接下来再定。" : "这里先留作关于页面入口，内容稍后整理。"}</p>
      </div>
    </main>
  );
}

function NotFoundPage({ onSearch }: { onSearch: () => void }) {'''
          if marker not in text:
              raise SystemExit('NotFoundPage marker not found')
          text = text.replace(marker, holding, 1)

          route_marker = '''      <Routes>
        <Route path="/" element={<HomePage darkMode={darkMode} />} />'''
          route_replacement = '''      <Routes>
        <Route path="/" element={<HomePage darkMode={darkMode} />} />
        <Route path="/projects" element={<HoldingPage kind="projects" />} />
        <Route path="/about" element={<HoldingPage kind="about" />} />'''
          if route_marker not in text:
              raise SystemExit('Routes marker not found')
          text = text.replace(route_marker, route_replacement, 1)

          path.write_text(text)
          PY
      - run: npm install
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: align inner navigation with projects and about"
          git push origin HEAD:work/topnav-projects-about
