name: One-time site header refactor

on:
  push:
    branches:
      - preview/weekly-v0-1
    paths:
      - .github/workflows/_refactor-site-header.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/weekly-v0-1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10

      - name: Split site header and CSS
        run: python3 scripts/refactor-site-header.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Media pipeline tests
        run: pnpm run media:test

      - name: MiraDocs compatibility
        run: pnpm run verify:mira-docs

      - name: Root build
        run: pnpm run build

      - name: Root static output
        run: node scripts/verify-br003a-root-static.mjs

      - name: GitHub Pages build
        run: pnpm run build:github-pages

      - name: GitHub Pages static output
        run: EXPECTED_BASE=tomz-io pnpm run verify:static-output

      - name: Commit refactor and remove one-time helpers
        run: |
          git checkout -- src/content/content-times.generated.ts src/content/home-recent.generated.ts src/content/home-focus.generated.ts 2>/dev/null || true
          rm -rf .mira-cache dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_refactor-site-header.yml scripts/refactor-site-header.py
          git add src/App.tsx src/main.tsx src/styles.css src/components/SiteHeader.tsx src/styles/site-header.css
          git diff --cached --check
          git commit -m "refactor: split site header and styles"
          git push origin HEAD:preview/weekly-v0-1
