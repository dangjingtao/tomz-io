name: One-time shared layer refactor

on:
  push:
    branches:
      - preview/weekly-v0-1
    paths:
      - .github/workflows/_refactor-shared-layers.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/weekly-v0-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10
      - name: Wire shared layers
        run: python3 scripts/refactor-shared-layers.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Media pipeline tests
        run: pnpm run media:test
      - name: MiraDocs compatibility
        run: pnpm run verify:mira-docs
      - name: Root build
        run: pnpm run build
      - name: Root static output
        run: pnpm run verify:static-output
      - name: GitHub Pages build
        run: pnpm run build:github-pages
      - name: GitHub Pages static output
        env:
          EXPECTED_BASE: tomz-io
        run: pnpm run verify:static-output
      - name: Commit refactor and remove one-time helpers
        run: |
          git restore src/content/content-times.generated.ts src/content/home-focus.generated.ts src/content/home-recent.generated.ts || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/blog/BlogPages.tsx src/features/docs/DocsLayout.tsx
          git rm scripts/refactor-shared-layers.py .github/workflows/_refactor-shared-layers.yml
          git commit -m "refactor: share site model and heading behavior"
          git push origin HEAD:preview/weekly-v0-1
