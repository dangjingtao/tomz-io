name: Apply validated function layering

on:
  push:
    branches:
      - preview/weekly-v0-1
    paths:
      - .github/workflows/function-layering-apply.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile

      - name: Apply reviewed layering transform
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/function-layering-once.yml').read_text()
          start = source.index("          node <<'NODE'\n") + len("          node <<'NODE'\n")
          end = source.index("\n          NODE", start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/layer.cjs').write_text(script)
          PY
          node /tmp/layer.cjs

          python <<'PY'
          from pathlib import Path
          path = Path('src/features/docs/docs-utils.ts')
          source = path.read_text()
          old = 'docs.map(navigationDirectory)'
          if old not in source:
              raise SystemExit('expected docsByDirectory boundary was not found')
          source = source.replace(old, 'docs.map((doc) => doc.directory)')
          if 'navigationDirectory' in source:
              raise SystemExit('dead navigationDirectory wrapper reference survived')
          path.write_text(source)
          PY

      - name: Generate required type inputs
        run: pnpm run generate:content-times
      - name: TypeScript contract check
        run: pnpm exec tsc -b
      - name: MiraDocs contract check
        run: pnpm run verify:mira-docs
      - name: Production build
        run: pnpm run build
      - name: Production static output check
        run: pnpm run verify:static-output
      - name: GitHub Pages build
        run: pnpm run build:github-pages
      - name: GitHub Pages static output check
        run: pnpm run verify:static-output
      - name: Hygiene guards
        run: |
          test ! -e package-lock.json
          git diff --check
          test ! -e src/app/site-runtime.ts
          ! grep -q 'function navigationDirectory' src/App.tsx
          ! grep -q 'function renderMarkdown' src/App.tsx
          ! grep -q 'function docsByDirectory' src/App.tsx
          ! grep -q 'function weeklyIssueNumber' src/App.tsx
          ! grep -q 'function BlogThumbVisual' src/App.tsx
          ! grep -q 'function blogCategoryIcon' src/App.tsx

      - name: Commit validated source refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/App.tsx \
            src/types/site.ts \
            src/utils \
            src/content/author-profiles.ts \
            src/features/article/article-cover.ts \
            src/features/docs/docs-utils.ts \
            src/features/weekly/weekly-utils.ts
          git diff --cached --check
          git commit -m "refactor(app): layer shared and page helpers"
          git push origin HEAD:preview/weekly-v0-1
