- title: "GitHub 正式关闭 HTTPS 的 SHA-1：一项‘早该退休’的兼容性终于真的退场"
  url: "https://github.blog/changelog/2026-09-15-sha-1-in-https-on-github-sunset/"
  source: "GitHub Changelog"
  radar: "infrastructure"
  topic: "web-security / tls / compatibility / legacy-tech / developer-infrastructure"
  discoveredAt: "2026-09-16"
  origin: "radar"
  note: "GitHub 按此前计划于 9 月 15 日在 github.com 及合作 CDN 上禁用 HTTPS 的 SHA-1，影响 GitHub Enterprise Cloud 与 Data Residency，Enterprise Server 不受影响。这条本身不是大新闻，但很适合《见π》的基础设施观察：互联网长期背负的兼容性债务并不会因为标准宣布淘汰就自动消失，真正的退场往往要等大型公共基础设施愿意切断最后的旧客户端。可与浏览器、TLS、旧设备和‘为了兼容而永久存在’的工程现实放在一起写。"
  status: "candidate"

- title: "Firefox 156 Beta：浏览器开始更明确地拒绝把非标准 WebKit scrollbar 当成‘支持的标准能力’"
  url: "https://developer.mozilla.org/en-US/docs/Mozilla/Firefox/Releases/156"
  source: "MDN / Mozilla"
  radar: "web"
  topic: "browser / css / web-compat / standards / progressive-enhancement"
  discoveredAt: "2026-09-16"
  origin: "radar"
  note: "Firefox 156 Beta 于 9 月 15 日进入发布节奏，其中一个很小但有意思的变化是：非标准 ::-webkit-scrollbar 在 @supports selector() 中统一报告为 unsupported，即便少数兼容站点仍会实际执行相关规则。它把‘为了兼容而执行’和‘公开宣称支持’拆开了。这个细节很适合 Web Radar：兼容层不必反过来绑架能力检测，浏览器可以继续照顾旧世界，同时不给非标准接口新的合法性。"
  status: "candidate"

- title: "V&A Digital Design Weekend：有人正在用土壤生物电池和低功耗计算机重新想象‘计算基础设施’"
  url: "https://www.vam.ac.uk/blog/digital/digital-design-weekend-returns-to-va-south-kensington-this-september"
  source: "Victoria and Albert Museum"
  radar: "ghost"
  topic: "design / low-energy-computing / bio-battery / solarpunk / interaction / digital-art"
  discoveredAt: "2026-09-16"
  origin: "radar"
  note: "V&A 9 月 15 日公布 2026 Digital Design Weekend 项目，其中 Shinji Toya 的 Microbial Feral Computing 用 soil-based bio-batteries 驱动低能耗计算实验；同一活动还包括把身体变成字形输入的 Glyph Yourself、织物合成器、算法音乐与关于灭绝植物的推测性数字档案。相比泛泛的‘未来科技展’，这批作品更值得留意的是它们把计算从屏幕和云端拉回材料、能源、身体与生态。鬼集候选优先聚焦 Microbial Feral Computing，不必把整个活动写成展讯。"
  status: "candidate"

- title: "OpenQARP：富士通把量子应用研发拆成一百多个可组合开源部件"
  url: "https://www.fujitsu.com/global/about/resources/news/press-releases/2026/0915-01.html"
  source: "Fujitsu / OpenQARP"
  radar: "open-source"
  topic: "quantum-computing / open-source / composability / research-tooling / hybrid-computing"
  discoveredAt: "2026-09-16"
  origin: "radar"
  note: "富士通 9 月 15 日宣布全球开源 Open Quantum Application Research Package（OpenQARP），提供超过 100 个量子应用研发组件，其中包含 70 多个可组合 building blocks 与约 20 个可直接运行的算法，并支持普通 PC、NVIDIA CUDA-Q 和富士通量子模拟环境。值得保留的不是‘量子又开源了’，而是研究软件也在采用越来越熟悉的模块化工具箱路线：把昂贵、专门的研发流程拆成可组合的小部件，让尚未拥有真实量子硬件的人也能参与应用层实验。正式编辑前应再次核对官方页面可访问性和 license / repository 细节。"
  status: "candidate"
