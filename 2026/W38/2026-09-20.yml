- title: "Safari 27 直接内置 MCP：浏览器正在从 Agent 的被自动化对象，变成主动提供能力的开发工具"
  url: "https://webkit.org/blog/18325/webkit-features-for-safari-27-0/"
  source: "WebKit"
  radar: "web"
  topic: "browser / mcp / coding-agent / web-development / local-tools"
  discoveredAt: "2026-09-20"
  origin: "radar"
  note: "WebKit 9 月 17 日发布 Safari 27.0 说明，其中 Safari MCP 已正式可用：开发者开启 ‘Allow remote automation and external agents’ 后，Claude Code、Codex 或其他 MCP 客户端可通过 safaridriver 读取 DOM、网络请求、截图和 console，并验证表单状态、样式、可访问性与性能。Apple 强调该 MCP server 本地运行、本身不发起网络请求，也不访问 Safari 个人信息。值得《见π》看的不是又多一个 MCP，而是浏览器厂商第一次把‘给 Agent 看见和验证真实浏览器’做成一等开发接口：过去 Agent 要靠 Playwright/CDP 等外部自动化层摸浏览器，现在浏览器本身开始主动暴露面向 Agent 的能力边界。"
  status: "candidate"

- title: "一个工程师、14.5 周、83 万行 Rust：GitHub 用 Agent 原地重写了运行 Agent 的 Runtime"
  url: "https://github.blog/ai-and-ml/generative-ai/migrating-the-github-copilot-runtime-to-rust-using-copilot/"
  source: "GitHub Blog"
  radar: "developer-tools"
  topic: "rust / coding-agent / software-rewrite / runtime / incremental-migration / agent-fleet"
  discoveredAt: "2026-09-20"
  origin: "radar"
  note: "GitHub 9 月 16 日公开 Copilot agent runtime 从 TypeScript/Node.js 原地迁移到 Rust 的完整工程记录：约 14.5 周内持续在 main 上迁移并发版，最终形成 832,378 行生产 Rust、468,689 行 Rust 单测和大量跨语言 E2E；文章称工作由一名工程师在团队支持和大量 Agent session 协作下主导完成。真正值得看的不是 80 万行这个刺激数字，而是迁移方法：没有 big-bang rewrite，而是小组件逐步替换、预发布验证、真实用户暴露、回归归因；同时作者明确记录了不完整迁移、行为合同不匹配、host boundary、错误 test oracle 等几十个回归。它提供了难得的 Agent 大规模工程案例：Agent 把过去经济上不成立的重写变得可行，但正确性仍靠合同、测试、渐进发布和人类控制来兜底。"
  status: "candidate"

- title: "One Robot, Many Bodies：控制策略开始尝试脱离某一具固定的机器人身体"
  url: "https://www.umiacs.umd.edu/news-events/news/one-robot-many-bodies-new-system-helps-four-legged-robots-adapt"
  source: "University of Maryland Institute for Advanced Computer Studies"
  radar: "research-reading"
  topic: "robotics / morphology / reinforcement-learning / locomotion / transfer"
  discoveredAt: "2026-09-20"
  origin: "radar"
  note: "University of Maryland 9 月 18 日介绍与 George Mason University 合作的 MorFiC（Morphology-aware FiLM Critic），论文已被 CoRL 2026 接收。问题很直观：四足机器人学会跑和抗推后，一旦换成重量、形状或电机不同的身体，原策略往往失效；MorFiC 试图让一个 locomotion policy 在不同 robot morphology 间迁移而无需重新训练。正式成刊前仍应追论文核对实验范围和泛化边界，但这个问题本身很漂亮：如果软件智能越来越可迁移，机器人领域也开始追问‘技能究竟属于大脑，还是属于这具身体’。"
  status: "candidate"
