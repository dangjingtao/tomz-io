trends:
  - title: "Agent 的竞争正从模型能力转向控制面"
    note: "Muse 的 Secure VM / Sentinel、Nightfall MCP Gateway、Open Agent Auth、KYA、Copilot 正式 Approve PR、Catalyst production gate 与 Agents API 放在一起看，已经不是零散功能。身份、授权、sandbox、staging、审计、审批、发布门槛正在组成 Agent 真正进入生产前缺失的基础设施层。"
  - title: "软件平台正在重新定义自己的边界：入口变轻，能力层变重"
    note: "Roblox Everywhere 允许内容离开主 App，以 standalone / Web / offline 形态运行但继续使用平台底层；Chrome 缩短发布周期，浏览器 Agent 调试能力继续扩张；语音 Agent 也开始把前端交互与后端推理拆开。平台不再只争一个入口，而是在争谁成为别人下面那层运行时。"
  - title: "‘复杂度下降’同时发生在工程、科学与攻击面"
    note: "Agent Harness 被托管化、真实 App 验证闭环被工具化、科学基础模型把历史观测变成公共底座，而 Anthropic 威胁报告又显示同类编排能力正在压低复杂网络行动需要的人力门槛。值得警惕的不是 AI 单向变强，而是原本昂贵、稀缺、需要团队协作的复杂流程正在同时变便宜。"

