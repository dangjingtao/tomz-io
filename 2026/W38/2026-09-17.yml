- title: "Firefox × Mistral：浏览器里的 AI 开始把‘模型选择权’当成 Web 开放性问题"
  url: "https://blog.mozilla.org/en/firefox/mozilla-mistral-partnership/"
  source: "Mozilla"
  radar: "web"
  topic: "browser / ai / model-choice / open-web / distribution"
  discoveredAt: "2026-09-17"
  origin: "radar"
  note: "Mozilla 9 月 16 日宣布与 Mistral 合作，把 Mistral Small 4 带入 Firefox Smart Window beta，并将 Smart Window 首次扩展到法国。值得保留的不是又一个浏览器 AI 功能，而是 Mozilla 明确把模型入口、默认分发和用户选择上升到开放 Web 的竞争问题：当 AI 逐渐成为浏览器的新交互层，‘谁决定你能用哪个模型’可能会像搜索引擎默认项一样成为新的平台权力。"
  status: "candidate"

- title: "Sponsored Agents：广告正在从‘给你看一条信息’变成‘让品牌 Agent 直接和你谈’"
  url: "https://openai.com/index/reimagining-advertising-with-ai/"
  source: "OpenAI"
  radar: "business-distribution"
  topic: "advertising / agents / distribution / conversational-commerce / platform"
  discoveredAt: "2026-09-17"
  origin: "radar"
  note: "OpenAI 9 月 16 日公布 ChatGPT Ads 新能力，其中 Sponsored Agents 允许用户点击广告后直接与企业赞助的 Agent 对话，同时 Ads Manager 加入 AI 创意能力，并接入 HubSpot 与 Shopify。值得《见π》继续看的不是广告产品本身，而是广告单元可能从静态展示/落地页迁移成一个可交互、可持续说服甚至可完成任务的代理。商业分发的基本单位如果从 impression 变成 conversation，平台治理、身份披露和‘谁在说话’都会随之变得更重要。"
  status: "candidate"

- title: "1847 年的一次火车晚点，178 年后被还原成早期‘太空天气故障报告’"
  url: "https://phys.org/news/2026-09-minute-delay-solar-storm-disrupted.html"
  source: "Phys.org / University of Warwick research coverage"
  radar: "ghost"
  topic: "space-weather / railway / telegraph / infrastructure-history / failure-analysis"
  discoveredAt: "2026-09-17"
  origin: "radar"
  note: "研究者重新解释了一次 1847 年英国铁路约 16 分钟的延误：当时的电报/信号基础设施受到太阳活动诱发电流干扰。这条很适合鬼集，不因为它‘古老’，而因为它像一份跨越 178 年才完成根因分析的事故报告——现代社会讨论卫星、电网、通信系统的空间天气风险时，早期联网基础设施其实已经留下过故障样本。正式编辑时应继续追到论文或大学原始发布核实细节。"
  status: "candidate"

- title: "赫库兰尼姆卷轴的新线索：铅墨让被火山烧毁的文字更可能被 X 射线重新读出"
  url: "https://phys.org/news/2026-09-lost-ancient-scrolls-eruption-mount.html"
  source: "Phys.org / research coverage"
  radar: "research-reading"
  topic: "archaeology / x-ray / ancient-scrolls / imaging / cultural-preservation"
  discoveredAt: "2026-09-17"
  origin: "radar"
  note: "对维苏威火山喷发中碳化卷轴碎片的研究发现墨水含铅，这可能显著改善 X 射线成像对墨迹与纸草基底的区分。它延续了虚拟展开古卷这条很迷人的技术线：计算机视觉和成像技术不是生成一段古代文本，而是在尽可能不打开、也不进一步毁坏文物的前提下恢复真实存在的字。相比泛泛的 AI 考古叙事，这个材料层面的突破更值得保留。正式编辑前应追原论文。"
  status: "candidate"

- title: "GitHub AI Scan 脱离 CodeQL 默认配置：安全扫描正在变成 PR 上可独立调用的能力"
  url: "https://github.blog/changelog/2026-09-16-code-scanning-ai-scan-no-longer-requires-codeql-default-setup/"
  source: "GitHub Changelog"
  radar: "developer-tools"
  topic: "security / code-review / ai-scan / pull-request / developer-tools"
  discoveredAt: "2026-09-17"
  origin: "radar"
  note: "GitHub 9 月 16 日宣布 Code Scanning 的 AI Scan 不再要求仓库先启用 CodeQL default setup，就能在 PR 上寻找安全漏洞。单看是产品门槛降低，更值得观察的是安全能力被进一步拆成可按 PR 调用的独立检查：仓库治理不再要求先接受一整套扫描体系，团队可以把更窄的安全检查插入既有 Review 流程。与近期 AI Review 进入 required approval、agentic autofix 等变化放在一起看，GitHub 正把 AI 逐步嵌进代码治理链，而不只是编辑器。"
  status: "candidate"
