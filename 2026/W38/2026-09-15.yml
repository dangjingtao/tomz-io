- title: "HardFlow：与其在每一步束缚生成模型，不如只对最终结果执行硬约束"
  url: "https://news.mit.edu/2026/new-method-enables-ai-safety-critical-situations-0914"
  source: "MIT News / MIT CSAIL"
  radar: "research-reading"
  topic: "generative-models / hard-constraints / safety-critical / robotics / control"
  discoveredAt: "2026-09-15"
  origin: "radar"
  note: "MIT 团队提出 HardFlow，用于要求生成结果必须满足不可妥协约束的安全关键任务。值得看的不是又一个生成算法，而是它反直觉的控制策略：不在每个中间生成步骤强行满足约束，而给模型更大的搜索自由，只在最终输出上严格执行 hard constraints；实验覆盖机器人、物理过程控制与计算机视觉。这与 Agent 工程里‘过程可探索、边界必须由外部系统最终卡死’的设计直觉形成了很好的跨领域呼应，适合作为研究线而非泛 AI 新闻保留。"
  status: "candidate"

- title: "Unconventional Robotics Symposium：机器人研究者专门为‘不太像机器人学的机器人学’办了场免费会议"
  url: "https://unconvrobotics.github.io/"
  source: "2nd Unconventional Robotics Symposium / TU Delft"
  radar: "ghost"
  topic: "robotics / physical-computation / soft-robotics / embodied-intelligence / research-community"
  discoveredAt: "2026-09-15"
  origin: "radar"
  note: "TU Delft 9 月 14–15 日举办第二届 Unconventional Robotics Symposium，主题直接把机器人灵感来源扩到 biology、arts、books and beyond，内容涉及软体、physical computation、embodied intelligence 与 nonlinear dynamics。更有意思的是组织者把会议本身也当成实验：免费、非正式但严肃，并明确反思传统学术会议昂贵、高碳和不易参与的问题。它很适合鬼集：怪的不是某台机器人，而是一群研究者主动给偏离主航道的机器人学搭了一个低门槛公共空间。"
  status: "candidate"

- title: "ENCROACH：用一座会反射你的装置，把高密度住宅里的‘看见与被看见’变成身体体验"
  url: "https://events.cornell.edu/event/encroach-an-exhibition-exploring-privacy-and-exposure-in-high-density-housing"
  source: "Cornell AAP / Housing Innovation Lab"
  radar: "design"
  topic: "architecture / privacy / interaction / housing / spatial-design"
  discoveredAt: "2026-09-15"
  origin: "radar"
  note: "Cornell Housing Innovation Lab 的户外展览 ENCROACH 用碎片化空间、被迫协商的视线和反射表皮讨论高密度住宅中的隐私：身体可见但脸不可见，内部与外部、观看与被观看的边界被刻意搅乱。它不是数字产品设计，却是很好的交互样本——隐私不是一个设置开关，而是空间、视线、身体和他人共同制造的动态关系。适合给《见π》补一条真正离开屏幕的设计观察。"
  status: "candidate"

- title: "MX Keypad：AI 编程终于长出了一块专门的实体控制面板"
  url: "https://news.logitech.com/press-releases/news-details/2026/Logitech-Unveils-MX-Keypad-for-Developers-The-Customizable-Multi-App-AI-Control-Center/default.aspx"
  source: "Logitech"
  radar: "product"
  topic: "developer-tools / hardware / ai-coding / physical-interface / multi-agent"
  discoveredAt: "2026-09-15"
  origin: "radar"
  note: "Logitech 9 月 8 日发布 MX Keypad，定位不是普通宏键盘，而是跨 GitHub Copilot、Claude Code、VS Code、IntelliJ 等工具的开发者 AI 控制面板，可把 prompt、refactor、命令和跨 App 动作绑定到实体按键。单看产品未必革命性，但它是个有趣的交互信号：当开发工作流里同时存在多个 Agent、IDE 与上下文后，‘编排 AI’开始从软件 UI 溢出到桌面硬件。适合和软件 Control Room / Agent control plane 放在一起看，但不要写成新品广告。"
  status: "candidate"
