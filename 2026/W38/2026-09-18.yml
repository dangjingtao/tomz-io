- title: "GitHub Actions 加上 workflow execution protections：CI 也开始拥有自己的运行时权限边界"
  url: "https://github.blog/changelog/2026-09-17-workflow-execution-protections-in-github-actions-generally-available/"
  source: "GitHub Changelog"
  radar: "developer-tools"
  topic: "ci / github-actions / execution-policy / supply-chain / governance"
  discoveredAt: "2026-09-18"
  origin: "radar"
  note: "GitHub 9 月 17 日宣布 workflow execution protections GA。值得继续看的不是又一个 Actions 安全开关，而是 CI/CD 的执行权限正在从 workflow 文件里的隐含假设，变成平台可治理的独立控制面：什么工作流可以执行、在什么条件下执行，开始与代码本身分层。与 Agent Runtime 的审批、sandbox、policy gate 放在一起看，这是一条更普遍的工程趋势——自动化越强，执行边界越需要脱离自动化脚本本身。"
  status: "candidate"

- title: "ubuntu-latest 将迁移到 26.04：一个叫 latest 的便利标签，仍然是一份会自己变化的依赖合同"
  url: "https://github.blog/changelog/2026-09-17-ubuntu-26-generally-available-and-latest-migration/"
  source: "GitHub Changelog"
  radar: "infrastructure"
  topic: "ci / reproducibility / ubuntu / dependency-drift / github-actions"
  discoveredAt: "2026-09-18"
  origin: "radar"
  note: "GitHub 宣布 Ubuntu 26.04 runner GA，并将在 10 月 19 日至 11 月 19 日把 ubuntu-latest 从 24.04 渐进迁移到 26.04；官方明确提醒工具和预装版本变化可能打断 workflow。它很适合做一个朴素的工程现场旁证：latest 看似减少配置，实际上把升级决策交给了平台时间表。对于追求可复现构建的团队，pin 版本仍然是一种治理选择，而不只是保守习惯。"
  status: "candidate"

- title: "GSoC 在 AI 时代重新发现稀缺资源：不是代码，而是 maintainer 的时间与上下文"
  url: "https://opensource.googleblog.com/2026/09/reconnecting-with-the-heart-of-open-source-highlights-from-our-2026-gsoc-india-tour.html"
  source: "Google Open Source Blog"
  radar: "open-source"
  topic: "open-source / maintainers / mentorship / ai-coding / community"
  discoveredAt: "2026-09-18"
  origin: "radar"
  note: "Google 9 月 17 日总结 GSoC India 社区讨论时，把 AI 辅助开发后的真正瓶颈说得很清楚：模板、测试、语法修复越来越容易生成，但 maintainer 的注意力、架构视野、项目历史与高质量 review 没有同步扩容；低质量自动提交反而会消耗志愿维护者。这个材料适合《见π》从‘AI 提高代码产量’反向讨论开源治理：当生成成本趋近于零，理解项目为什么如此设计的人变得更贵。"
  status: "candidate"

- title: "北极海冰不是被风简单推着走：碰撞网络解释了大尺度漂移与扩散"
  url: "https://news.ucr.edu/articles/2026/09/16/engineers-solve-puzzle-arctic-sea-ice-movement"
  source: "University of California, Riverside"
  radar: "research-reading"
  topic: "climate / sea-ice / mechanics / collective-behavior / modeling"
  discoveredAt: "2026-09-18"
  origin: "radar"
  note: "UC Riverside 9 月 16 日介绍的一项研究指出，仅靠风并不能解释北极海冰的移动和铺展，冰块之间的碰撞与相互作用是关键。值得保留的是它把一个看似‘外力推动物体’的问题还原成大量个体接触后出现的集体动力学：宏观轨迹不是单个冰块受力的简单相加。正式编辑前应继续追原论文，尤其适合放在非 AI 的科学观察里。"
  status: "candidate"

- title: "Mila × Mozilla：开放 AI 的问题正在从‘开放权重’重新回到公共基础设施"
  url: "https://blog.mozilla.org/en/mozilla/mila-canada-open-source-ai-initiative/"
  source: "Mozilla"
  radar: "open-source"
  topic: "open-source-ai / public-infrastructure / research / ecosystem / governance"
  discoveredAt: "2026-09-18"
  origin: "radar"
  note: "Mozilla 与 Mila 9 月 17 日宣布新的可信开源 AI 计划，并得到加拿大政府支持。它和昨天 Firefox × Mistral 的浏览器模型选择问题有关，但不是同一事件：这里更值得观察的是‘开放 AI’开始被重新描述为生态和公共基础设施问题，而不只是某个模型是否开放权重。先作为持续线索保留，后续如果出现具体项目、治理结构或可复用成果，再决定是否升级为正式入选项。"
  status: "candidate"
