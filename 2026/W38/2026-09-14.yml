- title: "Anthropic 威胁报告：AI 在真实网络攻击里正从助手变成编排器"
  url: "https://www.anthropic.com/threat-intelligence-report-september-2026"
  source: "Anthropic Threat Intelligence"
  radar: "anomaly"
  topic: "ai-security / cyber-operations / orchestration / multi-agent"
  discoveredAt: "2026-09-14"
  origin: "radar"
  note: "Anthropic 的 2026 年 9 月威胁情报报告汇总其在 2025 年 12 月至 2026 年 8 月间处置的多类滥用案例。比单个攻击故事更值得看的是角色变化：报告称多数被观察到的网络行动里，AI 已不只是回答问题，而是直接执行或编排侦察、利用和数据外传，多 Agent 框架开始承担完整 kill chain 的脚手架；人类更多负责设定目标和检查结果。这与近期 Agent runtime、权限控制面、sandbox 迅速成熟形成阴影面上的对应：同一套降低复杂任务组织成本的能力，也在降低复杂攻击需要的人力门槛。"
  status: "candidate"

- title: "Roblox Everywhere：游戏平台开始把自己拆成可嵌入 Web、独立 App 与离线运行的基础设施"
  url: "https://about.roblox.com/newsroom/2026/09/rdc-2026-the-world-needs-more-play"
  source: "Roblox RDC 2026"
  radar: "business-distribution"
  topic: "game-platform / web-distribution / creator-economy / offline / platform-unbundling"
  discoveredAt: "2026-09-14"
  origin: "radar"
  note: "Roblox 在 RDC 2026 公布 Roblox Everywhere：未来创作者可把 Roblox 游戏发布成 mobile、PC、console 的 standalone app，同时底层仍由 Roblox 提供技术与服务；2026 年底前还计划支持 Chrome 浏览器直接进入游戏，不再要求安装客户端，并在 2027 年加入离线单人模式。信号不只是游戏平台多几个入口，而是一个典型封闭平台开始尝试把引擎、分发、社交与运行时拆开：内容可以离开主 App，但平台基础设施继续留在下面。它对‘平台究竟是入口还是能力层’这个老问题给了一个很新的样本。"
  status: "candidate"

- title: "用声波同时保护和搬运量子信息：phonon 开始承担双重角色"
  url: "https://www.nature.com/articles/s41567-026-03369-2"
  source: "Nature Physics / Harvard SEAS"
  radar: "research-reading"
  topic: "quantum-computing / phononics / qubit-coherence / chip-scale-network"
  discoveredAt: "2026-09-14"
  origin: "radar"
  note: "Harvard 团队在 Nature Physics 发表的工作展示了 all-mechanical coherence protection：用连续声学驱动把 diamond silicon-vacancy spin 维持在更不易受低频噪声影响的 dressed state，并把 coherence time 提升约 3 倍。更有意思的是同一类 phonon 既可以在片上网络里传递量子信息，也可以帮助保护量子态。它是一条很好的异质科学信号：有时系统复杂度不是靠再加一个独立保护层解决，而是让原本负责传输的物理介质兼任保护。"
  status: "candidate"

- title: "CI 全绿不等于真正部署：迁移和自动化最危险的是‘看起来成功’"
  url: ""
  source: "Mira 稳定性周报 / 真实工程现场（已脱敏）"
  radar: "field-note"
  topic: "ci-cd / deployment / migration / observability / false-success"
  discoveredAt: "2026-09-14"
  origin: "field-note"
  note: "近期真实工程现场反复出现一个可公开抽象的问题：CI 总体显示 success，并不能证明生产部署步骤真的执行过；凭据缺失、外部授权变化或部署来源切换，都可能让关键步骤被跳过而整条流水线仍显得健康。与此相连的迁移经验是：代码仓库迁移本身通常不会自动改变线上运行资源，但首次迁移后的真实部署前，必须逐项核验凭据、外部集成、实际部署来源和硬编码依赖。适合写成‘绿色不是证据，执行证据才是’的工程现场短文；公开时继续保持完全脱敏。"
  status: "candidate"
