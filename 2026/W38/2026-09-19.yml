- title: "npm 增加 stage-only token：自动化可以把包送到门口，但最后一次 publish 仍留给人"
  url: "https://github.blog/changelog/2026-09-18-stage-only-npm-tokens-for-safer-automation/"
  source: "GitHub Changelog"
  radar: "developer-tools"
  topic: "npm / supply-chain / staged-publishing / human-approval / automation"
  discoveredAt: "2026-09-19"
  origin: "radar"
  note: "GitHub 9 月 18 日为 npm granular access token 增加 Read and write (stage only) 权限：自动化可以用 npm stage publish 提交待发布版本，但不能直接 npm publish，最终发布需要 maintainer 以 2FA 审批。它和本周 Actions execution protections 是同一条更普遍的工程线，但作用点不同：不是阻止 workflow 启动，而是把高风险副作用拆成‘机器准备、人类提交’两个阶段。npm 还计划在 2027 年 1 月移除通过 bypass-2FA token 直接发布的能力。适合继续观察 staged action 是否成为自动化系统的通用治理模式。"
  status: "candidate"

- title: "MIT 把光学实验室做成可拆、可装、会自愈的机器人：自动化终于碰到了实验的物理摩擦"
  url: "https://news.mit.edu/2026/robotic-lab-runs-optics-experiments-on-demand-0917"
  source: "MIT News"
  radar: "research-reading"
  topic: "robotics / autonomous-lab / optics / physical-experiment / science-infrastructure"
  discoveredAt: "2026-09-19"
  origin: "radar"
  note: "MIT 9 月 17 日公布可重构 robotic optics laboratory：机械臂能识别、搬运和排列带 QR 编码的标准光学组件，以微米级精度调整镜片，并在扰动后重新校准。演示中系统从随机放置的组件开始，约 30 分钟、50 次动作后自主搭出可工作的 laser cavity；团队还在做远程云端实验入口。真正值得《见π》看的不是‘机器人做科学’，而是自动化开始跨过软件边界，处理实验世界最昂贵也最琐碎的那层——摆放、校准、漂移和重来。"
  status: "candidate"

- title: "如果布料本身就是机器人：Rice 把传感、运动和机械行为直接编进针织结构"
  url: "https://news.rice.edu/news/2026/rices-sanchez-exploring-future-where-fabric-itself-becomes-robot"
  source: "Rice University"
  radar: "ghost"
  topic: "soft-robotics / programmable-textiles / knitting / human-centered-design / materials"
  discoveredAt: "2026-09-19"
  origin: "radar"
  note: "Rice University 9 月 16 日介绍 Vanessa Sanchez 的 Programmable 3D-Knitted Soft Robotic Textiles 项目：目标不是把传感器、执行器再缝到衣服上，而是把 sensing、movement 与 mechanical behavior 直接设计进针织结构，让座椅、衣物或柔性安全系统本身成为机器。项目仍处早期研究阶段，因此不宜包装成已完成产品；但它很适合‘鬼集’：当结构材料本身开始兼任感知与执行，机器人未必还需要长得像一台机器人。"
  status: "candidate"

- title: "华为把 Agentic Infra 从口号落到存储、调度、恢复和治理：Agent 平台开始争夺生产基础设施层"
  url: "https://www.huawei.com/en/news/2026/9/hc-agentic-infra-industry-ai"
  source: "Huawei"
  radar: "china-dev"
  topic: "agent-infrastructure / cloud / memory / observability / enterprise / china"
  discoveredAt: "2026-09-19"
  origin: "radar"
  note: "华为云 9 月 18 日在 HUAWEI CONNECT 2026 展开 Agentic Infra：AICS 强调全链路可观测和故障恢复，Context Memory Storage 面向长时 Agent 的大容量记忆，AgentArts/openJiuwen 则把企业 Agent 与 MCP 资产放进同一平台。官方给出的客户、资产与性能数字仍需按厂商口径看待；真正值得保留的是中国云厂商已经不再只把 Agent 当应用开发框架，而是在重新命名计算、存储、调度、可靠性和治理这一整层基础设施。它可与本周 Agents API / control-plane 主线对照，但正式成刊时应避免再把整期拉回 Agent 单一主题。"
  status: "candidate"
