- title: "Meta 发布 Muse：个人 Agent 进入 Secure VM + Sentinel 控制面阶段"
  url: "https://about.fb.com/news/2026/09/introducing-muse-personal-ai-agent/"
  source: "Meta"
  radar: "agent-ai"
  topic: "personal-agent / secure-vm / permissions / background-agent"
  discoveredAt: "2026-09-09"
  origin: "radar"
  note: "Meta 在 9 月 8 日正式发布 Muse。真正值得看的是产品架构：每个用户的 Agent 跑在独立 Secure VM 中，凭据与 Agent 隔离；另有 Sentinel 在系统层审批网络访问和敏感动作，并保留完整审计轨迹。Agent 还可在用户离开 App 后继续后台执行。它把此前偏工程内部的 sandbox、approval、audit trail 直接做成了大众个人 Agent 的产品层。"
  status: "candidate"

- title: "NVIDIA PAIR：把家里闲置 GPU 拼成个人 Agent 计算池"
  url: "https://www.theverge.com/ai-artificial-intelligence/989435/nvidia-pair-personal-ai-router-home-local-llm-compute-tool-rtx-macbook"
  source: "The Verge / NVIDIA IFA 2026 announcement"
  radar: "open-source"
  topic: "local-ai / distributed-inference / agent-compute / edge"
  discoveredAt: "2026-09-09"
  origin: "radar"
  note: "NVIDIA 发布免费开源 PAIR（Personal AI Router），可把局域网里闲置的 RTX PC、DGX Spark 与部分 Apple Silicon 机器组成弹性个人 AI 计算池，为 Agent 子任务分发算力。它不是传统集群产品，而是把家庭/个人设备的碎片化闲置算力包装成 Agent Runtime 的资源层；对本地 AI、隐私和云 token 成本都有直接意义。"
  status: "candidate"

- title: "CyberAgents Exchange 开始给 Agent / Skill / MCP 做部署前审查"
  url: "https://www.tenable.com/press-releases/tenable-uses-openai-gpt-cyber-models-to-help-defenders-inspect-community-built-ai-components"
  source: "Tenable"
  radar: "agent-ai"
  topic: "agent-security / skills / mcp / supply-chain"
  discoveredAt: "2026-09-09"
  origin: "radar"
  note: "Tenable 与 OpenAI 合作推出 CyberAgents Exchange AI Inspector，用 GPT cyber models、Tenable One AI Exposure 与人工研究员共同审查社区 Agent、Skills、MCP servers 和 multi-agent playbooks。Exchange 8 月上线后已收录 100+ 组件。值得观察的不是单个安全产品，而是 Agent 生态开始出现类似软件包仓库的‘组件供应链审查层’。"
  status: "candidate"

- title: "Zoho Catalyst 3.0：Agent 可以部署开发环境，但生产仍需人工晋升"
  url: "https://catalyst.zoho.com/blog/meet-catalyst-3.0.html"
  source: "Zoho Catalyst"
  radar: "product"
  topic: "agentic-development / mcp / deployment / human-gate"
  discoveredAt: "2026-09-09"
  origin: "radar"
  note: "Catalyst 3.0 把 MCP、Agent Skills 和非交互 CLI 接进完整开发/部署链。一个很实在的产品边界是：Agent 可在 development 中建表、配置 auth、部署函数，但 production 与 development 解耦，最终生产晋升必须人工执行；破坏性操作在非交互模式被禁用。比‘AI 会写代码’更值得看的是平台开始围绕 Agent 重构生产权限模型。"
  status: "candidate"

- title: "Webflow Source：Agent Presence 与 Release Gate 被做进可视化生产工具"
  url: "https://webflow.com/blog/webflow-conf-2026-announcements"
  source: "Webflow"
  radar: "product"
  topic: "agentic-workspace / visual-development / governance / release-gate"
  discoveredAt: "2026-09-09"
  origin: "radar"
  note: "Webflow Conf 2026 发布 Source 方向及一组 Agent 原生能力：Source 把代码库和 martech stack 拉进共同工作区；Agent Presence 在画布上实时显示 Agent 正在做什么；Releases 允许整个站点分支后再统一审核发布；MCP 进一步开放 CMS、交互和 Cloud deploy。这里出现了一种清晰形态：Agent 不再只是侧边栏助手，而成为有 presence、有权限、有 staging、有发布门槛的协作者。"
  status: "candidate"

- title: "Agentic SWE benchmark 的标签可能在骗人：真正任务难度更像 Spread / Novelty / Centrality"
  url: "https://arxiv.org/abs/2609.01271"
  source: "arXiv"
  radar: "research-reading"
  topic: "coding-agent / benchmark / evaluation"
  discoveredAt: "2026-09-09"
  origin: "radar"
  note: "论文分析 5 个 Agent 软件工程 benchmark 与 14,922 条轨迹，提出 SNC（Spread、Novelty、Centrality）描述仓库级任务真实需求。结论之一是常见的 bug fix / feature implementation 标签无法代表实际难度；不同模型成功时的行为特征也不同。对所有拿 SWE-bench 式单一分数比较 Agent 的产品都值得敲一下警钟。"
  status: "candidate"

- title: "Gloo Code 用 Agent + 模型路由把‘token 预算’直接做成开发产品卖点"
  url: "https://investors.gloo.com/news-releases/news-release-details/gloo-launches-gloo-code-agentic-coding-and-optimized-agents-make"
  source: "Gloo"
  radar: "business-distribution"
  topic: "coding-agent / model-routing / cost-control"
  discoveredAt: "2026-09-09"
  origin: "radar"
  note: "Gloo Code 主打 purpose-built agents + 自动模型选择，以任务复杂度和成本路由模型，并直接用 Terminal-Bench 2.1 的成本/效果比宣传。单个产品未必重要，但它反映 AI Coding 的竞争维度正在从‘谁接了最强模型’转到 harness、routing、spec quality 与可预测 token 成本。适合后续与 multi-provider / gateway 趋势一起看。"
  status: "candidate"
