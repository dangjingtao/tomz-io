- title: "Visa、Mastercard、Ant International 开始共建 Know-Your-Agent：Agent 身份正在成为支付基础设施"
  url: "https://www.reuters.com/technology/payment-firms-visa-mastercard-ant-international-team-up-ai-agent-trust-framework-2026-09-10/"
  source: "Reuters / Ant International joint release"
  radar: "business-distribution"
  topic: "agentic-commerce / agent-identity / authorization / payments / interoperability"
  discoveredAt: "2026-09-11"
  origin: "radar"
  note: "三家公司 9 月 10 日宣布启动 Know-Your-Agent（KYA）互操作框架，目标是在卡组织、数字钱包、Agent 平台和市场之间识别与验证可信 Agent，同时保留各网络自己的审批与风控。它不是又一个‘AI 帮你买东西’功能，而是在补 Agent 真正进入现实交易前缺失的身份层：谁运营这个 Agent、用户授权了什么、不同网络如何识别同一个可信执行者。框架还把 Visa Trusted Agent Protocol、Mastercard Verifiable Intent 与 Ant International Agentic Mobile Protocol 拉向共同原则，并通过 MAS convened BuildFin.ai 推进。值得与 Open Agent Auth、MCP Gateway、Muse Sentinel 放在同一条‘Agent 控制面从应用内部走向跨系统基础设施’的线观察。"
  status: "candidate"

- title: "GitHub Copilot Code Review 已能正式 Approve PR：AI 审查开始进入仓库治理合同"
  url: "https://github.blog/changelog/2026-09-01-copilot-code-review-can-now-approve-pull-requests/"
  source: "GitHub"
  radar: "agent-ai"
  topic: "ai-code-review / pull-request / approval / governance / organization-policy"
  discoveredAt: "2026-09-11"
  origin: "radar"
  note: "GitHub 9 月 1 日把 Copilot Code Review 的角色从‘给评论’推进到可提交正式 Approve，并可计入 repository required-approvals。功能默认关闭，可在 enterprise / organization / repository 三层配置，repo 级还能限定允许批准的文件路径；新 commit 推送后原审批自动失效。真正的信号不是 Copilot 又多了一个按钮，而是 AI Reviewer 开始被纳入 GitHub 自己的治理合同：组织策略、路径权限、required approval 与变更后重新审查都成为一等公民。对正在形成 Organization 级 AI PR Review 基础设施的团队尤其值得跟踪。"
  status: "candidate"

- title: "agent-device：Coding Agent 开始拥有跨 iOS / Android 的真实 App 验证闭环"
  url: "https://github.com/callstack/agent-device"
  source: "Callstack / GitHub"
  radar: "open-source"
  topic: "mobile-agent / app-testing / device-automation / mcp / evidence"
  discoveredAt: "2026-09-11"
  origin: "radar"
  note: "Callstack 的 agent-device 已形成一套专门面向 Coding Agent 的移动端验证层：通过 CLI、MCP 和 typed Node API 控制 iOS / Android / TV / desktop，Agent 读取 token-efficient accessibility snapshot，用语义 ref 操作真实 App，并按需采集 screenshot、video、log、trace、network、crash 与 performance 证据；探索流程还能录成可重放脚本进入 CI。它与传统 Appium / Detox / Maestro 的区别不只是封装，而是把‘改完代码后让 Agent 自己去真实运行界面验收’作为第一目标。移动开发的 Agent loop 正从 code→test 继续延伸到 code→running app→evidence→review。"
  status: "candidate"

- title: "OpenAI 推出 ChatGPT for Financial Services：垂直 AI 产品开始把专有数据、治理与审计一起打包"
  url: "https://www.reuters.com/business/openai-launches-chatgpt-financial-services-industry-2026-09-10/"
  source: "Reuters / OpenAI"
  radar: "product"
  topic: "vertical-ai / financial-services / enterprise-data / governance / audit"
  discoveredAt: "2026-09-11"
  origin: "radar"
  note: "OpenAI 9 月 10 日推出面向投行与股票研究等场景的 ChatGPT for Financial Services，整合 LSEG、PitchBook、Daloopa 等金融数据源，并强调 role-based access、加密和 audit log export。值得看的不是‘金融行业又有一个 ChatGPT’，而是垂直 AI 产品的竞争单位正在从模型能力变成完整工作环境：受信数据、行业工作流、权限、审计与现有订阅/模板一起交付。对于 Agent 真正进入企业生产，这种产品形态可能比通用聊天入口更接近长期落点。"
  status: "candidate"
