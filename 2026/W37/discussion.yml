- title: "从 Wiles 七年独行到 Claude 十一天形式化：被机器翻译的不是天才，而是证明"
  url: "https://www.anthropic.com/research/formalizing-fermats-last-theorem"
  source: "Tomz manual submission / Anthropic / PBS NOVA Andrew Wiles interview"
  radar: "research-reading"
  topic: "mathematics / formal-verification / lean / scientific-ai / human-machine-contrast"
  discoveredAt: "2026-09-12"
  origin: "discussion"
  note: "Tomz 人工提供素材。Anthropic 2026-09-04 公布 Claude 基本自主运行约 11 天，用 Lean 完成费马大定理首个完整 computer-checked proof。与其写成‘AI 取代数学家’，更值得把它和 Andrew Wiles 的 NOVA 老访谈并读：Wiles 描述自己从童年执念开始，七年秘密工作，在黑暗房间里反复摸索，经历证明漏洞后才修补完成。两者做的事情并不等价——Wiles 发现并建立了关键数学，而 Claude 的项目把一条已有数学证明路线转译为机器可逐步验证的形式证明。真正有意思的问题是：当形式化这种长期被认为极其昂贵、需要大量专业人工的工作突然被压缩到十几天，数学知识的‘可验证性基础设施’会发生什么变化。正式写作前应继续核对 Anthropic 公布的 theorem / token / code 规模数字，避免使用二手截图里的夸张统计。配套阅读：https://www.pbs.org/wgbh/nova/proof/wiles.html"
  status: "candidate"
