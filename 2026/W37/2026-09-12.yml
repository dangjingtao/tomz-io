- title: "OpenAI Agents API：Agent Harness 本身开始被作为托管基础设施出售"
  url: "https://openai.com/index/introducing-the-agents-api/"
  source: "OpenAI"
  radar: "agent-ai"
  topic: "agent-runtime / harness / sandbox / subagents / long-running"
  discoveredAt: "2026-09-12"
  origin: "radar"
  note: "OpenAI 9 月 10 日发布 Agents API public beta，把 Codex 使用的 harness 与长时运行基础设施直接开放给开发者：harness 由 OpenAI 托管，计算环境可选 OpenAI sandbox、自有基础设施或合作 sandbox，并原生处理长会话、工具使用和 subagent 协调。信号不只是‘又一个 Agent API’，而是此前各团队自己搭 Planner/Runtime/Sandbox/Context/Tool orchestration 的一整层工程，开始被云服务化。值得持续观察这种 harness-as-a-service 会把 Agent 产品的差异化推向哪里。"
  status: "candidate"

- title: "Chrome 153 开始两周一更：Web 平台进入更短的基础设施发布周期"
  url: "https://developer.chrome.com/blog/chrome-two-week-start"
  source: "Chrome for Developers"
  radar: "product"
  topic: "browser / web-platform / release-engineering / compatibility"
  discoveredAt: "2026-09-12"
  origin: "radar"
  note: "Chrome 9 月 8 日随 153 正式从四周发布周期切换到两周。表面只是浏览器更勤快，实际会改变 Web 开发、企业兼容测试、扩展维护和安全补丁节奏：过去按月吸收的平台变化开始变成近似持续交付。浏览器已经是事实上的应用运行时，它缩短 release train，本身就是开发基础设施节奏变化，值得从 AI 之外长期跟踪。"
  status: "candidate"

- title: "用水波做计算并直接开机器人：Neuromorphic 不一定长得像芯片"
  url: "https://www.nature.com/articles/s41467-026-77661-3"
  source: "Nature Communications"
  radar: "research-reading"
  topic: "neuromorphic-computing / robotics / wave-computing / physical-computation"
  discoveredAt: "2026-09-12"
  origin: "radar"
  note: "9 月 10 日发表的工作用物理波干涉实现 reservoir computing：研究者先用可视化的水波网络识别障碍，再直接控制 Arduino 小车实时避障，并用微磁模拟给出向 GHz 自旋波固态器件迁移的路径。它有趣之处在于重新提醒我们：‘计算’不必永远是数字逻辑上跑神经网络，物理介质自身也可以承担推理的一部分。适合《见π》作为科学与硬件侧的异质信号。"
  status: "candidate"

- title: "OOMWOO：有人真的在把扫地机器人重新做成可打印、可维修、无云的开源家电"
  url: "https://github.com/makerspet/oomwoo"
  source: "OOMWOO / GitHub"
  radar: "ghost"
  topic: "open-hardware / home-robot / local-first / repairability / ros2"
  discoveredAt: "2026-09-12"
  origin: "radar"
  note: "OOMWOO 试图从硬件、固件到软件完整开源一台家用扫地机器人：Raspberry Pi、ROS2、2D LiDAR、ESP32、3D 打印，本地运行且不要求云服务；当前项目还在早期构建阶段，但 GitHub 已有较大社区关注。比‘DIY 一个机器人’更值得看的，是开源社区开始把反云锁定、可维修、可升级从服务器软件一路带到消费家电。它很适合鬼集：有点怪，但背后其实是一个越来越正常的问题——为什么买回家的机器最后还要租它的云。"
  status: "candidate"

- title: "Quaddle：只用四个舵机让四足机器人走、横移、旋转"
  url: "https://www.petoi.com/pages/quaddle-educational-robot-kit"
  source: "Petoi / OpenCat"
  radar: "ghost"
  topic: "robotics / open-source-hardware / mechanical-design / physical-ai"
  discoveredAt: "2026-09-12"
  origin: "radar"
  note: "Petoi 9 月推出 Quaddle，把常见需要 8–12 个舵机的四足机构压缩到 4 个舵机，通过机械连杆和步态设计仍实现行走、横移、旋转和平衡，并继续沿用 OpenCat 的开放生态。它未必代表机器人行业大趋势，但非常适合《见π》的‘怪而有启发’：当大家都在给 Physical AI 堆更多传感器和算力时，这个项目反过来从机械结构里省自由度，用一点笨办法换掉一截复杂度。"
  status: "candidate"
