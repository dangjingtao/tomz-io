- title: "NASA × IBM 开源 Lunar Foundation Model：把几十年月球观测变成可复用的科学基础模型"
  url: "https://science.nasa.gov/science-research/artificial-intelligence-lunar-foundation-model/"
  source: "NASA / IBM"
  radar: "research-reading"
  topic: "lunar-science / foundation-model / remote-sensing / open-science"
  discoveredAt: "2026-09-13"
  origin: "radar"
  note: "NASA 与 IBM 9 月 10 日发布并开源 NASA-IBM Lunar Foundation Model，主要基于 Lunar Reconnaissance Orbiter 等多源月球数据训练，并同步公开预训练数据集、benchmark、GitHub 代码和 Hugging Face 模型。值得看的不是‘AI 也来研究月球’，而是科学基础模型开始把几十年、跨仪器、跨分辨率的历史观测组织成可继续迁移和复现实验的公共研究底座；NASA 称其在部分月表关键特征识别任务上较常用方法最高提升约 23%。适合《见π》作为 AI 与真正科学基础设施交叉的一条信号，而不是普通模型发布新闻。"
  status: "candidate"

- title: "GPT-Live-1 API：语音 Agent 的前端开始与后端推理 / 工具层解耦"
  url: "https://openai.com/index/introducing-gpt-live-1-in-the-api/"
  source: "OpenAI"
  radar: "product"
  topic: "voice-agent / full-duplex / delegation / realtime-interface"
  discoveredAt: "2026-09-13"
  origin: "radar"
  note: "OpenAI 9 月 10 日把 GPT-Live-1 开放到 API，核心不只是更自然的语音，而是 full-duplex 前端模型可以一边持续听说，一边把深度推理和工具调用委托给后端文本模型或第三方模型。语音层、推理层、Agent Harness 开始被拆成独立可组合部件：前台维持自然交互，后台慢任务继续执行。这个架构对移动端、电话 Agent、长时任务和多模型路由都比单纯语音 benchmark 更值得观察。"
  status: "candidate"

- title: "Memory-V2V：多轮视频编辑开始需要‘编辑记忆’，而不是每一轮重新生成"
  url: "https://research.adobe.com/publication/memory-v2v-memory-augmented-video-to-video-diffusion-for-consistent-multi-turn-editing/"
  source: "Adobe Research / ECCV 2026"
  radar: "research-reading"
  topic: "video-editing / generative-media / memory / iterative-workflow"
  discoveredAt: "2026-09-13"
  origin: "radar"
  note: "Adobe Research 9 月 12 日发布 ECCV 2026 工作 Memory-V2V，专门处理生成式视频编辑中的多轮一致性：传统模型每一轮独立处理，前面已经改好的区域会在后续修改中漂移或被覆盖；该方法用外部 memory 保存前序编辑，并按当前任务检索、压缩和重新注入相关历史。它映射了一个很普遍的产品问题：真正的创作不是一次 prompt，而是连续修改；生成式工具若没有版本记忆和局部约束，越编辑越不像原来的东西。"
  status: "candidate"

- title: "KernWatch：一个人把 Linux 性能排障做成了可录制、可回放的 eBPF TUI"
  url: "https://github.com/matthart1983/kernwatch"
  source: "KernWatch / GitHub / developer community"
  radar: "ghost"
  topic: "linux / ebpf / observability / tui / personal-project"
  discoveredAt: "2026-09-13"
  origin: "radar"
  note: "开发者 Matt Hart 在听完 Brendan Gregg 的性能演讲后做了 KernWatch：一个 Rust 写的 Linux kernel/performance TUI，把 CPU scheduler、memory pressure、block I/O、IRQ、syscall、cgroup、eBPF 等现场压进同一界面，还支持 bounded eBPF capture、session recording、replay 和 incident report export。项目仍早期，不宜吹成新标准；但它很符合‘鬼集’：一个个人项目把传统需要 top/perf/bpftrace/iostat 等多套工具来回切换的排障过程，尝试重新组织成可复盘的证据工作流。"
  status: "candidate"
