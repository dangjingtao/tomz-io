- title: "聚变从实验室问题变成产业政策问题：加州开始为一门尚未商业化的能源技术提前造制度"
  url: "https://www.gov.ca.gov/2026/09/30/governor-newsom-signs-legislation-to-accelerate-californias-fusion-industry-announces-major-investment-for-quantum-research/"
  source: "State of California"
  radar: "institution-energy"
  topic: "fusion / industrial-policy / regulation / energy / state-capacity"
  discoveredAt: "2026-10-01"
  origin: "radar"
  note: "加州 9 月 30 日签署 SB 925，要求州能源机构制定聚变发展战略、商业化路径并推进制造，同时 AB 2647 要求重新评估先进核能在零碳电网中的角色；州政府还宣布 3000 万美元用于量子与深空研究。值得保留的不是又一笔科技补贴，而是技术成熟度与制度成熟度开始错位：聚变还没有成为商业电源，政府已经提前处理认证、环境审查、制造、人才和供应链。这是一个很好的制度小切口——当一项技术仍在证明‘能不能做’时，国家/地方能力什么时候应该开始准备‘做成以后怎么接住’？也可与《气数》里国家能力、路径依赖和制度预置的问题互相照亮，但暂不硬套历史结论。"
  status: "candidate"
  imageUrl: "https://www.gov.ca.gov/wp-content/uploads/2026/09/bill9-1.jpg"
  imageSourceUrl: "https://www.gov.ca.gov/2026/09/30/governor-newsom-signs-legislation-to-accelerate-californias-fusion-industry-announces-major-investment-for-quantum-research/"
  imageSource: "Office of the Governor of California"
  imageNote: "官方新闻稿主图，州长在 UC Berkeley 量子实验室签署法案；画面把实验设备与制度动作放在同一现场，适合表现‘技术尚在实验室，制度已经进场’。"
  imageStatus: "verify-rights"

- title: "机器人 benchmark 开始需要自己的‘标准考场’：OpenArm 2.0 把背景、灯光、相机和校准夹具一起开源"
  url: "https://docs.openarm.dev/overview/whats-new-in-2.0/"
  source: "OpenArm / Enactic"
  radar: "robotics-open-source"
  topic: "robotics / benchmark / reproducibility / open-hardware / physical-ai"
  discoveredAt: "2026-10-01"
  origin: "radar"
  note: "OpenArm 2.0 在 9 月底更新的文档里把项目从一只开源 7DOF 机械臂扩成可复现实验栈：除机械臂外增加 OpenArm Cell，用固定背景、照明、相机、安装位置和机械校准夹具约束不同实验室之间最容易漂移的条件，并配套数据集、仿真与控制节点。它真正有意思的不是‘又一只开源机器人’，而是机器人学习开始承认 benchmark 的物理环境本身也是协议的一部分。软件 benchmark 可以固定数据和代码，具身智能若连桌子、光线、相机位置和装配公差都不同，‘模型 A 胜过模型 B’可能根本不可比较。OpenArm KER 尚未完整发布，文档也明确部分 teleop/sim2real 代码仍在开发，正式写作不能把整套路线描述成全部交付。"
  status: "candidate"
  imageSourceUrl: "https://docs.openarm.dev/overview/whats-new-in-2.0/"
  imageSource: "OpenArm / Enactic"
  imageNote: "官方 2.0 文档和 Hardware 页面包含 OpenArm 2.0、OpenArm Cell 与校准流程图；正式排版优先取 Cell/校准夹具图，因为它比单独机械臂产品照更能解释‘物理 benchmark 需要标准考场’。当前未确认长期稳定的原图直链。"
  imageStatus: "verify-rights"
