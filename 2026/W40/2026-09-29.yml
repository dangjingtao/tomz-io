- title: "杜波依斯 1900 年的数据肖像没有被‘数字化’，而是被重新印了三十张：数据可视化重新回到历史、材料和手工"
  url: "https://www.usf.edu/arts/news/2026/20260925-graphicstudio-printing-black-america-aquisitions.aspx"
  source: "University of South Florida Graphicstudio"
  radar: "design-culture"
  topic: "data-visualization / W.E.B.-Du-Bois / printmaking / history / information-design"
  discoveredAt: "2026-09-29"
  origin: "radar"
  note: "艺术家 William Villalongo 与城市研究者 Shraddha Ramani 以 W.E.B. Du Bois 为 1900 巴黎世博会制作的数据肖像为起点，用当代数据重做了 30 幅版画，并与美国六家 printshop、历史学者和地方研究者合作。项目没有把百年前的信息图仅当作一种可复刻的视觉风格，而是继续追问住房、迁徙、职业、墓地与城市历史等今天的问题；作品已进入 MoMA 等馆藏，并进入 2026 年 9 月 27 日开幕的 MoMA 信息设计展。值得《见π》看的不是‘老图表翻新’，而是数据可视化在 dashboard 之外重新成为一种有材料、有作者、有历史位置的公共叙事媒介。"
  status: "candidate"
  imageSourceUrl: "https://www.usf.edu/arts/news/2026/20260925-graphicstudio-printing-black-america-aquisitions.aspx"
  imageSource: "USF Graphicstudio"
  imageNote: "USF 原文公开展示 Black Homeowners、African American Burial Ground Project & Tropicana Field 等作品图及完整 credit。后者把体育场地下的黑人墓地历史做成地层式信息图，尤其能帮助理解‘数据 + 城市史 + 版画’的交叉。作品版权明确属于艺术家/出版社体系，正式刊发前必须核对授权。"
  imageStatus: "verify-rights"

- title: "稀土供应链的另一头不是新矿，而是垃圾堆：研究者开始为电子废物设计‘只抓某一种元素’的聚合物"
  url: "https://www.isu.edu/news/2026-fall/trash-into-treasure-isu-researchers-developing-polymers-to-extract-rare-earth-elements-from-waste.html"
  source: "Idaho State University"
  radar: "science"
  topic: "rare-earth / e-waste / polymers / circular-economy / materials"
  discoveredAt: "2026-09-29"
  origin: "radar"
  note: "Idaho State University 团队在研究可从矿山尾矿和电子废物中选择性捕获稀土元素的聚合物。稀土并非天然极少，难点往往是浓度低、分离难；而旧电子设备与采矿废料已经形成另一种高浓度‘人造矿床’。这项工作仍处研究阶段，不能写成回收工艺已经解决，但它提供了一个更长尺度的观察：当关键材料需求上升，资源地图可能不只向地下延伸，也会重新绘制城市里几十年累积的产品、废物和旧基础设施。"
  status: "candidate"
  imageUrl: "https://www.isu.edu/media/publications/headlines/2026-fall/RareEarthPolymers_3.jpg"
  imageSourceUrl: "https://www.isu.edu/news/2026-fall/trash-into-treasure-isu-researchers-developing-polymers-to-extract-rare-earth-elements-from-waste.html"
  imageSource: "Idaho State University"
  imageNote: "大学新闻稿原图，展示研究人员在实验室处理材料；可用于说明研究现场，但信息量不如未来若能找到聚合物选择性捕获机制图。正式刊发前核对大学媒体图片使用条款。"
  imageStatus: "verify-rights"

- title: "把太阳能制氢的搜索空间从‘找一种催化剂’变成‘设计一整个材料家族’：MOF 的可调结构正在改变实验方式"
  url: "https://news.oregonstate.edu/news/new-possibilities-uncovered-efficiently-converting-sunlight-clean-energy"
  source: "Oregon State University / Journal of the American Chemical Society"
  radar: "science"
  topic: "photocatalysis / hydrogen / MOF / materials-discovery / solar-energy"
  discoveredAt: "2026-09-29"
  origin: "radar"
  note: "Oregon State University 团队发表一族用于光催化水制氢的 metal-organic framework 材料。MOF 的意义不只是这一次性能数字：金属节点与有机 linker 可以组合、调参，研究者已合成近十万种、预测更多候选，材料发现越来越像在一个可设计的结构空间里搜索，而不是等待单一配方偶然出现。当前结果仍是实验室尺度，距离廉价的大规模绿氢有工程鸿沟；《见π》更适合保留的问题是：当材料本身变成可编程的组合空间，化学实验的组织方式会不会越来越接近设计与搜索。"
  status: "candidate"
  imageUrl: "https://news.oregonstate.edu/sites/news.oregonstate.edu/files/styles/hero_background_style/public/2026-09/H2_Figure.png?itok=fBYgSQHy"
  imageSourceUrl: "https://news.oregonstate.edu/news/new-possibilities-uncovered-efficiently-converting-sunlight-clean-energy"
  imageSource: "Oregon State University"
  imageNote: "OSU 新闻稿主图为该研究的材料/反应机制示意，能直接解释光照、MOF 与产氢过程；URL 带站点图片样式参数，可能长期稳定性一般，正式排版时优先回原页面重新确认原图地址与 credit。"
  imageStatus: "unstable"
