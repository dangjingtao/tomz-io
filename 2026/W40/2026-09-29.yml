- title: "折叠屏最有意思的应用，也许不是多放一栏内容：有人把开合动作重新变成了‘放磁带’"
  url: "https://techcrunch.com/2026/09/28/the-iphone-duo-may-already-have-its-first-killer-app-a-virtual-walkman/"
  source: "TechCrunch / Vidit Bhargava"
  radar: "design-culture"
  topic: "foldable / interaction-design / retro-computing / physical-metaphor / indie"
  discoveredAt: "2026-09-29"
  origin: "radar"
  note: "独立开发者 Vidit Bhargava 在 Bitrig hackathon 做的 Duo-Man，没有把折叠屏简单理解成‘更大的屏幕’：打开 iPhone Duo 是挑选并放入磁带，合上后外屏成为 Walkman，作者还录下真实 Walkman 的按键声与底噪。它目前更接近 hackathon 原型而非成熟产品，但切口很好：新硬件形态真正成熟的信号，可能不是旧 App 被拉宽，而是软件开始把铰链、开合、内外屏切换这些物理动作本身当成交互语法。它也把复古媒介从视觉皮肤推进到身体动作与声音反馈。"
  status: "candidate"
  imageSourceUrl: "https://techcrunch.com/2026/09/28/the-iphone-duo-may-already-have-its-first-killer-app-a-virtual-walkman/"
  imageSource: "TechCrunch / Vidit Bhargava demo"
  imageNote: "优先使用作者公开 demo 中打开设备‘放磁带’与合上后 Walkman 外屏的画面；这两态并置才能解释折叠动作成为交互语法。当前未记录稳定的一手图片直链，正式使用需回到作者原帖核权。"
