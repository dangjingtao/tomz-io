- title: "Robotaxi 真正进入城市系统后，问题不再只是能不能开：武汉 400 万订单开始回答它和公交、出租车、能源怎样相处"
  url: "https://www.nature.com/articles/s41893-026-01944-2"
  source: "Nature Sustainability"
  radar: "city-life"
  topic: "robotaxi / urban-mobility / public-transit / energy / Wuhan"
  discoveredAt: "2026-09-28"
  origin: "radar"
  note: "9 月 22 日发表的研究使用武汉超过 400 万条有人出租车与全无人 Robotaxi 订单，开始从真实城市运行而非 demo 讨论自动驾驶。研究发现 Robotaxi 与传统出租车需求空间上存在竞争，但在地铁、公交站周边的出行结构又显示出更强的公共交通互补性；Robotaxi 目前也更集中在道路网络较简单区域。论文进一步给出调度与拼车优化的上界情景：车队规模可减少 62.5%、日能耗减少 44.8%，但这是模型优化结果，不是武汉现网已经实现的节能。值得《见π》追问的是：当自动驾驶从技术能力变成城市基础服务，评价尺度会从‘车会不会自己开’迁移到它怎样重新分配道路、公共交通、能源和既有劳动市场。"
  status: "candidate"
  imageStatus: "verify-rights"
  imageSourceUrl: "https://www.nature.com/articles/s41893-026-01944-2"
  imageSource: "Nature Sustainability"
  imageNote: "论文 Fig. 1–5 包含武汉 Robotaxi 时空分布、与公共交通关系、道路网络复杂度及能源优化结果，信息价值很高；正式使用前需核对论文图片授权，优先考虑图 1 或图 5，而不是泛化 Robotaxi 新闻照片。"

- title: "一颗电池在胃里工作三天，然后自己消失：临时电子设备开始把‘寿命结束后怎么办’写进材料本身"
  url: "https://www.nature.com/articles/s44286-026-00443-7"
  source: "Nature Chemical Engineering"
  radar: "science"
  topic: "bioresorbable-electronics / battery / ingestible-device / materials / healthcare"
  discoveredAt: "2026-09-28"
  origin: "radar"
  note: "9 月 21 日发表的开放获取研究展示 Mg–MoO3 纸电池：峰值开路电压 1.84V，在猪的胃肠环境中支持最长三天的工作，并实际驱动了用于药物追踪的无线标签和胃部电刺激胶囊。电池以镁合金、MoO3 纸复合阴极、可降解电解质和蜂蜡/小烛树蜡封装，目标是在任务结束后逐步降解，减少取回手术和体内电子废物风险。现在仍是前临床、小样本，且电刺激系统的 PCB 本身尚不可降解，不能写成‘可吞服电子设备已经完全消失’。更值得看的变化是设计逻辑：硬件过去默认追求更长寿命，现在某些医疗设备开始反过来精确设计‘应该活多久、什么时候消失’。"
  status: "candidate"
  imageUrl: "https://media.springernature.com/full/springer-static/image/art%3A10.1038%2Fs44286-026-00443-7/MediaObjects/44286_2026_443_Fig1_HTML.png"
  imageSourceUrl: "https://www.nature.com/articles/s44286-026-00443-7"
  imageSource: "Nature Chemical Engineering"
  imageNote: "论文 Fig. 1 是胶囊式可降解电子系统与 Mg–MoO3 电池结构示意，直接帮助理解‘临时供电 + 最终降解’的设计逻辑，比产品照更适合作为解释图。论文为 CC BY 4.0 开放获取；正式刊发仍需保留作者/论文归属并检查图内是否有单独第三方 credit。"
