- title: "四足机器人第一次把一整场马拉松当成续航测试：腿式机器人的瓶颈正在从‘会跑’转向‘能跑多久’"
  url: "https://doi.org/10.1038/s41586-026-11102-5"
  source: "Nature / Nature Portfolio"
  radar: "robotics"
  topic: "quadruped-robot / energy-efficiency / endurance / locomotion"
  discoveredAt: "2026-09-28"
  origin: "radar"
  note: "9 月 23 日 Nature 论文报告 KAIST 的 RAIBO2 四足机器人以单次电池完成韩国尚州马拉松，时间 4:19:52，平均 2.64 m/s，赛道累计高差 286m；全程耗电 1,280Wh，而电池容量 2,016Wh。研究团队把重点放在轻量腿部、电机驱动电路和强化学习运动规则共同降低运输能耗，并报告总 cost of transport 0.25。真正值得看的不是‘机器人跑完 42 公里’的猎奇纪录，而是腿式机器人评价指标开始从动作炫技进入耐力、能效与真实地形——这决定它能不能离开演示场进入巡检、物流和长期户外任务。"
  status: "candidate"
  imageStatus: "verify-rights"
  imageSourceUrl: "https://www.natureasia.com/en/info/press-releases/detail/9447"
  imageSource: "Nature Portfolio"
  imageNote: "优先寻找 Nature 论文/官方新闻稿中的 RAIBO2 实际马拉松照片或机器人结构图；它们能解释真实赛道与能效主题。当前未记录稳定可复用的直链，正式排版前从原始论文或 KAIST 官方来源核权，不使用二次媒体图。"
