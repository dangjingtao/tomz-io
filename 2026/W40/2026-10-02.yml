- title: "量子计算开始遇到制造业最熟悉的问题：不是最好的一颗 qubit 多强，而是同一批器件为什么总有几颗掉队"
  url: "https://news.fnal.gov/2026/10/sqms-center-uncovers-material-origins-of-variations-in-qubit-performance-through-landmark-study/"
  source: "Fermilab / SQMS Center / Applied Physics Reviews"
  radar: "science"
  topic: "quantum-computing / manufacturing / materials / reproducibility / blind-study"
  discoveredAt: "2026-10-02"
  origin: "radar"
  note: "Fermilab 牵头的 SQMS 对 22 个超导 transmon qubit 做了一次跨 6 家机构、7 种材料表征手段的盲测：做材料分析的人事先不知道器件的 T1 表现，最后再把微观特征与性能对照。结果指向三个很具体的制造变量——表面氧化层厚度、刻蚀侧壁角度和沟槽深度；这些差异可解释同材料器件最高约两倍的性能变化，而肉眼可见的划痕、颗粒等宏观缺陷反而没有显示清晰相关性。值得《见π》留下的不是又一个‘量子突破’，而是量子硬件正在从追逐最好样机进入良率与可重复性阶段：规模化以后，系统能力越来越由最差的器件决定。更有意思的是研究方法本身——把材料表征做成盲测，说明这个领域也开始需要像成熟制造业一样建立排除偏见、寻找过程变量的质量科学。"
  status: "candidate"
  imageUrl: "https://news.fnal.gov/wp-content/uploads/2026/09/Material-Defects-Graphic-1024x399.jpg"
  imageSourceUrl: "https://news.fnal.gov/2026/10/sqms-center-uncovers-material-origins-of-variations-in-qubit-performance-through-landmark-study/"
  imageSource: "SQMS Center / Fermilab"
  imageNote: "官方材料缺陷图直接并列显示表面氧化层厚度、侧壁角度与沟槽深度三项相关特征，比泛化量子芯片照片更能解释性能差异来自制造细节。Graphic credit 为 SQMS Center, Fermilab。"
  imageStatus: "verify-rights"

- title: "一颗鞋盒大小的卫星开始做过去要更大航天器才能做的事：商业拼车正在把太空实验变成更频繁的工程迭代"
  url: "https://www.nasa.gov/blogs/smallsatellites/2026/10/01/nasa-smallsats-launch-to-advance-science-technology-orbital-operations/"
  source: "NASA"
  radar: "space-infrastructure"
  topic: "CubeSat / rideshare / propulsion / satellite-servicing / science-infrastructure"
  discoveredAt: "2026-10-02"
  origin: "radar"
  note: "10 月 1 日 Transporter-18 一次商业拼车同时送上三项 NASA 支持的小卫星任务：ASCENT 用同一低毒推进剂同时驱动化学高推力和电喷低推力推进；鞋盒大小的 SPRITE 要做地面无法完成的远紫外天体观测；SSPICY 的 Otter 24C 则计划从 2027 年起近距离检查最多 4 颗失效卫星，为未来在轨维修与清除积累数据。单看任何一项都不是第一次出现的宏大突破，真正的结构变化是发射被 rideshare 降低门槛后，推进、天文仪器、在轨服务这些原本昂贵的能力可以用小航天器更频繁地上天试错。太空基础设施可能正在出现类似云计算早期的变化：实验不再必须先长成一项大型任务。"
  status: "candidate"
  imageSourceUrl: "https://www.nasa.gov/blogs/smallsatellites/2026/10/01/nasa-smallsats-launch-to-advance-science-technology-orbital-operations/"
  imageSource: "NASA / SpaceX"
  imageNote: "NASA 原文包含 Transporter-18 发射照片与 CubeSat 整流罩集成现场；优先使用能同时看到多颗小卫星或拼车集成的图片来解释共享一次发射完成多种实验，而不是单纯火箭升空照。页面明确标注相关照片 credit 为 SpaceX，正式刊发前需核对第三方图片复用权。"
  imageStatus: "verify-rights"

- title: "数据平台也在学着把出口打开：Cloudflare Basin 用 Iceberg 把存储与计算重新拆开"
  url: "https://blog.cloudflare.com/cloudflare-basin/"
  source: "Cloudflare"
  radar: "developer-infrastructure"
  topic: "data-platform / Apache-Iceberg / serverless / egress / interoperability"
  discoveredAt: "2026-10-02"
  origin: "radar"
  note: "Cloudflare 10 月 1 日把原 Data Platform 正式更名并 GA 为 Basin：Pipelines 负责摄取与转换，Catalog 管 Apache Iceberg 表，Basin SQL 在 R2 上查询；同时允许 PyIceberg、DuckDB、Snowflake、Spark 等兼容引擎直接读写同一份 Iceberg 数据，并继续以 R2 的零 egress 费用作为卖点。值得看的不是 Cloudflare 又补齐一块产品，而是云平台竞争里出现一个反直觉方向：平台一边把摄取、存储、查询做得更一体化，一边又用开放表格式和免出口费强调随时可以从别的计算引擎读走。锁定用户的方式可能从锁住数据本身，变成让留在这里足够省事、但离开也不疼。"
  status: "candidate"
  imageSourceUrl: "https://blog.cloudflare.com/cloudflare-basin/"
  imageSource: "Cloudflare"
  imageNote: "官方博客包含 Basin 数据流和架构图，正式排版优先选 Pipelines 到 Iceberg/Catalog 再到 SQL 或外部引擎的结构图，帮助理解存储与计算解耦，不要用品牌主视觉替代解释图。当前页面未取得可确认长期稳定的原图直链。"
  imageStatus: "verify-rights"
