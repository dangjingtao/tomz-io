- title: "材料不再只是‘自己长好’：研究者让马达蛋白拖着 DNA 跑，把能量和运动写进材料的形成过程"
  url: "https://www.isct.ac.jp/en/news/j0mk0vpp6a42"
  source: "Institute of Science Tokyo / Kyoto University"
  radar: "science"
  topic: "active-materials / DNA / molecular-machines / self-assembly / molecular-robotics"
  discoveredAt: "2026-10-04"
  origin: "radar"
  note: "Science Tokyo 与京都大学团队把 DNA 延长、微管运输和马达蛋白运动组合到同一系统：先让 DNA 长在微管上，再消耗 ATP 驱动马达蛋白移动微管，使 DNA 在运动中相遇、连接并被拉伸，几分钟内形成网络。去掉 ATP 或马达蛋白后网络不会形成，说明这里的结构不是传统意义上放着等它自组装，而需要持续的能量输入与主动运动。更有意思的是网络复杂度并非线性增加，而是在 DNA 生长时间或微管密度跨过阈值后明显跃迁。它还远不是会‘活’的材料，但观察尺度已经变了：人工材料的设计变量开始从分子是什么，扩展到谁来搬它、怎样施力、何时耗能。"
  status: "candidate"
  imageUrl: "https://www.isct.ac.jp/cms/contents/data/1/4900/component/file/79bd2b487a7a76cde8e684a975eb715f.webp"
  imageSourceUrl: "https://www.isct.ac.jp/en/news/j0mk0vpp6a42"
  imageSource: "Institute of Science Tokyo / Shogo Hamada"
  imageNote: "官方 Image 1：绿色 DNA 被红色微管运动拉伸并组织成网络，25 μm 比例尺；这是研究结果本身的显微图。页面注明 image courtesy of Assistant Professor Shogo Hamada；正式刊发前核对机构图片复用条件。"
  imageStatus: "verify-rights"

- title: "鸡蛋壳没有先被炼成工业原料，而是直接进了金属加工：循环制造开始尝试删掉供应链中的一个步骤"
  url: "https://engr.ncsu.edu/news/2026/10/02/researchers-use-eggshells-to-make-stronger-lighter-metal-alloys/"
  source: "North Carolina State University / Journal of Magnesium and Alloys"
  radar: "materials-industry"
  topic: "eggshell / magnesium-alloy / circular-manufacturing / biogenic-waste / process-design"
  discoveredAt: "2026-10-04"
  origin: "radar"
  note: "NC State 等团队把磨碎的废鸡蛋壳直接加入镁材料，再通过 friction stir extrusion 的压力、旋转、摩擦热和剪切，在加工过程中形成强化相，得到更强、更硬的镁基复合材料。鸡蛋壳约 95% 是碳酸钙；传统路线通常先从矿石制造钙材料，再把它加入合金，这项 proof-of-concept 尝试直接跳过中间原料制造。现在还不能据此断言它已经具备大规模经济性，但这个切口很漂亮：循环制造未必只是‘把废物回收成同一种东西’，也可能是重新设计工艺，让一种行业的废物直接成为另一种制造过程的反应物，从而把供应链的一段删掉。"
  status: "candidate"
  imageSourceUrl: "https://www.eurekalert.org/multimedia/1154969"
  imageSource: "Bharat Gwalani / North Carolina State University"
  imageNote: "官方发布配图为破开的鸡蛋壳与改性镁合金金属棒并置。EurekAlert 页面明确标注 Credit: Bharat Gwalani, NC State University，Usage Restrictions: Credit must be given；当前未记录可确认长期稳定的原图直链。"
  imageStatus: "verify-rights"

- title: "一座设计博物馆重新开门时，把城市拆迁废料压成了自己的 8.2 万块外墙砖：建筑开始把地方的废物也当成地方材料"
  url: "https://designmuseumgent.be/en/de-nieuwe-vleugel"
  source: "Design Museum Gent / Carmody Groarke"
  radar: "design-city"
  topic: "museum / circular-construction / civic-space / waste-brick / adaptive-reuse"
  discoveredAt: "2026-10-04"
  origin: "radar"
  note: "Design Museum Gent 在关闭四年后于 10 月 3 日重新开放。新翼外墙使用超过 82,000 块 Gent Waste Brick，以本地城市废物流为原料并采用低能耗石灰固化而非传统窑烧；建筑尺度又刻意对齐 18 世纪 Hotel de Coninck 的砖尺寸。与此同时，旧馆从 16 世纪到 20 世纪的多层建筑尽量保留、修复和再利用，新翼还设置免费进入的 Stadskamer，把博物馆的一部分定义为城市客厅。值得看的不是一栋‘绿色建筑’，而是地方性出现了另一种定义：过去地方材料意味着本地石头、木材、工艺，现在一座城市自己的拆除废料也可以成为它的新材料史。博物馆还把剩余 Waste Brick 继续做成临时座椅、灯和吧台，让施工余料继续进入公共活动。"
  status: "candidate"
  imageSourceUrl: "https://carmodygroarke.com/work/design-museum-gent"
  imageSource: "Carmody Groarke / Design Museum Gent"
  imageNote: "建筑师官方项目页有新翼、历史庭院和 Gent Waste Brick 的项目摄影；正式排版优先选择能同时看到白色 Waste Brick 新翼与旧建筑的画面。当前未取得可确认长期稳定且无变换参数的原图直链。"
  imageStatus: "verify-rights"
