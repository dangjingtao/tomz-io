- title: "蜂丝不只是‘天然材料’：研究者开始把蛋白质序列当成可编程的伤口界面"
  url: "https://www.csiro.au/en/news/All/News/2026/September/Honeybee-silk-could-power-smarter-wound-dressings"
  source: "CSIRO / Adelaide University"
  radar: "science"
  topic: "biomaterials / wound-care / programmable-materials / honeybee-silk / rural-health"
  discoveredAt: "2026-09-30"
  origin: "radar"
  note: "CSIRO 与 Adelaide University 验证了重组蜜蜂丝薄膜在伤口愈合过程中可生物降解、耐受良好且不妨碍整体愈合；下一阶段才会尝试把感染感知、定向释药等功能写进蛋白质序列。真正值得保留的不是‘智能绷带已经做成’，而是材料设计的对象正在从形状和配方继续下沉到蛋白质序列：敷料可能从被动覆盖物变成能感知并响应伤口环境的界面。另一个人的尺度也很具体——如果未来减少换药频率，偏远地区患者可能少跑很多次专科医疗。当前功能性智能敷料仍属后续研究目标，不能写成已临床实现。"
  status: "candidate"
  imageUrl: "https://www.csiro.au/-/media/News-releases/2026/September/Honeybee-silk-wound-dressing/close-up-of-samples-from-underneath.jpg"
  imageSourceUrl: "https://www.csiro.au/en/news/All/News/2026/September/Honeybee-silk-could-power-smarter-wound-dressings"
  imageSource: "CSIRO"
  imageNote: "CSIRO 新闻稿提供的实验样品图，手套与培养皿中的透明蜂丝薄膜能直接说明材料是什么；官方页面提供 JPG 下载入口。正式刊发前仍核对 CSIRO 图片使用条款与 credit。"
  imageStatus: "verify-rights"

- title: "固态电池的材料问题不只有‘离子跑多快’：电解质开始被要求学会柔软地贴住电极"
  url: "https://news.rice.edu/news/2026/softer-porous-material-could-help-improve-solid-state-batteries"
  source: "Rice University / Chemical Science"
  radar: "science"
  topic: "solid-state-battery / MOF / mechanical-design / electrolyte / materials"
  discoveredAt: "2026-09-30"
  origin: "radar"
  note: "Rice 团队做出的 ZnBTCA 是一种采用柔性脂肪族 linker 的 MOF 固态电解质：负电框架帮助选择性传输锂离子，同时材料本身比常见刚性 MOF 更柔软、更能适应电极接触。测试中锂承担约 79% 离子电流，锂金属对称电池在研究条件下接近 300 小时未见短路。比性能数字更值得《见π》留下的是设计变量的变化：固态电池过去很容易把电解质当作纯粹的离子运输问题，但界面接触会把‘机械柔顺性’也变成电化学材料的一部分。与本周已有 MOF 光催化候选形成有趣对照：同一类可设计多孔框架，正在不同领域从化学组成继续扩展到结构与力学属性。"
  status: "candidate"
  imageUrl: "https://news.rice.edu/sites/g/files/bxs2656/files/2026-09/featured_zina_2.jpg"
  imageSourceUrl: "https://news.rice.edu/news/2026/softer-porous-material-could-help-improve-solid-state-batteries"
  imageSource: "Rice University"
  imageNote: "Rice 新闻稿主图为研究团队/实验现场，适合人物与研究现场版式，但不能解释 ZnBTCA 的孔道与柔性机制；若正式成稿，优先进一步寻找论文结构图。"
  imageStatus: "verify-rights"

- title: "Firefox 157 的‘大改版’里有个反潮流的小动作：Compact Mode 回来了，浏览器重新把屏幕空间还给网页"
  url: "https://www.firefox.com/en-US/firefox/157.0/releasenotes/"
  source: "Mozilla Firefox"
  radar: "web-design"
  topic: "browser / Firefox / compact-ui / design-system / user-control"
  discoveredAt: "2026-09-30"
  origin: "radar"
  note: "Firefox 157 在 9 月 29 日正式发布近年最大的一次视觉刷新，统一工具栏、侧边栏、菜单和组件设计，并新增主题；但更有观察价值的是 Mozilla 同时恢复 Compact Mode，让工具栏与标签间距主动缩小，给网页本身腾空间。过去几年桌面软件普遍向更大的触控友好间距、更圆润的组件和更多常驻功能走，Compact Mode 的回归像一个很小的反信号：成熟工具的用户并不总想要‘更显眼的 UI’，一部分人要的是界面退后。它也保留了旧侧边栏回退开关直到 2027 年底，说明大设计系统迁移仍需要给高频用户缓冲带。"
  status: "candidate"
  imageSourceUrl: "https://www.firefox.com/en-US/firefox/157.0/releasenotes/"
  imageSource: "Mozilla Firefox"
  imageNote: "官方 Release Notes 自带 Firefox visual refresh 截图，最适合用新版工具栏/标签/侧边栏画面解释视觉刷新；当前未记录可确认长期稳定的原图直链，正式排版从官方页面重新取图并核对 Mozilla 品牌素材条款。"
  imageStatus: "verify-rights"

- title: "一条新铁路真正提速以后，城市还得补七座桥：基础设施的‘成功’会把旧平交道口变成新的瓶颈"
  url: "https://at.govt.nz/projects-and-initiatives/takaanini-level-crossings"
  source: "Auckland Transport"
  radar: "city-infrastructure"
  topic: "rail / level-crossing / city-rail-link / induced-infrastructure / walking-cycling"
  discoveredAt: "2026-09-30"
  origin: "radar"
  note: "Auckland Transport 9 月 28 日更新 Takaanini 平交道口计划：City Rail Link 开通带来更密集列车和更短旅程后，当地反而需要用 7 座新桥替换既有平交道口，才能继续提高班次并改善步行、骑行、公交和汽车的安全连接。这个案例适合用来观察基础设施的第二阶段效应：主干网络能力提升，并不会自动完成城市升级；它会把此前尚可忍受的局部接口暴露成新的约束。所谓‘铁路建成’其实只是系统重新分配瓶颈的开始。项目仍处设计阶段，预计持续到 2032 年，不应写成工程已经完成。"
  status: "candidate"
  imageUrl: "https://at.govt.nz/media/vaqe12dh/takanini-level-crossing-removals-takaanini-station-render-sept-2025.jpg?format=jpg&mode=crop&width=1535"
  imageSourceUrl: "https://at.govt.nz/projects-and-initiatives/takaanini-level-crossings"
  imageSource: "Auckland Transport"
  imageNote: "官方 Takaanini Station access bridge 效果图，能直观解释平交道口被立体步行连接替代后的城市界面；图片 URL 带裁切参数，可能不是最稳定原图，正式刊发前回 Auckland Transport 原页确认原始资源与使用条件。"
  imageStatus: "unstable"
