- title: "长鑫存储第五代 DRAM 平台进入量产：先进存储的竞争重新落到工艺、良率与每片晶圆产出"
  url: "https://www.reuters.com/world/asia-pacific/chinas-cxmt-says-new-memory-chip-platform-enters-mass-production-2026-09-20/"
  source: "Reuters / CXMT"
  radar: "china-dev"
  topic: "semiconductor / dram / manufacturing / memory / china"
  discoveredAt: "2026-09-21"
  origin: "radar"
  note: "Reuters 9 月 20 日报道，长鑫存储第五代 DRAM 平台进入量产，并公布两款 24Gb LPDDR5X；报道援引公司信息称新平台通过多重图形化把存储单元间距压到 11.95nm，并将每片晶圆的芯片总产出提高至少 50%。这条值得保留，不是因为又一场 AI 芯片竞赛，而是存储这种更基础、也更不性感的硬件层仍然由制造工艺、良率、密度和供应链决定。正式编辑时应继续核对公司一手材料，并把性能数字明确标成厂商口径。"
  status: "candidate"

- title: "MilleMiglia：当真实物流数据不能公开，就把‘像真的问题’本身开源"
  url: "https://research.google/blog/millemiglia-a-realistic-instance-generator-for-middle-mile-logistics/"
  source: "Google Research"
  radar: "research-reading"
  topic: "operations-research / logistics / benchmark / privacy / open-source"
  discoveredAt: "2026-09-21"
  origin: "radar"
  note: "Google Research 9 月 18 日发布开源 MilleMiglia，用生成器构造接近真实工业约束的 middle-mile logistics benchmark。这个领域长期缺公开高质量数据，因为网络拓扑和需求量通常属于企业敏感信息；MilleMiglia 不公开客户真实数据，而是把固定车辆班次、配送中心吞吐限制、同步约束等问题结构编码进可生成实例。它很适合《见π》：开放研究不一定意味着把原始数据倒出来，有时更有价值的是开源一个足够逼真的问题发生器。"
  status: "candidate"

- title: "Fugleramme：一只本地 AI 画框听窗外鸟叫，却坚持不用 AI 画鸟"
  url: "https://github.com/arnegiacomo/fugleramme"
  source: "arnegiacomo / GitHub"
  radar: "ghost"
  topic: "raspberry-pi / e-ink / local-ai / birdnet / public-domain-art / personal-project"
  discoveredAt: "2026-09-21"
  origin: "radar"
  note: "挪威开发者 Arne Giacomo Munthe-Kaas 的个人项目 Fugleramme 用 Raspberry Pi 5 + 麦克风运行本地 BirdNET-Go，听到鸟鸣后把对应物种排版到 13.3 英寸彩色电子墨水屏；有意思的是 800 多张、400 多个物种的图全部来自人工整理的 19 世纪公共领域博物学插画，而不是生成图。项目还把真实厨房窗外的识别结果做成 live demo。它是很好的鬼集：AI 在这里退到背景做感知，前景反而是历史图像、环境声音和一件安静的家具。"
  status: "candidate"

- title: "POpSi：开放源码开始一路下沉到‘可验证的安全芯片’"
  url: "https://www.popsi-workshop.org/"
  source: "Practical Open Silicon Workshop / ZeroRISC / MPI-SP"
  radar: "open-source"
  topic: "open-silicon / hardware-security / verification / cryptography / open-source"
  discoveredAt: "2026-09-21"
  origin: "radar"
  note: "9 月 21–22 日举行的 Practical Open Silicon Workshop 把主题压得很具体：用于安全与密码学的硬件正在从闭源设计向 open-source silicon 移动，而真正困难的是如何让这种开放进入商业与研究实践。它把 Kerckhoffs 原则继续往芯片里推——可信不再只要求算法公开，还要讨论 RTL、验证、工具链和物理实现。暂时作为开放硬件趋势候选，不把一个 workshop 本身包装成产业突破。"
  status: "candidate"
