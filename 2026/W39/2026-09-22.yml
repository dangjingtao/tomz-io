- title: "DNA 计算机不再靠‘纠错后得到答案’，而是让正确答案成为最低能量状态"
  url: "https://www.nature.com/articles/s41586-026-10996-5"
  source: "Nature / Maynooth University"
  radar: "research-reading"
  topic: "molecular-computing / dna / thermodynamics / unconventional-computing"
  discoveredAt: "2026-09-22"
  origin: "radar"
  note: "Nature 9 月 16 日发表的 Scaffolded DNA Computer（SDC）把计算编码进 DNA 分子系统的能量景观：系统松弛到热力学更有利的平衡态时，正确输出会自然胜过大量错误配置，因此不需要独立的显式纠错子系统或精密的动力学控制。论文展示 10 个程序、超过 700 次计算，包括乘 3、除 2、8-bit parity 和 25-bit 加法（作者计为 100-bit computation）；小实例可在一分钟内完成，并可通过更换输入重复使用。它不是‘DNA 要替代 CPU’的故事，真正漂亮的是计算架构反过来利用物理系统本身的趋稳性质承担纠错与搜索，是很适合《见π》的非硅计算信号。"
  status: "candidate"

- title: "Chrome 的 unload 事件今天走到全量弃用：Web 正在清掉一个阻碍 BFCache 的历史包袱"
  url: "https://developer.chrome.com/docs/web-platform/deprecating-unload"
  source: "Chrome for Developers"
  radar: "product"
  topic: "web-platform / browser / lifecycle / bfcache / compatibility"
  discoveredAt: "2026-09-22"
  origin: "radar"
  note: "Chrome 的官方弃用时间表把 2026-09-22 / Milestone 154 标为 unload 在非 Top-50 origins 覆盖到 100% page loads 的节点。unload 长期被网页用于离页清理，却与现代浏览器的 back/forward cache 生命周期模型冲突；Chrome 用多年、分阶段 rollout 和 Permission-Policy / opt-out 给网站迁移窗口。这不是耀眼的新 API，反而是 Web 平台如何删除一个用了很多年的错误抽象：兼容性债务不能一刀切，只能把弃用本身做成基础设施。"
  status: "candidate"
