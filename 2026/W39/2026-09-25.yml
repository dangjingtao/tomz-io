- title: "Android Studio 开始允许 Agent 换着用：IDE 正在变成 Harness，而不是模型外壳"
  url: "https://android-developers.googleblog.com/2026/09/build-your-way-use-any-ai-agent-in-android-studio.html"
  source: "Android Developers Blog"
  radar: "product"
  topic: "developer-tools / ide / agent / acp / interoperability / android"
  discoveredAt: "2026-09-25"
  origin: "radar"
  note: "Google 9 月 24 日宣布 Android Studio Rabbit 2 Canary 预览 Bring Your Own Agent（BYOA），可接入 Claude Agent、Codex、Antigravity 以及其他 ACP-compatible agent。真正值得看的不是 IDE 又多了几个 AI 入口，而是 Android Studio 把项目图、构建诊断、Compose Preview、SDK 工具和模拟器控制作为 IDE-native 能力注入 Agent，并允许一个 Agent 配额不足或表现不佳时换另一个接手。这里出现了一个很清楚的产品边界：IDE 不必押注单一模型，反而可以成为承载上下文、工具、权限与验证环境的 Harness。正式编辑可与 Safari MCP、浏览器主动暴露 Agent 能力等候选并读，但避免写成协议胜负判断。"
  status: "candidate"

- title: "把自动驾驶比赛的‘整套实验台’开源：240 支队伍不用先造一遍基础设施"
  url: "https://tier4.co.jp/en/updates/press-release/20260924-tieriv-releases-racing-kart-reference-design"
  source: "TIER IV"
  radar: "open-source"
  topic: "autonomous-driving / open-source / reference-design / simulation / physical-ai / education"
  discoveredAt: "2026-09-25"
  origin: "radar"
  note: "TIER IV 9 月 24 日公开基于 Autoware 的自动驾驶赛车 reference design，包含自动驾驶软件、模拟器和设计信息，并把它与实车及在线评测环境组合用于 2026 Autonomous Driving AI Challenge；官方称 240 支队伍、约 600 人使用同一基础平台。信号不在赛车本身，而在‘开放一个领域’开始从放源码推进到给出共同硬件假设、仿真、评测和真实世界验证路径：参与者不用先把整套基础设施重造一遍，才能开始比较算法。可与本周开放 benchmark、机器人基础设施候选形成一条非纯 AI 的公共实验台线。"
  status: "candidate"

- title: "Project Suncatcher 要把 TPU 送上轨道：数据中心的边界被推到散热、辐射和激光链路"
  url: "https://blog.google/innovation-and-ai/models-and-research/google-research/google-project-suncatcher-facts/"
  source: "Google"
  radar: "hardware"
  topic: "space-computing / tpu / datacenter / energy / thermal / optical-networking"
  discoveredAt: "2026-09-25"
  origin: "radar"
  note: "Google 9 月 24 日更新 Project Suncatcher，计划发射原型卫星测试 TPU 在太空中的运行，并继续研究真空散热、辐射、发射振动和卫星间高带宽激光连接。它现在仍是 moonshot，不应写成‘太空数据中心已经可行’；但它很适合《见π》的硬件/基础设施观察：当算力需求足够大，工程团队开始重新讨论‘数据中心应该在哪里’，而问题立刻从芯片性能扩展成能源获取、热设计、材料可靠性和网络拓扑。"
  status: "candidate"

- title: "Firefox 把 AI 做成一种‘窗口类型’，而不是强塞进整个浏览器"
  url: "https://blog.mozilla.org/en/firefox/firefox-window-types/"
  source: "Mozilla"
  radar: "web-browser"
  topic: "browser / interaction-design / ai / privacy / user-control"
  discoveredAt: "2026-09-25"
  origin: "radar"
  note: "Mozilla 9 月 24 日把 Firefox 桌面体验明确描述为 Classic、Private、Smart 三种窗口，其中 Smart Window 仍为 beta，AI 上下文与 memories 均强调可选和用户控制。比功能清单更值得看的，是它没有把 AI 当成浏览器全局默认状态，而是把不同信任/任务模式做成可切换的空间：普通浏览、隐私浏览、带 AI 上下文的持续任务各有边界。对产品设计很有启发，尤其适合和行业里‘AI 无处不在’的默认集成形成对照；正式编辑需说明 Smart Window 当前区域可用性有限且仍处 beta。"
  status: "candidate"
