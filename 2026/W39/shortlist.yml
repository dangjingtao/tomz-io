trends:
  - title: "自动化正在学会停在最后一步之前"
    note: "HardFlow 只在最终输出执行硬约束、GitHub Actions 把执行保护独立出来、npm stage-only token 允许机器准备但不允许机器最终 publish，连大型 Runtime 重写也依赖渐进迁移和真实回归。共同信号不是‘人类审批’四个字，而是系统开始把探索、准备、执行和不可逆副作用拆成不同阶段。"
  - title: "计算正在离开屏幕：进入浏览器、实验台、织物、土壤和窗边画框"
    note: "Safari MCP 让浏览器主动向 Agent 暴露真实运行态；MIT 自动光学实验室开始处理摆放与校准；可编程针织物把感知与动作编进材料；Microbial Feral Computing 用土壤生物电池供能；Fugleramme 把本地识别藏进一只安静的电子墨水画框。值得看的不是万物 AI，而是计算重新获得材料、空间和身体。"
  - title: "开放正在从‘公开代码’扩展成‘公开问题、公开能力与公开底层’"
    note: "MilleMiglia 不泄露企业物流数据而开源逼真的问题生成器，OpenQARP 把量子研发拆成可组合部件，Mila × Mozilla 把开放 AI 重新描述为公共基础设施，POpSi 则把开放继续下沉到安全芯片。开放性的对象正在从 repository 扩展到 benchmark、接口、治理与 silicon。"

