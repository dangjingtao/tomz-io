- title: "Docker 把 Agent、工具和护栏一起装进 OCI：Sandbox 正从运行环境变成可分发的治理单元"
  url: "https://www.docker.com/press-release/cloud-sandboxes-extending-secure-ai-agent-isolation-beyond-the-laptop/"
  source: "Docker"
  radar: "agent-ai"
  topic: "agent / sandbox / microvm / oci / permissions / infrastructure"
  discoveredAt: "2026-09-26"
  origin: "radar"
  note: "Docker 9 月 24 日发布 Cloud Sandboxes，并把下一代 Kits 定义为标准 OCI image：一个 artifact 可同时封装 Agent、工具以及它能触碰什么的规则，官方还表示计划把 Kit spec 提交 CNCF。更值得看的不是又一个云 Agent 服务，而是治理边界开始变成可构建、可分发、跨本地与云复用的基础设施对象；Docker 甚至明确区分传统 container 与 Agent 所需的 containment。可与本周 Harness、浏览器/IDE 主动暴露能力等候选并读，但正式编辑应避免把厂商提出的开放规范提前写成行业标准。"
  status: "candidate"

- title: "27B Agent 搬回 Windows PC：本地与云开始变成同一工作流里的两档执行位置"
  url: "https://www.jonpeddie.com/news/perplexity-brings-its-local-agent-stack-to-amd-ryzen-ai-max-pcs/"
  source: "Perplexity / AMD announcement coverage"
  radar: "hardware"
  topic: "local-ai / agent / ai-pc / unified-memory / privacy / hybrid-compute"
  discoveredAt: "2026-09-26"
  origin: "radar"
  note: "Perplexity 9 月 24 日把 Portable Computer 扩到 AMD Ryzen AI Max Windows 设备：27B 级模型、Agent orchestrator、scheduler、sandbox 与敏感内容分类器可在本机运行，本地 inference 不消耗 Computer credits，需要更强云模型时再请求用户许可。信号不在某块 AI PC 芯片，而在产品边界：本地执行、隐私过滤和云端升级开始被包装成一个连续 Agent 工作流，而不是用户自己在 local/cloud 两套工具间切换。当前一手页面检索不稳定，正式成刊前应再次核对 Perplexity/AMD 原始公告和具体兼容机型。"
  status: "candidate"

- title: "25 毫米开源传感器板：可穿戴研究开始把实验硬件压成一块可复现的小积木"
  url: "https://github.com/ludvikalkhoury/TinZr"
  source: "TinZr GitHub / preprint"
  radar: "open-source"
  topic: "wearables / esp32 / sensors / open-hardware / research-tools"
  discoveredAt: "2026-09-26"
  origin: "radar"
  note: "TinZr 是一块约 25×25 mm、基于 ESP32-C3 的多模态生理数据采集平台，仓库公开 Arduino board package、3D designs、库与预印本。它不是大新闻，反而很适合《见π》的非 AI 小东西：研究工具的价值有时不是某个惊艳算法，而是把传感、无线连接和复现实验所需的硬件细节收敛成别人可以拿起来继续做的积木。项目目前仍很小，论文处于预印本/同行评审阶段，正式编辑不要夸大成熟度。"
  status: "candidate"
