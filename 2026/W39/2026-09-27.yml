- title: "先烧一卷假的古罗马纸草，再去读真的：跨学科实验把古代焦卷的墨迹亮了出来"
  url: "https://news.berkeley.edu/2026/09/16/to-read-2000-year-old-burned-scrolls-scientists-burn-their-own/"
  source: "UC Berkeley / PLOS ONE"
  radar: "research-reading"
  topic: "archaeology / x-ray-ct / papyrus / virtual-unwrapping / experimental-methods"
  discoveredAt: "2026-09-27"
  origin: "radar"
  note: "UC Berkeley 团队为了验证赫库兰尼姆炭化纸草能否更容易被无损读取，先用现代纸草、传统灯黑墨和校准过的微量铅制作卷轴，再在低氧环境中把它真正烧焦，随后做 X-ray CT 和虚拟展开。结果显示含铅墨迹对 X 射线的吸收可显著高于炭化纸草，极低浓度也能形成可读对比。最有《见π》味道的不是‘AI 解古卷’这个熟悉叙事，而是研究方法本身：面对无法反复试错的两千年文物，团队先造一个足够像真的、可以放心毁掉的替身，把考古、材料、X-ray 成像、算法和电池 CT 的既有展开程序拼成实验台。正式编辑需说明它只对含可检测金属成分的古代墨水有直接帮助，并非所有赫库兰尼姆卷轴都会因此可读。"
  status: "candidate"

- title: "光子芯片先把 SDK 开出来：新计算架构开始用模拟器争夺还没摸到硬件的开发者"
  url: "https://qant.com/de/pressemitteilung/q-ant-launcht-weltweit-erstes-open-source-software-development-kit-sdk-fuer-photonisches-computing/"
  source: "Q.ANT"
  radar: "hardware"
  topic: "photonic-computing / sdk / simulation / open-source / hpc / hardware-software"
  discoveredAt: "2026-09-27"
  origin: "radar"
  note: "Q.ANT 9 月 23 日发布面向其光子处理器的开源 SDK，提供 C/C++、Python API、示例和可在普通 CPU 上运行的 simulation backend；开发者无需先拥有光子硬件，就能写和测试未来要迁移到其 NPU 的程序。比厂商宣称的能效数字更值得看的是硬件生态策略：一种仍稀缺、难以直接获得的新计算架构，先把编程模型和模拟环境送到普通笔记本上，让软件生态早于硬件普及发生。可与量子 SDK、GPU 早期工具链等历史路径对照。正式编辑不要采用‘世界首个’或能效倍数等未经独立验证的营销表述，也要说明硬件访问仍受限。"
  status: "candidate"
