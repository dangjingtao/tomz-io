- title: "Antigravity 把 Agent 拆成‘云端架构师 + 本地工人’：代码甚至不必离开机器"
  url: "https://developers.googleblog.com/introducing-support-for-local-ai-models-in-the-antigravity-sdk/"
  source: "Google for Developers"
  radar: "agent-ai"
  topic: "local-ai / agent / hybrid-compute / privacy / developer-tools"
  discoveredAt: "2026-09-24"
  origin: "radar"
  note: "Google 9 月 23 日宣布 Antigravity SDK 支持 LiteRT 等本地执行路径，并展示一种很值得继续看的混合 Agent 架构：云端模型只根据文件名和任务描述做规划，本地 Gemma 实例负责读取代码、复现漏洞、写补丁、互相审查并跑回归测试。重点不是又一个本地模型，而是‘高能力规划留云端、私密且高 token 的执行留设备’开始成为产品化编排模式；它把隐私、成本、延迟和能力差异同时变成调度问题。正式编辑时应把 Google demo 与普遍可复现能力分开，不直接采用厂商 token / 性能宣传。"
  status: "candidate"

- title: "Copilot Agent 开始说 OpenTelemetry：Agent 可观测性正在接入企业原有监控栈"
  url: "https://github.blog/changelog/2026-09-22-opentelemetry-in-the-github-copilot-app/"
  source: "GitHub Changelog"
  radar: "product"
  topic: "agent / observability / opentelemetry / governance / developer-tools"
  discoveredAt: "2026-09-24"
  origin: "radar"
  note: "GitHub Copilot app 新增由企业管理的 OpenTelemetry 配置，可把 Agent 活动、模型与工具交互送进组织现有的兼容监控系统。它的信号比‘多了一个 dashboard’更大：Agent 运行开始被当成和服务、trace、基础设施一样需要统一 telemetry 的生产对象，而不是只存在于聊天记录里的黑盒。可与近期审批、Control Plane、Agent 身份等候选形成同一治理趋势，但正式编辑时应避免把每个治理功能拆成重复条目。"
  status: "candidate"

- title: "量子模拟器让‘物质凭空出现’变成可实验的问题"
  url: "https://sciencesources.eurekalert.org/news-releases/1144971"
  source: "Duke University / Nature Physics"
  radar: "research-reading"
  topic: "quantum-simulation / particle-physics / trapped-ion / fundamental-physics"
  discoveredAt: "2026-09-24"
  origin: "radar"
  note: "Duke Quantum Center 团队 9 月 23 日报道用 trapped-ion quantum simulator 观察 string-breaking dynamics：当模拟的基本粒子被拉开、连接中的能量升高到一定程度，系统出现对应粒子-反粒子生成的动力学。它不是在实验室里真的重演 Big Bang，也不是发现新粒子；价值在于量子设备开始成为高能物理难题的实验模拟器，而不只是‘更快的计算机’。这条给《见π》补一条远离 AI 的科学线，正式编辑时应回到 Nature Physics 原论文核对模型规模和限制。"
  status: "candidate"

- title: "Qualcomm 要收购 PickNik：开源机器人运动规划开始成为芯片平台的战略层"
  url: "https://www.qualcomm.com/news/releases/2026/09/qualcomm-to-acquire-picknik-to-advance-the-future-of-open-roboti"
  source: "Qualcomm"
  radar: "business-distribution"
  topic: "robotics / open-source / moveit / semiconductor / acquisition / physical-ai"
  discoveredAt: "2026-09-24"
  origin: "radar"
  note: "Qualcomm 9 月 23 日宣布拟收购 PickNik Robotics。PickNik 长期围绕 ROS / MoveIt 做机械臂运动规划与开源机器人软件；这笔交易值得看的不是并购金额，而是芯片厂正在把开源机器人软件栈往自己的战略边界里收：算力平台若想进入 Physical AI，竞争不只发生在 SoC，还发生在开发者已经依赖的规划、控制和集成层。它与本周 Intrinsic Core 开源可互相照亮——一边是工业机器人基础设施向公共积木开放，一边是半导体平台主动收拢成熟开源能力。交易尚待完成，正式编辑必须保持‘拟收购’表述。"
  status: "candidate"
