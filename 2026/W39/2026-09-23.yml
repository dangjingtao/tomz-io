- title: "Intrinsic Core 开源：工业机器人开始拥有一层可复用的公共基础设施"
  url: "https://github.com/intrinsic-ai/sdk"
  source: "Intrinsic / GitHub / ROSCon 2026"
  radar: "open-source"
  topic: "robotics / ros / industrial-automation / open-source / physical-ai"
  discoveredAt: "2026-09-23"
  origin: "radar"
  note: "Intrinsic 在 ROSCon 2026 宣布把工业机器人平台的核心组件以开放方式交给 ROS 生态，包括硬件无关实时控制、运动规划、姿态估计、仿真/标定以及第三方传感器和夹爪驱动，并同时给出 CNC machine tending 的开放参考方案。值得看的不是又一个‘Physical AI’口号，而是工业机器人长期昂贵的集成层正在被拆成可复用公共积木：如果控制、感知、规划和硬件适配逐渐形成开放底座，小型制造商的自动化门槛可能从系统集成项目变成软件组合问题。正式编辑时应以 Intrinsic 一手公告和仓库实际 license/组件边界复核，不把二手报道中的 adoption 数字直接当事实。"
  status: "candidate"

- title: "Isaac ROS 5.0 把 Skill 写给机器人开发 Agent：文档第一次明确变成机器的工作接口"
  url: "https://blogs.nvidia.com/blog/isaac-ros-5-0-agentic-open-source-robotics/"
  source: "NVIDIA / ROSCon 2026"
  radar: "product"
  topic: "robotics / agent / skills / ros / developer-tools / documentation"
  discoveredAt: "2026-09-23"
  origin: "radar"
  note: "NVIDIA 9 月 22 日发布 Isaac ROS 5.0，除了 ROS Lyrical、Ubuntu 24.04 和新的硬件加速接口，更值得《见π》保留的是它开始明确提供 agent-ready documentation 与可复用 skills：setup、manipulation、FoundationStereo fine-tuning、pick-and-place 等工作流可以直接成为开发 Agent 的操作入口。这和单纯‘AI 帮你写 ROS 代码’不同——软件包开始主动把自己的操作知识整理成机器可执行的技能合同。它与近期浏览器 MCP、Agent skill 沉淀可以形成一条跨领域趋势，但正式编辑时不要把厂商性能数字当主角。"
  status: "candidate"

- title: "HashFly：有人认真让一只模拟果蝇脑去算 Bitcoin hash"
  url: "https://futurebit.io/hashfly"
  source: "FutureBit / HashFly"
  radar: "ghost"
  topic: "unconventional-computing / connectome / bitcoin / wetware / browser-experiment"
  discoveredAt: "2026-09-23"
  origin: "radar"
  note: "FutureBit 的 HashFly 是一个浏览器 proof-of-concept：拿果蝇 connectome 的神经活动轨迹参与简化的 double-SHA-256 计算。当前实验本质上仍跑在传统计算机模拟上，约 100 kH/s，完全不是可用矿机；FutureBit 对真实有机神经元能效的 1 W/TH、10x ASIC 等说法也只是推测，不能当成已验证结论。但它非常适合‘鬼集’：公开 connectome 数据被从神经科学搬去做一种荒诞但可运行的计算实验，真正有趣的是数据集一旦开放，人们会把同一副‘脑结构’塞进完全没人预想的任务里。正式编辑时需明确区分 demo、模拟与湿件假说。"
  status: "candidate"

- title: "Agent 商务开始撞上银行的追责问题：替你买东西之后，谁承担错误？"
  url: "https://www.reuters.com/legal/litigation/banks-warn-ai-shopping-bots-raise-scam-fraud-data-privacy-risks-2026-09-22/"
  source: "Reuters"
  radar: "business-distribution"
  topic: "agentic-commerce / payments / consumer-protection / identity / accountability"
  discoveredAt: "2026-09-23"
  origin: "radar"
  note: "Reuters 9 月 22 日汇总多家国际银行对 AI shopping agents 的担忧：敏感金融数据如何处理、Agent 是否把交易导向较不安全的支付方式、发生诈骗或错误购买时消费者向谁追责，以及 Agent 是否真正代表用户利益。值得保留的不是银行‘反 AI’，而是 agentic commerce 从演示进入真实交易后，产品问题迅速变成身份、授权、披露、可追责与消费者保护问题。它可与此前 KYA / Agent 身份层候选形成持续事件，正式编辑时优先作为同一趋势的更新，而不是重复写一条‘Agent 可以购物’。"
  status: "candidate"
