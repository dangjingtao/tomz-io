- title: "商都的铜从七百公里外来：一块矿石如何暴露早期国家的资源网络"
  url: "https://www.nature.com/articles/s41467-026-78864-4"
  source: "Nature Communications / Sun et al.（2026-10-21）"
  radar: "历史与制度 / 科学方法 / 技术史"
  topic: "商代青铜、铜矿溯源、长距离物资网络、国家形成"
  discoveredAt: "2026-10-25"
  origin: radar
  note: >-
    10 月 21 日发表的开放获取论文研究约公元前 1400 年郑州商都相关两处铸铜遗址的矿石材料，结合石榴子石 U-Pb 定年与化学组成、铅同位素、黄铜矿微量元素等多重指纹，提出其铜料来自约 700 公里外长江中游九瑞矿区。过去成品青铜器的铜锡铅合金化会遮蔽铜的地球化学来源，转而研究铸造遗址矿石材料提供了另一条证据路径。值得追问：在秦统一以前很久，跨流域金属供应网络已经如何运转？它能提示资源动员与交换规模，却不能单凭矿石来源推断具体运输路线、交易制度或统一行政控制。可与《气数》关于国家能力和技术—制度关系的提问对照，但不能把商代直接写成秦制的前身。
  status: candidate
  imageSourceUrl: "https://www.nature.com/articles/s41467-026-78864-4"
  imageSource: "Nature Communications / Sun et al."
  imageNote: "优先核对论文的矿区与铸造遗址分布图、样品地球化学对比图；当前未取得已验证的稳定图片直链，正式排版应从原论文图版核对 CC 许可及第三方素材例外。"
  imageStatus: none

- title: "设计师 Olivier Mourgue 去世：为什么《2001 太空漫游》的未来是一张能瘫坐的椅子"
  url: "https://www.theguardian.com/artanddesign/2026/oct/21/olivier-mourgue-obituary"
  source: "The Guardian（2026-10-21 讣告）/ MoMA 馆藏档案"
  radar: "人物与传记 / 设计文化与媒介 / 技术史"
  topic: "Olivier Mourgue、Djinn 椅、1960 年代设计、科幻电影、未来生活"
  discoveredAt: "2026-10-25"
  origin: radar
  note: >-
    【本周人物雷达】为什么是他：Olivier Mourgue 不只因《2001：太空漫游》空间站场景的 Djinn 座椅闻名；他以低矮、柔软、可更换面料的家具反对拘谨的传统客厅，让未来主义从航天技术想象落到身体坐下的方式。MoMA 馆藏保有 1964–65 年 Djinn Chaise Longue，并明确记载其电影关联、材料与设计思想。为什么是这周：Mourgue 于 10 月 5 日逝世，10 月 21 日刊出的完整讣告重新提供了审视其设计与大众生活关系的时机。可问：1960 年代对未来的想象，为何既激进又日常？不要只做电影道具逸闻，更不把所有《2001》的美术成果归于他。此前本周候选未收录此人物；Francis Halzen 诺奖人物已有 10 月 10 日素材，避免重复包装。
  status: candidate
  imageUrl: "https://www.moma.org/media/W1siZiIsIjQwMjU2NiJdLFsicCIsImNvbnZlcnQiLCItcXVhbGl0eSA5MCAtcmVzaXplIDIwMDB4MjAwMFx1MDAzZSJdXQ.jpg?sha=84bcf92d50b23106"
  imageSourceUrl: "https://www.moma.org/collection/works/3358"
  imageSource: "The Museum of Modern Art (MoMA)"
  imageNote: "MoMA 馆藏 Djinn Chaise Longue 官方实物照片，清楚显示低矮曲线与软包结构；比电影截图更能解释设计本体。馆方明确要求经 Art Resource 或 Scala Archives 取得出版授权，不可默认正式刊发。"
  imageStatus: verify-rights

- title: "戒瘾纪念币被放进推币机：杜尚奖把一个人的清醒时间变成艺术"
  url: "https://www.centrepompidou.fr/fr/pompidou-plus/magazine/article/brognon-rollin-le-temps-a-lepreuve"
  source: "Centre Pompidou / Prix Marcel Duchamp 2026 官方获奖公告"
  radar: "设计文化与媒介 / 社会与商业 / 人的现场"
  topic: "Brognon Rollin、戒瘾、时间经验、现成品艺术、参与式装置"
  discoveredAt: "2026-10-25"
  origin: radar
  note: >-
    10 月 22 日，David Brognon 与 Stéphanie Rollin 获 2026 年 Marcel Duchamp Prize。其展品把戒瘾互助群体用于纪念清醒时长的代币放进四台推币/游戏装置，汇集许多个体的年、月、日与小时；机器内代币保持临界平衡，另有参与者远程控制灯光表达每日状态。切口不是猎奇地展览成瘾，而是制度化的时间刻度如何成为人的私人证词：一次复发是否抹去此前努力，谁有资格讲述恢复过程？展览持续至 2027 年 2 月 7 日。应保留艺术家与当事人共同创作的边界，不把作品误当成疗效研究，也不将脆弱处境当作噱头。
  status: candidate
  imageUrl: "https://www.centrepompidou.fr/fileadmin/user_upload/Brogon-Rollin-bandeau.jpg"
  imageSourceUrl: "https://www.centrepompidou.fr/fr/pompidou-plus/magazine/article/brognon-rollin-le-temps-a-lepreuve"
  imageSource: "Centre Pompidou"
  imageNote: "官方展厅装置实景，直接展示两台推币装置及其空间关系；优先于获奖者肖像。馆方/摄影师著作权需核验，正式刊发不可仅凭可访问外链认定可复用。"
  imageStatus: verify-rights
