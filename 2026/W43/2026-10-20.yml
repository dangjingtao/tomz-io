- title: "把美术馆的涡轮大厅变成一件能被身体听见的乐器"
  url: "https://www.hyundai.com/worldwide/en/newsroom/detail/0000001286"
  source: "Tate Modern / Hyundai Motor / Tarek Atoui"
  radar: "设计文化与媒介 / 鬼集"
  topic: "声音艺术、空间感知、跨文化乐器"
  discoveredAt: "2026-10-20"
  origin: "radar"
  note: "10 月 13 日开放的《Hold》将定制管乐、鼓、锣、石头、20 米织物和计算机驱动的气流织成可由表演不断激活的空间装置，展期至 2027 年 4 月。观察点：当建筑、材料和身体共同参与，音乐不再只是播放的内容。官方媒体包对图像署名、报道用途和封面授权有明确限制。"
  status: "candidate"
  imageSourceUrl: "https://www.hyundai.com/worldwide/en/newsroom/detail/0000001286"
  imageSource: "Tate / Hyundai press kit / Ben Fisher and Yili Liu"
  imageNote: "优先官方装置现场图；封面使用可能另收费并需事先授权，暂不保存不稳定直链。"
  imageStatus: "verify-rights"

- title: "一砖厚的蛇形墙：老技术为何仍能给新建筑出主意"
  url: "https://www.serpentinegalleries.org/whats-on/serpentine-pavilion-2026-by-isabel-abascal-and-alessandro-arienzo-lanza-atelier/"
  source: "Serpentine Galleries / LANZA atelier"
  radar: "技术史 / 设计文化与媒介 / 鬼集"
  topic: "蛇形砖墙、结构几何、材料效率"
  discoveredAt: "2026-10-20"
  origin: "radar"
  note: "伦敦 Serpentine 2026 展亭《a serpentine》展期至 10 月 25 日，采用 crinkle-crankle 蛇形砖墙：墙体凭曲线获得稳定性，可用单砖厚度成形。官方追溯其古老技术渊源。不是泛化为所有建筑的万能结构，而是追问旧技术如何因材料节约和公共空间需求重新被看见。"
  status: "candidate"
