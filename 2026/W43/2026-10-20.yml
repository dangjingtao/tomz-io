  note: "澳大利亚博物馆 10 月 14 日公布 Gulamada 项目：无人机 LiDAR 辅助定位，地面核验六处已登记岩棚和三处此前未登记岩棚，发现手印岩画与石器。传统监护人参与实地记录。值得问的是技术扩大遗址发现能力后，谁来决定坐标、图像的公开边界和保护责任。"
