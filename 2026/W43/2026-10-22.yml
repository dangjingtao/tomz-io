- title: "不用机械扫描镜，让 256 种波长替激光雷达转头"
  url: "https://science.nasa.gov/science-research/science-enabling-technology/technology-highlights/nasas-casals-instrument-bridges-gaps-in-3d-maps-of-earths-surface/"
  source: "NASA Goddard / NASA Earth Science Technology Office"
  radar: "科技与科学 / 基础设施 / 鬼集"
  topic: "激光雷达、光栅色散、森林三维测绘、遥感仪器"
  discoveredAt: "2026-10-22"
  origin: "radar"
  note: "NASA 10 月 21 日介绍 CASALS：可调谐激光依次使用 256 个波长，通过衍射光栅将不同波长投向不同角度，试图以无机械扫描镜方式连续覆盖地表三维带状区域。2024 年机载验证在约 5 公里高度获得约 22 厘米水平分辨率；目前仍是机载原型，后续需扩展幅宽与机载处理才能进入空间任务。值得留的是‘换波长即换方向’这一不直观的光学工程，把森林冠层与地表间的测量空白变成可攻克的仪器问题。"
  status: "candidate"
  imageSourceUrl: "https://science.nasa.gov/science-research/science-enabling-technology/technology-highlights/nasas-casals-instrument-bridges-gaps-in-3d-maps-of-earths-surface/"
  imageSource: "NASA Goddard"
