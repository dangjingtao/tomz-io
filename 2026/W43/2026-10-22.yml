- title: "海洋里最常见的“独行者”也会抱团：碳循环模型漏看了微生物的另一种生活"
  url: "https://news.mit.edu/2026/oceans-most-abundant-loner-microbe-has-sticky-second-life-1020"
  source: "MIT News / Nature Communications / Chisholm lab"
  radar: "科技与科学 / 生命科学 / 环境"
  topic: "原绿球藻、生物膜、海洋碳泵、微生物生态"
  discoveredAt: "2026-10-22"
  origin: "radar"
  note: "MIT 10 月 20 日报道：Prochlorococcus 不只在表层海水自由漂浮，也能附着颗粒形成生物膜；实验中附着细胞释放的有机碳接近游离细胞的两倍，海洋样本亦检出颗粒附着状态。团队提出这种生活方式可能影响碳向深海输送，并给出粗略量级估算，但强调尚不能把估算当作已测定的全球碳汇。张力在于一个长期被视为‘独居’的物种有可切换的社会性，模型的遗漏可能不是新物种，而是同一物种的另一种行为。"
  status: "candidate"
  imageSourceUrl: "https://www.nature.com/articles/s41467-026-77598-7"
  imageSource: "Nature Communications / MIT Chisholm lab"
  imageNote: "MIT 新闻封面是 Pexels 通用海景，不应采用；首选论文原始生物膜显微图或实验结果图，需回原文确认图片及许可，尚无稳定直链。"
  imageStatus: "none"

