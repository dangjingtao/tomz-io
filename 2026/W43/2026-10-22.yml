- title: "南极冰川的接地线并不是一条线：海水钻入冰下几公里改变了预测"
  url: "https://science.nasa.gov/blogs/science-news/2026/10/20/nasa-refines-thwaites-glacier-projections/"
  source: "NASA JPL / UC Irvine / Dartmouth / Nature Communications"
  radar: "科技与科学 / 城市环境与生活方式 / 科学方法"
  topic: "思韦茨冰川、海平面、接地区、潮汐、模型不确定性"
  discoveredAt: "2026-10-22"
  origin: "radar"
  note: "NASA 10 月 20 日介绍 10 月 12 日论文：新模型不把冰川从陆地过渡到浮冰的区域简化为几何意义上的一条 grounding line，而是允许潮汐海水在接地区向冰下侵入数公里。新模型对上世纪 90 年代以来卫星观测的冰川退缩拟合明显改善；部分情景的本世纪海平面贡献可高于以往部分估计，不能误写成确定翻倍。观察切口是科学模型里看似细小的边界条件，如何改变沿海城市面对的长期风险。"
  status: "candidate"
  imageSourceUrl: "https://science.nasa.gov/blogs/science-news/2026/10/20/nasa-refines-thwaites-glacier-projections/"
  imageSource: "NASA / JPL"
