- title: "月球基地的垃圾不是废物，而是下一批维修零件的原料"
  url: "https://news.mit.edu/2026/mit-student-team-cerberuz-wins-nasa-lunarecycle-centennial-challenge-1020"
  source: "MIT AeroAstro / NASA LunaRecycle Challenge"
  radar: "鬼集 / 科技与科学 / 基础设施"
  topic: "月球资源循环、复合材料、注塑、数字孪生"
  discoveredAt: "2026-10-22"
  origin: "radar"
  note: "MIT 10 月 20 日介绍学生团队 CERBERUZ 在 NASA LunaRecycle 原型与数字孪生两个赛道获一等奖：把热塑性塑料与难回收的包装泡沫等材料粉碎、混合，再通过注塑制造备件；数字孪生用于预测填模、翘曲与收缩风险。它不是月球已经建成回收厂，而是把极端补给约束转化为地球上同样有价值的材料循环问题：垃圾分类标准不再只是‘能否回收’，而是‘在现场能否直接做成有用的东西’。"
  status: "candidate"
