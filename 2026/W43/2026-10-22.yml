- title: "四万五千盘磁带尚未消失：索马里广播档案与声音记忆的抢救窗口"
  url: "https://www.unesco.org/en/articles/world-day-audiovisual-heritage-protecting-memory-risk"
  source: "UNESCO / Memory of the World Programme"
  radar: "历史与制度 / 设计文化与媒介 / 人的现场"
  topic: "广播档案、音像保存、格式迁移、集体记忆"
  discoveredAt: "2026-10-22"
  origin: "radar"
  note: "UNESCO 10 月 20 日介绍 2026 年濒危音像遗产保护工作，其中包括索马里 Radio Mogadishu 馆藏约 45,000 盘模拟录音带的保存与数字化，以及赞比亚广播档案面对自然灾害、存储环境和过时格式的风险。重要的不是又一轮数字化口号：地方新闻、日常叙事、音乐和政治声音若因磁带老化或播放设备消失而无法读取，社会记忆会先于史书丢失。项目正在实施，不能写成 45,000 盘已全部数字化；长期保存仍涉及元数据、访问权和格式迁移。"
  status: "candidate"
