  note: "伦敦 Serpentine South 于 10 月 8 日至 2027 年 1 月 10 日举办 Justin Caguiat 的 Change Ringing：热致变色绘画随着环境光热显隐形态，植物花朵与种子形状的铜铃按英国 change ringing 变换敲钟逻辑发声，建筑墙面又参与反射和放大声音。它不是又一个沉浸式投影展，而是让材料、气温、传统钟铃算法与建筑声学共同决定作品；观众看到和听到的展览并不完全固定。官方有 George Darrell 拍摄的装置现场图，需核验摄影再使用权；不以赞助商 logo 充当配图。"
