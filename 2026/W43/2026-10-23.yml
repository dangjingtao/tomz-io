- title: "湿漉漉的组织也能贴：外科缝合正在被重新想象成材料连接问题"
  url: "https://news.mit.edu/2026/sanaheal-makes-surgical-stitching-more-like-applying-sticky-note-1020"
  source: "MIT News / SanaHeal"
  radar: "科技与科学 / 生命科学 / 社会与商业"
  topic: "生物黏合材料、手术器械、技术转化、医疗监管"
  discoveredAt: "2026-10-23"
  origin: "radar"
  note: "MIT 10 月 20 日介绍衍生企业 SanaHeal：以受藤壶、蛛网等启发的亲水高分子黏合技术，让潮湿且不规则的组织表面快速贴合并形成气液密封。报道称其创伤止血用途已获监管批准，而更广泛的术中止血和组织修复用途计划在 2027 年开展人体试验；不同适应症与市场地区的监管状态须分别核验，不能写成缝合已被替代。观察切口：外科长期依赖针线和钉合，材料科学能否让某些连接操作转变为表面黏合？科研成果商业化为何需要漫长的临床、监管与合作链条？"
  status: "candidate"
  imageSourceUrl: "https://news.mit.edu/2026/sanaheal-makes-surgical-stitching-more-like-applying-sticky-note-1020"
  imageSource: "MIT News / SanaHeal"
