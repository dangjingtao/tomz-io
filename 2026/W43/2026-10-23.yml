- title: "一台研究暗物质的望远镜，意外在自己的“噪声”里发现新彗星"
  url: "https://www.esa.int/Science_Exploration/Space_Science/Euclid/Euclid_discovers_new_comet"
  source: "European Space Agency / Euclid Consortium"
  radar: "科技与科学 / 科学方法 / 鬼集"
  topic: "Euclid、彗星、意外发现、科研数据再利用"
  discoveredAt: "2026-10-23"
  origin: "radar"
  note: "ESA 10 月 19 日宣布，主要用于测量遥远星系与暗宇宙的 Euclid，在 9 月 16—24 日拍摄的深空巡天图像里发现此前未知的 C/2026 S1 彗星；移动目标检测程序在五组视场、共 16 次曝光中找出条纹，国际小行星中心于 10 月 8 日确认。彗星约距地球 13 亿公里，当前并不适合作为 Comet Interceptor 的目标。值得看的张力是：一个为消除移动物体干扰而设计的分析环节，反而把“噪声”变成另一个学科的发现；跨任务数据与快速跟进如何扩大大型科学仪器的意外收益？"
