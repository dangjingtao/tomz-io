- title: "八张中间证书的密钥泄露：浏览器不用升级也能在三小时内撤销信任"
  url: "https://blog.mozilla.org/security/2026/10/20/protecting-firefox-users-following-the-compromise-of-emudhra-intermediate-certificates/"
  source: "Mozilla Firefox Security Team"
  radar: "Web 与浏览器 / 基础设施 / 制度与治理"
  topic: "HTTPS、证书信任、CA 密钥泄露、OneCRL、浏览器安全"
  discoveredAt: "2026-10-23"
  origin: "radar"
  note: "Mozilla 10 月 20 日披露，10 月 17 日 20:06 UTC 获报 eMudhra 八张中间 CA 证书相关私钥遭泄露；Firefox 通过 OneCRL 下发封禁，在不到三小时内完成标准配置用户的规则分发，无需重启或升级。随后推出桌面和 Android 维护版本、从 NSS 信任库移除关联根证书；10 月 21 日追加 Android 158.0.2，修正部分客户端启动后未立即应用内置 OneCRL 的问题。需区分“潜在伪造证书能力”和“已发生大规模中间人攻击”，官方并未据此证明后者。观察切口：Web 信任不仅依靠证书签发，更依赖可在软件发布周期之外运行的快速撤销机制，以及撤销自身的跨端回归。"
  status: "candidate"
  imageSourceUrl: "https://blog.mozilla.org/security/2026/10/20/protecting-firefox-users-following-the-compromise-of-emudhra-intermediate-certificates/"
  imageSource: "Mozilla Security Blog"
  imageNote: "原文没有能解释 CA 信任链和 OneCRL 下发机制的官方示意图，不用 Firefox logo 或泛化黑客图代替证据。"
  imageStatus: "none"
