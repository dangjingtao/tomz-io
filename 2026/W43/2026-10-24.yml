- title: "新几内亚的火不只是厄尔尼诺：卫星看到干旱与土地利用叠加"
  url: "https://science.nasa.gov/earth/earth-observatory/fires-char-new-guinea/"
  source: "NASA Earth Observatory / GFED / NOAA-20 VIIRS"
  radar: "城市环境与生活方式 / 历史与制度 / 科学方法"
  topic: "2026厄尔尼诺、巴布亚火灾、土地利用、碳排放、灾害治理"
  discoveredAt: "2026-10-24"
  origin: "radar"
  note: "NASA 10 月 22 日用 10 月 11 日 VIIRS 影像和 GFED 估算描述新几内亚严重烟霾：巴布亚新几内亚一侧截至 10 月中旬的火灾碳排放已高于往年同期，印尼巴布亚也异常偏高。厄尔尼诺导致连续少雨，但多数点火与耕作、牧场、清地和狩猎等人类活动相关，土地开发又改变火势和扑救条件。值得追问：同一气候冲击为何在不同土地制度和使用方式下产生不同灾害？排放为模型估算，不能等同最终实测或把所有火归咎单一产业。"
  status: "candidate"
  imageUrl: "https://assets.science.nasa.gov/content/dam/science/esd/eo/images/iotd/2026/new-guinea-on-fire/papuanewguinea_vir_20261011_lrg.jpg/jcr%3Acontent/renditions/cq5dam.thumbnail.319.319.png"
  imageSourceUrl: "https://science.nasa.gov/earth/earth-observatory/fires-char-new-guinea/"
  imageSource: "NASA Earth Observatory / Michala Garrison / VIIRS"
  imageNote: "官方 10 月 11 日新几内亚南部烟霾卫星图；目前确认的直链是 319px 缩略图，正式排版需回官方 Downloads 取得高分辨率图并核对署名。"
  imageStatus: "verify-rights"

- title: "一块砖也能重新定义城市循环：根特美术馆把拆除废料做成外墙"
  url: "https://bcmaterials.org/en/gent-waste-brick"
  source: "BC materials / Design Museum Gent / Local Works Studio"
  radar: "城市环境与生活方式 / 设计文化与媒介 / 社会商业"
  topic: "循环建筑、城市废弃物、建筑认证、地方生产、公共文化空间"
  discoveredAt: "2026-10-24"
  origin: "radar"
  note: "根特设计博物馆 10 月重新开放的新翼采用 Gent Waste Brick，材料开发方称其由 63% 本地市政废料骨料组成、用石灰养护而非高温烧制，并通过外墙使用认证；制造商记录 2024 年在距离现场不到 5 公里的旧铁路工场生产约 82,000 块，博物馆另一公开页面称 85,000 块，正式写作需核对口径。切口不是‘废物变砖’的口号，而是城市能否把材料研发、认证、地方制造、居民参与和公共建筑采购连成真正的闭环；其生命周期碳数据来自项目方，须保留比较边界。"
  status: "candidate"
  imageUrl: "https://bcmaterials.org/sites/default/files/styles/fullwidth/public/2026-09/MDC_DMG_DING_051_sep23_1064_HR_0.jpg.webp?itok=VslKMGOS"
  imageSourceUrl: "https://bcmaterials.org/en/gent-waste-brick"
  imageSource: "BC materials / © Design Museum Gent"
  imageNote: "项目方公开的博物馆新翼与历史街区实景，帮助读者理解材料进入城市空间；链接带 Drupal itok 参数，稳定性不佳，正式刊发还需摄影授权。"
  imageStatus: "unstable"

- title: "3D 打印不只是造形状：X-Hinges 让物体的关节自己感知动作"
  url: "https://news.mit.edu/2026/design-software-reimagines-everyday-objects-as-self-aware-devices-1022"
  source: "MIT CSAIL / Tianjin University / UIST 2026"
  radar: "科技与科学 / 设计文化与媒介 / 交互"
  topic: "3D打印、内嵌传感、柔性铰链、物理交互、校准"
  discoveredAt: "2026-10-24"
  origin: "radar"
  note: "MIT 与天津大学 10 月 22 日介绍 X-Hinges：设计工具把感测材料与导电走线分开嵌入打印关节，做出能读取多轴动作的手套、可捏合调光的折纸灯等实验物件。关键转变是感知不再总靠外贴传感器，而能在制造时长进结构。研究者承认不同打印件的导电布局有差异，仍需视觉系统校准；尚不是量产的‘有意识家具’，更不宜把它归为 AI 自动控制成果。"
  status: "candidate"
  imageSourceUrl: "https://news.mit.edu/2026/design-software-reimagines-everyday-objects-as-self-aware-devices-1022"
  imageSource: "MIT CSAIL / X-Hinges researchers"
  imageNote: "优先官方手套驱动机器人手、折纸灯或多轴关节演示图；新闻页有研究者图片但本轮未确认稳定静态直链及使用许可。"
  imageStatus: "verify-rights"

- title: "四个旋钮、8192 个灯点：一件新媒体作品长成了开源乐器社区"
  url: "https://github.com/engmung/Patternflow"
  source: "SeungHun Lee / Patternflow GitHub / patternflow.work"
  radar: "鬼集 / 设计文化与媒介 / 个人作品"
  topic: "开源硬件、参与式艺术、LED合成器、媒介考古、创作者社区"
  discoveredAt: "2026-10-24"
  origin: "radar"
  note: "韩国创作者 SeungHun Lee 从白南准的参与式电视获得启发，制作四旋钮控制的 128×64 LED 实时图案合成器；硬件、固件、浏览器编辑器和图案格式开放，社区成员能自制外壳和分享图案。项目 GitHub 记录 2026 年从个人原型、众筹到跨国自制者及展览的演变。观察点是屏幕从播放内容的终端重新变成现场演奏的乐器；不是新奇 LED 玩具榜单，也需区分开源代码、硬件图纸与社区图案各自的许可。"
  status: "candidate"
  imageUrl: "https://raw.githubusercontent.com/engmung/Patternflow/main/docs/media/community-builds.jpg"
  imageSourceUrl: "https://github.com/engmung/Patternflow/blob/main/README.md"
