- title: "一万三千八百年前的营地，留下了碎骨、骨针与跨越白令陆桥的工具线索"
  url: "https://news.ku.edu/news/article/bering-land-bridge-base-camp-reveals-what-life-was-like-nearly-14000-years-ago"
  source: "University of Kansas / Science Advances / Kelly Graf et al."
  radar: "历史与制度 / 科学方法 / 人的现场"
  topic: "史前迁徙、白令陆桥、石器技术、古人日常"
  discoveredAt: "2026-10-19"
  origin: "radar"
  note: "堪萨斯大学 10 月 14 日介绍 Shég’ Xdaltth’i’ 遗址：研究团队辨识约 13,800、13,000、12,700 年前三个文化层，累计出土八万余件考古材料；最早层包含炉灶、可能的居住结构、碎裂的野牛骨、骨针和特殊菱形双面石器。研究者认为某些石器形式与白令陆桥亚洲一侧有联系，但不能仅凭形状重建具体迁徙路线。值得追问：史前跨大陆移动史如何通过一个营地里处理骨髓、缝制衣物的微小动作被重新认识？避免把推定居所写成已经确认的‘美洲最古老房屋’。"
  status: "candidate"
  imageUrl: "https://news-archive-assets.ku.edu/data/5e/17/01m4bvxrfmcy09k1ktmryw7f4q.jpeg"
  imageSourceUrl: "https://news.ku.edu/news/article/bering-land-bridge-base-camp-reveals-what-life-was-like-nearly-14000-years-ago"
  imageSource: "University of Kansas / Kelly Graf"
  imageNote: "研究者手持遗址出土的草原野牛骨，背景为发掘中的土坑；官方实拍用于展示骨骼与活动层的考古证据，不当作房屋复原图。"
  imageStatus: "verify-rights"

- title: "厄尔尼诺不只让海水变暖，还让赤道太平洋从绿转蓝"
  url: "https://science.nasa.gov/earth/nasa-satellites-observe-historic-2026-el-nino/"
  source: "NASA Science / NASA Scientific Visualization Studio / PACE / Sentinel-6"
  radar: "科技与科学 / 城市环境与生活方式"
  topic: "2026厄尔尼诺、海洋颜色、浮游植物、海面高度、卫星连续观测"
  discoveredAt: "2026-10-19"
  origin: "radar"
  note: "NASA 10 月 15 日综合 Sentinel-6 海面高度、海温和 PACE 光谱观测：2026 年厄尔尼诺期间，赤道太平洋部分原本较绿的海域变得更蓝，指向上升流减弱、营养盐供给减少和浮游植物丰度变化。与传统仅看海温异常的叙述不同，海洋颜色将物理气候振荡连接到食物网。NASA 引用 NOAA 对本次强度的概率判断仍属预测，不能写成最终历史纪录；可视化的‘蓝’是光谱数据产品，并非人人肉眼都能察觉。"
  status: "candidate"
  imageSourceUrl: "https://svs.gsfc.nasa.gov/5683/"
  imageSource: "NASA Scientific Visualization Studio"
  imageNote: "首选官方 2025/2026 PACE apparent visible wavelength 动态对比；同源还有海温与海面高度图。当前未核实可长期访问的静态图片直链，不用泛化海浪照片。"
  imageStatus: "none"

- title: "谁来定义一个社区的数据画像：堪萨斯州让服务组织牵头而非大学替人发言"
  url: "https://news.ku.edu/news/article/el-centro-and-ku-partner-on-data-driven-statewide-effort-to-build-a-fuller-picture-of-latino-communities-in-kansas"
  source: "University of Kansas / El Centro / Center for Community Health and Development"
  radar: "社会与商业 / 历史与制度 / 人的现场"
  topic: "社区参与式研究、数据代表性、基层组织、公共服务"
  discoveredAt: "2026-10-19"
  origin: "radar"
  note: "堪萨斯大学 10 月 16 日介绍州级拉丁裔社区状况调查：项目由长期服务社区的 El Centro 主导，大学提供定量、定性方法支持，社区顾问委员会及本地信任网络参与接触受访者。此时项目仍在收集和组织证据，不能将拟议画像当作已验证的政策成果。值得观察的是数据生产中的权力关系：当研究对象自己决定哪些问题重要，公共服务统计会不会得到不同的‘问题地图’？既要看代表性，也要看谁最终拥有解释与使用权。"
  status: "candidate"
  imageSourceUrl: "https://news.ku.edu/news/article/el-centro-and-ku-partner-on-data-driven-statewide-effort-to-build-a-fuller-picture-of-latino-communities-in-kansas"
  imageSource: "University of Kansas"
  imageNote: "官方报道配图为 Adobe 通用人物照，不足以说明真实研究现场；等待项目公开方法图或社区参与实拍，不以图库图冒充当事人。"
  imageStatus: "none"

- title: "一幅粉彩画如何变成数百万针：二十幅巨型织毯重新打开‘复制’的含义"
  url: "https://nga.gov.au/exhibitions/arthur-boyd-tapestries/"
  source: "National Gallery of Australia / Manufactura de Tapeçarias de Portalegre"
  radar: "设计文化与媒介 / 技术史 / 人的现场"
  topic: "织毯、媒介转换、手工劳动、圣方济各图像、展览"
  discoveredAt: "2026-10-19"
  origin: "radar"
  note: "澳大利亚国家美术馆 2026 年 6 月至 10 月 18 日首次完整展出 Arthur Boyd 创作的二十幅圣方济各主题巨型织毯，原始粉彩图由葡萄牙 Portalegre 织毯工坊转译为约 2.5×3.4 米的作品，织造中蕴含数百万针的手工劳动。它提醒读者：图像从一种媒介‘复制’到另一种媒介，不只是像素搬运，还涉及织工对颜色、纹理与节奏的再解释。展览已结束，不应写成仍在开放；馆藏图像和作品著作权需核验。"
  status: "candidate"
  imageSourceUrl: "https://nga.gov.au/exhibitions/arthur-boyd-tapestries/"
  imageSource: "National Gallery of Australia / Bundanon Trust / Portalegre workshop"
  imageNote: "优先馆藏页有完整作品与织毯局部的官方照片，展示粉彩到织物的材料差异；作品版权归属和摄影再使用须单独核验，尚未取得稳定原图直链。"
  imageStatus: "verify-rights"
