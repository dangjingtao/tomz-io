- title: "3400 年前的王室档案里，既有瘟疫中的婴儿，也有前线催兵的急信"
  url: "https://engelsiz.ktb.gov.tr/TR-475961/hititlerin-devlet-hafizasi-3-bin-400-yil-sonra-gun-isigina-kavustu.html"
  source: "Türkiye Ministry of Culture and Tourism / Kayalıpınar excavation"
  radar: "历史与制度 / 考古 / 人的现场"
  topic: "赫梯档案、行政记录、疫情、军事物流、古代书写"
  discoveredAt: "2026-10-11"
  origin: "radar"
  note: "土耳其文化旅游部 10 月 8 日公布 Kayalıpınar（古 Šamuḫa）2026 年发掘 131 件楔形文字泥板及残片，与上一季 53 件合计 184 件。馆方称其为本世纪发现的规模最大的赫梯语王室档案之一；文本涉及婴儿公主患热病、死亡及丧葬仪式、将领请求士兵与战车的紧急信件，以及记录路线和鸟类的占卜日志。切口不是猎奇古王室，而是行政档案把国家能力、危机通信和具体家庭的痛苦同时保存下来。现阶段基于部委释读公告，尚需等待考古报告与文本正式刊布核对年代、翻译和背景。"
  status: "candidate"
  imageSourceUrl: "https://www.aa.com.tr/tr/pg/foto-galeri/sivasta-kral-2-tudhaliya-donemine-ait-131-civi-yazili-tablet-gun-yuzune-cikarildi/168324"
  imageSource: "Türkiye Ministry of Culture and Tourism / Anadolu Agency"
  imageNote: "部委供图的本次出土泥板与残片实拍；优先原件照片而非历史复原图，当前未确认稳定直链；正式刊发须核实部委和通讯社授权。"
  imageStatus: "verify-rights"

- title: "一枚小戒指画出了消失的亚历山大灯塔：海底宫殿里的行政痕迹"
  url: "https://www.franckgoddio.org/cn/service/newsletter/detail/new-find-in-the-eastern-port-of-alexandria/"
  source: "IEASM / Franck Goddio / Hilti Foundation"
  radar: "历史与制度 / 城市史 / 设计文化"
  topic: "亚历山大港、灯塔、印章、海底考古、城市治理"
  discoveredAt: "2026-10-11"
  origin: "radar"
  note: "IEASM 10 月 7 日一手通报：在亚历山大东港水下的 Antirhodos 皇家岛宫殿遗址发现一枚青铜印章戒指，刻有古代灯塔形象，与公元 2 世纪钱币图像相似；团队称这是首次发现灯塔图像的此类戒指。出土位置提示宫殿可能承担港口或灯塔相关行政职能，但仅凭一枚戒指无法证明佩戴者身份或具体官署结构。值得追问：消失的宏大建筑，为什么会在微小的日常行政工具上留下可识别图像？"
  status: "candidate"
  imageSourceUrl: "https://www.franckgoddio.org/cn/service/newsletter/detail/new-find-in-the-eastern-port-of-alexandria/"
  imageSource: "Christoph Gerigk / Franck Goddio / Hilti Foundation"
  imageNote: "首选发掘团队一手新闻稿里的青铜戒指及其灯塔刻纹特写，次选出水现场；版权为摄影师及基金会所有，未取得可验证的独立原图直链，需授权核验。"
  imageStatus: "verify-rights"

- title: "太空实验室设计寿命十年，却把油水、泡沫和粉末研究了十八年"
  url: "https://www.esa.int/Science_Exploration/Human_and_Robotic_Exploration/Farewell_to_the_Fluid_Science_Laboratory_after_18_years_in_orbit"
  source: "European Space Agency"
  radar: "科技与科学 / 基础设施 / 技术史"
  topic: "国际空间站、微重力、科学仪器寿命、维修、软物质"
  discoveredAt: "2026-10-11"
  origin: "radar"
  note: "ESA 10 月 9 日宣布国际空间站 Columbus 舱的 Fluid Science Laboratory 开始退役工作。它 2008 年启用，原计划工作 10 年，实际运转超过 18 年、完成 18 项实验和 4.2 万余小时运行；最后的实验研究粒子稳定乳液。零重力环境帮助把浮力与沉降的干扰从泡沫、乳液、颗粒材料研究中剥离。观察点有两个：科学仪器的价值往往来自跨团队维护而非首发；太空探索不只有宏大天体，也有一杯油水如何混合的日常材料物理。退役硬件尚待后续货运飞船再入销毁，不能写成已经回收。"
  status: "candidate"
  imageUrl: "https://www.esa.int/var/esa/storage/images/esa_multimedia/images/2022/08/working_on_the_fluid_science_laboratory/24404558-1-eng-GB/Working_on_the_Fluid_Science_Laboratory_pillars.jpg"
  imageSourceUrl: "https://www.esa.int/ESA_Multimedia/Images/2022/08/Working_on_the_Fluid_Science_Laboratory"
  imageSource: "ESA / NASA"
  imageNote: "2022 年宇航员在轨操作 Fluid Science Laboratory 的实拍，直接解释实验室维护与长期运行；ESA Standard Licence，正式排版前核对许可范围和署名。"
  imageStatus: "verify-rights"

- title: "农田里的半圆形绿色不是设计：地下水耗尽后，灌溉圆圈只剩一半"
  url: "https://science.nasa.gov/earth/earth-observatory/fighting-drought-in-texas-cotton-country/"
  source: "NASA Earth Observatory / USGS Landsat / Texas farmers"
  radar: "城市、环境与生活方式 / 农业 / 人的现场"
  topic: "得州棉花、地下水、干旱、灌溉、农业转型"
  discoveredAt: "2026-10-11"
  origin: "radar"
  note: "NASA 10 月 8 日把得州 Lubbock 附近 2025 与 2026 年 Landsat 图像、农民口述和长期含水层资料放在一起。2026 年部分农场棉田枯死，地下水不足使中心支轴灌溉系统只能覆盖圆形地块的一半或三分之一，在卫星图上呈现半圆/扇形绿地。USGS 数据显示当地许多地区地下水位自 1950 年以来下降数十英尺，部分农户的井已无法正常抽水。它不是又一篇天气异常报道，而是水资源边界如何在农田几何和家庭生计中显形。两个年份的图像不能单独证明气候长期趋势，也不应将某位农户经历外推全区。"
  status: "candidate"
  imageUrl: "https://assets.science.nasa.gov/dynamicimage/assets/science/esd/eo/images/iotd/2026/fighting-drought-in-texas-cotton-country/texasdrought_oli_20260909_lrg.jpg?crop=faces%2Cfocalpoint&fit=clip&h=4721&w=4856"
  imageSourceUrl: "https://science.nasa.gov/earth/earth-observatory/fighting-drought-in-texas-cotton-country/"
