  origin: "radar"
  note: "补同步 10 月 8 日积压候选。官方预告吉澳安龙太平清醮约有 270 年传统，每十年举行一次；2026 年 10 月 11–15 日举办第 27 届，包含竹棚戏台、神功戏、道教科仪与巡游。离岛人口外迁后，十年一次的仪式能否成为离乡群体重新连接地方的低频机制？官方预期返乡人数尚待现场核验，图片为往届活动而非 2026 实况。"
