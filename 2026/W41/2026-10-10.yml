- title: "为什么我们以为尼安德特人只会打石头？木头消失了，技术史也跟着缺页"
  url: "https://www.uam.es/uam/investigacion/cultura-cientifica/noticias/neandertales-madera"
  source: "Universidad Autónoma de Madrid / IPHES-CERCA / Science Advances"
  radar: "历史与制度 / 科学方法 / 技术史"
  topic: "尼安德特人、木工、考古保存偏差、材料文化"
  discoveredAt: "2026-10-10"
  origin: "radar"
  note: "10 月 8 日研究团队披露西班牙 Abric Romaní 遗址 16 个考古层的 597 件木材遗存与印痕，时间跨度约 6.2 万至 4 万年前，其中 13 件可能经尼安德特人加工或使用，包括长矛、树皮容器、木制结构和用途未定的棒状器物。木材腐朽后留下碳酸钙模具，使通常消失的日常技术重新可见。反直觉之处在于‘石器时代’或许首先是保存偏差；器物功能仍有不确定性。论文 DOI:10.1126/sciadv.aeh2287。"
  status: "candidate"
  imageSourceUrl: "https://www.uam.es/uam/investigacion/cultura-cientifica/noticias/neandertales-madera"
  imageSource: "UAM / Gerard Campeny / IPHES-CERCA"
  imageNote: "优先研究团队挖掘现场的木器模具记录照片；大学官网提供图源和摄影署名，尚无稳定原图直链。"
  imageStatus: "verify-rights"

