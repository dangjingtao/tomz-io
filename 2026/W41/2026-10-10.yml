- title: "把一立方公里南极冰做成望远镜：2026 物理诺奖背后的自然材料仪器"
  url: "https://icecube.wisc.edu/news/awards/2026/10/francis-halzen-icecube-principal-investigator-wins-2026-physics-nobel-prize/"
  source: "IceCube Collaboration / University of Wisconsin–Madison"
  radar: "科技与科学 / 科学方法 / 鬼集"
  topic: "中微子天文学、极地科学、科学仪器、国际协作"
  discoveredAt: "2026-10-08"
  origin: "radar"
  note: "补同步 10 月 8 日积压候选。2026 年物理诺奖表彰 Francis Halzen 对 IceCube 和天体高能中微子发现的决定性贡献。科学家把南极一立方公里透明冰作为探测介质，埋入数千光学传感器捕捉稀有相互作用产生的光；2025–26 升级已部署，首批升级科学数据尚待发布。问题不是谁发明了望远镜，而是自然环境如何成为仪器的一部分；奖项属于个人，成果来自长期跨国团队。"
  status: "candidate"
  imageUrl: "https://res.cloudinary.com/icecube/images/q_auto/v1773945375/IceCube_Upgrade_Diagram_031826_five_UG_strings/IceCube_Upgrade_Diagram_031826_five_UG_strings.png"
  imageSourceUrl: "https://icecube.wisc.edu/gallery/the-icecube-upgrade/"
