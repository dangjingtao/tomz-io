  origin: "radar"
  note: "NASA 10 月 9 日发布 2025 年 10 月 7 日与 2026 年 10 月 2 日同区域的 Landsat 假彩色对比图：泰国 Prachin Buri 的 Bang Pakong 河附近农田和养殖区大面积被淹。官方引用洪水影响全国数百万人及大量农地的灾情；不同年份的单次影像不能独立证明长期气候趋势。观察问题是遥感如何让普通读者看见洪水跨越行政、农业和生态边界，也应关注图像如何避免把灾民抽象成像素。"
