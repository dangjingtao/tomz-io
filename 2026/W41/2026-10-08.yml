- title: 森林的“自然状态”也有历史：千年沉积记录重估澳大利亚传统用火
  url: https://www.nature.com/articles/s41586-026-11097-z
  source: Nature / University of Melbourne / Gunaikurnai Land and Waters Aboriginal Corporation
  radar: 历史与制度 / 环境 / 科学方法
  topic: 文化性用火、殖民土地管理、生态基线、火灾反馈
  discoveredAt: '2026-10-08'
  origin: radar
  note: 10 月 7 日 Nature 论文利用澳大利亚东南部约千年的花粉与木炭记录，发现传统低温用火中断后，当地林地结构、火灾强度和侵蚀发生明显变化；研究提出殖民土地管理变化与当代火灾风险间存在长期反馈。观察问题：被认为“天然”的森林形态，是否本来就是历史管理实践的结果？结论仅来自具体地区，不可外推全澳，也不能据此否认气候变化的作用。
  status: candidate
  imageSourceUrl: https://www.nature.com/articles/s41586-026-11097-z
  imageSource: Nature / Fletcher et al.
  imageNote: 首选论文 Fig. 3 植被—火—退化概念图，或 Fig. 2 沉积记录；本轮未获得可验证的原图直链。
  imageStatus: verify-rights
- title: 一座小镇决定能不能赶海，过去可能先给有雨量计的邻居打电话
