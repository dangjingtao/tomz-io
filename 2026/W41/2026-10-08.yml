- title: 阿波罗登月的软件首先学会了“人真的会按错按钮”
  url: https://news.mit.edu/2026/margaret-hamilton-computing-pioneer-dies-1007
  source: MIT News / MIT Museum
  radar: 技术史 / 人的现场
  topic: Margaret Hamilton、阿波罗、容错、工程职业史
  discoveredAt: '2026-10-08'
  origin: radar
  note: MIT 10 月 7 日讣告确认 Hamilton 于 9 月 30 日逝世。她的女儿曾在模拟器误触发飞行前程序，她提出防护却遭拒，Apollo 8 后来发生类似误操作；Apollo 11
    的优先级软件又在过载时保障关键任务。可讨论的软件史小切口：工程不只是写对程序，还要在系统里承认人和机器都会出错。正式写作应避免将团队成果完全归于个人。
