- title: 1181 年出现了 185 天的客星，845 年后望远镜看见它像串珠
  url: https://noirlab.edu/public/news/noirlab2624/
  source: NSF NOIRLab / Gemini North / ISTA / NASA APOD
  radar: 历史与制度 / 天文学
  topic: 古代天文记录、超新星遗迹、跨文明证据
  discoveredAt: '2026-10-08'
  origin: radar
  note: 10 月 6 日 NOIRLab 发布 Gemini North 对 Pa 30 的新成像，发现放射状丝线中存在串珠状气体结节。Pa 30 被认为很可能与 1181 年中国、日本和阿拉伯记载的持续约
    185 天的客星有关。观察问题：古代独立史料如何在数百年后成为现代自然科学的观测线索？遗迹与史料对应仍需保留科学上的不确定性。
