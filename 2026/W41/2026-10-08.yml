- title: Agent 写代码越快，Git 的写入与合并越可能成为稀缺资源
  url: https://github.blog/engineering/architecture-optimization/building-git-infrastructure-for-agent-scale-development/
  source: GitHub Engineering
  radar: 开发工具 / 基础设施
  topic: Git、Agent 并发、持久化写入、版本治理
  discoveredAt: '2026-10-08'
  origin: radar
  note: GitHub 10 月 6 日发布、7 日更新的工程文披露：2026 年 9 月提交量 73.8 亿，月度 push 从去年同期 6.9 亿增至 33.5 亿。大量并发 Agent 使单
    ref 一致性更新、durable writes、CI 扇出成为瓶颈；GitHub 正将权威存储与计算层解耦，内部 benchmark 报告最高 35 倍写吞吐提升（非全站已实现）。观察问题：当生产代码越来越便宜，协调与治理为何反而更贵？
