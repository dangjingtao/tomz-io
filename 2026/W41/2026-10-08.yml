  origin: radar
  note: BUSTAN 是在 Design Museum Holon 展出的全尺度原型，以 178 块机器人打印的本地土砖围绕活橄榄树，砖的几何用于遮阴、通风、保湿，也为虫鸟菌类留栖息空间。值得看的不是打印技术本身，而是建筑需求方从人扩展到一棵树及其生态邻居。尚无长期生态效果数据，不宜写成成熟方案。
