- title: "让键盘自己来找手：Google 日本把输入设备做成了四条传送带"
  url: "https://blog.google/intl/ja-jp/products/android-chrome-play/gboard-2026/"
  source: "Google Japan / Gboard team"
  radar: "鬼集 / 设计、文化与媒介"
  topic: "输入设备、交互设计、开源硬件、反常识原型"
  discoveredAt: "2026-10-06"
  origin: radar
  note: "Gboard 团队今年的 10 月 1 日实验把四组各 29 键装到传送带上：不是让手去找键，而是让键流到手边，支持单手输入。它延续 Google Japan 多年“认真做荒诞键盘”的传统，并给出真正可制造的开源设计图。价值不在实用性，而在把几十年默认不动的物理界面假设倒过来，再把玩笑做到能造出来。"
  status: candidate
