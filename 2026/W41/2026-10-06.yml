- title: "关键矿物的“矿”正在变宽：黏土、盐水、煤灰、废水都开始被当成资源库"
  url: "https://newscenter.lbl.gov/2026/10/05/the-science-enabling-a-steady-supply-of-critical-minerals/"
  source: "Lawrence Berkeley National Laboratory"
  radar: "科技与科学 / 能源与基础设施"
  topic: "关键矿物、资源回收、盐水提锂、工业废物流"
  discoveredAt: "2026-10-06"
  origin: radar
  note: "Berkeley Lab 汇总的一组研究把关键矿物供应问题从“多开矿”扩展到非常规来源：锂黏土、复杂盐水、矿尾、煤灰和废水。单项技术成熟度不同；更值得保留的是资源定义的变化——过去被视作废物或低品位来源的东西，随着分离技术和成本结构改变，正在进入可计算的资源边界。"
  status: candidate
  imageSourceUrl: "https://newscenter.lbl.gov/2026/10/05/the-science-enabling-a-steady-supply-of-critical-minerals/"
