- title: "AI 代码审查的榜单也得承认‘标准答案不完整’：GitHub 开放 ReviewBench"
  url: "https://github.blog/ai-and-ml/github-copilot/reviewbench-an-open-benchmark-for-ai-code-review/"
  source: "GitHub Engineering / ReviewBench"
  radar: "开发工具 / 研究与值得读"
  topic: "代码审查、基准评测、精确率与召回率、人工标注"
  discoveredAt: "2026-10-09"
  origin: "radar"
  note: "GitHub 10 月 5 日公开 ReviewBench：从 1.039 亿真实 PR 的分布抽样，构建 219 个公共 PR、19 种语言的评测集；人工审查、静态分析与多模型共同发现候选问题，再统一裁定。除了固定 golden set 的 precision/recall，还给未命中已知答案但可能正确的新发现单独评分，避免更强的审查者被不完整答案反向惩罚。其 96.6% 人类复核一致率是方法有效性线索，不等于所有模型审查结论都可信。可与真实 CI/Review 经验互照，保留方法的可重复性与评价偏差问题。"
  status: "candidate"
  imageSourceUrl: "https://github.blog/ai-and-ml/github-copilot/reviewbench-an-open-benchmark-for-ai-code-review/"
  imageSource: "GitHub Engineering"
  imageNote: "官方文章的主视觉是装饰性图标，未见必要的独立可复用解释图；正式编辑可链接原始 benchmark 方法图或重新绘制标注流程，但本次不生成配图。"
  imageStatus: "none"
