  note: "2026 安曼设计周 10 月 2–17 日举行，时隔七年回归，主题 Accumulations（累积）；官方与约旦通讯社披露逾 220 位设计师/团体、跨街区展览，并计划在 Ras El Ain 等地留下四件永久公共作品。主展场 Hangar 原是 1930 年代发电机建筑。真正有趣的不是‘又办设计展’，而是将展览从短暂室内事件变成城市公共空间和地方记忆的长期改造。永久装置的后续维护与社区使用尚待观察。"
