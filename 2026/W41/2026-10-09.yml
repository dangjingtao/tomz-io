  discoveredAt: "2026-10-09"
  origin: "radar"
  note: "Chalmers 10 月 8 日介绍可重构电池包：通过开关与管理系统绕过性能较差的电芯，让剩余电芯继续工作。模型在部分高压车况下给出超过 20% 寿命提升的理想上限；一个假设案例推迟约 14 个月换电池，但尚无量产乘用车和全寿命实车验证，开关与控制系统也增加成本。更值得追问的是系统设计能否把‘木桶最短板’从固定命运改成动态治理，而不把模型收益误当成已实现的用户收益。"
