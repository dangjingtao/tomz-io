- title: "原子钟之后，时间开始由原子核来校准：中欧两组核钟同时走出实验原理"
  url: "https://www.natureasia.com/en/info/press-releases/detail/9455"
  source: "Nature / TU Wien–PTB / Tsinghua University"
  radar: "科技与科学 / 基础物理 / 中国科研"
  topic: "钍-229、核钟、精密计时、基础物理"
  discoveredAt: "2026-10-09"
  origin: "radar"
  note: "Nature 10 月 7 日同期发表维也纳与北京团队的两项独立核钟成果：用钍-229 原子核能级跃迁而非电子跃迁锁定激光频率；欧洲原型实现反馈锁定并连续运行约一天，中国团队采用不同激光/晶体配置。它们仍不及最好的光学原子钟，不能写成已取代现有时间标准。值得问的是：计时基准从原子电子转向原子核，除了未来导航同步，还能怎样变成检验基本物理乃至暗物质模型的仪器？原文：doi:10.1038/s41586-026-11084-4 与 doi:10.1038/s41586-026-11122-1。"
  status: "candidate"
  imageSourceUrl: "https://physics.aps.org/articles/v19/139"
  imageSource: "American Physical Society / T. Schumm, TU Wien"
  imageNote: "APS Physics 原文展示钍-229 掺杂氟化钙晶体与实验腔体实拍，能解释核钟的实体而非抽象钟面；未获得稳定图片直链，授权需核验。"
