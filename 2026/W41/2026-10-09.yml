- title: "移民把故乡的碎陶器磨进新陶器：考古学在一粒掺料里找到手艺迁徙"
  url: "https://www.floridamuseum.ufl.edu/science/archaeologists-uncover-centuries-old-mystery-of-tampa-bays-secret-community-of-migrant-potters/"
  source: "Florida Museum of Natural History / American Antiquity"
  radar: "历史与制度 / 文化与手艺 / 鬼集"
  topic: "技术迁徙、工匠网络、陶器岩相、文化传播"
  discoveredAt: "2026-10-09"
  origin: "radar"
  note: "佛罗里达博物馆 9 月底发布对坦帕湾古陶片的研究：化学分析显示陶土为当地材料，但装饰陶器的制作技术、掺入旧陶碎料（grog）及其中云母与北方密西西比文化圈关联，支持有工匠迁居并在当地制陶的解释，而非仅靠成品贸易或纹样模仿。最奇妙的是多代旧陶碎片嵌套在新陶器里，技术、材料和可能的故乡记忆被物理传递；动机仍属解释而非已证实心理事实。虽非当天新研究，属本周补发现的高信号历史小切口。"
  status: "candidate"
