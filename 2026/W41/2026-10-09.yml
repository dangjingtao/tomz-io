- title: "一张会感知自己形状的软片：光纤不再只传信息，还能读出身体弯曲"
  url: "https://news.mit.edu/2026/shape-sensing-sheet-digitally-tracks-movement-bends-twists-1008"
  source: "MIT News / Advanced Intelligent Systems"
  radar: "科技与科学 / 设计与交互 / 人的现场"
  topic: "柔性传感、光波导、康复、可穿戴交互"
  discoveredAt: "2026-10-09"
  origin: "radar"
  note: "MIT 10 月 8 日介绍柔性硅胶片内嵌之字形光纤的形状传感方案：通过光在弯折光纤中传播的变化实时重建整张软片的三维形状；实验中相对实体形状误差低于 0.4 cm，部分光纤损坏仍可重建。它目前是研究原型，光纤仍约 1 mm 厚，尚不是可直接穿戴量产产品。观察点是传感器从绑在身体上的硬节点，变成织物/皮肤本身可感知形状；康复记录可能因此从单次人工观察变为可比较的运动证据。"
