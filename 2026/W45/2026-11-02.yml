- title: "从母婴传播到零报告：巴巴多斯用免费孕产服务完成一项公共卫生认证"
  url: "https://www.who.int/news/item/30-10-2026-barbados-eliminates-mother-to-child-transmission-of-hiv"
  source: "WHO / PAHO 官方认证公告（2026-10-30）"
  radar: "科技与科学 / 人的现场 / 社会与商业 / 公共卫生"
  topic: "巴巴多斯、HIV母婴传播、孕产保健、全民健康覆盖、公共卫生认证、隐私与平等"
  discoveredAt: "2026-11-02"
  origin: "radar"
  note: "WHO10月30日确认巴巴多斯达到消除HIV母婴传播作为公共卫生问题的全球目标：2022—2024年未报告由母婴传播造成的婴儿新增HIV感染，产前护理、孕妇HIV检测、感染孕妇抗病毒治疗覆盖率均约98%。服务对孕妇不分国籍免费且自愿保密。编辑切口：看似医学成功，核心却是多年持续运转的普惠服务、监测和人权保障。必须写成‘作为公共卫生问题获认证消除’，不能写成病毒已从该国消失；0例为特定监测期间报告结果，维持状态仍需投入。与图瓦卢立法条目形成制度能力的不同阶段对照，不预设同一机制。"
  status: "candidate"
  imageUrl: ""
  imageSourceUrl: "https://www.who.int/news/item/30-10-2026-barbados-eliminates-mother-to-child-transmission-of-hiv"
