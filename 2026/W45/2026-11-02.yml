- title: "一部1926年的公共卫生法终于退场：图瓦卢怎样重写疫情与健康治理的权限"
  url: "https://www.who.int/newzealand/news/detail/29-10-2026-tuvalu-parliament-passes-public-health-act-2026--modernizing-century-old-public-health-legislation"
  source: "WHO / 图瓦卢政府联合新闻稿（2026-10-29）"
  radar: "历史与制度 / 城市、环境与生活方式 / 社会与商业"
  topic: "图瓦卢、1926公共卫生法、2026新法、卫生应急、国际卫生条例、岛国国家能力"
  discoveredAt: "2026-11-02"
  origin: "radar"
  note: "图瓦卢议会10月29日通过《2026公共卫生法》，替代1926年最初颁布、此后多次修订的旧法。新法明确从社区卫生风险到国家紧急事件及国际关注公共卫生紧急事件的升级响应、数据使用和跨部门协调框架。编辑切口：一百年过去，小岛国的公共卫生国家能力为何必须先从‘谁有权作决定、何时升级’的法律结构重建？《气数》可借此研究制度更新与纠错，而非从小国样本推出大国结论。通过立法不等于实施已见效，后续应追踪执行细则、预算、数据隐私和实际卫生结果。"
  status: "candidate"
  imageUrl: ""
  imageSourceUrl: "https://www.who.int/newzealand/news/detail/29-10-2026-tuvalu-parliament-passes-public-health-act-2026--modernizing-century-old-public-health-legislation"
