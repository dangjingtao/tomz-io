- title: "超导体的相图画错了？两种电子配对状态在极低温高压下相遇"
  url: "https://physics.cornell.edu/news/two-flavors-superconductivity-material-has-right-ingredients-twist"
  source: "Cornell University Physics / Nature Physics 原始研究（2026-10-30，DOI 10.1038/s41567-026-03504-z）"
  radar: "科技与科学 / 材料与物理"
  topic: "UTe2、碲化铀、超导、热力学相图、拓扑超导候选、量子计算"
  discoveredAt: "2026-11-02"
  origin: "radar"
  note: "Cornell团队用脉冲超声和极端压力实验重测碲化铀UTe2的相图，指出此前一些压力相关描述与热力学不一致；在约1—2K的低温范围发现两种不同超导态的相交与共存区域，研究发表于10月30日Nature Physics。编辑切口：前沿发现有时不是新材料，而是重新绘制一张大家已经相信的地图。研究支持UTe2作为拓扑超导候选的物理前提，不等于已经证明拓扑超导，更不意味着量子计算器件已经实现；压力条件极端，实验可重复性和独立验证仍需追踪。"
  status: "candidate"
