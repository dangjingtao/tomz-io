- title: "哈勃望远镜还没退休：NASA向商业航天征询‘抬高、维修或安全退役’"
  url: "https://science.nasa.gov/missions/hubble/nasa-explores-potential-commercial-servicing-for-hubble-telescope/"
  source: "NASA Science 官方公告（2026-10-30；RFI 2026-10-29）"
  radar: "科技与科学 / 历史与制度 / 工程基础设施"
  topic: "哈勃望远镜、在轨维修、商业航天、轨道衰减、空间资产寿命、采购征询"
  discoveredAt: "2026-11-02"
  origin: "radar"
  note: "NASA10月29日发布信息征询（RFI），向产业界了解为哈勃升轨、在轨维护升级或最终安全再入处置的能力；征询截止11月30日。NASA估算在无干预情况下哈勃可能于2033—2034年再入，若执行延寿任务需在2032年前完成。编辑切口：当一件价值极高、已服役三十多年的公共科研设备逐渐失去轨道高度，维护、重建、商业服务和安全退役如何比较？这仍是市场能力摸底，不是NASA已签订维修合同或已确定载人任务；不要把1997年历史维修照片误写成2026现场。"
