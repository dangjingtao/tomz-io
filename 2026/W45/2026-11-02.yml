- title: "六分之七的记者遇害案件未获司法解决：UNESCO新报告揭示战争无人机与问责裂缝"
  url: "https://www.unesco.org/en/articles/six-out-seven-journalists-killings-are-not-brought-justice-reversing-progress-fight-against-impunity"
  source: "UNESCO 2026-11-02 正式新闻稿及《记者安全与有罪不罚危险》双年报告（unesdoc.unesco.org/ark:/48223/pf0000399885）"
  radar: "历史与制度 / 社会与商业 / 人的现场 / 新闻自由"
  topic: "记者安全、调查问责、联合国教科文组织、2026双年报告、战争无人机、制度失灵"
  discoveredAt: "2026-11-02"
  origin: "radar"
  note: "2026-11-03 续注：已核实UNESCO于11月2日公开正式新闻稿与报告原文入口（https://unesdoc.unesco.org/ark:/48223/pf0000399885），不再停留在活动预告。报告统计2024—2025年189名记者遇害，其中127人在冲突地区；50人死于无人机袭击，占冲突地区记者遇害者约40%。UNESCO称全球司法未解决比例由前一双年期85%升至86%，为其2012年开始统计后首次逆转；非冲突地区比例长期下降至77%，说明全球趋势不能掩盖不同制度情境。编辑切口：报道战争的技术环境变了，保护与追责制度为何未跟上？谨慎区分‘司法未解决’与‘无人调查/无人起诉’，核查报告方法与国家回应口径；与《气数》国家能力及制度纠错的研究方法关联，不做国家评分。原2026-11-02采集，今日只续注原记录，不新增重复条目。"
