- title: "为什么是鲍蔼伦，为什么是这周：把《心经》手语动作变成光的香港影像先驱"
  url: "https://www.mplus.org.hk/en/exhibitions/ellen-pau-luminosity/"
  source: "M+ 博物馆《Ellen Pau: Luminosity》展览页面（2026-10-30 开始）"
  radar: "人物与传记 / 设计、文化与媒介 / 科技与科学 / 人的现场"
  topic: "鲍蔼伦、Ellen Pau、香港录像艺术、手语、动作捕捉、心经、公共艺术、Videotage"
  discoveredAt: "2026-11-02"
  origin: "radar"
  note: "本周人物雷达已主动完成。为什么是她：鲍蔼伦是香港录像与新媒体艺术先驱，1986年参与创办Videotage，并长期把技术、身体和城市空间放进艺术创作。为什么是这一周：M+在10月30日于大台阶开始展出《原光》（Luminosity），以动作捕捉将《心经》手语表演转为逐渐浮现又消散的光迹，且免费向公众开放。编辑切口：技术不只负责让影像更逼真，还能否把一种身体语言变成公共空间里可感知的哲学？不写流水账传记，不将手语仅当装饰；区分本次2026《原光》与她2022年M+幕墙作品《光之凝》。已核对近两周Radar人物条目，未发现鲍蔼伦被充分写过。"
