- title: "一座博物馆为何要开在悉尼西部：Powerhouse Parramatta把科技与地方记忆放进同一栋楼"
  url: "https://powerhouse.com.au/about/media/full-exhibition-program-for-powerhouse-parramatta-revealed"
  source: "Powerhouse 官方开幕展览公告（2026-08-24）；2026-11-07 正式开馆"
  radar: "城市、环境与生活方式 / 设计、文化与媒介 / 历史与制度"
  topic: "Powerhouse Parramatta、西悉尼、公共文化投资、原住民水文化、科技博物馆、设计与收藏"
  discoveredAt: "2026-11-02"
  origin: "radar"
  note: "Powerhouse Parramatta计划11月7日开放，项目总额约9.15亿澳元（含馆外藏品存储与数字化），五个开幕展共呈现逾3000件展品，其中1600余件来自馆藏。展览从第一民族的水域治理、飞行史到商场与消费空间设计；四个展览免费，Task Eternal对成人收费。编辑切口：重要文化基础设施不一定建在传统城市中心，如何让技术史、地方知识与公共空间真正为西悉尼服务？开馆尚未发生，不能写成参观体验或宣称长期社会收益已兑现；同时留意本周已收录Es Devlin在伦敦的导览条目，避免重复包装同一艺术家，重点应放在公共文化设施与地区分布。"
