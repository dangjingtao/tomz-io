- title: "一座村庄被掏空以后，谁还留在里面：牛津五年田野研究把“衰落”写成可阅读的多媒体书"
  url: "https://www.compas.ox.ac.uk/article/emptiness-has-moved-in-next-door"
  source: "Oxford COMPAS 2026-11-03 原始研究说明；Stanford University Press《Living Emptiness》2026-11-03开放数字出版；Oxford 2026-11-05新书发布会"
  radar: "历史与制度 / 城市、环境与生活方式 / 人的现场 / 数字出版"
  topic: "Living Emptiness、Dace Dzenovska、东欧去工业化、边境地区、国家撤退、民族志、开放多媒体书"
  discoveredAt: "2026-11-07"
  origin: "radar"
  note: "牛津研究团队在拉脱维亚边境、亚美尼亚高地、乌克兰中部及俄罗斯远东进行了五年民族志，11月3日公布数字原生、开放获取的多媒体研究成果，11月5日在牛津发布。以居民影像、声音、文章解释人和公共服务撤离后仍留在原地的人如何生活。研究者强调空心化可能源于资本流向、边境制度和政策选择，而非单一的自然人口规律。编辑切口：‘空城’不是空白地块，如何在治理与统计中让仍在场的人可见？与《气数》的国家能力、路径依赖、竞争解释方法呼应；研究范围为特定后社会主义田野，不能据此直接推断全欧洲政治激进化或任何国家气数。数字书正文 https://livingemptiness.org/ 当前网页读取受限，Oxford COMPAS原始公告与书发布页可核对。来源 https://www.compas.ox.ac.uk/event/living-emptiness"
  status: "candidate"
  imageUrl: ""
  imageSourceUrl: "https://www.compas.ox.ac.uk/article/emptiness-has-moved-in-next-door"
  imageSource: "Oxford COMPAS / 研究者 Dominic Martin 的俄罗斯远东旧军事驻地照片（网页有署名）"
  imageNote: "研究项目有田野照片及署名，但未找到独立开放再利用授权和稳定原图直链；先保留官方图文页面，不抓取不搬运。"
  imageStatus: "none"

- title: "土地登记与外国投资也可能是国家扩权工具：14个非洲国家的案例挑战“弱国家”叙事"
  url: "https://www.manchester.ac.uk/about/news/how-foreign-investment-can-strengthen-african-governments-control-over-land/"
  source: "University of Manchester 2026-11-06 研究公告；Geoforum论文 DOI 10.1016/j.geoforum.2026.104838"
  radar: "历史与制度 / 社会与商业 / 城市、环境与生活方式"
  topic: "撒哈拉以南非洲、土地权利、国家能力、外资、保护区、数字地籍、传统土地使用权"
  discoveredAt: "2026-11-07"
  origin: "radar"
  note: "Carolin Dieterle与Yuezhou Yang综合14国24个案例，结合2018—2024年在乌干达、南非、坦桑尼亚、赞比亚、肯尼亚的田野与既有研究，发现政府有时借外资、基建、保护区、土地登记与数字测绘扩展行政控制，而当地传统土地权利可能受损。编辑切口：国家能力‘增强’对谁是好事？必须区分财政/行政覆盖能力与土地使用者的权利和同意。《气数》可用此检验‘国家弱—外资强’二元叙事，但这是质性比较框架，不是14国普遍因果律；应查原论文的方法与反例，不作国家评分。论文 DOI https://doi.org/10.1016/j.geoforum.2026.104838"
  status: "candidate"
  imageUrl: ""
  imageSourceUrl: "https://www.manchester.ac.uk/about/news/how-foreign-investment-can-strengthen-african-governments-control-over-land/"
