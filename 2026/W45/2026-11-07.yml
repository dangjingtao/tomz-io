- title: "洪水警报画出淹水范围，比一大段文字更快救人吗：746人的模拟决策实验"
  url: "https://doi.org/10.1080/29986907.2026.2746540"
  source: "University of Vermont 2026-11-06研究新闻原稿（由Phys.org转载）；Crisis and Risk Communication论文 DOI 10.1080/29986907.2026.2746540"
  radar: "城市、环境与生活方式 / 科技与科学 / 设计与文化 / 公共安全"
  topic: "洪水预警、灾害地图、信息设计、行为实验、决策时间、疏散、风险沟通"
  discoveredAt: "2026-11-07"
  origin: "radar"
  note: "佛蒙特大学团队以模拟暴雨的互动游戏让746名参与者接收不同形式手机洪水预警，比较疏散/居家防护选择的速度与适切性。11月6日大学发布的研究新闻称：淹水范围地图组平均6.69秒、决策准确率77.8%；常见信息图组8.58秒、57.7%。编辑切口：应急信息设计的指标不能只有‘看得懂’，还要看人能否及时采取正确行动。注意实验为模拟决策而非真实灾难死亡率证据，样本与任务设计可能影响外推；原始论文DOI已披露，但本轮未能直接打开出版商全文，正式深读须复核分组与统计显著性。大学原稿转载 https://phys.org/news/2026-11-people-pressure.html"
