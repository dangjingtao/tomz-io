- title: "一台太空机器人真的拼上了第三节桁架：成功证明“在轨组装”，却没完成整面天线"
  url: "https://www.caltech.edu/about/news/caltech-robotic-space-demo-successfully-builds-in-space"
  source: "Caltech 2026-11-05 ASTRA/NOM4D项目原始公告；DARPA资助的在轨实验"
  radar: "科技与科学 / 航天工程 / 鬼集 / 工程基础设施"
  topic: "ASTRA、Caltech、DARPA NOM4D、在轨自主组装、桁架、反射天线、工程试验边界"
  discoveredAt: "2026-11-07"
  origin: "radar"
  note: "2026年3月30日入轨的ASTRA系统携带两节预制桁架和机械臂，Caltech 11月5日披露它在轨自主装出了第三节，实测照片由载荷相机回传。目标是11节桁架组成1.4米反射天线，但任务因时间与工程问题只完成初始部分；团队通过地面备份机复现故障，利用每天7—8个约15分钟通信窗口排障。编辑切口：从‘把大东西折叠送上去’到‘把零件送上去在轨拼’，首次演示的证据边界在哪里？不能把一节新增桁架写成完整天线成功，更不能当成百米级空间制造已经可用；与本周ISS太阳翼人工出舱更新有工程比较价值但并非同一事件。配图为Caltech/Momentus载荷实拍，非DARPA概念画。"
  status: "candidate"
