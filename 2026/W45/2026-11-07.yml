- title: "为什么是Tony Albert，为什么是这周：一场原住民三年展来到Alice Springs，策展不只是陈列作品"
  url: "https://araluenartscentre.nt.gov.au/whats-on/5th-national-indigenous-art-triennial-after-rain"
  source: "Araluen Arts Centre 2026-11-06开幕日程；National Gallery of Australia第五届National Indigenous Art Triennial官方展览页与Tony Albert访谈"
  radar: "人物与传记 / 设计与文化 / 城市、环境与生活方式 / 人的现场"
  topic: "Tony Albert、After the Rain、澳大利亚第一民族艺术、Alice Springs、跨代传承、策展、艺术家社群"
  discoveredAt: "2026-11-07"
  origin: "radar"
  note: "为什么是这周：第五届澳大利亚国家原住民艺术三年展《After the Rain》11月6日在Mparntwe/Alice Springs的Araluen Arts Centre开启新一站，11月7日安排Aretha Brown与Tina Baum对谈及工作坊。为什么是Tony Albert：他既是艺术家又是本届艺术总监，把10组跨代艺术实践组织为关于文化延续、土地、创伤与新生的对话，而不是给艺术家做个人履历展。编辑切口：策展如何把中心机构的收藏与在地社群重新连起来？要明确这是巡展的新站，非整场展览2026年11月首次亮相；此前已在Canberra及Gold Coast展出。官方策展人访谈 https://nga.gov.au/stories-ideas/tony-albert-stephen-gilchrist/；不以‘代表所有原住民’概括各艺术家立场。与本周Sky Hopinka、Harvey Pratt等人物候选区分为澳洲在地巡展现场。"
  status: "candidate"
  imageUrl: ""
  imageSourceUrl: "https://nga.gov.au/exhibitions/fifth-national-indigenous-art-triennial/"
  imageSource: "National Gallery of Australia /《After the Rain》展览及作品图像，作品版权分别属于艺术家"
  imageNote: "官方展览页可追溯多幅艺术家作品与策展人照片，署名及许可因作品不同而异；本轮未提取可明确再使用的单一图片直链，暂不搬运。"
  imageStatus: "none"
