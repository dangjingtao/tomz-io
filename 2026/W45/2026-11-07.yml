- title: "一场演出有多少小时没有算进工资：ILO把排练、差旅与后期劳动重新放回账本"
  url: "https://www.ilo.org/resource/news/wide-variations-pay-and-uneven-recognition-working-hours-across-recorded"
  source: "ILO 2026-11-06正式新闻稿；2026-10-28《Trends in remuneration and working time: Recorded media and live performance》研究 DOI 10.54394/00034560"
  radar: "社会与商业 / 设计与文化 / 人的现场 / 劳动制度"
  topic: "文化劳动、电影、现场演出、音乐、排练工时、流媒体、版税、项目制、性别薪酬差距"
  discoveredAt: "2026-11-07"
  origin: "radar"
  note: "ILO 11月6日发布新研究说明：电影、音乐与现场演出行业的实际劳动不止镜头或舞台上的时长，排练、旅行、搭建、后期等可能另付、包价或根本未被完整记录。项目制、版税、剩余报酬与流媒体复杂版权链使总收入难统计；研究举出欧盟2022年文化就业女性毛时薪平均低于男性13.5%，不可误写成2026全球差距。编辑切口：观众看到作品，合同和统计却可能看不见制作作品的时间。应并列呈现创作者、雇主及小型制作公司的经营风险，不把‘未单独计费’自动等同于违法欠薪。报告入口 https://www.ilo.org/publications/trends-remuneration-and-working-time-recorded-media-and-live-performance"
