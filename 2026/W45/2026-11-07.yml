- title: "恐龙骨里的“血”活过一亿年？真正被检测到的是矿化细胞中的血红素化学指纹"
  url: "https://doi.org/10.1073/pnas.2614248123"
  source: "PNAS 2026-11-02 同行评审原始论文；Curtin University 2026-11-03研究说明"
  radar: "科技与科学 / 古生物 / 鬼集"
  topic: "Aratasaurus museunacionali、1.15亿年、血红素、矿化红细胞、质谱、污染控制、化石分子保存"
  discoveredAt: "2026-11-07"
  origin: "radar"
  note: "Curtin领衔团队在巴西东北部1.15亿年前的兽脚类恐龙Aratasaurus骨骼血管通道中，结合液相色谱-质谱、拉曼光谱和透射电镜，识别与矿化椭球状细胞结构空间对应的血红素衍生分子，并将周围基质中的叶绿素/细菌叶绿素卟啉作为对照。论文发表于PNAS 11月2日，大学11月3日发布说明。编辑切口：古生物研究从骨骼形态走向分子证据，但污染和成岩产物的竞争解释怎样被排除？这是血源分子与疑似矿化红细胞证据，不是仍可流动的‘恐龙鲜血’，也不是完整血红蛋白、DNA或克隆恐龙；论文也承认内源生物分子鉴定长期存在争论。配图为Curtin官方新闻中的化石照片，待核权。"
  status: "candidate"
  imageUrl: "https://www.curtin.edu.au/news/wp-content/uploads/2026/10/P1012262-scaled.jpg"
  imageSourceUrl: "https://www.curtin.edu.au/news/media-release/dinosaur-blood-oldest-discovery-rewrites-what-fossils-can-reveal-about-the-past/"
