- title: "世界生物圈保护区日看南非Waterberg：617公顷恢复计划究竟恢复什么"
  url: "https://www.unesco.org/en/articles/south-africas-waterberg-biosphere-reserve-advances-plans-restore-617-hectares-degraded-grazing-land"
  source: "UNESCO 2026-10-26 报道（10-27更新）；UNESCO 11-03 国际生物圈保护区日"
  radar: "城市、环境与生活方式 / 历史与制度 / 人的现场"
  topic: "南非Waterberg、生物圈保护区、灌木侵占、草场恢复、社区培训、生态监测"
  discoveredAt: "2026-11-03"
  origin: "radar"
  note: "11月3日是UNESCO国际生物圈保护区日，借当周日期回看其10月26日发布的Waterberg实地计划：2025—2029年ReLISA项目拟先修复617公顷受灌木侵占的草场，调查显示更大区域约11156公顷受影响，并拟培训18名当地居民（以妇女、青年为主）。为什么值得看：生态保护并非‘种更多树’那么简单，草地与木本植物比例、牧业生计、水分入渗和清除物利用存在真实取舍。617公顷是计划而非已恢复面积，生物炭效益和碳、水、收入效果尚待CSIR监测。可与《气数》关于执行能力、反馈和长期制度协调的方法对话，不据此推断国家整体治理。"
  status: "candidate"
