  source: "NAMM 2025-06-09 当事人口述史；2026-10-29《纽约时报》讣告及2026年10月业内悼念"
  radar: "人物与传记 / 设计、文化与媒介 / 鬼集 / 科技与科学"
  topic: "Mike Beigel、Mu-Tron III、电子音乐史、模拟滤波器、口述史、发明与音乐实践"
  discoveredAt: "2026-11-03"
  origin: "radar"
  note: "本周人物雷达已于11月2日收录鲍蔼伦，本条为额外跨界人物续扫。为什么是他：Beigel的Mu-Tron III包络滤波器把演奏力度转成可听见的动态音色，影响Stevie Wonder等音乐人；NAMM于2025年录制了他的口述史，是可靠一手访谈。为什么是这一周：其2026年9月逝世后，《纽约时报》10月29日刊出讣告，引发对音乐背后隐形电子工程师的重新关注。编辑切口不是罗列专利，而是‘音乐史里谁拥有声音的作者身份’。各媒体对具体去世日期和年龄表述不一致，正式人物稿须以家属讣告复核，当前不写确切日期与年龄。与本周鲍蔼伦侧重的公共影像议题不同，避免同一人物重复包装。"
