  discoveredAt: "2026-11-03"
  origin: "radar"
  note: "ESA于11月2日披露希腊国家航天计划ERMIS-3（2026-03-30发射）在调试后数周与希腊Holomondas光学地面站建立激光通信链路，称为希腊首次与低轨卫星建立光学链路。真正工程问题是高速运动的小卫星如何完成精确指向、捕获和连续跟踪，且还受云层与大气湍流制约。此次证明链路建立，不等于已公开持续吞吐率、全天候可用性或商业规模部署。配图为ESA官方图像库地面站照片，摄影来源Astrolight，遵循ESA Standard Licence但再利用条款仍需核验。"
