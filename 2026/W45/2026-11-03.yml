- title: "给鱼打疫苗，不必再一条条捞出水：丝蛋白微针尝试解决养殖业的最后一厘米"
  url: "https://news.mit.edu/index.php/2026/mit-engineers-design-safer-more-efficient-vaccination-system-farmed-fish-1102"
  source: "MIT News 2026-11-02；ACS Nano 原始研究（MIT / USDA）"
  radar: "科技与科学 / 人的现场 / 城市、环境与生活方式 / 鬼集"
  topic: "水产养殖、鱼类疫苗、丝蛋白微针、虫胶防水、劳动安全、冷链"
  discoveredAt: "2026-11-03"
  origin: "radar"
  note: "MIT与美国农业部团队在ACS Nano发表食品级丝蛋白微针方案，利用虫胶涂层使微针能在水下穿过湿鱼皮肤并控制疫苗释放，报道中已在1—2克虹鳟鱼上测试。传统注射要麻醉、离水、逐条操作，成本与鱼及工人安全都受影响。编辑切口：农业技术真正难的常是活体现场操作，而非实验室药物本身。现阶段属于研究验证，尚无规模化养殖部署或长期防病收益证据；不可写成已取代传统注射。"
