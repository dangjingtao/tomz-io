- title: "气候健康干预‘每年可挽救160万人’：模型背后的财政与公共卫生账本"
  url: "https://www.who.int/news/item/04-11-2026-six-climate-and-health-actions-could-save-1.6-million-lives-and-deliver-trillions-in-benefits-each-year"
  source: "WHO 2026-11-04《Global benefits and costs of prioritized actions on climate change and health》技术报告及公告"
  radar: "历史与制度 / 社会与商业 / 城市、环境与生活方式 / 科技与科学"
  topic: "气候适应、公共财政、卫生经济、热预警、清洁燃料、政策建模"
  discoveredAt: "2026-11-05"
  origin: "radar"
  note: "WHO 11月4日估算全球扩大六类气候与健康干预（高温健康预警、饮水、卫生设施、手卫生、清洁家庭燃料、化石燃料合理定价）每年或避免约160万人死亡，产生3.9万亿美元经济福利收益及5.4万亿美元财政收益。其研究比较2024—2075年扩围与不扩围情景；1.6百万是模型预测而非已观察死亡减少，财政收益不能与经济福利直接相加成单一‘净利润’。报告自身承认扩围假设较理想、部分干预交互未建模、长期预测不确定。编辑切口：《气数》关心的制度执行能力与财政余地，怎样影响本来已有技术的健康收益兑现？不据模型数字给国家或政策排名。"
  status: "candidate"
  imageUrl: ""
  imageSourceUrl: "https://www.who.int/news/item/04-11-2026-six-climate-and-health-actions-could-save-1.6-million-lives-and-deliver-trillions-in-benefits-each-year"
  imageSource: "WHO / 2026气候与健康报告；新闻题图署名Hồ Chí Cường"
  imageNote: "报告封面与新闻摄影版权未核实，数字可引用需回原报告，图片暂不转存。"
  imageStatus: "none"

- title: "让考古发掘变成一场可以投票的戏：伦敦尝试把被忽略的社区写进规划规则"
  url: "https://www.ucl.ac.uk/social-historical-sciences/news/2026/nov/reclaiming-ground-legislative-theatre-social-equity-planning-led-archaeology"
  source: "University College London / Archaeology South-East 2026-11-03项目公告；UCL 2026-09资助说明"
  radar: "历史与制度 / 设计、文化与媒介 / 人的现场 / 鬼集"
  topic: "立法剧场、规划考古、社区参与、奥古斯托·博瓦尔、文化遗产治理"
  discoveredAt: "2026-11-05"
  origin: "radar"
  note: "UCL 11月3日介绍Reclaiming the Ground：由考古人员与剧场实践者共同推动，借巴西戏剧家Augusto Boal的Legislative Theatre，让10位18—25岁的伦敦黑人青年以表演重现考古与规划中的障碍，再与政策人员讨论、投票提出建议，计划2028年春展示。项目已获资助且2026年9月起开展，不能说本周才发明立法剧场，也不能写成政策已经改变。编辑切口：谁有权解释从城市地下挖出来的历史？剧场能否把抽象的公众参与变成真正的规则反馈？本周人物扫描同时注意Boal因新项目获得现实入口，但为避免与本条重复包装，暂不另建其百科式传记候选。"
  status: "candidate"
