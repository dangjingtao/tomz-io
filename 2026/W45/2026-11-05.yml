- title: "全球约2.4亿青少年一周没有一天达到60分钟活动：问题不只在手机屏幕"
  url: "https://www.who.int/news/item/04-11-2026-one-in-four-adolescents-worldwide-reported-no-active-days-in-the-previous-week"
  source: "WHO 2026-11-04新闻稿及The Lancet Global Health原始研究（389项调查、140个国家与地区）"
  radar: "城市、环境与生活方式 / 人的现场 / 科技与科学"
  topic: "青少年身体活动、城市可步行性、学校环境、性别差距、公共健康"
  discoveredAt: "2026-11-05"
  origin: "radar"
  note: "WHO 11月4日发布全球估计：11—17岁青少年约四分之一（约2.4亿）自报上一周没有任何一天达到至少60分钟中高强度身体活动；研究汇集389项人群调查、覆盖140个国家与地区、超过320万名青少年。女孩报告零活动日的比例28%，男孩22%。编辑切口：城市交通、公共空间安全、学校制度和性别规范共同塑造孩子能否活动，而非把原因归结为个人懒惰或屏幕。注意‘零达标日’不等于完全没有运动；为自报及模型估计，不是对每个国家的实时计步。与11月4日露宿者热暴露条目不同，关注成长环境与日常活动权。"
  status: "candidate"
  imageUrl: ""
  imageSourceUrl: "https://www.who.int/news/item/04-11-2026-one-in-four-adolescents-worldwide-reported-no-active-days-in-the-previous-week"
