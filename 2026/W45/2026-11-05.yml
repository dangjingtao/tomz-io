- title: "陨石落地前先画出‘散落区’：欧洲把小行星预警接进自动化流水线"
  url: "https://neo.ssa.esa.int/en/-/predicting-the-strewn-field-of-imminent-impactors"
  source: "ESA NEO Coordination Centre 2026-09-10原始技术公告；EU–ESA 2026-11-03—05流星观测与行星防御研讨会"
  radar: "科技与科学 / 鬼集 / 历史与制度"
  topic: "Meerkat Asteroid Guard、Aegis、陨石散落区、蒙特卡洛、行星防御、跨机构预警"
  discoveredAt: "2026-11-05"
  origin: "radar"
  note: "ESA NEOCC于9月10日介绍已进入运行链的散落区预测模块：Meerkat识别潜在撞击体，Aegis细化轨道，结合大气风场和碎裂模拟自动计算可能的陨石散落区；论文对历史事件回测。11月3—5日EU–ESA在西西里举办的流星观测与行星防御研讨会，使天文观测、雷达、火流星与地面回收的协同再次成为当周现实议题。编辑鬼集切口：一颗陨石尚未落地，就能为搜寻者准备地图，但概率区域不是落点保证，模型验证不等于对任何新事件的精准预言。明确技术发布在9月，本周只是新研讨会入口；不把它包装成11月刚上线。"
