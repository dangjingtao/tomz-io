- title: "Swift在苏门答腊上空结束22年任务：一台‘宇宙急诊车’的退役与抢救失败"
  url: "https://science.nasa.gov/blogs/swift/2026/11/02/nasas-swift-observatory-to-re-enter-atmosphere/"
  source: "NASA Swift mission blog（2026-11-02发布、11-04更新确认）；NASA Swift任务总结（2026-10-23）"
  radar: "科技与科学 / 工程基础设施 / 历史与制度"
  topic: "Swift望远镜、伽马射线暴、在轨服务、失控再入、科研设施生命周期"
  discoveredAt: "2026-11-05"
  origin: "radar"
  note: "NASA于11月4日更新确认：美国太空军测得Swift在美国东部时间11月4日07:39于印度尼西亚北苏门答腊上空再入，2004年发射、原计划主任务2年却运行近22年。NASA此前的商业升轨尝试未能完成，Swift曾依靠快速定位和多波段观测联动全球天文台。编辑切口：一件长期运行的科学公共资产如何在维护、商业救援和不可避免的退役之间选择？本周11月2日已收录哈勃维修征询，但那是仍待决策的未来选项；本条是已确认发生的Swift终局，不混为一谈。不能把艺术概念图写成11月4日再入实拍；NASA仅称部分残骸可能幸存，不臆测地面损失。"
  status: "candidate"
  imageUrl: "https://assets.science.nasa.gov/dynamicimage/assets/science/astro/universe/2023/09/Swift-1.png"
