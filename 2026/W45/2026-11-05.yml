  origin: "radar"
  note: "Smithsonian 11月3日宣布：2026年2月启动的Mississippi Community Cultural Conservation Program，覆盖15家地方博物馆与文化组织、30位参与者，将于11月12—14日Jackson举行的全国民俗节期间完成最后一次线下工作坊。此前课程包括馆藏护理、数字化、灾害预案与社区叙事。编辑切口：文化保护的瓶颈可能不在国家博物馆缺藏品，而在地方机构缺训练、技术与跨机构网络；大型机构如何不以自上而下的标准取代地方知识？目前只是项目总结与未来活动预告，未验证长期保存成果，不能写成活动已举行。"
