- title: "为什么是Harvey Pratt，为什么是这周：一座纪念碑在设计者身后继续召集人们"
  url: "https://americanindian.si.edu/visit/washington/nnavm"
  source: "Smithsonian National Museum of the American Indian官方纪念碑档案与2026-11-02退伍军人纪念活动公告；美国内政部2026-01-05悼念声明"
  radar: "人物与传记 / 设计、文化与媒介 / 历史与制度 / 人的现场"
  topic: "Harvey Pratt、原住民退伍军人、纪念碑设计、法医肖像、文化真实性、公共记忆"
  discoveredAt: "2026-11-05"
  origin: "radar"
  note: "为什么是他：Cheyenne与Arapaho艺术家Harvey Pratt（1941—2025）既是越战退伍军人、法医肖像画家，也是华盛顿National Native American Veterans Memorial‘Warriors’ Circle of Honor’设计者；他曾推动打击冒充原住民艺术品的市场欺诈。为什么是这一周：Smithsonian 11月2日公布11月7日的原住民退伍军人纪念活动，这是Pratt于2025年12月31日去世后的首个退伍军人节前夕，纪念碑再次成为公共集会与讲述的现场。编辑切口：从替身份不明者画脸，到为被忽略的军人设计共同记忆空间，艺术如何承担‘让人被看见’的公共职责？活动尚未发生；不能将2020年建成、2022年奉献典礼和2026年纪念活动混写为同一事件。已检索本周11月2日鲍蔼伦、11月3日Mike Beigel、11月4日Hellmuth Sievers，不重复既有人物。"
  status: "candidate"
  imageUrl: "https://americanindian.si.edu/sites/1/files/nnavm/2020AK23-332-946x709.jpg"
  imageSourceUrl: "https://americanindian.si.edu/visit/washington/nnavm"
  imageSource: "Smithsonian National Museum of the American Indian / National Native American Veterans Memorial官方照片"
  imageNote: "官方可追溯纪念碑旧照，不是2026年活动现场；馆方图片版权与摄影师署名仍须逐张核查，不能因馆藏元数据CC0推定照片也可自由转载。"
  imageStatus: "verify-rights"
