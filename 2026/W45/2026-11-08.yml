  note: "11月5日世界数字保存日，澳大利亚国家图书馆以自己的数字保存团队为例，讨论如何照护USB、软盘和PDF等‘born-digital’馆藏，并与实体文物的可逆修复、定制保护盒作对照。编辑切口：一件物品的存在不等于未来有人还能打开它；格式、设备、校验、迁移与机构预算共同决定数字记忆寿命。文章主要是机构实践介绍，未提供完整保存成本、成功率或迁移流程，不应当成已验证的行业解决方案。与Bowie档案条目形成‘私人档案—公共保存’关联，但不强行捆成单一主题。"
