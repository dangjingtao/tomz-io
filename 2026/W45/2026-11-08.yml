- title: "世卫组织报告刚果（金）Bundibugyo病毒病突破万例：社区死亡比数字更能揭示救治断点"
  url: "https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON625"
  source: "WHO Disease Outbreak News DON625，2026-11-06（数据截至11月3日）"
  radar: "科技与科学 / 人的现场 / 历史与制度 / 公共卫生"
  topic: "Bundibugyo病毒病、刚果（金）、跨境卫生治理、社区死亡、早期发现、救治可及性"
  discoveredAt: "2026-11-08"
  origin: "radar"
  note: "WHO 11月6日疫情通报：截至11月3日，刚果（金）8省67个卫生区累计10668例确诊、5198例死亡，粗病死率48.7%，51个卫生区仍有传播；10月21日以来512名报告死亡者中335人在社区死亡、177人在治疗中心死亡。编辑切口不是恐怖数字，而是为何患者仍未能及时进入救治体系：病例发现、地理可及性、跨境监测和地方卫生行政能力如何相互制约。注意WHO说的是Bundibugyo病毒病（埃博拉病毒病的一种），不可把病例数套用到所有埃博拉疫情；粗病死率不等于个体风险，通报也不能直接证明哪项政策导致传播。肯尼亚和尼日利亚本轮通报未新增病例，不等于全区域无风险。与《气数》国家能力方法论只作问题对照，不进行国家排名。"
  status: "candidate"
