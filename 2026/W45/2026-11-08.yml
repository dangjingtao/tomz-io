  note: "本周刊于Science的Tunnug 1研究报道称在约2800年前的西伯利亚墓葬中发现逾1000颗大麻种子和保存的人发，研究者据化学检测提出古人可能为致幻目的使用该植物。AP采访的外部专家对头发中的化学信号是否足以区分摄入与墓内污染提出质疑。编辑切口：植物残留、人体化学信号、古代文献三种证据何时能互相支撑，何时仍无法证明具体行为？研究论文DOI及原始检测数据本轮未核实，故状态hold；不能把‘最早已证实的吸食’或‘用于安抚祭祀牺牲者’写成定论。正式入选前须回原始Science论文及方法补证。"
