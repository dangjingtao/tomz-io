- title: "尼日利亚追加5亿美元修复干旱土地：550万亩成绩单背后是怎样的治理协作"
  url: "https://www.worldbank.org/en/news/press-release/2026/11/06/nigeria-boosts-support-for-climate-resilience-and-sustainable-landscapes"
  source: "World Bank 2026-11-06 项目追加融资公告（ACReSAL）"
  radar: "社会与商业 / 城市、环境与生活方式 / 历史与制度"
  topic: "尼日利亚、ACReSAL、景观修复、流域治理、气候适应、财政投入、农牧冲突"
  discoveredAt: "2026-11-08"
  origin: "radar"
  note: "世界银行11月6日宣布为尼日利亚北部ACReSAL项目追加5亿美元融资。公告称项目自2022年已在约55万公顷实施可持续景观管理、受益者超过440万人；追加资金目标到2031年达到140万公顷、惠及660万人。编辑切口：修复景观是植树工程、用水制度，还是地方财政与跨部门治理的共同项目？必须区分世界银行自报的既有项目产出、未来目标与经独立验证的生态/收入效果；冲突减少、洪灾损失下降仍属于预期收益。可与本周‘人工造林与野火风险’及《气数》执行能力研究形成互补，但不是同一地区/生态类型的直接因果对照。"
