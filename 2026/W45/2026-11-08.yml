  source: "American Planning Association 2026世界城市规划日官方活动页；RTPI 2026说明"
  radar: "城市、环境与生活方式 / 历史与制度 / 设计与文化"
  topic: "世界城市规划日、1949起源、公众参与、共同设计、城市公平、规划实施"
  discoveredAt: "2026-11-08"
  origin: "radar"
  note: "11月8日是世界城市规划日，1949年由阿根廷规划学者Carlos María della Paolera倡议；APA将2026线上会议安排在11月6日，聚焦协作、共同设计与共同所有权。编辑切口：规划为何不仅是图纸上的空间分配，而是利益冲突、社区参与和行政执行？这是一场行业纪念与专业会议，不是新规划政策或已证实的公平改善。若做人物方向可回看della Paolera，但本周已主动收录Bowie，避免仅凭周年日重复包装传记；更值得追踪会议案例与可量化的社区结果。"
