- title: "为什么是David Bowie，为什么是这周：V&A把他的手稿、未实现计划与故乡观众带到同一展厅"
  url: "https://www.vam.ac.uk/dundee/info/david-bowie-treasures-go-on-display-in-scotland-for-the-first-time-at-v-a-dundee"
  source: "V&A Dundee 2026-11-04 开展官方公告与展览档案（David Bowie: On Tour）"
  radar: "人物与传记 / 设计与文化 / 人的现场 / 音乐史"
  topic: "David Bowie、V&A Dundee、艺术家档案、创作过程、地方记忆、80周年纪念"
  discoveredAt: "2026-11-08"
  origin: "radar"
  note: "为什么是这周：11月4日V&A Dundee正式开启David Bowie: On Tour，逾100件档案物品首次以此规模走出伦敦展出，11月6日还有围绕展览的夜间活动；展览处于2027年1月8日Bowie诞辰80周年纪念的前奏。为什么是Bowie：手稿、1973年Dundee演出票、Berlin公寓钥匙、歌曲创作秒表、未实现的影视剧本，把‘反复重塑形象’从明星神话拉回工作习惯与地方听众记忆。编辑切口：一个人如何有意识地保存自己的创作痕迹，博物馆又如何把私人档案变成可供城市共同阅读的文化记忆？不写生平大全；避免把策展选择等同于完整真实的Bowie，或把80周年误写为2026年。已检查本周鲍蔼伦、Mike Beigel、Sky Hopinka、Tony Albert等人物条目，不同人物与事件，不重复包装。"
