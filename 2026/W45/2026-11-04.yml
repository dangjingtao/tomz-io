- title: "种树未必降低火险：全球67248块人工造林地的卫星记录给出反直觉答案"
  url: "https://oembed.uef.fi/en/article/afforestation-reshapes-wildfire-activity-across-temperate-regions-worldwide"
  source: "University of Eastern Finland 2026-11-03 原始研究公告；PNAS DOI 10.1073/pnas.2623623123"
  radar: "科技与科学 / 城市、环境与生活方式 / 历史与制度"
  topic: "人工造林、野火、卫星观测、碳汇、生态治理、土地利用"
  discoveredAt: "2026-11-04"
  origin: "radar"
  note: "2026-11-03公布的PNAS研究分析2001—2023年全球温带地区67248块由非林地转为人工林的斑块；控制气候、可达性与斑块面积等因素后，造林与单位面积火灾发生率平均高26%、发生火灾时预期烧毁面积高23%相关。差异显著：温带针叶林区增幅更大，草地、稀树草原与灌丛地区反而观察到火灾发生率下降。编辑切口：公共政策中‘种树=生态修复’的简单等式在不同生境为何失灵？《气数》的制度反馈框架可用于追问项目目标、执行和火险成本如何协调，不把相关性研究写成任意造林必然引发火灾，更不否认造林的其他生态收益。"
  status: "candidate"
  imageUrl: ""
  imageSourceUrl: "https://oembed.uef.fi/en/article/afforestation-reshapes-wildfire-activity-across-temperate-regions-worldwide"
  imageSource: "University of Eastern Finland / 造林地实景（Juli Pausas、Susana Gómez-González摄影）"
  imageNote: "大学公告有摄影署名但未见开放再发布许可；尚未提取稳定原始图片链接，保留官方页面供编辑核权。"
  imageStatus: "none"

- title: "海啸警报不能只靠一条消息：太平洋跨国演练检验火山海啸的通信冗余"
  url: "https://www.unesco.org/en/articles/pacific-island-countries-and-territories-strengthen-tsunami-preparedness-through-regional-pacwave26"
  source: "UNESCO / IOC-UNESCO 2026-11-03 PacWAVE26官方公告"
  radar: "历史与制度 / 城市、环境与生活方式 / 人的现场 / 科技与科学"
  topic: "PacWAVE26、火山海啸、跨境预警、灾害通信、冗余、国家能力"
  discoveredAt: "2026-11-04"
  origin: "radar"
  note: "UNESCO 11月3日预告太平洋岛国和地区将于11月4日23:00 UTC至11月5日03:00 UTC开展PacWAVE26区域演练，特别针对西南太平洋火山源海啸，测试国家海啸预警中心、灾害管理机构之间的接收、判断、共享和协调链路。公告列出WhatsApp、Slack、HF无线电与邮件列表等不同通信渠道，值得从‘单点失败与冗余’理解制度韧性。采集时演练尚未开始，不能写成演练已成功或预警链路已被证实可靠；后续如有官方演练复盘，应更新本条。11月5日世界海啸意识日构成当周时间入口。与《气数》制度协调/系统冗余观察面相接，但不进行国家排名。"
  status: "candidate"
