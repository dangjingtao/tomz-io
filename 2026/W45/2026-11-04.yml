- title: "为什么是Hellmuth Sievers，为什么是这周：一位海洋学家如何把海啸预警做成跨国制度"
  url: "https://www.unesco.org/en/articles/hellmuth-sievers-life-dedicated-understanding-ocean-and-tsunamis"
  source: "UNESCO 2026-09-04当事人口述访谈；UNESCO 2026-11-03 PacWAVE26官方演练公告"
  radar: "人物与传记 / 历史与制度 / 科技与科学 / 人的现场"
  topic: "Hellmuth Sievers、智利海洋学、1958国际海啸预警、2026演练、制度史、跨境合作"
  discoveredAt: "2026-11-04"
  origin: "radar"
  note: "本周人物雷达11月2日已有鲍蔼伦、11月3日有Mike Beigel，此条为主动延伸扫描，不取代已完成的周扫描。为什么是他：UNESCO 9月的当事人访谈记载Sievers自1950年代参与智利海洋学与跨国海啸预警合作，1958年智利加入夏威夷预警体系是其职业生涯的重要节点。为什么是这一周：11月4—5日PacWAVE26跨国火山海啸演练与11月5日世界海啸意识日，让‘预警不是一台机器而是一套跨境协调制度’成为现实问题。编辑切口不是94岁科学家生平百科，而是科学仪器、国际组织和公共警报如何在数十年中形成可用网络。2026演练不是由他本人组织，不能建立未经证实的直接因果；避免与当周灾害演练条目重复叙述，人物可作为制度史的另一入口。"
  status: "candidate"
