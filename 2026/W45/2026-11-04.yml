- title: "两千年前被斩首的边疆居民，今天有了一张脸：数字复原究竟能还原多少"
  url: "https://media.nms.ac.uk/news/2000-year-old-face-of-inhabitant-of-roman-scotland-revealed-in-new-reconstruction"
  source: "National Museums Scotland 2026-10-20 原始公告；2026-11-03新报道；展览2026-11-14开幕"
  radar: "历史与制度 / 设计、文化与媒介 / 人的现场 / 科技与科学"
  topic: "罗马不列颠、苏格兰边疆、古DNA、同位素、骨考古、数字面容复原"
  discoveredAt: "2026-11-04"
  origin: "radar"
  note: "苏格兰国家博物馆将于11月14日开幕的Roman Scotland展，展示在Inveresk发现的罗马时期居民头骨及其数字面容复原。馆方结合骨骼损伤、同位素、古DNA与艺术家Chris Rynn的工作推测其生活史；四名成年男子有死后斩首现象，动机尚不明。11月3日的最新报道让这项10月20日已公告的展品重新进入当周视野。编辑切口：博物馆如何在‘可证实的骨骼信息’与‘供公众共情的面容想象’之间划线？面容不是历史照片；其职业、身份、斩首原因都不能由一张重建图直接确定。"
