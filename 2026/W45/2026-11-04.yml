- title: "对露宿者来说，一棵树可能是救命基础设施：盐湖城的实测与街头访谈"
  url: "https://attheu.utah.edu/facultystaff/tree-shade-offers-critical-heat-relief-for-people-experiencing-unsheltered-homelessness/"
  source: "University of Utah 2026-10-29 原始研究报道；Journal of Urban Health DOI 10.1007/s11524-026-01134-7；2026-11-03研究传播"
  radar: "人的现场 / 城市、环境与生活方式 / 社会与商业 / 科技与科学"
  topic: "露宿者、城市热岛、树荫、热暴露、公共空间、住房、气候适应"
  discoveredAt: "2026-11-04"
  origin: "radar"
  note: "犹他大学研究者跟踪8名盐湖城露宿者的个人热暴露，收集近万次热指数观测；午后树荫与约1.7—3.2华氏度的热指数降低相关，夜间仍有长时间高温暴露。另有24名露宿者和30名商户/员工的访谈材料，揭示遮阴、饮水、厕所与被驱离等公共空间障碍。10月29日大学原始报道、11月3日再次传播；基础研究于9月发表，不冒充11月刚发表的论文。编辑切口：城市树木在最需要的人那里是公共卫生设施而非景观装饰；8人的小样本不能推导全城效应，树荫也不能替代稳定住房和室内降温。"
  status: "candidate"
  imageUrl: ""
  imageSourceUrl: "https://attheu.utah.edu/facultystaff/tree-shade-offers-critical-heat-relief-for-people-experiencing-unsheltered-homelessness/"
