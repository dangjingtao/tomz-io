- title: "考古学酿出一瓶‘罗马风味’啤酒：当历史研究进入舌头，会丢失什么"
  url: "https://le.ac.uk/news/2026/november/roman-inspired-ale-everards-archaeological-discoveries"
  source: "University of Leicester 2026-11-03 官方报道；2026-11-02项目发布活动"
  radar: "鬼集 / 设计、文化与媒介 / 历史与制度 / 人的现场"
  topic: "罗马不列颠、考古公众传播、食品史、历史再造、Rutland马赛克、Fosse Centurion"
  discoveredAt: "2026-11-04"
  origin: "radar"
  note: "莱斯特大学考古团队与本地酿酒厂11月2日发布Fosse Centurion，11月3日大学披露其从Rutland罗马别墅与Leicester Stibbe发掘获得历史灵感，用蜂蜜、酸樱桃、蒲公英根和杜松等调味。它是现代团队的‘罗马风格’实验与公共传播项目，不是从古代配方原样复刻、也不能证明罗马人一定饮用这种成品。编辑鬼集切口：历史知识如何被翻译成可以尝到的体验，又如何避免把‘受启发’包装成‘考古复原’？记录的是文化研究与创意传播，不作酒类购买推荐。"
