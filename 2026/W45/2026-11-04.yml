- title: "纽约街头脚手架能不能透光？城市把施工安全设施当作公共空间重新设计"
  url: "https://www.nyc.gov/mayors-office/news/2026/10/mamdani-administration-announces-1-200-sidewalk-sheds-taken-down"
  source: "NYC Mayor's Office / Department of Buildings 2026-10-19 官方公告；2026-11-03实地报道复核"
  radar: "设计、文化与媒介 / 城市、环境与生活方式 / 历史与制度"
  topic: "纽约人行道棚架、PAU、Arup、模块化、建筑安全、街道治理"
  discoveredAt: "2026-11-04"
  origin: "radar"
  note: "纽约市政府10月19日披露PAU设计的Baseline Shed与Speed Shed已在280 Broadway DOB总部外安装展示；11月3日的现场报道确认两款原型进入公众视野。透明聚碳酸酯屋面、可移动轻型棚架等设计试图同时维持防坠物安全与商铺采光、行人视线。市府称自2026年1月以来棚架减少约1200座（约15%），属于官方口径；规则仍在制定，尚非全市普及。编辑切口：被当作临时障碍物的基础安全设施，为什么也是公共设计？城市宣布原型设计可被自由复制，但不等于市府新闻摄影自动开放转载。该公告并非11月3日才首发，不冒充当日新政。"
  status: "candidate"
