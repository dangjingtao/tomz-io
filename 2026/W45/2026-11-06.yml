- title: "一张靠体温供电的疾病监测贴片：3800万美元科研计划还不是临床产品"
  url: "https://news.mit.edu/2026/mit-led-team-receives-funding-for-early-disease-detection-wearable-monitor-1104"
  source: "MIT News 2026-11-04公告；ARPA-H PYTHIA项目"
  radar: "科技与科学 / 社会与商业 / 人的现场"
  topic: "PYTHIA、ARPA-H、无创生物标志物监测、败血症、心力衰竭、体温能量采集、医疗器械转化"
  discoveredAt: "2026-11-06"
  origin: "radar"
  note: "MIT宣布牵头一个为期四年、最多获得3800万美元ARPA-H支持的PYTHIA项目，计划研发以人体热量供电的可穿戴贴片，连续检测间质液中的心衰和败血症相关生物标志物，后续仍需元件开发、临床前和临床试验。编辑切口：从连续血糖监测走向更多疾病的难点，不是贴一片芯片，而是极低浓度分子的可靠识别、能量预算、误报与临床责任。金额为最高资助额而非已花费成本；不能写成现有医疗产品或已经完成早期诊断验证。本周已有鱼类疫苗微针，但技术和临床场景不重合。"
