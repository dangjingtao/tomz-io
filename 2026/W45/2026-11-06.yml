- title: "国际空间站最后一组卷展式太阳翼开始安装：一座将退役的实验室为什么还要扩容供电"
  url: "https://www.nasa.gov/blogs/spacestation/2026/11/05/spacewalk-begins-to-install-last-roll-out-solar-array/"
  source: "NASA ISS官方任务日志（2026-11-05 08:44 EST）及2026-11-04任务准备说明"
  radar: "科技与科学 / 工程基础设施 / 历史与制度"
  topic: "国际空间站、IROSA、太阳翼、航天维修、受控离轨、科研资产生命周期"
  discoveredAt: "2026-11-06"
  origin: "radar"
  note: "NASA在11月5日08:44 EST的日志确认，CSA宇航员Joshua Kutryk与NASA宇航员Anil Menon于08:36 EST出舱，目标是在3B供电通道安装第八组也是最后一组IROSA卷展式太阳翼。11月4日任务说明预计该系列改造把空间站供电能力由约160 kW增至约215 kW；这些电力既支持科研和运行，也支持未来安全受控离轨。编辑切口：为什么即将结束使命的基础设施仍需要投入升级？可与本周Swift退役和哈勃维修征询对照，但本条聚焦空间站在役维护，不重复卫星个案。当前核对到的官方页面只确认出舱开始，尚未找到11月5日完整出舱与最终安装成功的独立官方终报；绝不把计划写成已完成，后续优先在原记录续注。 2026-11-07续注：NASA 11月5日15:52 EST的正式完工日志（https://www.nasa.gov/blogs/spacestation/2026/11/05/spacewalkers-install-final-roll-out-solar-array/）确认Menon与Kutryk完成6小时59分出舱，成功安装并展开3B通道第八组、最后一组IROSA；2021年以来累计18次相关出舱，空间站供电能力由约160kW提高到约215kW。现将hold改为candidate。原链接保留作为出舱开始证据，终报为后续事实来源；不把计划当结果，也不把训练照当现场。"
  status: "candidate"
  imageUrl: ""
  imageSourceUrl: "https://www.nasa.gov/blogs/spacestation/2026/11/05/spacewalk-begins-to-install-last-roll-out-solar-array/"
