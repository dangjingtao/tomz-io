- title: "中草药不是只看配方：越南与老挝实验室练习测农药残留和霉菌毒素"
  url: "https://www.who.int/brunei/news/detail-wpro/05-11-2026-what-s-in-herbal-remedies--laboratory-analysts-from-viet-nam-and-lao-pdr-learn-to-test-for-safety-and-quality"
  source: "WHO西太平洋区域办公室2026-11-05新闻稿；越南国家药品质量控制研究所NIDQC培训现场资料"
  radar: "科技与科学 / 城市、环境与生活方式 / 历史与制度 / 人的现场"
  topic: "传统草药、安全检测、黄曲霉毒素、农药残留、越南、老挝、实验室能力建设"
  discoveredAt: "2026-11-06"
  origin: "radar"
  note: "WHO 11月5日介绍9月开展的两阶段传统与补充医学产品实验室培训：30人完成线上模块、16人参与河内线下操作，重点学习农药残留与霉菌毒素检测、HPLC-FLD与QuEChERS样品前处理。新闻日期是本周，培训发生在9月，不能误写成11月新开课。编辑切口：传统药物的文化信任与现代公共安全并非非此即彼，关键在于小国和基层实验室能否负担检测设备、标准与人才；培训不等于已建立覆盖全市场的常态监管，也不证明所有草药有效或有害。"
