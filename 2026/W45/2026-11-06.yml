  discoveredAt: "2026-11-06"
  origin: "radar"
  note: "ILO于11月3—5日在乌拉圭蒙得维的亚召开《家政工人公约》第189号通过15周年全球会议；官方背景材料称约81%的家政工人仍处于非正规就业。乌拉圭是首个批准C189的国家，也是国际家政工人联合会创始大会举办地。编辑切口：《气数》所关注的法律能力与实际执行能力之间，为什么相隔十五年仍有巨大缺口？需查各国统计分母、是否以全球家政工人总数为基数，以及公约批准与实际社保覆盖的差别；会议目标不等于已达成的新国际承诺。与本周ILO女性管理报告主题不同，重点是家庭内部隐形劳动。"
