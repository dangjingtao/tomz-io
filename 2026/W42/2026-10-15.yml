  imageStatus: verify-rights

- title: "地铁工地里的旧木船，连名字也要重新考证"
  url: "https://www.sea.museum/en/about/media/2026/10/cocklebayboat"
  source: "Australian National Maritime Museum"
  radar: "历史与制度 / 城市与公共空间 / 技术史"
  topic: "悉尼港口史、船舶考古、原住民命名、文物保护"
  discoveredAt: "2026-10-15"
  origin: radar
  note: "澳大利亚国家海事博物馆 10 月 13 日披露，2018 年悉尼地铁施工发现的殖民时期木船，保存了 294 块木构件，团队发现隐蔽铁质紧固件，并使用摄影测量和数字模型研究保护与复原。馆方经原住民咨询认为旧称 Barangaroo Boat 与历史人物缺少直接联系，改称 Cockle Bay Boat。船的具体航行范围仍待考证，永久展陈计划于 2028 年开放。切口：地下施工如何揭示城市经济史，文物命名又如何体现历史解释权。"
  status: candidate
