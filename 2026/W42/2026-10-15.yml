- title: "一座陨石坑为什么长得像蜘蛛：地貌会保存被侵蚀的冲击证据"
  url: "https://science.nasa.gov/earth/earth-observatory/an-impact-structure-with-legs/"
  source: "NASA Earth Observatory / USGS Landsat 9"
  radar: "科技与科学 / 历史与制度 / 鬼集"
  topic: "地质时间、陨石撞击、遥感、科学方法、地貌侵蚀"
  discoveredAt: "2026-10-15"
  origin: radar
  note: "NASA 10 月 13 日揭晓西澳 Kimberley 的 Spider Crater 卫星谜题：2026 年 9 月 20 日 Landsat 9 影像中，浅色砂岩山脊像蜘蛛脚一样从中央隆起辐射，完整结构约 13×11 公里；地质学家曾提出火山成因，后来在现场发现冲击锥、受冲击石英与锆石等证据，支持陨石撞击解释。撞击年代估计约在 9 亿至 6 亿年前，仍有不确定性。值得保留的不是奇形怪状照片本身，而是远看似生物图案、近看由漫长侵蚀与冲击地质构成的科学识别过程。"
  status: candidate
  imageUrl: "https://assets.science.nasa.gov/dynamicimage/assets/science/esd/eo/images/iotd/2026/an-impact-structure-with-legs/aus_spidercrater_oli2_20260920_lrg.jpg?crop=faces%2Cfocalpoint&fit=clip&h=4837&w=5122"
  imageSourceUrl: "https://science.nasa.gov/earth/earth-observatory/an-impact-structure-with-legs/"
  imageSource: "NASA Earth Observatory / Michala Garrison / USGS Landsat"
  imageNote: "2026-09-20 Landsat 9 原始观测的官方可视化：清楚显示放射状砂岩脊与撞击结构。NASA 图片裁切参数非临时签名，正式刊发前仍核对具体图像署名与许可。"
  imageStatus: verify-rights

- title: "一块史前肩胛骨与一颗受伤门齿：如何重建尼安德特人的社会关系"
  url: "https://www.nature.com/articles/s41598-026-69193-z"
  source: "Scientific Reports / University of Cambridge / Shanidar Cave Project"
  radar: "历史与制度 / 科学方法 / 人的现场"
  topic: "尼安德特人、史前创伤、考古证据、社会照料"
  discoveredAt: "2026-10-15"
  origin: radar
  note: "10 月 15 日开放获取论文报告伊拉克 Shanidar 洞穴约 7.5 万年前的尼安德特人遗存 Shanidar A：左肩胛骨有约 15 毫米近圆形穿孔，团队推测可能来自史前木制狩猎工具；门齿也有明显旧伤，提示个体受伤后继续存活。研究者由此讨论史前人群的冲突与相互照料，但工具并未随遗骸出土，伤痕成因、是否有意行为、照料程度及埋葬解释都存在不确定性。应保留论文的证据链，而非将推断写成确定的史前故事。"
  status: candidate
  imageUrl: "https://cdn.prod.website-files.com/66291ceb75bda80771024415/6ad0e2f3e3e3577e308f2cce_Scapula%231.webp"
  imageSourceUrl: "https://www.joh.cam.ac.uk/about-us/news-and-research/neanderthals-violent-death-in-the-middle-east-reveals-possible-prehistoric-murder"
