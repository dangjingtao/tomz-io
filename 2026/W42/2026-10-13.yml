- title: 51 名学生把虾、藻和微生物装进小水缸，送上空间站
  url: https://www.esa.int/Education/ESA_Academy_Experiments_programme/Student-built_SCAMPI_experiment_launches_to_the_International_Space_Station
  source: European Space Agency / ESA Academy / SCAMPI student consortium
  radar: 科技与科学 / 生命科学 / 人的现场
  topic: 微重力生态系统、闭环生命支持、学生工程、空间实验
  discoveredAt: '2026-10-13'
  origin: radar
  note: ESA 10 月 13 日确认 SCAMPI 随 CRS-35 货运任务发射：来自欧洲与美国高校的 51 名学生设计、测试并交付一个包含虾、藻和微生物的密闭水生生态系统，计划在国际空间站研究微重力下的生物与环境相互作用，之后返回地球进行生物学比较分析。值得关注的不只是把水族箱送上太空，而是长期深空生活支持系统的基础问题：小型生态循环如何在重力消失时维持平衡？这是实验刚发射、尚无科学结果，不能把预期用途写成已验证成果；团队协作和临发射前的活体维护也值得记录。
