- title: 一座筹划四十年的城市广场，到了开建前才重新争论谁有决定权
  url: https://www.cityofsydney.nsw.gov.au/building-new-infrastructure/town-hall-square
  source: City of Sydney / NSW planning process
  radar: 历史与制度 / 城市、环境与生活方式 / 社会与商业
  topic: 公共空间、地方与州规划权、城市更新、拆迁与公共利益
  discoveredAt: '2026-10-13'
  origin: radar
  note: 悉尼市政府 10 月更新的 Town Hall Square 项目页显示：这处市政厅对面公共广场的构想始于 1980 年代，2026 年 10 月 1 日提交开发申请，9 日被州规划部长认定为州级重大开发项目，拟转交独立规划委员会审定。方案计划拆除 7 栋非遗产保护建筑，建设约 4500 平方米公共开放空间、30 余棵本土树木及遮阴水景，市政府列出的建设预算为 1.5 亿澳元。当前是规划与审批阶段，不是已建成成果。它留下的真实张力是：城市中心究竟更需要新公共空间，还是现有商户与建筑；长期公共愿景与当下成本冲突时，市级和州级机构如何分配决定权？应同时核查政府、商户与居民立场，不将市政府效果图等同公共共识。
