- title: "公民议事会更有气候雄心，却很少改变政策"
  url: "https://www.nature.com/articles/s41558-026-02755-1"
  source: "Nature Climate Change / Pfeffer et al."
  radar: "历史与制度 / 社会与商业"
  topic: "公民议事会、政策执行、制度授权"
  discoveredAt: "2026-10-17"
  origin: "radar"
  note: "研究评估西欧六个公民议事会 488 条建议，67% 比现有政策更雄心勃勃，但除法国约三分之一产生可识别的政策影响外，多数没有改变决策。反事实识别与西欧样本有限；不等于参与机制毫无价值，也不等于建议必然带来减排。追问表达权如何变成决策权。"
  status: "candidate"
  imageUrl: "https://media.springernature.com/lw685/springer-static/image/art%3A10.1038%2Fs41558-026-02755-1/MediaObjects/41558_2026_2755_Fig2_HTML.png"
  imageSourceUrl: "https://www.nature.com/articles/s41558-026-02755-1"
  imageSource: "Pfeffer et al. / Nature Climate Change"
  imageNote: "论文 Fig.2 展示六个议事会政策影响，文章 CC BY 4.0，使用需署名、附许可及注明修改。"
  imageStatus: "available"

- title: "一千年前的铅污染，藏在孩子的牙齿里"
  url: "https://www.antiquity.ac.uk/news/2026/ancient-teeth-trace-real-impact-britains-medieval-lead-industry"
  source: "Antiquity Journal / Loveluck et al."
  radar: "历史与制度 / 人的现场"
  topic: "中世纪矿业、牙釉质、阶层不平等"
  discoveredAt: "2026-10-17"
  origin: "radar"
  note: "通过英格兰 Peak District 墓葬牙釉质铅含量，研究重建公元 650–1500 年的童年污染暴露，并发现陪葬品较丰富者通常暴露较低。阶层代理与样本均有局限，不能直接断定早逝女性死因。工业遗址被重熔消失后，人的身体成为经济史档案。"
  status: "candidate"
  imageSourceUrl: "https://www.antiquity.ac.uk/news/2026/ancient-teeth-trace-real-impact-britains-medieval-lead-industry"
  imageSource: "Antiquity Journal / Sheffield Museums Trust"
  imageNote: "报道的墓葬吊坠不直接解释铅暴露；优先原论文牙釉质检测图，不硬凑图片。"
  imageStatus: "none"

- title: "37 个机器人单元自行找到了同一个节拍"
  url: "https://www.birmingham.ac.uk/news/2026/chaos-to-coordination-vibrating-material-organises-itself-into-a-single-rhythm"
  source: "University of Birmingham / Veenstra, Binysh et al."
  radar: "科技与科学 / 鬼集"
  topic: "机械超材料、时间晶体、自组织"
  discoveredAt: "2026-10-17"
  origin: "radar"
  note: "37 单元蜂巢和 24 单元环形主动超材料在非互易相互作用下，从局部振动发展为同步节律。已验证集体周期运动；机器人定向运动仍是设想。无中央控制的协同机制值得关注。"
  status: "candidate"
  imageUrl: "https://www.birmingham.ac.uk/media-library/mech-eng-single-image.xdec6428a.jpg?f=webp&q=80&w=1440"
  imageSourceUrl: "https://www.birmingham.ac.uk/news/2026/chaos-to-coordination-vibrating-material-organises-itself-into-a-single-rhythm"
  imageSource: "University of Birmingham / researchers"
  imageNote: "官方 37 单元蜂巢装置实拍，能说明结构，静态照片不能证明同步；图片授权待核。"
  imageStatus: "verify-rights"

