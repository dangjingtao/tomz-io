- title: "飓风之后城市在卫星夜景里熄灭又亮起：停电恢复第一次有了更细的空间轮廓"
  url: "https://science.nasa.gov/earth/earth-observatory/isaias-dims-the-gulf-coast/"
  source: "NASA Earth Observatory / Black Marble HD / NOAA-20 / Landsat 9"
  radar: "城市、环境与生活方式 / 科技与科学 / 公共服务"
  topic: "灾后恢复、城市电网、夜间遥感、基础设施韧性"
  discoveredAt: "2026-10-18"
  origin: "radar"
  note: "NASA 10 月 16 日展示 2026 年 10 月飓风 Isaias 过后佛罗里达狭长地带的高分辨率夜间灯光：10 月 11 日 Pensacola、Destin 及 98 号公路沿线大片变暗，12 日部分恢复，14 日总体接近灾前。Black Marble HD 使用 NOAA-20 VIIRS 夜间观测并校正月相、云和非电灯光，与 Landsat 9 底图结合。观察问题：从太空看城市恢复，能否让应急资源更早找到仍在黑暗中的街区？但灯光变化不是逐户通电清单，云遮挡、备用电源与光源差异都需要解释；NASA 明确将它作为地面停电报告的补充。"
  status: "candidate"
