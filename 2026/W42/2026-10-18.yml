- title: "鸟才是建筑的拆迁队：100 块会被啄走的砖让城市给巢材留位置"
  url: "https://fedsquare.com/events/design-x-nature-peckable-architecture-at-fed-square"
  source: "Fed Square / Royal Botanic Gardens Victoria / Melbourne Fringe / Bethany Kiss"
  radar: "设计、文化与媒介 / 城市、环境与生活方式 / 鬼集"
  topic: "多物种设计、鸟巢材料、计划性降解、公共艺术、城市生态"
  discoveredAt: "2026-10-18"
  origin: "radar"
  note: "墨尔本 Design X Nature 展览截至 10 月 18 日：Bethany Kiss 与生态学研究者合作，以树皮、细枝、苔藓、木麻黄针叶和有机明胶制成可被鸟啄取的复合砖；项目作者另撰文称在 Federation Square 和皇家植物园共安装 100 块，并用感应相机观察哪些鸟会使用。它的设计逻辑恰好反过来：不是要求公共设施永久完好，而是让非人类使用者逐渐拆解它。要追问鸟是否真的优先取用、材料能否安全降解、何种城市物种受益；目前是实验性装置，不宜宣称生态效果已经证实。"
  status: "candidate"
  imageUrl: "https://d1vlmco8ur52ud.cloudfront.net/08-11-2026-015754-1690.jpg"
  imageSourceUrl: "https://www.melbournefringe.com.au/whats-on/events/design-x-nature-peckable-architecture-at-fed-square"
  imageSource: "Melbourne Fringe / Bethany Kiss"
  imageNote: "作者提供的制作现场照片：地面上摆放干燥中的巢材砖、树皮与苔藓，能直接解释材料与成形方式。官方展览图源由 CloudFront 托管；摄影与再使用许可需核对。"
  imageStatus: "verify-rights"

- title: "用激光先找石棚，再由社区决定如何记录：原住民遗址勘查的技术与权限边界"
  url: "https://australian.museum/about/organisation/media-centre/aboriginal-rock-shelters-discovery/"
  source: "Australian Museum / University of Sydney / Dharug Custodian Aboriginal Corporation"
  radar: "历史与制度 / 科技与科学 / 文化遗产"
  topic: "考古 LiDAR、原住民文化遗产、社区主导、数据保护"
  discoveredAt: "2026-10-18"
  origin: "radar"
  note: "澳大利亚博物馆 10 月 14 日披露，悉尼大学与 Dharug 社群合作用无人机 LiDAR 在蓝山密林识别潜在岩棚，地面核查确认 6 处已登记遗址与 3 处此前未登记的岩棚，含手印岩画和石器；团队也校正了旧遗址登记系统中不精确的坐标。技术只能先筛选，实际文化记录由社区知识持有者参与。切口：遥感提高了发现能力，但敏感地点的坐标、影像和解释权应由谁管理？候选仅保留公开发布的概括，不记录遗址精确位置或未公开影像；官方配图再利用需向博物馆/权利人核权。"
  status: "candidate"
  imageSourceUrl: "https://australian.museum/about/organisation/media-centre/aboriginal-rock-shelters-discovery/"
  imageSource: "Australian Museum / University of Sydney"
  imageNote: "原发布页有研究团队步行实地核验的照片，适合呈现技术与社区协作；图片为悉尼大学提供，未获取可验证的稳定直链，且遗址影像可能有文化敏感性，不硬凑。"
  imageStatus: "none"

- title: "把洪水挡墙写成一座公园的日记：160 万块马赛克记录普通人的一天"
  url: "https://www.rmit.edu.au/news/all-news/2026/oct/good-design-awards26"
  source: "RMIT University / One Day in Our Park / 2026 Australian Good Design Awards"
  radar: "设计、文化与媒介 / 城市、环境与生活方式 / 人的现场"
  topic: "城市防洪、公共艺术、社区叙事、信息设计、基础设施再利用"
  discoveredAt: "2026-10-18"
  origin: "radar"
  note: "RMIT 10 月 15 日公布设计奖案例 One Day in Our Park：一面长 360 米的地铁工程防洪墙，被超过 160 万块马赛克铺成文字公共艺术，收集 45 个社区在同一公园度过一天的微小经历及发生次数，例如在树下默读。获 Built Environment / Installation Design 金奖。这里有一种不以技术炫耀为中心的基础设施再设计：一面必须存在的工程墙如何同时成为邻里记忆载体？需要继续核实故事采集方法、社区参与和长期维护，不因获奖就默认公众认可。"
  status: "candidate"
  imageUrl: "https://www.rmit.edu.au/assets/rmit-images/news/2026/oct/good-design-awards26/gooddesignawards26-image2-1220x732px.jpg"
  imageSourceUrl: "https://www.rmit.edu.au/news/all-news/2026/oct/good-design-awards26"
  imageSource: "RMIT University / One Day in Our Park"
  imageNote: "官方实景图展示墙体上的“BOOKS READ SILENTLY UNDER TREES: 45”等马赛克文字；直接说明防洪设施如何承载社区生活统计，需核实摄影署名与再使用授权。"
  imageStatus: "verify-rights"

- title: "海底的‘意大利面’长出了吸盘：新属发现提醒我们标本馆还有多少未知"
  url: "https://australian.museum/about/organisation/media-centre/deep-sea-spaghetti-worm/"
  source: "Australian Museum / CSIRO / Records of the Australian Museum"
  radar: "鬼集 / 科技与科学 / 生命科学"
  topic: "深海分类学、海山生态、博物馆标本、形态与分子证据"
  discoveredAt: "2026-10-18"
  origin: "radar"
  note: "澳大利亚博物馆 10 月 14 日介绍新建立的多毛类海虫属 Terebellosuctoria：其腹面吸盘状结构可能有助于附着在海山等缺少松软沉积物的环境。研究使用 2021—2022 年远航采集标本，结合形态、DNA 和电镜分析；文章介绍 7 个新种，其中 2 个归入新属。另有一种像分枝生物的采集物，解剖后发现是管栖海虫伸出的复杂管道。它的观察价值不是‘怪虫照片’，而是深海采集和命名之间存在漫长知识积压；生物分类仍需人类耐心辨认与交叉证据。适应功能目前是研究者解释，不是实验证实的因果机制。"
  status: "candidate"
  imageSourceUrl: "https://australian.museum/about/organisation/media-centre/deep-sea-spaghetti-worm/"
  imageSource: "Australian Museum / CSIRO"
  imageNote: "官方稿含新属 Terebellosuctoria jimii 的实物照片与管道样本，版权标记 © CSIRO；未取得稳定原图直链，正式配图前须联系版权方核权。"
  imageStatus: "none"
