- title: "使馆空气监测停报之后，污染竟然回升：公开数据本身可能是一种治理"
  url: "https://news.climate.columbia.edu/2026/10/06/september-research-roundup-select-papers/"
  source: "Columbia Climate School / PNAS (Zhou et al., doi:10.1073/pnas.2605467123)"
  radar: "历史与制度 / 城市、环境与生活方式 / 科学方法"
  topic: "环境信息公开、空气污染、制度问责、卫星遥感"
  discoveredAt: "2026-10-12"
  origin: "radar"
  note: "哥伦比亚气候学院 10 月 6 日介绍一项对 46 座城市的研究：美国使领馆空气质量公开报告在 2025 年暂停后，卫星观测显示这些城市的气溶胶污染估计增加约 33%；研究用停报前监测与卫星数据估计 PM2.5 约增加 1.9 μg/m³，在缺乏其他公开国家级监测系统的地方效应更持久。研究使用对照与预趋势检验，但仍应保留因果识别和不同污染指标的局限。观察问题：公开数据不是治理的附属品，而可能通过被看见与被问责直接改变行为；当监测消失，究竟失去了什么？"
  status: "candidate"
  imageSourceUrl: "https://news.climate.columbia.edu/2026/10/06/september-research-roundup-select-papers/"
  imageSource: "Columbia Climate School / original PNAS study"
  imageNote: "原文配图是马尼拉烟霾通用照片，不能说明停报前后因果；优先寻找原论文 46 城市比较图，未取得可验证的稳定直链，本次不使用装饰性照片。"
  imageStatus: "none"

- title: "同样是极端热浪，1941 年与 2021 年的人为什么死于不同的危险？"
  url: "https://www.nature.com/articles/s43247-026-04055-0"
  source: "Communications Earth & Environment / Simon Fraser University / Columbia Climate School"
  radar: "历史与制度 / 科技与科学 / 人的现场"
  topic: "热浪史、历史报纸、灾害脆弱性、基础设施与社会习惯"
  discoveredAt: "2026-10-12"
  origin: "radar"
  note: "9 月 19 日发表的开放获取研究在 10 月哥伦比亚气候学院研究汇总中重新受到关注。作者检索 25 家报纸的 357 期历史报道，结合气象、河流、农业与死亡资料，对比 1941 与 2021 年北美极端热浪。1941 年热浪虽然绝对温度略低，但对当时气候背景仍极端；研究记录 344 例报道中的直接或间接相关死亡，溺亡在 1941 年更突出，而 2021 年不列颠哥伦比亚省的高温死亡多发生在室内。不同事件的地理覆盖、记录方式和归因口径不完全一致，不能直接比较死亡总数。真正的问题是：灾害伤害的形态并不只由天气决定，也由居住、交通、技术、社会习惯与公共应对共同塑造。"
  status: "candidate"
  imageUrl: "https://media.news.climate.columbia.edu/wp-content/uploads/2026/10/Screenshot-2026-10-05-at-12.41.20-PM-650x563.png"
  imageSourceUrl: "https://news.climate.columbia.edu/2026/10/06/september-research-roundup-select-papers/"
  imageSource: "Columbia Climate School / Anderson & Chartrand (2026)"
  imageNote: "论文相关的 1941 年热浪温度、降水、土壤湿度异常九宫格地图，解释事件跨周演化和历史记录采样位置；用于科学解释而非纯装饰。论文及第三方图表授权为 CC BY-NC-ND 4.0（如无单独 credit），商业刊发、改图前须核实授权。"
  imageStatus: "verify-rights"

- title: "把老咖啡厂改成音乐学校：城市更新能否留下的不只是建筑外壳？"
  url: "https://www.oma.com/projects/flama"
  source: "OMA / FLAMA project / October 8 groundbreaking"
  radar: "设计、文化与媒介 / 城市与公共空间 / 社会与商业"
  topic: "工业遗产、适应性再利用、艺术教育、城市社区"
  discoveredAt: "2026-10-12"
  origin: "radar"
  note: "OMA 10 月 8 日宣布休斯敦 Frank Liu Jr. Academy for Music and Arts 开工：把 1930 年代 J. A. Folger & Co. 咖啡工厂的一部分改造为以音乐和艺术为中心的学校。项目处于施工阶段，不能当成已经运营的社区成效；它同时涉及工业遗产保存、教育空间再分配、社区文化与公办特许学校的制度争议。观察问题：旧厂房被保留后，谁真正获得了新的使用权与教育机会？不能只凭漂亮效果图断言城市更新成功。"
  status: "candidate"
  imageSourceUrl: "https://www.oma.com/projects/flama"
  imageSource: "OMA / Out of RAM (renderings)"
  imageNote: "官方项目页含建筑改造效果图，优先选能同时看见旧厂房构件和新学校空间的图；图片署名 Out of RAM。当前没有确认可稳定直链的官方图片，须回官方项目页取得原图并核实设计事务所/渲染方授权。"
  imageStatus: "verify-rights"

- title: "哈苏相机的快门被拿来开火：Doom 仍是最顽固的硬件通用测试"
  url: "https://github.com/radium-wang/Hasselblad-X-System-CIM-Firmware-Research-Feature-Extensions/blob/main/x2d/doom/README.md"
  source: "radium-wang / independent firmware research (GitHub)"
  radar: "鬼集 / 科技与科学 / 技术史"
  topic: "Doom 移植、相机固件、逆向研究、非预期交互"
  discoveredAt: "2026-10-12"
  origin: "radar"
  note: "独立开发者 Radium Wang 在哈苏第一代 X2D 100C（固件 4.2.0）上探索运行 doomgeneric：此前的实机操作者反馈确认显示游戏画面、全按快门开火、扬声器音效、屏幕滑动转向。公开仓库明确声明当前源码仅完成离线验证，不等于公开版本已再次实机测试；有声版退出后的完整恢复、其他机型和长期稳定性尚未验证，也不是可一键安装的产品。值得看的是相机快门这种专用物理界面被临时改写为游戏控制器，及旧游戏作为硬件开放程度的民间试金石。避免鼓励未经授权的固件修改。"
  status: "candidate"
  imageSourceUrl: "https://github.com/radium-wang/Hasselblad-X-System-CIM-Firmware-Research-Feature-Extensions/blob/main/x2d/doom/README.md"
