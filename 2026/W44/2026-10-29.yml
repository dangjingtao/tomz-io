- title: "阳光吸得越多，电荷越容易消失？一块硫化铋薄膜给出了反例"
  url: "https://www.ox.ac.uk/news/2026-10-28-semiconductor-breakthrough-overcomes-major-challenge-in-capturing-solar-energy"
  source: "University of Oxford / Nature, Delayed electron–hole recombination in a pseudo-direct semiconductor（2026-10-28）"
  radar: "科技与科学 / 能源与材料"
  topic: "硫化铋、太阳能、载流子复合、伪直接带隙、材料物理"
  discoveredAt: "2026-10-29"
  origin: "radar"
  note: "牛津大学与武汉大学合作研究指出：通常强吸光半导体中的电子—空穴更快复合，但硫化铋的相邻能级形成较慢复合的暂时“储库”；超快太赫兹光谱实验与计算相互印证，研究团队估计在室温下较同等吸光强度的常规材料可降低约 75% 复合速率。10 月 28 日 Nature 论文 DOI: https://doi.org/10.1038/s41586-026-11223-x。编辑切口：某些被当成材料设计必然代价的权衡，可能只是我们对能带结构的想象太窄。这里证明的是材料机制而非完成了更高效率的太阳能电池；不得把 75% 写成电池效率提升。"
  status: "candidate"
  imageUrl: "https://assets-oxweb.admin.ox.ac.uk/styles/uncropped_huge/s3/2026-10/Semiconductor%20experiment%201.jpg.avif?itok=QmMFD--n"
  imageSourceUrl: "https://www.ox.ac.uk/news/2026-10-28-semiconductor-breakthrough-overcomes-major-challenge-in-capturing-solar-energy"
  imageSource: "University of Oxford / Laura Herz"
  imageNote: "牛津官方文章标注的非接触光学探测实验设备照片；为研究现场而非硫化铋样品微观图，图片样式 URL 含临时参数，正式排版前核稳定性与转载授权。"
  imageStatus: "verify-rights"

- title: "水下遗产不只是沉船：联合国教科文组织要求衡量谁从保护中受益"
  url: "https://www.unesco.org/en/articles/protection-development-alexandria-declaration-underwater-cultural-heritage"
  source: "UNESCO / Alexandria Declaration on Underwater Cultural Heritage（2026-10-28 公告；2026-08-20 通过）"
  radar: "历史与制度 / 设计、文化与媒介 / 城市、环境与生活方式"
  topic: "水下文化遗产、2001 公约、海洋考古、沿海社区、文化资源治理"
  discoveredAt: "2026-10-29"
  origin: "radar"
  note: "UNESCO 10 月 28 日公布《亚历山大水下文化遗产宣言》专题；宣言实际上于 8 月 20 日在亚历山大图书馆获与会者认可，背景是 2001 年《保护水下文化遗产公约》25 周年。其主张把保护成果的衡量从“保住多少遗迹”延伸到知识、教育、海洋素养、沿海社区受益与可持续发展，同时继续反对盗掘与非法交易。编辑问题：文化遗产的保护权、解释权与收益权如何分配？与《气数》关心的制度能力和史料保存有方法论关联；但宣言不是强制执行的新国际法，也不能把政策愿景写成实际成效。"
  status: "candidate"
  imageUrl: "https://www.unesco.org/sites/default/files/styles/paragraph_medium_desktop/article/2026-10/778551157_1087545700294850_4700435415792550986_n.jpg.webp?itok=EAvq2zU8"
  imageSourceUrl: "https://www.unesco.org/en/articles/protection-development-alexandria-declaration-underwater-cultural-heritage"
  imageSource: "UNESCO / 亚历山大会议现场"
  imageNote: "UNESCO 官方专题的会议现场照片；用于说明宣言与讨论过程，不能误标为水下考古实物。来源署名与再使用条件需正式核验。"
  imageStatus: "verify-rights"

- title: "油、粮、肥料一起涨：世界银行看到的是价格冲击之间的连锁反应"
  url: "https://www.worldbank.org/en/news/press-release/2026/10/28/commodity-markets-outlook-october-2026"
  source: "World Bank / Commodity Markets Outlook October 2026（2026-10-28）"
  radar: "社会与商业 / 历史与制度 / 城市、环境与生活方式"
  topic: "大宗商品、能源、粮食安全、厄尔尼诺、财政缓冲、风险传导"
  discoveredAt: "2026-10-29"
  origin: "radar"
  note: "世界银行 10 月 28 日发布新一期《大宗商品市场展望》：基线预测 2026 年商品价格整体上涨 23%、能源 32%，食品价格 2026—27 两年累计约 18%；特别专题分析市场压力下商品价格波动如何相互传导。报告提出在中东冲突、粮运受阻、厄尔尼诺叠加时风险会放大，并给出更不利情景。值得留给《见π》与《气数》的问题是：国家面对外部冲击时，财政余地、替代供应链与民生保护是否比单一增长数字更重要？这些均为 2026-10-28 时点预测而非已实现涨幅；不能将情景预测当必然结果，正式写作需对照原报告和地区差异。报告原文：https://openknowledge.worldbank.org/bitstreams/b89c473c-d071-4aa4-9f4d-174281aaf0be/download"
  status: "candidate"
  imageSourceUrl: "https://www.worldbank.org/en/news/press-release/2026/10/28/commodity-markets-outlook-october-2026"
  imageSource: "World Bank / Commodity Markets Outlook"
  imageNote: "官方报告提供数据和图表下载入口，尚未核实适合独立引用的稳定图像 URL 与许可；不以通用油井或粮食图库替代数据图。"
