- title: "听见磁层里的波、用业余电台研究电离层：NASA 把公众变成研究网络"
  url: "https://science.nasa.gov/get-involved/citizen-science/nasa-selects-19-new-citizen-science-proposals-in-2026/"
  source: "NASA Science / Citizen Science Seed Funding Program & Science Activation（2026-10-28）"
  radar: "人的现场 / 科技与科学 / 鬼集"
  topic: "公众科学、业余无线电、磁层声化、志愿者天文、研究参与"
  discoveredAt: "2026-10-29"
  origin: "radar"
  note: "NASA 10 月 28 日宣布选中 19 项公众科学提案，其中 12 项来自种子资助、7 项来自科学参与计划；项目包括把磁层等离子体波转换成可供志愿者辨认的声音、阿拉斯加民众部署低成本磁力计、业余无线电爱好者利用电离层信号研究空间天气，以及课堂种植未来太空作物。编辑切口：普通人的耳朵、天线与教室可以成为科研仪器的一部分，公众科学并不只等于帮忙点图片分类。须区分“获得资助的拟议项目”与“已经运行并取得成果”；NASA 页面下方九宫格 Logo 指的是 2026 年已上线的其他项目，不应误配为这 19 项。"
  status: "candidate"
  imageSourceUrl: "https://science.nasa.gov/get-involved/citizen-science/nasa-selects-19-new-citizen-science-proposals-in-2026/"
  imageSource: "NASA Science"
  imageNote: "官方页面唯一九宫格图是其他已上线项目的 Logo 集合，与本次 19 项获选提案不完全对应；避免误导，暂不使用。"
  imageStatus: "none"

- title: "伦敦下水道的考古学：城市怎样把自己的废物变成“看不见的东西”"
  url: "https://www.ucl.ac.uk/social-historical-sciences/events/2026/oct/sewers-monsters-and-modernity-how-waste-made-london"
  source: "UCL Institute of Archaeology / Geneviève Godin 研究讲座（2026-10-28）"
  radar: "鬼集 / 历史与制度 / 城市、环境与生活方式 / 设计、文化与媒介"
  topic: "维多利亚时代伦敦、下水道、城市考古、废物政治、基础设施"
  discoveredAt: "2026-10-29"
  origin: "radar"
  note: "UCL 10 月 28 日讲座《Sewers, Monsters, and Modernity》提出一个反直觉问题：维多利亚时代的新式下水道把污水从街道中持续移走，也可能制造一种“缺席的基础设施”——城市居民不再看见废物，却继续由排放路径、管网与处理制度承担后果。主讲 Geneviève Godin 研究伦敦下水道生态与当代遗产。适合《见π》鬼集或城市制度史短条，和《气数》的基础设施路径依赖方法可对照；目前仅有讲座摘要，尚未取得全文或研究实证，因此先 hold，不能把讲座论点写成已验证的历史因果定论。"
  status: "hold"
  imageSourceUrl: "https://www.ucl.ac.uk/social-historical-sciences/events/2026/oct/sewers-monsters-and-modernity-how-waste-made-london"
  imageSource: "UCL Institute of Archaeology"
  imageNote: "活动页配图为喷水雕塑与管道的意象图，非研究所讨论的伦敦下水道档案；没有可核验的合适实物图片，暂不使用。"
  imageStatus: "none"
