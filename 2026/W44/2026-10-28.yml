- title: "折纸从桌面走到图书馆大厅：平板铝片能拼出承重空间结构"
  url: "https://news.mit.edu/2026/origami-based-construction-method-yields-lightweight-load-bearing-structures-architecture-1027"
  source: "MIT News / Center for Bits and Atoms / International Journal of Solids and Structures（2026-10-27）"
  radar: "科技与科学 / 设计、文化与媒介 / 鬼集"
  topic: "结构折纸、模块化制造、建筑、轻量结构、工艺"
  discoveredAt: "2026-10-28"
  origin: "radar"
  note: "MIT 团队把源于 Ron Resch 的折纸镶嵌结构改为可从平板切割、折叠并螺接的刚性单元，模拟中较部分折纸结构约硬 3.5 倍；23 英尺的铝制 Lexicon 雕塑已在波士顿公共图书馆展示。编辑问题：当建筑构件自带几何约束与装配顺序，设计到施工之间是否可以少一些昂贵的翻译？目前展示的是室内悬挂雕塑，不是通过建筑规范验收的灾后庇护所；性能比较也只针对论文选定基准。"
  status: "candidate"
