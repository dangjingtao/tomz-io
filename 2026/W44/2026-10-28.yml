- title: "无家可归治理不缺口号，缺的是知道哪些干预真的有用"
  url: "https://www.povertyactionlab.org/j-pal-north-america-homelessness-evaluation-resource-hub"
  source: "J-PAL North America / MIT News（2026-10-26，10-27 启动活动）"
  radar: "社会与商业 / 城市、环境与生活方式 / 历史与制度"
  topic: "住房稳定、公共政策、循证治理、随机评估、资源约束"
  discoveredAt: "2026-10-28"
  origin: "radar"
  note: "J-PAL 北美新上线免费的 Homelessness Evaluation Resource Hub，按‘使用已有证据’与‘自己生成证据’组织资源，涉及住房优先、紧急援助、住房法庭法律援助、租房补贴等；10 月 27 日举行上线活动。它不是新的万能救助算法，而是把‘某项措施到底对谁有效’变成公共部门可重复问的问题。编辑切口：政策绩效不应只看发放了多少服务，更要有反事实比较、伦理边界和基层执行成本。不要把旧有评估综述说成这周刚做出的实验，也不能直接把北美结论外推别国。"
  status: "candidate"
  imageSourceUrl: "https://www.povertyactionlab.org/j-pal-north-america-homelessness-evaluation-resource-hub"
  imageSource: "J-PAL North America"
  imageNote: "官方页面主图为 Shutterstock 素材，非受助者真实项目现场；不使用。可在正式编辑时选择有授权的评估流程图或自行绘制示意图。"
  imageStatus: "none"

- title: "万圣节前重看‘猎巫’：当年的审判文书今天成了地方公共史"
  url: "https://www.suffolk.gov.uk/council-and-democracy/council-news/discover-suffolks-dark-legacy-in-landmark-witchcraft-exhibition"
  source: "Suffolk County Council / Suffolk Archives（2026-09-11 公告，10-16 开展）"
  radar: "历史与制度 / 设计、文化与媒介 / 人的现场"
  topic: "1645—1647 英格兰猎巫、宗教与战争、档案展览、女性形象、公共记忆"
  discoveredAt: "2026-10-28"
  origin: "radar"
  note: "为什么是这一周：万圣节临近，萨福克档案馆 10 月 16 日开幕的《Witches: Suffolk's Dark Legacy》正展出英国图书馆借展的《女巫之槌》、詹姆士一世《恶魔学》和猎巫者 Matthew Hopkins 著作，讨论 1645—1647 年当地近 200 人遭指控的恐惧、宗教冲突与社会压力。编辑切口不是借节日消费恐怖奇观，而是考察恐慌如何被文本、司法与权威共同制度化，以及今天展览怎样重新解释普通人的遭遇。展方‘近 200 人’指被指控者，不能写成被处死人数；若做人物稿，Hopkins 也不能被写成无争议的独角主角。"
  status: "candidate"
  imageUrl: "https://www.suffolk.gov.uk/image-library/matthew-hopkins-a-discovery-of-witches.xcea5cbc5.jpg?format=webp&height=1402&quality=75&width=1000"
  imageSourceUrl: "https://www.suffolk.gov.uk/council-and-democracy/council-news/discover-suffolks-dark-legacy-in-landmark-witchcraft-exhibition"
  imageSource: "Suffolk Archives / Matthew Hopkins《A Discovery of Witches》历史版画（经 Suffolk County Council）"
  imageNote: "官方页面展示 Hopkins 猎巫图像的历史书籍版画；须核实原始馆藏、摄影数字化权利和允许的再使用条件，不能仅因原作年代久远就默认网页扫描件可自由复用。"
  imageStatus: "verify-rights"

- title: "当 AI 声称推翻 ETH：一个形式化证明如何进入学术公共审查"
  url: "https://openai.com/index/building-scientific-understanding-with-academic-communities/"
  source: "OpenAI Research（2026-10-26）/ openai/math 公开证明材料"
  radar: "科技与科学 / 科学方法 / 开发工具"
  topic: "指数时间假设、Lean 形式化、数学证明、学术审查、AI 科学发现"
  discoveredAt: "2026-10-28"
  origin: "radar"
  note: "OpenAI 10 月 26 日宣称模型给出了指数时间假设 ETH 的反证，并公布自然语言证明和 Lean 形式化材料；由 ETH 提出者 Russell Impagliazzo、Ramamohan Paturi 与 Ryan Williams 牵头组织外部公开审查。同期还宣布全维局部平滑猜想与四维量子场论相关结果，披露策略不同。这里应记录的是一项极其重大的待验证主张及其验证制度：机器可生成、形式系统可检查，与学界真正理解、独立复核、界定假设之间仍有距离。不能将企业声明写成已获学界共识，也不等于解决 P vs NP 或产生实用的 SAT 快算法；后续以外部专家结论更新此条，避免同事件重复入库。"
  status: "hold"
  imageSourceUrl: "https://openai.com/index/building-scientific-understanding-with-academic-communities/"
  imageSource: "OpenAI Research"
  imageNote: "官方页面以品牌视觉为主，缺乏解释 ETH 与证明审查机制的可靠配图；暂不使用，后续可用明确标注为二次制作的验证流程示意。"
  imageStatus: "none"

