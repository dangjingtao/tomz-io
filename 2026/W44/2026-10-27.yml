- title: "今天是世界视听遗产日：摩加迪沙电台的四万五千卷磁带，究竟是谁的历史？"
  url: "https://www.unesco.org/en/articles/world-day-audiovisual-heritage-protecting-memory-risk"
  source: "UNESCO / Memory of the World Programme（2026-10-20；世界视听遗产日 10-27）"
  radar: "历史与制度 / 设计、文化与媒介 / 人的现场"
  topic: "索马里、Radio Mogadishu、声音档案、历史记忆、数字保存"
  discoveredAt: "2026-10-27"
  origin: "radar"
  note: "为什么是今天：10 月 27 日是世界视听遗产日。UNESCO 2026 年专题指出，摩加迪沙电台约 45,000 卷模拟磁带记录索马里人的日常、语言、音乐、新闻和政治记忆，正推进保存与数字化；赞比亚广播档案也面临自然灾害、载体老化与格式淘汰。编辑问题不是又一项扫描工程，而是谁有能力保存、解释并重新听见一国普通人的声音。档案数字化不等于已向公众开放；不要把保存计划写成全部完成。与《气数》关注的制度史、史料存续问题可互相参照。"
  status: "candidate"
  imageSourceUrl: "https://www.unesco.org/en/articles/world-day-audiovisual-heritage-protecting-memory-risk"
  imageSource: "UNESCO / Eric Hammarström, Svenskt visarkivs（专题主图为瑞典档案照片）"
  imageNote: "UNESCO 专题主图并非摩加迪沙电台实物；不宜误当索马里现场图。正式选用时应优先寻找 Radio Mogadishu 官方档案或 UNESCO 项目照片并核对授权。"
  imageStatus: "none"

- title: "从赏红叶到读懂植物压力：NASA 把秋色做成全球光谱时间序列"
  url: "https://science.nasa.gov/earth/earth-observatory/hunting-red-leaves-with-satellites/"
  source: "NASA Earth Observatory / PACE OCI / GLOBE（2026-10-26）"
  radar: "科技与科学 / 城市、环境与生活方式 / 设计、文化与媒介"
  topic: "秋色、PACE、超光谱、物候、公众科学、地面验证"
  discoveredAt: "2026-10-27"
  origin: "radar"
  note: "NASA 10 月 26 日发布 PACE OCI 286 波段观测绘制的 2026 年全球植被红色素变化图，把日本传统赏枫、北美观叶旅行与可重复的全球物候观测联系起来。PACE 可以每一两天重访并追踪花青素、类胡萝卜素与叶绿素，公众上传地面照片帮助校准；但地图上的红色也可能来自农作物成熟或胁迫，不等于处处秋叶。编辑切口：当一种季节审美变成可测量的地球信号，我们多理解了什么，又丢掉了什么？与 10-26 厄尔尼诺卫星记录不是同一研究或图像。"
  status: "candidate"
  imageUrl: "https://assets.science.nasa.gov/dynamicimage/assets/science/esd/eo/images/iotd/2026/red-leaf-hunting-/fallfoliagephenology_pace_20261004.jpg"
  imageSourceUrl: "https://science.nasa.gov/earth/earth-observatory/hunting-red-leaves-with-satellites/"
  imageSource: "NASA Earth Observatory / Lauren Dauphin / PACE OCI"
  imageNote: "官方 2026-09-29 至 10-04 全球植被红绿比图；标注色标含义与数据来源，注意红色素信号不能简单等同秋叶景观；使用前核 NASA 图像与第三方数据署名。"
  imageStatus: "verify-rights"

- title: "宇宙的黑暗时代被放进一场模拟：Lumina 让两次再电离出现在同一幅计算图里"
  url: "https://news.mit.edu/2026/watch-universe-emerge-from-dark-ages-with-lumina-1026"
  source: "MIT News / Lumina collaboration / MNRAS（2026-10-26）"
  radar: "科技与科学 / 计算与可视化"
  topic: "早期宇宙、氢氦再电离、超级计算、模拟与观测"
  discoveredAt: "2026-10-27"
  origin: "radar"
  note: "MIT、哈佛等团队 10 月 26 日发布 Lumina：在约 500 Mpc 的宇宙体积里追踪最初 20 亿年的暗物质、气体、恒星与辐射，模型同时覆盖氢与氦再电离；在 Frontier 超算上使用极大规模计算资源。它为后续望远镜观测提供可比较的预测，而不是‘拍到宇宙出生录像’。编辑问题：当历史无法直接重放，科学如何用计算把不同尺度和物理过程接起来，并用真实观测约束模拟？图片为模型可视化，不是望远镜实拍。"
  status: "candidate"
  imageUrl: "https://news.mit.edu/sites/default/files/download/202610/MIT-Lumina-01-press.jpg"
  imageSourceUrl: "https://news.mit.edu/2026/watch-universe-emerge-from-dark-ages-with-lumina-1026"
  imageSource: "Lumina collaboration / MIT News"
  imageNote: "四联模拟可视化对应暗物质、气体、氦与氢再电离；MIT News 标注 CC BY-NC-ND，非商业使用、署名且不可改作（仅允许按尺寸裁剪）；商业发布须另核授权。"
  imageStatus: "verify-rights"

- title: "保护区不是地图上的百分比：六千多个地点揭示生态网络缺的可能是‘连线’"
  url: "https://doi.org/10.1038/s41559-026-03222-y"
  source: "Nature Ecology & Evolution / Roshan Sharma et al. / Monash University（2026-10-26/27）"
  radar: "城市、环境与生活方式 / 历史与制度 / 科学方法"
  topic: "30×30 生物多样性目标、OECM、生态廊道、保护区网络"
  discoveredAt: "2026-10-27"
  origin: "radar"
  note: "Monash 参与的 Nature Ecology & Evolution 研究分析 14 国 6,234 个其他有效区域保护措施（OECM）地点：约 27% 与正式保护区相邻，约 67% 在附近，但仅约 2% 真正桥接原本隔离的保护区；把它们纳入网络后，一些孤立保护区可合并为更大簇。编辑切口：2030 年保护 30% 陆海目标若只看面积，会不会奖励许多互不连通的‘绿色孤岛’？这是基于样本和空间邻接关系的分析，不等于实测所有物种迁移效果；原论文 DOI 一手入口，新闻稿来自研究机构。"
  status: "candidate"
  imageSourceUrl: "https://doi.org/10.1038/s41559-026-03222-y"
  imageSource: "Nature Ecology & Evolution / Monash University"
  imageNote: "原论文图表的版权及稳定图片直链尚未核验；二手报道使用通用风景图库，不采用。"
  imageStatus: "none"

- title: "一条边能打出任何结：数学家把‘简单结构藏着无限复杂’变成构造方法"
  url: "https://www.monash.edu/science/news-events/news/2026/a-single-edge-can-tie-any-knot%2C-mathematicians-find"
  source: "Monash University / University of Sydney / Journal of Combinatorial Theory A（2026-10-21）"
  radar: "鬼集 / 科技与科学 / 设计、文化与媒介"
  topic: "纽结理论、三维拓扑、四面体剖分、可计算构造"
  discoveredAt: "2026-10-27"
  origin: "radar"
  note: "Monash 与悉尼大学团队上周公开一项构造性结果：把四面体拼接成三维球面时，单独一条边就能按指定方式构成任意复杂的结；研究不仅证明存在性，还提供从纽结图构造相应剖分的方法。这个结果怪得可爱：‘一条边’不是一段直线的普通几何直觉，而是三维拓扑剖分中的边。可作为鬼集短条，避免夸大为直接工程应用。"
  status: "candidate"
  imageSourceUrl: "https://www.monash.edu/science/news-events/news/2026/a-single-edge-can-tie-any-knot%2C-mathematicians-find"
  imageSource: "François Guéritaud / Saul Schleimer / Henry Segerman via Wikimedia Commons（Monash 页面图）"
  imageNote: "Monash 页面展示 figure-eight knot complement，注明改编自 CC BY-SA 3.0 图；图并非研究新构造的直接证明，引用需标原作者、许可与改动，正式排版前核对图像原链。"
  imageStatus: "verify-rights"
