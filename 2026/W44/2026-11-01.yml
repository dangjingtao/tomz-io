  note: "今天11月1日，Museums of History NSW组织Sydney Open，让公众在10:00—17:00参观平时难以进入的建筑与空间；主办方称2026年覆盖悉尼CBD四十多处地点，1997年以来累计开放过550多座建筑。编辑切口：一座城市的建筑不只是街道上看得见的立面，谁有权进入、理解和使用其内部空间，也是城市公共史的一部分。活动门票收费，不能说所有场所免费或全部对公众永久开放；今日活动尚在进行，不预设现场参与人数或访客评价。与本周Hirshhorn长期改造条目不同，这是一日临时开放与公共接近权的观察。"
