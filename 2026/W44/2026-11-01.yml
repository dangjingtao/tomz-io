- title: "当沉浸式展览用手语讲述：Es Devlin 的光、语言与空间怎样被不同观众进入"
  url: "https://beta.designmuseum.org/whats-on/talks-courses-and-workshops/bsl-tour-of-es-devlin-other-worlds"
  source: "London Design Museum / Es Devlin: Other Worlds 英国手语导览（2026-10-30）"
  radar: "设计、文化与媒介 / 人的现场 / 人物与传记"
  topic: "Es Devlin、展览无障碍、英国手语、舞台设计、创作档案、文化可及性"
  discoveredAt: "2026-11-01"
  origin: "radar"
  note: "为什么是这位创作者、这一周：伦敦设计博物馆10月30日专门安排Edward Richards带领英国手语导览，解读Es Devlin三十年横跨舞台、雕塑、语言与光的创作；回顾展于10月2日开幕，展出其伦敦工作室复刻、早期笔记及‘30-Year Desk’。编辑切口不是再写名人履历，而是当一场以语言、空间和视觉沉浸为媒介的展览面向聋人观众时，策展‘体验’需要怎样翻译？官网确认了导览安排与无障碍信息，不能据此推断所有展品都已完全无障碍，也不能把活动已举行等同于观众评价。人物雷达本周已有Mayer Hillman与Graça Machel，本条仅作为设计现场与人物事件续补，不要求再占人物栏目名额。"
  status: "candidate"
