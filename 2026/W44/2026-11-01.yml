- title: "沙漠曾有湖泊，人却没有留下来：石器原料改写了早期迁徙地图"
  url: "https://www.nature.com/articles/s41586-026-11180-5"
  source: "Nature 原始研究《Stone and water governed early human settlement of the desert》（2026-10-28，DOI 10.1038/s41586-026-11180-5）"
  radar: "历史与制度 / 科技与科学 / 考古与方法"
  topic: "阿拉伯半岛、鲁卜哈利沙漠、旧石器时代、石器原料、古湖泊、人类迁徙模型"
  discoveredAt: "2026-11-01"
  origin: "radar"
  note: "研究者沿鲁卜哈利沙漠约1500公里样带调查125处地点，55处发现古湖泊沉积，但未发现可打制石料或石器遗存；在研究覆盖的半岛水源可达区域中，约57%缺少适合打制石器的地质材料。加入石料变量后，已知遗址位置模型的AUC由0.695提高至0.768。编辑切口：人类迁徙史为什么不能只画气候和水源地图？工具所需材料也可能限制可居住空间。这是基于现有考古可见性与地质模型的推断，‘未找到石器’不能直接证明从未有人经过；不能把研究写成水不重要，也不把古代资源约束直接类比现代国家命运。与《气数》的资源、技术与选择空间研究路径可互相启发。"
  status: "candidate"
  imageUrl: "https://media.springernature.com/lw685/springer-static/image/art%3A10.1038%2Fs41586-026-11180-5/MediaObjects/41586_2026_11180_Fig2_HTML.png"
  imageSourceUrl: "https://www.nature.com/articles/s41586-026-11180-5"
  imageSource: "Nature / Dellmour、Coco、Samawi 等（论文图2）"
  imageNote: "半岛石料与水源共同约束的人类占据潜力地图及统计验证图，适合作为证据图而非沙漠风景照。论文正文采用 CC BY 4.0，第三方材料以图注为准；使用须署作者、来源、许可证及改动，图中文字和图例不可误读。"
  imageStatus: "verify-rights"

- title: "一座超大城市每年只收850万美元房产税：卡拉奇怎样给自己的公共服务筹钱？"
  url: "https://www.worldbank.org/en/news/press-release/2026/10/30/pakistan-new-world-bank-program-to-strengthen-municipal-revenues-and-services-in-s"
  source: "World Bank Group / Sindh Property Revenues Enhancement Program（2026-10-30）"
  radar: "历史与制度 / 社会与商业 / 城市、环境与生活方式"
  topic: "卡拉奇、城市财政、房产税、地方自治、公共服务、财政转移支付"
  discoveredAt: "2026-11-01"
  origin: "radar"
  note: "世界银行10月30日批准向巴基斯坦信德省提供1.5亿美元融资，以改进城市不动产税征管与公共服务。官方称卡拉奇目前每年仅收约850万美元房产税，计划提高到8500万美元，税收遵从率目标由20%至50%；参与地方议会约70%的征收收入拟再投入基础设施，覆盖卡拉奇25个地方议会、约358万人。编辑问题：一座城市的建设能力来自新项目拨款，还是能否持续向本地筹资、向居民解释税收回报？注意融资已获批、改革和增收尚未实现；跨城市税收比较须核税基、权限与汇率。与《气数》的财政国家能力研究可作机制对照，但不预设任何国家治理结论。与本周福州城市更新条目不同，本条聚焦地方财政的可持续性。"
  status: "candidate"
  imageUrl: ""
  imageSourceUrl: "https://www.worldbank.org/en/news/press-release/2026/10/30/pakistan-new-world-bank-program-to-strengthen-municipal-revenues-and-services-in-s"
  imageSource: "World Bank Group / Sindh PREP 官方公告"
  imageNote: "尚未确认与本次批准项目直接相关且授权清楚的原始图片；避免使用泛用卡拉奇天际线充当税收改革实施实景。若入选优先找项目原始图表或当地公共设施的可核权照片。"
  imageStatus: "none"

- title: "气候危机首先是一场健康账：热致死亡上升，清洁能源却也正在救命"
  url: "https://lancetcountdown.org/2026-report/"
  source: "Lancet Countdown 2026 全球报告 / WHO 解读（2026-10-28）"
  radar: "科技与科学 / 城市、环境与生活方式 / 社会与商业 / 人的现场"
  topic: "气候变化与健康、热致死亡、公共卫生、清洁能源、COP31、健康适应"
  discoveredAt: "2026-11-01"
  origin: "radar"
  note: "2026 Lancet Countdown由71个合作机构的146位专家编制，监测54项气候与健康指标；WHO10月28日指出，巴黎协定生效后十年的年均热相关死亡数比此前十年高近36%，模型估算2023年全球约71万例热相关死亡；与此同时，2025年清洁能源投资约2.1万亿美元，减少化石燃料空气污染也有健康收益。编辑切口：气候政策若从电力和排放转到医院、街道、工地和老人身体上，哪些取舍会改变？注意热致死亡为模型估算，非逐例核实死亡登记；时期对比不能直接归因于单一政策；清洁能源投资与实际健康收益不能简单画等号。与本周厄尔尼诺遥感候选不重复，重点是健康指标与适应政策。"
  status: "candidate"
  imageUrl: ""
  imageSourceUrl: "https://lancetcountdown.org/2026-report/"
  imageSource: "Lancet Countdown / WHO 官方报告与数据门户"
  imageNote: "报告页面的摄影和宣传视觉存在独立署名或非商业许可，暂不复制；如正式使用优先核对数据门户可导出图表的具体授权与指标口径。"
  imageStatus: "none"

- title: "一颗按键一颗 RISC-V：有人把键盘拆成可以任意拼接的电子积木"
  url: "https://github.com/notaroomba/keybytes"
  source: "notaroomba/keybytes 原作者 GitHub 仓库与项目日志（2026-10-25 前后公开演示）"
  radar: "鬼集 / 硬件与开发工具 / 设计、文化与媒介 / 人的现场"
  topic: "Keybytes、模块化键盘、CH32V003、RISC-V、磁吸、pogo pins、开源硬件"
  discoveredAt: "2026-11-01"
  origin: "radar"
  note: "Nathan Alspaugh的Keybytes让每个19.05毫米的Keybit按键拥有CH32V003 RISC-V微控制器，四边pogo pins传输电源与I2C，磁吸外壳使按键重排；Keyword主控集成STM32WB55、蓝牙、USB-C与固件存储。仓库提供KiCad电路、CAD外壳和演示，MIT许可。鬼集切口：为了让布局彻底自由，能把一件日常工具拆到多细、付出多少工程复杂性？演示证明小规模模块工作，不等于已验证大键盘的延迟、连接稳定性和量产成本；作者估计约900美元的全尺寸方案是当前原型成本而非售价。避免把个人开源实验误写成商业产品。"
  status: "candidate"
  imageUrl: "https://raw.githubusercontent.com/notaroomba/keybytes/main/assets/keybytes.jpg"
  imageSourceUrl: "https://github.com/notaroomba/keybytes"
  imageSource: "Nathan Alspaugh / notaroomba GitHub 原作者实物照片"
  imageNote: "仓库README直接引用的Keybytes模块实物照片，非第三方商品渲染；仓库代码标示MIT许可，但图片单独授权范围未明确，正式刊发前向作者核实摄影权与署名要求。"
  imageStatus: "verify-rights"

- title: "城市最值得看的房间，平时不让你进：悉尼一天打开四十多扇门"
