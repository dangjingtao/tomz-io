- title: "Cloud Mail：用 Cloudflare Workers 搭一套自己的域名邮箱"
  url: "https://github.com/maillab/cloud-mail"
  source: "maillab/cloud-mail GitHub main README 与 wrangler 配置；HelloGitHub 第119期曾收录"
  radar: "开源项目 / Web / 开发工具 / 基础设施"
  topic: "Cloudflare、Email Routing、邮箱服务、Hono、D1、KV、R2、Resend、自托管"
  discoveredAt: "2026-11-01"
  origin: "discussion"
  note: "Tomz 推荐的低服务器成本项目。源码说明 Worker 后端配 Vue3/Element Plus 前端，结合 Cloudflare Email、D1/KV/R2、Resend/CF 发信能力，提供多地址、邮件附件、API、转发与管理。不是 Cloudflare 免费提供完整通用 SMTP 服务器，也不意味着所有功能零成本；发信服务与域名、额度和配额须核实。它已被 HelloGitHub 第119期介绍，故不是首次发现。建议短篇开源项目精选，若考虑实际托管需额外核查邮件隐私、管理员权限、反滥用和投递安全；暂不写成已通过安全审计的生产替代方案。"
  status: "candidate"
