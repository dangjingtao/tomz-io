- title: "世界时间不再加减闰秒：国际计量大会把 UTC 的连续运行提前到 2027 年"
  url: "https://www.bipm.org/en/cgpm-2026/resolution-5"
  source: "BIPM / 第28届国际计量大会 2026 年第5号决议（2026-10-15）；英国 NPL 同日技术说明"
  radar: "科技与科学 / 历史与制度 / 工程基础设施"
  topic: "协调世界时、UTC、闰秒、负闰秒、地球自转、UT1、原子时、分布式系统"
  discoveredAt: "2026-11-01"
  origin: "discussion"
  note: "Tomz 主动推荐 BIPM 一手决议。第5号决议明确 continuous UTC 从 2027-05-20 生效，将 |UT1-UTC| 许可上限放宽到3600秒，以避免未来数世纪反复插入或删除闰秒；不是2027年把全球时钟拨动一小时，更不是2026年立刻完成切换。2025年专家会议估计至2035年前发生负闰秒的概率约30%，系统风险涵盖电信、电网、交通、导航和时间同步。编辑切口：人类为了地球自转而调整钟表，现在为了维持全球软件与基础设施的一致性，决定让UTC不再紧追地球。建议科学制度短文或独立深读，必须区分已通过的决议、未来生效日期及ITU广播系统后续过渡。不要与同届关于重定义秒的第4号决议混淆。"
  status: "candidate"

