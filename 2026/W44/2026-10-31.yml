- title: "一间不能出借的孔雀厅，准备在虚拟现实里旅行"
  url: "https://www.si.edu/newsdesk/releases/virtual-reality-experience-brings-iconic-peacock-room-life-smithsonians-national"
  source: "Smithsonian National Museum of Asian Art（2026-10-29）"
  radar: "设计、文化与媒介 / 历史与制度 / 鬼集"
  topic: "孔雀厅、James McNeill Whistler、文化遗产数字化、VR、馆藏遗赠限制、艺术家与赞助人冲突"
  discoveredAt: "2026-10-31"
  origin: "radar"
  note: "史密森尼亚洲艺术博物馆10月29日宣布《A Gorgeous Surprise: The Peacock Room in VR》，拟于2027年2月12日开放，配合孔雀厅150周年与Whistler回顾展。孔雀厅是画家现存唯一完整室内作品，因Freer遗赠条款原作不得外借；VR让参观者走进不同历史阶段的室内、观看瓷器与墙饰、听画家和资助人Leyland争执的故事。编辑问题：当文物因法律和物理原因不能旅行，数字副本是在扩大公共接近权，还是在创造另一件需要独立审视的作品？这是计划中的展示，不是已上线的在线VR；目前官方仅说未来将向伙伴机构及网络提供，不能宣称已经可用。"
  status: "candidate"
  imageUrl: "https://asia.si.edu/interactives/symbols/assets/Architectural%20Element-38eb416d.jpg"
  imageSourceUrl: "https://asia.si.edu/interactives/symbols/peacock/harmony-in-blue-and-gold-the-peacock-room/index.html"
  imageSource: "Smithsonian National Museum of Asian Art / Peacock Room官方馆藏展示"
  imageNote: "孔雀厅内部与双孔雀墙饰的馆方现有实景图，不是2027年VR界面截图；来源可追溯，图像数字版权及再使用许可尚待馆方核实。"
  imageStatus: "verify-rights"

- title: "六万年前的红色颜料里藏着羚羊：考古学开始读取肉眼看不见的遗物"
  url: "https://www.kyushu-u.ac.jp/en/researches/view/436"
  source: "九州大学 / 卑尔根大学 / Proceedings of the Royal Society B（2026-10-21，DOI 10.1098/rspb.2025.3300）"
  radar: "科技与科学 / 历史与制度 / 鬼集"
  topic: "古蛋白质组学、赭石、南非Klipdrift、伊兰羚羊、早期智人、考古证据边界"
  discoveredAt: "2026-10-31"
  origin: "radar"
  note: "研究团队从南非Klipdrift约6万年前富含赭石的考古沉积层中检出伊兰羚羊I型胶原蛋白；质谱和数据库比对使已不见形状的动物材料重新进入史料。两种竞争解释仍并存：人们将动物材料与颜料混合，或现场曾有经赭石处理的兽皮。不能写成已证实的史前化妆品、绘画配方或宗教仪式；英文大学通稿概称6万年前，日文页面约6.4万年前，精确年代需回论文核对。它与《气数》的史料方法可对照：保存下来的不一定是肉眼看得见的物件。"
  status: "candidate"
  imageUrl: ""
  imageSourceUrl: "https://www.kyushu-u.ac.jp/en/researches/view/436"
  imageSource: "九州大学 / Takumi Tsutaya（实验室照片）；Ole F. Unhammer / University of Bergen（遗址照片）"
  imageNote: "大学原始通稿有第一作者Zahra Haghighi制样照片、遗址照片和羚羊插图，未验证可复用的稳定原图URL；摄影署名明确但许可未明，不下载。"
  imageStatus: "none"

- title: "疟疾疫苗便宜四成，不是因为技术奇迹，而是采购与产能重新谈判"
  url: "https://www.unicef.org/press-releases/gavi-and-unicef-secure-lower-malaria-vaccine-price-saving-us50-million-childhood"
  source: "UNICEF / Gavi / IFFIm联合公告（2026-10-22）"
  radar: "社会与商业 / 科技与科学 / 人的现场"
  topic: "疟疾疫苗、RTS,S/AS01、国际公共采购、预付款融资、疫苗可及性、生产转移"
  discoveredAt: "2026-10-31"
  origin: "radar"
  note: "UNICEF与Gavi在10月22日宣布：借助IFFIm预付款安排，RTS,S/AS01疟疾疫苗预期价格降约40%至每剂5.50欧元，估计2027—2029年可节省约5000万美元，理论上可支持最多100万名儿童完成四剂接种或扩充其他疫苗采购。生效预计在2027年初，仍以制造与监管里程碑（包括新工厂WHO预认证）为条件。编辑切口：医学突破之外，融资结构、制造转移和大宗采购怎样决定技术能否真正到达儿童？省钱与多接种人数均是预期而非已经实现的成果，不能把疫苗有效率与价格降幅混淆。"
