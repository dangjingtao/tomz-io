- title: "把美术馆围墙打开：杉本博司用一条旧地下通道重连城市与雕塑"
  url: "https://www.si.edu/newsdesk/releases/hirshhorn-sculpture-garden-reopens-national-mall"
  source: "Smithsonian Institution / Hirshhorn Museum（2026-10-29公告；计划10-31开放）"
  radar: "设计、文化与媒介 / 城市、环境与生活方式 / 人的现场"
  topic: "Hirshhorn、Hiroshi Sugimoto、雕塑花园、公共空间、无障碍、存量改造"
  discoveredAt: "2026-10-31"
  origin: "radar"
  note: "华盛顿Hirshhorn雕塑花园计划10月31日历经四年改造后重新开放：入口由2处增至5处，恢复自20世纪80年代关闭的地下通道，展出作品由约35件增至近60件；杉本博司在尊重1974年Gordon Bunshaft设计的同时加入反射通道、可用作表演的水池和石墙。编辑切口不是‘著名建筑师又造了花园’，而是修复城市公共文化空间时，进入权、流线、可停留性与历史遗产如何被重新谈判。馆方数据为开幕前公告，尚不能推断实际客流、可达性或居民评价；美国当地10月31日开幕活动未在采集时点结束。"
  status: "candidate"
  imageUrl: ""
  imageSourceUrl: "https://www.si.edu/newsdesk/releases/hirshhorn-sculpture-garden-reopens-national-mall"
  imageSource: "Smithsonian / Hirshhorn（Rick Coulby等馆方摄影）"
  imageNote: "官方公告有改造后雕塑花园照片及署名，但未核验稳定可直接引用的原图URL；旧园照片与施工渲染图不可误充10月31日开放实景，正式使用前核权。"
