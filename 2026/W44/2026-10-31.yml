- title: "世界城市日落在福州：城市更新之后，原来的居民还能住得起吗？"
  url: "https://unhabitat.org/news/22-oct-2026/world-cities-day-2026-to-explore-how-urban-regeneration-can-advance-adequate"
  source: "UN-Habitat（2026-10-22）/ 联合国世界城市日官方页面（2026-10-31）"
  radar: "城市、环境与生活方式 / 历史与制度 / 社会与商业 / 人的现场"
  topic: "世界城市日、福州、城市更新、住房可负担性、原住居民、绅士化、公共空间"
  discoveredAt: "2026-10-31"
  origin: "radar"
  note: "10月31日世界城市日全球活动在福州举行，2026主题为“Regenerating the City: Adequate Housing for All”；UN-Habitat特别指出更新后的公共空间与服务可能伴随租金上涨，导致本应受益的原居民被迫迁离。官方称全球至多34亿人缺乏适足住房，其中逾11亿人住在非正规住区或贫民窟；数据须回溯原始口径，不能直接当作2026年福州本地住房状况。编辑切口：城市更新的评价应看修了多少楼，还是看原来的人能否继续住下去？活动10月31日至11月2日，现阶段仅是议程与倡议，不把会议宣示写成政策落地；与《气数》的城市治理和财政能力问题相连，但不套用历史类比。"
  status: "candidate"
  imageUrl: ""
  imageSourceUrl: "https://www.unesco.org/en/sustainable-cities/world-cities-day-2026"
  imageSource: "UNESCO / World Cities Day 2026"
  imageNote: "UNESCO活动页主图注明Shutterstock/Norbert9，为商业图库且非福州更新项目实景；不取图。后续如入选应寻福州实地更新案例及明确授权的实景照片。"
