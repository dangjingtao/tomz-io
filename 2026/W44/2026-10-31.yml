- title: "格拉萨·马谢尔报告三十年：儿童保护制度越完善，为什么战争中的儿童仍越来越危险？"
  url: "https://www.unicef.org/press-releases/30-years-protecting-children-affected-armed-conflict-commitment-impact"
  source: "UNICEF执行主任在联合国安理会的发言（2026-10-26）；Graça Machel 1996年《Impact of Armed Conflict on Children》"
  radar: "人物与传记 / 历史与制度 / 人的现场"
  topic: "Graça Machel、儿童与武装冲突、联合国监督机制、制度成效与失效、战争中的儿童"
  discoveredAt: "2026-10-31"
  origin: "radar"
  note: "为什么是这个人：Graça Machel于1996年向联合国提交关于武装冲突对儿童影响的里程碑报告，推动将儿童从战争的附带受害者转变为国际和平与安全议程的独立保护对象。为什么是这一周：10月26日联合国安理会纪念该报告30周年，UNICEF指出30年来已签署40余项行动计划、超过22万儿童从武装团体或军队中获释，但2025年经联合国核实的严重侵害儿童事件超过3.8万起。编辑问题是制度建立与现实恶化如何同时发生；须区分核实事件数量、真实发生总量、战区变化与监督覆盖率，不能据单年数字直接证明制度完全失效。与本周10月26日Mayer Hillman人物候选不同，人物与当周安理会事件形成独立关联；如编辑阶段认为人物篇幅重复可标记回看/skip，而不是强制入选。"
  status: "candidate"
  imageUrl: ""
  imageSourceUrl: "https://www.unicef.org/press-releases/30-years-protecting-children-affected-armed-conflict-commitment-impact"
  imageSource: "UNICEF / 联合国安理会发言档案"
  imageNote: "UNICEF官方发言配图并非Graça Machel本人肖像，不能误配；如需人物照片，应回UN Photo或原报告档案核对摄影师与再利用许可。"
  imageStatus: "none"
