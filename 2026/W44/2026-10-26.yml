- title: "威斯敏斯特教堂开始请原住民共同讲述自己的纪念碑"
  url: "https://www.westminster-abbey.org/abbey-news/new-book-explores-indigenous-histories-at-westminster-abbey"
  source: "Westminster Abbey Public History Research（2026-10-23）/ Scala Arts & Heritage"
  radar: "历史与制度 / 设计、文化与媒介 / 社会与商业"
  topic: "公共历史、殖民纪念物、原住民叙事、宗教空间、档案再解释"
  discoveredAt: "2026-10-26"
  origin: "radar"
  note: "威斯敏斯特教堂 10 月 23 日公布其公共历史研究首部成果《Indigenous Histories at Westminster Abbey》，出版日期为 10 月 29 日。书中从美国、加拿大、澳大利亚、新西兰、南非原住民视角重新审视与殖民移民社会有关的 80 多处墓葬、纪念碑及物件，五十多位不同背景贡献者参与。观察问题：纪念碑并非静止的权威文本，当被纪念者之外的人有机会重新讲述，它的公共含义如何变化？这不是声称教堂已经完成历史和解；要看谁真正获得解释权、出版后能否影响现场说明与公众参观。与《气数》的制度史关切可对照，但不将此项目硬套成单一政治立场。"
  status: "candidate"
  imageUrl: "https://abramsandchronicle.co.uk/cdn/shop/files/9781785516665_836x1024.jpg?v=1789114516"
  imageSourceUrl: "https://abramsandchronicle.co.uk/collections/fall-2026/products/9781785516665"
  imageSource: "Scala Arts & Heritage / Abrams & Chronicle Books（出版方公开封面）"
  imageNote: "正式出版物封面，包含历史木雕局部；用于准确识别本次公共历史成果，不以教堂通用外观照替代。封面设计与馆藏图版权须在刊发前核对。"
  imageStatus: "verify-rights"

- title: "定格动画的未来，依然有人在一根根编头发、一间间搭房子"
  url: "https://designmuseum.org/exhibitions/laika-presents-wildwood-the-exhibition"
  source: "Design Museum / LAIKA Studios（2026-10-15 开展；影片 10-23 英国上映）"
  radar: "设计、文化与媒介 / 鬼集 / 人的现场"
  topic: "定格动画、实体模型、工艺劳动、3D 打印、影像制作"
  discoveredAt: "2026-10-26"
  origin: "radar"
  note: "伦敦设计博物馆 10 月 15 日起展出 LAIKA《Wildwood》制作幕后，10 月 23 日影片在英国院线上映；展览把角色草图、木偶服装、3D 打印原型、微缩布景、动画摄影等串成一条真实制造链。10 月 27 日还有儿童黏土定格工作坊。编辑切口不是怀旧式的“手工打败数字”，而是数字制造与手工触感如何协作制造一种特定的影像质地；它也把通常藏在银幕后面的劳动过程变成可参观的对象。留意展览/电影宣发视角，勿将展方宣传语当制作成本或行业趋势证据。"
