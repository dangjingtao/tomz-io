- title: "如果儿童不再独自上学，城市真的更安全吗？重读 Mayer Hillman"
  url: "https://www.theguardian.com/science/2026/oct/20/mayer-hillman-obituary"
  source: "The Guardian（Anne Karpf 讣告，2026-10-20）/ Policy Studies Institute《One False Move》（1990）"
  radar: "人物与传记 / 城市、环境与生活方式 / 历史与制度"
  topic: "Mayer Hillman、儿童独立出行、道路安全、步行与自行车、统计盲区"
  discoveredAt: "2026-10-26"
  origin: "radar"
  note: "为什么是这个人、这一周：城市交通研究者 Mayer Hillman 9 月 25 日去世，10 月 20 日刊出讣告；本周 10 月 30 日本应是他的 95 岁生日。他与同事在 1990 年《One False Move》比较英国调查：7—8 岁儿童获准独自上学的比例从 1971 年约 80% 降到 1990 年约 9%，同期儿童道路死亡下降并不等于道路对儿童更安全，也可能是儿童被移出了道路。原报告作者本人公开存档：https://john-adams.co.uk/wp-content/uploads/2007/11/one%20false%20move.pdf；2013 年 PSI 后续研究可由 Oxford 机构仓储核验。编辑问题：一项安全指标改善时，我们是否忘了衡量人们失去的自由？不要把 1971—1990 的英格兰样本误写成今日全球现状；他的激进气候结论也须与道路研究分开评估。近期《见π》素材池未发现同一人物重复条目。"
  status: "candidate"
  imageUrl: "https://i.guim.co.uk/img/media/a1b18036078ee896acc0bf12bc2b4e1a0dddf0f1/10_20_1635_1440/master/1635.jpg?crop=none&dpr=1&s=none&width=465"
  imageSourceUrl: "https://www.theguardian.com/environment/2018/apr/26/were-doomed-mayer-hillman-on-the-climate-reality-no-one-else-will-dare-mention"
  imageSource: "The Guardian / John Alex Maguire / Rex Features"
  imageNote: "Hillman 与自行车同框的肖像；人物和城市交通议题同时可见，媒体摄影版权明确，预览前须核授权，不能默认正式复用。"
  imageStatus: "verify-rights"

- title: "1997 与 2026 的太平洋几乎长得一样，天气却不会照着旧剧本重演"
  url: "https://science.nasa.gov/earth/earth-observatory/el-nino-then-and-now/"
  source: "NASA Earth Observatory / NASA JPL（2026-10-23）"
  radar: "科技与科学 / 城市、环境与生活方式 / 科学方法"
  topic: "厄尔尼诺、35 年卫星测高、气候历史比较、风险预期"
  discoveredAt: "2026-10-26"
  origin: "radar"
  note: "NASA 10 月 23 日把 1997-10-13 和 2026-10-12 的赤道太平洋海面高度异常图并排：两次强厄尔尼诺均有暖水向南美延伸，但 2026 年发展更突然；NASA 科学家强调遥相关通过混沌大气传播，图像相似不意味着各地降雨和灾害会一一重演。35 年跨卫星、交叠任务的连续测高记录使这种历史对照成为可能。观察问题：当预测模型面对一个看似熟悉的模式，怎样既利用历史经验，又避免把相似误判成必然？这是对前一周厄尔尼诺海色与新几内亚火灾候选的独立方法论切口，不重复它们的生态结果。"
  status: "candidate"
  imageUrl: "https://assets.science.nasa.gov/dynamicimage/assets/science/esd/eo/images/iotd/2026/el-ni%C3%B1o-then-and-now/elninocomp_sen6_20261012.jpg"
  imageSourceUrl: "https://science.nasa.gov/earth/earth-observatory/el-nino-then-and-now/"
  imageSource: "NASA Earth Observatory / Lauren Dauphin / NASA-JPL Caltech"
  imageNote: "2026 年海面高度异常图，宜与 1997 年同类图成对排版；红色代表海面高度正异常，不是直接的气温或降雨图。NASA 来源图，正式使用时保留完整制图与数据署名。"
