- title: "殖民时代的测绘簿，正在帮助原住民找回被打散的地名与语言"
  url: "https://mhnsw.au/news/aboriginal-languages-week-living-languages-strong-futures/"
  source: "Museums of History NSW / First Nations Community Access to Archives（2026-10-19；原住民语言周10-18—10-25）"
  radar: "历史与制度 / 人的现场 / 设计、文化与媒介"
  topic: "原住民语言复兴、殖民档案、Kamilaroi、地名、档案可访问性、知识归属"
  discoveredAt: "2026-10-30"
  origin: "radar"
  note: "新南威尔士州历史博物馆在10月19日介绍原住民语言周的新展示：FNCAA团队在19世纪测绘簿、地图与书信中辨识原住民地名及词汇，结合Austlang代码、社区知识和口述历史改善检索，准备进一步数字化；材料包括1873年有关Kamilaroi语言与传统的记录。编辑切口：殖民行政文件原本服务于土地控制，却可能成为后代语言复兴的证据；谁有权解释、访问与再使用这些资料，不能只靠数字化技术决定。展示是档案识别和开放准备工作，不能写成语言已经‘复活’或全部记录已上线；部分知识可能有社区文化敏感性，正式引用须遵守原住民社区的访问与署名要求。来源为馆方一手页面，当前直接网页访问受限，但搜索索引可核对正文，后续可复验。"
  status: "candidate"
  imageSourceUrl: "https://mhnsw.au/news/aboriginal-languages-week-living-languages-strong-futures/"
  imageSource: "Museums of History NSW / State Archives Collection"
  imageNote: "馆方展示材料含历史手稿和原住民文化资料；当前未核验稳定直链及社区许可，暂不抓图。需先确认文化敏感性、馆藏编号和摄影/数字化版权。"
  imageStatus: "none"
