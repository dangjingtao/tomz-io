- title: "非洲城市未来新增七亿多人：决定就业机会的可能是‘到得了哪里’"
  url: "https://www.worldbank.org/en/news/press-release/2026/10/29/sub-saharan-africa-urban-awakening"
  source: "World Bank Group / Sub-Saharan Africa’s Urban Awakening（2026-10-29）"
  radar: "社会与商业 / 城市、环境与生活方式 / 历史与制度"
  topic: "撒哈拉以南非洲、城市化、就业可达性、通勤、城市外围、地方财政"
  discoveredAt: "2026-10-30"
  origin: "radar"
  note: "世界银行10月29日发布《Sub-Saharan Africa’s Urban Awakening》，预计2025—2050年该地区新增约7.48亿城市居民，强调大城市内可到达的就业集群、城市外围预留路网与基础设施空间、以及逾1.5万个小城镇的差异化投资。编辑切口：‘城市人口增长’并不自动变成‘生产力增长’，住房到岗位的距离、道路规划时机与地方财政能力决定机会能否落地；与《气数》关心的国家能力、基础设施路径依赖可对照。7.48亿是预测而非已发生人口增量，报告的政策建议也不等于政策已实施；应进一步核对报告模型、城市/乡镇定义和地区差异。"
  status: "candidate"
  imageSourceUrl: "https://www.worldbank.org/en/news/press-release/2026/10/29/sub-saharan-africa-urban-awakening"
  imageSource: "World Bank Group / 官方报告"
  imageNote: "发布页未确认可直接复用的、与报告数据一致的独立图片直链；优先在正式编辑时核验报告图表的版权与数据口径，不用通用非洲城市图库充当证据。"
  imageStatus: "none"

- title: "如果社交网站也能像维基百科一样修改：Social.Wiki把规则选择权交给用户"
  url: "https://news.mit.edu/2026/new-system-gives-users-more-control-over-online-experience-1029"
  source: "MIT News / Social.Wiki: A Web Held in Common（2026-10-29；UIST 2026 待发表）"
  radar: "设计、文化与媒介 / 社会与商业 / 开发工具 / 鬼集"
  topic: "Social.Wiki、可编辑社交应用、去中心化、plural governance、数据权限、界面设计"
  discoveredAt: "2026-10-30"
  origin: "radar"
  note: "MIT团队10月29日介绍Social.Wiki：用户能编辑平台内社交网站的代码或借助手段生成修改，并自主选择信任哪些编辑、按什么规则展示版本；试验包括把帖子变成花朵的微型博客和可调整报价规则的拼车应用。编辑问题：今天社交平台的‘社区规则’是否必须由一个运营商替所有人决定？这里的‘任何社交应用’指Social.Wiki生态内构建的应用，不是能直接修改现有主流社交网站；数据守卫会请求用户授权，但私密消息端到端加密仍在计划中，不能宣称成熟或已大规模上线。"
  status: "candidate"
  imageUrl: "https://news.mit.edu/sites/default/files/download/202610/MIT-CommonWeb-02-press.jpg"
  imageSourceUrl: "https://news.mit.edu/2026/new-system-gives-users-more-control-over-online-experience-1029"
  imageSource: "MIT News / Courtesy of Social.Wiki"
  imageNote: "‘The Garden’花朵微型博客四种用户可见版本的官方演示图，直接对应规则可分叉的编辑切口。MIT News 图片按 CC BY-NC-ND 供非商业使用，须署名，不得改作（尺寸裁剪例外）；商业发布需另获授权。"
  imageStatus: "verify-rights"

- title: "两粒磁珠能读懂残肢肌肉的伸缩，但距离真正控制义肢还有一步"
  url: "https://news.mit.edu/2026/magnetic-sensors-track-muscle-movement-better-prosthetic-limb-control-1029"
  source: "MIT News / Nature Sensors《A wireless magnetic implant system for continuous neuromuscular sensing》（2026-10-29）"
  radar: "科技与科学 / 人的现场 / 医疗与工程"
  topic: "神经义肢、肌肉机械信号、磁珠植入、magnetomicrometry、康复技术"
  discoveredAt: "2026-10-30"
  origin: "radar"
  note: "MIT 10月29日报告三名膝下截肢参与者的初步研究：肌肉中植入成对约3毫米磁珠，外部传感器跟踪距离变化，推断肌肉长度与速度；与皮肤/植入电极对照，在屏幕光标任务中表现出更稳定、准确的控制信号。编辑切口：人的意图不只存在于电信号，也存在于身体的真实机械运动；让义肢自然工作的关键可能是更忠实地测量使用者身体。三名参与者实验时没有佩戴义肢，验证的是虚拟控制任务，不能写成临床证明已能安全行走或大规模应用；植入长期安全性与商业化尚待研究。"
  status: "candidate"
  imageUrl: "https://news.mit.edu/sites/default/files/download/202610/MIT-Magnetic-Tracking-01-press.jpg"
  imageSourceUrl: "https://news.mit.edu/2026/magnetic-sensors-track-muscle-movement-better-prosthetic-limb-control-1029"
  imageSource: "MIT News / Courtesy of the researchers"
  imageNote: "研究人员手持微型磁珠与电路板的官方实物照片，不是义肢佩戴效果图；MIT News 标示 CC BY-NC-ND，非商业转载需署名且不可改作（尺寸裁剪例外），正式出版核权。"
  imageStatus: "verify-rights"

- title: "万圣节的‘猫头’不在地球：同一片星云被三种光看出三副面孔"
  url: "https://science.nasa.gov/missions/hubble/ghostly-cats-head-nebula-lurks-within-sight-of-nasas-hubble-webb/"
  source: "NASA / ESA / CSA / STScI（2026-10-29）"
  radar: "鬼集 / 科技与科学 / 设计、文化与媒介"
  topic: "猫头星云、船底座星云、哈勃、韦布、可见光与红外、多波段影像"
  discoveredAt: "2026-10-30"
  origin: "radar"
  note: "NASA与STScI在10月29日万圣节前夕公开船底座星云内‘Cat’s Head’尘埃柱的哈勃可见光、韦布近红外与中红外图像。它距地球约7500光年，形似猫头的‘眼睛’可能藏有年轻恒星；可见光显示不透明尘柱，红外揭示更多内部结构与受恒星辐射加热的尘埃。编辑切口：同一物体没有唯一一张‘真实照片’，不同波段与色彩映射回答不同物理问题。猫的轮廓是人类视觉联想，非天体正式分类；图像颜色经滤波与映射处理，不能称肉眼所见，也不是新发现了猫形生命。"
  status: "candidate"
  imageUrl: "https://assets.science.nasa.gov/dynamicimage/assets/science/missions/hubble/releases/2026/10/STScI-01M4BZ6G5147CKYXY9C9SY3D9F.jpg?fit=clip&h=2000&w=1358"
  imageSourceUrl: "https://science.nasa.gov/asset/hubble/cats-head-nebula-hubble-wfc3-image/"
  imageSource: "NASA / ESA / STScI；图像处理 Joseph DePasquale"
  imageNote: "哈勃可见光猫头尘埃柱官方展示图，拍摄数据为2026-01-15，公开于2026-10-29；NASA/ESA/STScI 多方署名，正式复用核NASA影像使用政策与第三方权利。图像颜色为滤波映射。"
  imageStatus: "verify-rights"
