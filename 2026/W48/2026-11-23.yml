  radar: "科技新闻 / 网络基础设施 / 制度与公共政策"
  topic: "Quad9、DNS、法国、网络封锁、司法管辖、隐私"
  discoveredAt: "2026-11-23"
  origin: "radar"
  note: "Cloudflare 11月18日撰文讨论 Quad9 因法国法院裁决与合规压力而退出法国的决定，认为其被迫在修改隐私/安全服务与承担诉讼处罚之间选择。此为有立场的行业利益相关方评论，不是法院裁判原文，也不能直接认定所有DNS服务商面临相同义务。已确认评论原文，尚未交叉核验 Quad9 官方声明、法院案号、裁判范围与执行时间，暂列 hold。编辑问题：公共DNS服务究竟应在多大范围承担内容过滤责任？"
  status: "hold"
  kind: "news"
  opportunityNote: "不强行商业化。中国互联网服务商面临不同的法律与网络治理框架，不能直接移植法国案例。"
