- title: "Google Gemini deferred tier：多轮后台任务不再只能在实时 API 与静态批处理间二选一"
  url: "https://cloud.google.com/blog/topics/inside-google-cloud/whats-new-google-cloud"
  source: "Google Cloud 官方 2026-11-19 更新（Nov 16–20 条目），附 Interactions API 与 ADK 文档入口"
  radar: "AI 业界 / 开发者平台 / 能力拐点 / 成本"
  topic: "Gemini deferred tier、异步推理、状态化多轮任务、批处理经济性"
  discoveredAt: "2026-11-23"
  origin: "radar"
  note: "Google Cloud 11月19日汇总称 deferred service tier 已对 Interactions API、ADK、Deep Research 正式可用，允许多轮、带状态的后台推理任务使用低优先级排队资源，完成的轮次按标准 PayGo 价格五折并可叠加缓存折扣。该机制与必须预先固定输入的静态 Batch 不同；延迟敏感任务不适用。与11月18日已有 OpenAI 异步折扣消息属于同一行业趋势，但提供不同平台的具体能力和价格证据，后续编辑应关联而非当成完全独立的大趋势。实际等待时间、峰值失败率、适用模型和中国可用性仍需核验。"
  status: "candidate"
  kind: "capability"
  opportunityNote: "对容忍排队的研究、批量数据处理与定时内容生产可能降低成本；须评估实际队列延迟、供应商地域可用性、数据合规与多模型切换成本，厂商价格不是独立 SaaS 需求证据。"
