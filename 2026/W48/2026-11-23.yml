- title: "MedChemBench：让 AI 从分子图识别走向药物研发中的多目标判断"
  url: "https://openai.com/index/introducing-medchembench/"
  source: "OpenAI Research 原始发布（2026-11-20）及其论文链接"
  radar: "AI 业界 / 科学 / 能力拐点"
  topic: "MedChemBench、药物化学、分子结构、实验数据、多目标优化"
  discoveredAt: "2026-11-23"
  origin: "radar"
  note: "11月20日 OpenAI 发布 MedChemBench，基于117篇论文与专利、761个不同分子结构组织99道药物化学推理题，考察结构重建、科学解释、化合物排序和性质数值预测。发布方称 GPT-6.2 Astra 在 xhigh 设置下得分84.5%，但这是发布方的基准与自家模型测试，不是药物临床有效性、实验室自主研发或外部复现的证据。原文同时指出分子性质之间有取舍，数值预测更难。编辑问题：科学AI是否开始从单一任务指标走向多约束决策？需继续检查论文方法、数据污染、外部实验验证。"
  status: "candidate"
  kind: "capability"
  opportunityNote: "中文药物研发辅助、文献/专利实验数据整理可能值得研究；真实机会受专业实验数据可得性、湿实验验证、法规和研发责任限制，不能从基准分数推断商业需求。"
