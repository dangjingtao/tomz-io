  note: "11月26日查阅上游：项目将 Linux 内核编译成 WASM，保留 MMU、文件系统与网络栈，未修改的 aarch64 用户程序由嵌入的模拟器执行。作者展示 Alpine/Debian 终端与 JS/TS SDK、无服务器本地运行，称 shell 启动亚秒级；CPU 密集型任务仍明显慢于原生。公开数值是作者基准测试，未独立运行；真实隔离安全性、浏览器兼容与依赖外部网络代理等必须实测，不能等同于已成熟的安全沙箱。编辑角度：浏览器中运行传统 Linux 软件的条件又发生了什么变化？"
