  note: "事实：作者报告局部 Rust 改写仅降低约8%至10% CPU，跨语言调用带来额外开销；完整迁移后每请求 CPU 约降70%，首 token 延迟中位数约降20%。审计移植测试发现超过100处弱化断言。团队使用生产实现作为行为参照，逐步核对差异。判断：代码生成成本下降不等于迁移成本消失，验证成为约束。反例：与11月24日 fast-anything 的局部移植策略形成有价值对照，但不同系统不能直接比较；厂商自报指标未独立复现，不应推断所有 Python 应用都值得重写。"
  kind: "capability"
  opportunityNote: "可关注迁移差异验证与回归工具；小团队是否需要完整重写取决于实际性能瓶颈、跨语言开销和维护成本。"
