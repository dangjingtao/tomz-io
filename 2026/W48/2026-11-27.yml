  topic: "聊天备份、Markdown、数据可携带性、一次性付费"
  note: "事实：官网展示 Chrome/Edge 扩展，通过已有登录会话将 ChatGPT、Claude、Gemini、Grok 对话写入本地目录，支持搜索和将旧对话作为上下文交给另一平台；14天试用，官网显示59美元一次性许可。商店本轮显示134用户、4条评分，属于动态平台指标，不代表付费人数。发现入口：https://news.ycombinator.com/item?id=50637995；商店：https://chromewebstore.google.com/detail/carry-ai-chat-exporter-fo/mlligjaffhiphbpkjejefoibcclbdfll 。判断：跨平台数据所有权是具体产品需求线索。反例：自动同步依赖浏览器运行、登录状态和平台接口稳定性；未审计扩展代码或实测隐私声明，不能将本地存储等同于零外部通信，也不是原生会话迁移。"
