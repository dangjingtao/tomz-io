  note: "对 11月24日 Radar 未保存素材进行回填，11月26日重新读取上游 README。项目是一款浏览器游戏：LLM 扮演经理，玩家被当作 subagent，在限时任务中操作模拟文件系统；游戏另设隐藏真值检查，记录 AI 经理错误验收的次数。支持用户自带 API Key、服务器计费及本地模型。项目说明存在以用户额度游玩的选项和充值方案，但未核实在线付费经营规模，也未亲自试玩；涉及使用模型订阅的桥接模式，作者自身警告可能触及服务条款。编辑问题：当 AI 评价人类劳动时，正确性到底由谁定义？"
