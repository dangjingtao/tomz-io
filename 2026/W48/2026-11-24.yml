- title: "fast-anything：让 AI 只把真正耗时的函数移植到 Rust"
  url: "https://github.com/EL4CTEO/fast-anything"
  source: "EL4CTEO/fast-anything 官方 README、示例和测试流程（2026-11-26 补核）"
  radar: "开源工具 / 软件工程 / 能力拐点 / 独立开发者"
  topic: "fast-anything、性能剖析、Rust、局部移植、差异验证"
  discoveredAt: "2026-11-24"
  origin: "radar"
  note: "11月24日漏存素材补录，11月26日查阅上游 README。项目先剖析运行耗时，挑选可移植热点函数，由 AI 生成 Rust 实现并以采集到的真实调用和扩展边界样例做差异验证；随后跑 A/A 与 A/B 基准，可随时禁用替换。作者声称部分示例有大幅提速，但这些是项目自测，未复现，不宜推广到一般应用。参数副作用、平台绑定、跨语言浮点语义、系统整体吞吐仍可能构成限制。编辑角度：AI 工具不必整库重写，局部可回退与可验证替换更值得注意。"
