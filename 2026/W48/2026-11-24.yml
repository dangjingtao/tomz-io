- title: "167 年前《物种起源》上市：达尔文第一天收到催印下一版的消息"
  url: "https://www.darwinproject.ac.uk/view/letters/DCP-LETT-2550"
  source: "Darwin Correspondence Project 原始通信（1859-11-24）、Darwin Online 初版书目"
  radar: "历史制度 / 人物与传记 / 科学史"
  topic: "Charles Darwin、物种起源、1859年11月24日、科学出版与争论"
  discoveredAt: "2026-11-24"
  origin: "radar"
  note: "为什么是这个人：达尔文以《物种起源》提出自然选择的论证，改变科学史和公共思想的讨论。为什么是这一周：1859年11月24日出版，2026年11月24日为167周年；达尔文当日致 Huxley 信记载出版商说首版已售罄并急催再版，Darwin Correspondence Project 与 Darwin Online 保留通信和首版文本。11月26日补核该周人物扫描，避免只写百科传记。切口是一个改变思想史的科学理论如何在出版、争辩、修订中逐渐变成社会共同知识。注意初版的发行与书商订货存在历史细节，不能轻率等同于每一册在出版当天都卖给了普通读者。"
  status: "candidate"
  kind: "history"
  opportunityNote: "不强行商业化。可追问科学传播和编辑修订之间的关系。"
