- title: "GPT-6 参与蛋白设计的湿实验：通用模型有了实验信号，但仍离替代专用模型很远"
  url: "https://openai.com/index/gpt-6-models-demonstrate-intrinsic-protein-design-capabilities/"
  source: "OpenAI Science 研究发布（2026-11-24）及预印本、Onava 合作实验"
  radar: "AI 业界 / 科学研发 / 能力拐点"
  topic: "GPT-6.2、蛋白质设计、实验结合、通用与专用模型协作"
  discoveredAt: "2026-11-25"
  origin: "radar"
  note: "11月25日补漏采集，发布日11月24日。OpenAI 与 Onava 报告，GPT-6.2 设计结构后用专用模型生成氨基酸序列并筛选，在五个目标中共测试322个 minibinder，其中35个（10.9%）出现结合阳性；另有若干序列重设计与抗体片段实验。实验有意义，但不能写成 GPT 独立完成所有设计、实现药物治疗或性能普遍优于专用蛋白模型。研究来自参与方，实验目标有限，结构整体预测依然是弱点。与11月23日 MedChemBench 是互补问题（基准能力 vs 湿实验验证），不应当重复宣传为同一成果。"
  status: "candidate"
  kind: "capability"
  opportunityNote: "自然语言结构约束与专业模型联用，可能扩展科研工作流工具的需求；湿实验验证、知识产权、合规、安全和真实研发成本仍是硬约束，尚不能据此推断中国商业落地。"
