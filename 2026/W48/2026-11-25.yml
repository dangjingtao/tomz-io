- title: "GitHub Copilot 代码审查默认计费归属将改变：谁调用 AI，谁承担账单？"
  url: "https://github.blog/changelog/2026-11-25-copilot-code-review-billing-will-default-to-the-organization/"
  source: "GitHub Changelog 官方公告（2026-11-25）"
  radar: "科技新闻 / 开发平台 / SaaS 经营与成本治理"
  topic: "GitHub Copilot、代码审查、组织计费、AI Credits、平台默认策略"
  discoveredAt: "2026-11-25"
  origin: "radar"
  note: "GitHub 11月25日宣布：对 Copilot Business/Enterprise，若此前没有明确选择计费归属，自2026年12月30日起，持付费 Copilot 许可成员发起的代码审查默认改向仓库所属组织计费。已有 Member 或 Organization 选择不变；未启用 AI Credits 付费用量、有 billing lock 或缺少可计费客户的账户，会被设为 Member；未持许可成员的独立设置不受此次改变。不能把政策解读为所有用户一律涨价。观察角度：当 AI 审查变成日常自动化，计费默认选项会影响公司工程预算与责任归属。"
  status: "candidate"
  kind: "news"
  opportunityNote: "小团队可能需要轻量审查用量可视化、预算归属和异常告警，但平台自有账单工具与采购约束可能使独立 SaaS 价值有限。"
  imageUrl: null
  imageSourceUrl: "https://github.blog/changelog/2026-11-25-copilot-code-review-billing-will-default-to-the-organization/"
  imageSource: "GitHub Changelog 官方公告（2026-11-25）"
