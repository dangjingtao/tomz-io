  note: "联合国在 COP31 启动 Disaster Risk Financing Platform，目标到 2030 年促成超过 30 亿美元风险融资渠道、保护 7500 万人。编辑切口：从灾后募捐转向灾前可触发资金，谁来定义风险阈值与支付条件？金额和覆盖人数均为未来目标，不能写成已经筹资到账或受益。与本周 COP31 主席制度候选不同，关注执行工具。"
