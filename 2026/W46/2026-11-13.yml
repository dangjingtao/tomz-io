- title: "苏格兰一片看似荒凉的沼泽，为什么能保存九千年的碳"
  url: "https://science.nasa.gov/earth/earth-observatory/scotlands-flow-country/"
  source: "NASA Earth Observatory（2026-11-12）/ Landsat 8 / UNESCO"
  radar: "城市环境生活 / 科学与生态 / 历史制度"
  topic: "苏格兰 Flow Country、泥炭地、碳储存、世界遗产"
  discoveredAt: "2026-11-13"
  origin: "radar"
  note: "NASA 11 月 12 日用 Landsat 8 图像解释苏格兰 Flow Country 的毯状泥炭沼泽；当地泥炭沉积可追溯九千多年，湿地缺氧抑制有机质分解。编辑切口：看似没有树的地景，可能比植树造林更值得保护。全球泥炭地碳储量是总体估算，不能直接归算给这片区域；卫星图摄于 2024 年，不是本周拍摄。"
  status: "candidate"
  imageUrl: null
  imageSourceUrl: "https://science.nasa.gov/earth/earth-observatory/scotlands-flow-country/"
  imageSource: "NASA Earth Observatory / Michala Garrison / USGS"
  imageNote: "NASA 原页提供 Landsat 图像下载；未核独立图像直链，复用前核 NASA 媒体规则。"
