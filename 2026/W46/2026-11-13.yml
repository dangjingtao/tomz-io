  radar: "人的现场 / 教育制度 / 公共卫生"
  topic: "乌干达、饥饿、校园学习、教师、营养"
  discoveredAt: "2026-11-13"
  origin: "radar"
  note: "UNICEF 11 月 12 日讲述 Napak 地区教师 Catherine Ibalasa 的课堂：学生头痛腹痛，疟疾检测阴性，真正障碍可能是饥饿。编辑切口：教育不是从黑板开始，而是从孩子是否吃饱开始。这是经机构采写的现场个案，不可据此推断全区患病率或项目效果。人物雷达本周已完成；此处是现场叙事，不包装成著名人物传记。"
