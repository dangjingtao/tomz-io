- title: "红树林的全球反弹：卫星记录里少见的生态好消息"
  url: "https://science.nasa.gov/earth/earth-observatory/a-global-rebound-for-mangroves/"
  source: "NASA Earth Observatory（2026-11-13）/ Science 研究 / Landsat"
  radar: "科学与生态 / 城市环境生活 / 历史制度"
  topic: "红树林、海岸防护、卫星遥感、自然恢复"
  discoveredAt: "2026-11-14"
  origin: "radar"
  note: "NASA 11 月 13 日回顾 Landsat 长期研究：1984—2010 年全球红树林减少近 3000 平方公里，2010 年后增加近 2000 平方公里；缅甸沿岸的稻田废弃与自然恢复提供直观对照。编辑切口：生态系统并非只能衰退，保护、泥沙沉积和自然再生怎样共同改变海岸？研究数据截至 2023 年，页面所示 2026 年卫星照片不等于全球研究的最新统计；各地区差异很大，不能说危机已解除。"
  status: "candidate"
  imageUrl: null
  imageSourceUrl: "https://science.nasa.gov/earth/earth-observatory/a-global-rebound-for-mangroves/"
  imageSource: "NASA Earth Observatory / Michala Garrison / USGS"
  imageNote: "官方页面提供 2010 与 2026 Landsat 图像下载；未核独立图像直链及复用条件。"
  imageStatus: "none"

- title: "刚果（金）饥饿预警超过三千万人：冲突、疫病与农时同时挤压选择"
  url: "https://www.who.int/news/item/13-11-2026-conflict-and-disease-outbreaks-deepen-dr-congo-s-hunger-crisis-as-record-numbers-are-projected-to-face-acute-food-insecurity"
  source: "FAO / WFP / UNICEF / WHO 联合新闻稿（2026-11-13）/ IPC"
  radar: "社会商业 / 历史制度 / 人的现场"
  topic: "刚果（金）、粮食安全、战争、埃博拉、农业生产"
  discoveredAt: "2026-11-14"
  origin: "radar"
  note: "四家联合国机构根据 IPC 预测 2027 年上半年刚果（金）将有 3030 万人处于 IPC 3 级或更严重粮食不安全状态，其中 420 万人为 IPC 4 级。编辑切口：战乱造成的迁徙、疫病与错过播种季如何相互放大，剥夺家庭恢复生计的选择？这是未来时段预测，不是当前已经发生的总人数；IPC 4 级已包含在 3 级以上总量中，不能相加。可与《气数》的国家能力与纠错空间研究方法形成问题关联，不作单因果归咎。"
  status: "candidate"
  imageUrl: null
  imageSourceUrl: "https://www.who.int/news/item/13-11-2026-conflict-and-disease-outbreaks-deepen-dr-congo-s-hunger-crisis-as-record-numbers-are-projected-to-face-acute-food-insecurity"
  imageSource: "WHO / Daniel Paluku"
  imageNote: "新闻稿配图有 WHO 署名，未核再利用许可。"
  imageStatus: "none"

- title: "孟加拉国与印度禁用百草枯：自杀预防也可以是农药监管"
  url: "https://www.who.int/americansamoa/news/detail-global/12-11-2026-bangladesh-and-india-ban-toxic-pesticide-to-boost-suicide-prevention-and-brain-health"
  source: "WHO（2026-11-12）"
  radar: "公共卫生 / 历史制度 / 城市环境生活"
  topic: "百草枯、农药治理、自杀预防、农业安全"
  discoveredAt: "2026-11-14"
  origin: "radar"
  note: "WHO 11 月 12 日介绍孟加拉国与印度 2026 年 9 月宣布全国禁用百草枯的监管行动。编辑切口：减少接触高度致命手段，为什么可能比单纯宣传心理健康更直接地挽救生命？WHO 引用其他国家的经验支持该政策方向，但两国本次禁令的实际执行及死亡率效果尚不能据此确认；需后续核实正式法规生效与执行情况。"
  status: "candidate"
