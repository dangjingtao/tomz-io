- title: "用缝纫机造混凝土梁：一块布把低碳结构设计带出昂贵工厂"
  url: "https://news.mit.edu/2026/fabric-molds-could-bring-material-saving-concrete-beams-within-reach-1106"
  source: "MIT Department of Civil and Environmental Engineering / Journal of Building Engineering"
  radar: "科技与科学 / 城市环境生活 / 设计与制造"
  topic: "布模混凝土、拓扑优化、建筑碳排、适用技术、南北成本差异"
  discoveredAt: "2026-11-09"
  origin: "radar"
  note: "MIT 11 月 6 日报道：团队用缝制布模浇筑约 3 米试验梁，相比设计承载能力相同的常规梁，混凝土用量约三分之一、钢筋约一半。仅对一根梁进行了约设计荷载 30% 的使用工况试验，挠度与模型预测相差约 2%；不能据此宣称已通过全尺度破坏或建筑规范验收。成本比较在劳动力较便宜地区更有利，在高人工成本地区反而更贵。编辑切口：可负担的低碳技术，可能不是更昂贵的机器人，而是一张能被缝出来的模板。"
