  note: "柏林市官方 2026 年活动页将 1918 年共和国宣告、1923 年啤酒馆政变、1938 年十一月大迫害和 1989 年柏林墙倒塌并列为 11 月 9 日的历史节点。11 月 7—14 日 Freedom Week、11 月 9 日德国历史博物馆免费开放与 1938 年大迫害专题导览提供本周真实公共入口。结合《气数》的制度研究方法，比较同一日的制度转型与暴力记忆如何被公共机构同时叙述，避免把复杂历史压成单一胜利叙事；这是活动与纪念安排，不是对历史因果的新发现。"
