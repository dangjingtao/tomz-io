  note: "MIT 11 月 5 日介绍的理论研究预测：高速重夸克在等离子体中的动量变化具有非对称、非高斯的大偏移尾部，可能成为识别极端流体微观结构的新窗口。研究先在弱相互作用模型计算并与既有强耦合计算结构比较，尚需与重离子实验数据对照。不要写成实验已经直接拍到宇宙初生流体。原论文《Heavy Quark Transport is Non-Gaussian Beyond Leading Logarithm》，应核对 PRL 正文。"
