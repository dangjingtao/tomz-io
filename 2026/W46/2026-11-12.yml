- title: "把一点无序织进材料：叶脉式网络为何比整齐蜂窝更能扛冲击"
  url: "https://news.mit.edu/2026/engineers-design-stronger-resilient-nature-inspired-metamaterials-1111"
  source: "MIT News（2026-11-11）/ Nature 原始研究"
  radar: "科技与科学 / 设计制造 / 鬼集"
  topic: "多尺度网络超材料、仿生设计、3D 打印、冲击吸收"
  discoveredAt: "2026-11-12"
  origin: "radar"
  note: "MIT 与东北大学团队 11 月 11 日报道 Nature 研究：以不同尺度梁组成非周期网络，3D 打印信用卡大小的聚合物试样，并与常规晶格、蜂窝超材料比较压缩与冲击响应；样品在测试中表现更好的韧性和损伤分散。编辑切口：工业设计的‘秩序’可能不如自然网络里的有组织的不规则。样本是实验室聚合物结构，不等于头盔、装甲或量产产品已通过认证；与本周布模混凝土候选的研究材料、制造方法及证据不同。"
  status: "candidate"
