- title: "为什么是 Lucia Moholy，为什么是本周：一封失而复得的 1946 年信，把包豪斯摄影带回 UNESCO"
  url: "https://www.unesco.org/en/articles/lucia-moholy-photography-transmission"
  source: "UNESCO Archives（2026-11-11 更新）/ Lucia Moholy 展览与档案"
  radar: "人物与传记 / 设计文化 / 历史制度 / 档案"
  topic: "Lucia Moholy、包豪斯、摄影著作权、微缩胶片、档案归属"
  discoveredAt: "2026-11-12"
  origin: "radar"
  note: "为什么是这个人：Lucia Moholy（1894—1989）的包豪斯建筑摄影塑造了现代设计的公共形象，但她 1933 年逃离德国时留下数百张玻璃底片，后来长期争取作品归还和署名；她还参与战时文献缩微复制及 UNESCO 的档案技术。为什么是本周：UNESCO 巴黎总部 11 月 12—30 日举办展览、11 月 16 日举办学术讨论，且档案人员今年新发现她 1946 年致 UNESCO 首任总干事 Julian Huxley 的微缩胶片计划信件。不是重写包豪斯百科，而是问：一套现代主义视觉形象是谁拍下的、谁拥有底片、谁获得署名？本周人物池已有 Blomstedt、Hilleman、Pulotu、Duke，题材不重复；若正式写作需复核 1946 年信件原件与权属史。"
  status: "candidate"
  imageUrl: null
  imageSourceUrl: "https://www.unesco.org/en/articles/lucia-moholy-photography-transmission"
  imageSource: "UNESCO / Fotostiftung Schweiz / ADAGP / Moholy-Nagy Foundation"
