  radar: "科技与科学 / 社会商业 / 历史制度"
  topic: "开放科学、知识产权、科研安全、技术转化、公共利益"
  discoveredAt: "2026-11-12"
  origin: "radar"
  note: "UNESCO 11 月 12 日在巴黎举办 Open Science for Innovation 会议，计划推出 WIPO–UNESCO 关于知识产权与开放科学的联合 factsheet，讨论开放研究伙伴关系、科研安全、公共资助与采购。编辑切口：开放不是免费放弃产权，也不是把安全当作封闭的借口；真正的冲突发生在谁付钱、谁有访问权、谁能复核结果。当前仅确认活动和文件发布计划，尚未核实事实表正式文本或政策结果；与 11 月 9 日科学外交会议、11 月 11 日 WHO 科学信任倡议不同，避免泛泛重复，暂列 hold。"
