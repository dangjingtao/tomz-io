- title: "一场暴雨让干旱水库两个月涨了十八米：卫星同时拍到救济与灾害"
  url: "https://science.nasa.gov/earth/earth-observatory/water-surges-into-navajo-reservoir/"
  source: "NASA Earth Observatory（2026-11-11）/ Landsat 9 / 美国陆军工兵部队"
  radar: "城市环境生活 / 科技与科学 / 气候与水资源"
  topic: "Navajo Reservoir、洪水、干旱、遥感对照、水库管理"
  discoveredAt: "2026-11-12"
  origin: "radar"
  note: "NASA 11 月 11 日以 Landsat 9 的 9 月 20 日与 11 月 7 日影像显示 Navajo Reservoir 水位约升 60 英尺（18 米），11 月 7 日达同期平均蓄水量的 108%，此前为 60%；四角地区秋季暴雨缓解短期干旱，也导致河道洪灾和居民疏散。编辑切口：同一场降水同时是水资源补充和灾害。108% 是同日期历史平均蓄水量，不是水库绝对容量；水位变化不能仅归因降雨，需考虑水坝调度。与前一天河谷雾遥感素材不是同一事件。"
  status: "candidate"
  imageUrl: "https://assets.science.nasa.gov/content/dam/science/esd/eo/images/iotd/2026/water-surges-into-navajo-reservoir/navajoreservoir_oli2_20261107.jpg/jcr:content/renditions/cq5dam.web.1280.1280.jpeg"
  imageSourceUrl: "https://science.nasa.gov/earth/earth-observatory/water-surges-into-navajo-reservoir/"
  imageSource: "NASA Earth Observatory / Michala Garrison / Landsat 9 USGS"
