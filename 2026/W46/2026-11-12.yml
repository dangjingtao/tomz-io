  discoveredAt: "2026-11-12"
  origin: "radar"
  note: "UNICEF 11 月 11 日现场文章：喀土穆水网据估约 60% 受漏水影响，水务工程师使用可进入管道的遥控摄像机器人和地面声学设备定位裂缝，文中一处社区暗漏在不到一小时内找到。编辑切口：技术进步有时是战争之后不再把整条马路挖开，而是把水重新送进家。UNICEF 同日简报指出电网遭袭会连带停水、疫苗冷链和灌溉，见 https://www.unicef.org/sudan/press-releases/drones-and-drought-sudan-combined-assault-children-nothing-seen 。60% 是 UNICEF 报道估算，个案速度不代表全城修复率；避免将技术报道美化为战争已经结束。"
