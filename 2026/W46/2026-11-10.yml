- title: "为什么是 Maurice Hilleman，为什么是这周：疫苗成功得让发明者从记忆中消失"
  url: "https://americanhistory.si.edu/collections/object-groups/antibody-initiative/mmr"
  source: "Smithsonian National Museum of American History 馆藏与 2026-11-06《First Do No Harm》展览公告"
  radar: "人物与传记 / 历史与制度 / 公共卫生 / 人的现场"
  topic: "Maurice Hilleman、疫苗史、MMR、科学家与公共记忆、医疗制度"
  discoveredAt: "2026-11-10"
  origin: "radar"
  note: "为什么是这个人：Hilleman（1919—2005）参与研发多种关键疫苗，馆藏保留他从女儿 Jeryl Lynn 感染腮腺炎中分离病毒、最终形成疫苗株的材料，既是实验室技术史也是家庭与公共卫生相连的现场。为什么是这一周：史密森尼 11 月 6 日开幕的《First Do No Harm》把他列为开篇三项案例之一，让一位常被成功公共卫生政策遮蔽的研究者重回展厅。编辑角度是‘预防成功为何反而让危险被忘记’，不写百科生平，不把科学成就归于孤胆英雄；同周 Blomstedt 人物候选来自音乐追思，非重复人物。展览证据：https://www.si.edu/newsdesk/releases/smithsonians-first-do-no-harm-exhibition-explores-medical-history 。"
  status: "candidate"
