- title: "室温下也能形成“超固体”：光与物质混合后出现自发排列的条纹"
  url: "https://research.ibm.com/publications/observation-of-a-supersolid-phase-in-a-spin-orbit-coupled-exciton-polariton-bose-einstein-condensate"
