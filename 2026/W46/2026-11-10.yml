- title: "一项 24 人银屑病试验提醒我们：从免疫细胞代谢到新疗法，中间还隔着多远"
  url: "https://rupress.org/jem/article/223/11/e20252558/283127/Vanin-pantethine-metabolic-axis-shapes-dendritic"
  source: "Journal of Experimental Medicine 原始论文（2026-10-27）/ PubMed 42944602"
  radar: "科技与科学 / 公共卫生 / 科学方法"
  topic: "Vanin、泛硫乙胺、树突细胞、胆固醇代谢、银屑病、证据等级"
  discoveredAt: "2026-11-10"
  origin: "radar"
  note: "10 月 27 日 JEM 原论文显示 Vanin-pantethine-cholesterol 轴与树突细胞过度活化相关；小鼠与患者来源细胞实验提示机制。单中心 24 名斑块状银屑病患者随机分为标准外用治疗与外用加口服泛硫乙胺两组，12 周后联合组评分改善更多。11 月 9 日大众科技媒体再传播。编辑切口：生物学机制、初步人体信号和可推广治疗之间有几层证据？研究样本极小，临床部分不能直接证明细胞机制或安全有效的常规疗法；暂列 hold，禁止写成读者可自行服用的治疗建议，需独立复核临床试验设计和更大样本。"
  status: "hold"
