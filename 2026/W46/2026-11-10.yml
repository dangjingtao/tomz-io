  radar: "科技与科学 / 科学方法 / 鬼集"
  topic: "超固体、激子极化激元、室温凝聚、光学微腔、对称性自发破缺"
  discoveredAt: "2026-11-10"
  origin: "radar"
  note: "研究团队在含液晶与有机聚合物的光学微腔中观察到激子极化激元凝聚体的周期性密度条纹、条纹位置随机选择及涡旋迹象，论文 10 月 16 日发表于 Science Advances；11 月 3 日大学通报、11 月 9 日大众科技媒体再传播。编辑切口：超固体并不等于把普通光变成一块能摸到的固体；这是短寿命、持续驱动的光-物质混合量子流体，尚非实用量子计算器。应保留理论判据、实验测量与应用推测的区分。"
