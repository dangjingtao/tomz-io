- title: "一只蜘蛛为现代动物命名法重新钉下标本：消失六十年的分类锚点"
  url: "https://www.si.edu/newsdesk/releases/smithsonian-led-scientists-anchor-first-scientific-animal-name-modern-day-spider"
  source: "Smithsonian National Museum of Natural History / Taxonomy"
  radar: "科技与科学 / 历史与制度 / 科学方法"
  topic: "Araneus angulatus、模式标本、双名法、自然史博物馆"
  discoveredAt: "2026-11-11"
  origin: "radar"
  note: "史密森尼 11 月 10 日发布：团队为 Clerck 于 1757 年命名的 Araneus angulatus 指定新模式标本，以瑞典采集样本、形态对照和 DNA 证据重新锚定科学名称。原始标本在 1858—1965 年间遗失；这是分类学规则与实体标本的修复，不是发现新蜘蛛物种。编辑切口：知识制度为什么需要可以再次检验的物证。"
