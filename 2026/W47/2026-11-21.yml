- title: "GitHub 安全公告权限细分：漏洞协作不再必须授予仓库管理员"
  url: "https://github.blog/changelog/2026-11-20-security-advisory-permissions-are-now-generally-available/"
  source: "GitHub Changelog（2026-11-20）"
  radar: "科技新闻 / 开源安全 / 平台治理"
  topic: "Security Advisories、私密漏洞报告、最小权限、组织协作"
  discoveredAt: "2026-11-21"
  origin: "radar"
  note: "GitHub 11 月 20 日宣布在支持自定义仓库角色的组织套餐中正式提供安全公告的细粒度权限，可分别授权查看、创建编辑管理、接受私密漏洞报告、发布公告及申请 CVE，而不必直接赋予仓库管理员或组织级安全管理员。限制：临时私有 fork 的合并仍需仓库管理员/安全经理，机密评论还要求写权限。官方上线说明不是已证实降低漏洞响应时间的实测结果。编辑问题：开源安全协作的瓶颈是否正从扫描工具转向可委托、可审计的修复权限？"
  status: "candidate"
  kind: "news"
  opportunityNote: "面向多仓库开源维护组织的漏洞协调和权限审计可能有服务机会，但 GitHub 原生功能正在补齐；需核验用户痛点、套餐门槛及付费需求。"
  imageUrl: null
  imageSourceUrl: "https://github.blog/changelog/2026-11-20-security-advisory-permissions-are-now-generally-available/"
  imageSource: "GitHub Changelog（2026-11-20）"
  imageNote: "原站配图复用授权未核实；仅保留原始来源，不下载或上传 R2。"
  imageStatus: "none"

- title: "GitHub Enterprise Server 3.23：无外网、无 GPU 的本地 AI 密钥检测进入预览"
  url: "https://github.blog/changelog/2026-11-20-github-enterprise-server-3-23-release-candidate/"
  source: "GitHub Changelog（2026-11-20）"
  radar: "AI 业界 / 开发者平台 / 能力拐点"
  topic: "GHES 3.23、air-gapped、AI secret detection、CPU inference、供应链安全"
  discoveredAt: "2026-11-21"
  origin: "radar"
  note: "GitHub 11 月 20 日发布 GHES 3.23 release candidate，其中 AI secret detection 可在隔离网络的企业设备上运行自包含微调模型，官方称只需 CPU，无需 GPU、托管 LLM 或外连；该能力仍为 public preview，不等于正式版稳定可用。版本还扩大多生态恶意包告警，并默认在包版本发布三天后才发起 Dependabot 版本升级 PR。观察问题：安全专用小模型在离线 CPU 上的可用性，是否意味着部分 AI 安全能力正在从云 API 回到企业内网？尚缺独立精度、延迟与成本测试。"
  status: "candidate"
  kind: "capability"
  opportunityNote: "中国政企、工业内网和私有代码托管环境可能有离线安全检测需求；需评估现有国产工具、误报率、维护成本和企业销售周期，不能据厂商预览推断市场空白。"
  imageUrl: null
  imageSourceUrl: "https://github.blog/changelog/2026-11-20-github-enterprise-server-3-23-release-candidate/"
  imageSource: "GitHub Changelog（2026-11-20）"
