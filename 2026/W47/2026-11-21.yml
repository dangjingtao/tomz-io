- title: "超导夹心器件同时存储比特和控制电流：低温计算补上记忆元件拼图"
  url: "https://news.mit.edu/2026/tiny-superconducting-sandwich-could-help-computers-use-less-energy-1120"
  source: "MIT Plasma Science and Fusion Center / Physical Review Letters（2026-11-20）"
  radar: "科学 / 硬件 / 科技新闻"
  topic: "超导存储、低温计算、磁性薄膜、非易失性存储、超导二极管"
  discoveredAt: "2026-11-21"
  origin: "radar"
  note: "MIT 11 月 20 日介绍一项发表于 Physical Review Letters 的实验：在两层磁性材料之间夹超薄超导薄膜，通过磁化排列改变超导/电阻状态，构成非易失性记忆单元；团队展示可单独切换一个单元而不干扰相邻单元，同一结构在更低温度下可作为可配置超导二极管。研究者明确表示下一步仍需缩小器件、组成大阵列并量化系统级节能。不可把单元实验说成可商业替代 RAM，也不可宣称已证明 AI 数据中心节电比例。"
  status: "candidate"
  kind: "capability"
  opportunityNote: "目前属于基础研究，尚无直接的小团队商业机会证据；低温制冷、阵列集成和系统能耗是核心反例，不应将实验器件包装为近期创业项目。"
