  note: "Cloudflare 11 月 18 日公布新版开放权重 Clairic，强调复杂文档、PDF 与图像中的表格、列表和日期提取及源文档定位；同时发布更轻量的 90 亿参数 Clairic-flash。模型权重开放不自动等于训练数据、代码、商用许可证或全部部署条件开放；目前未独立核验许可证、硬件要求、中文文档性能及第三方基准。编辑问题：结构化提取是否正从通用大模型高价调用转向专门小模型，哪些业务场景能真实节约成本？"
