  opportunityNote: "可观察面向中小硬件团队的 RTL 优化、仿真回归、PPA 报告与验证辅助，但专业 EDA 授权、工艺数据保密、可靠性责任和高门槛销售限制小团队进入；当前没有独立客户/营收证据。"

