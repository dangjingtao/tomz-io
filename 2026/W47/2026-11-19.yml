- title: "AI 开始优化真实芯片电路：从生成代码走向受验证约束的硬件设计"
  url: "https://openai.com/index/advancing-chip-design-with-our-models/"
  source: "OpenAI Research（2026-11-18）"
  radar: "AI 业界 / 半导体 / 能力拐点"
  topic: "AI 芯片设计、RTL、PPA、AMD、Synopsys、RISC-V"
  discoveredAt: "2026-11-19"
  origin: "radar"
  note: "OpenAI 11 月 18 日公布 AI 辅助芯片设计结果：其 Jalapeño 推理芯片 warp engine 和 matrix unit 标准单元面积分别约降 13% 和 10%，称已在硅片验证；与 AMD 合作的 GPU IP 优化最高报告 14% 改善，部分修改进入送厂设计；并在 PicoRV32 与 Ibex 开源 RISC-V 核上用模拟与综合工具评测。以上均为研究方披露的特定项目和指标，不代表所有芯片均能获得同等改善。重要限制：从规格生成新核时可能省略非基准测试所需功能；综合估计不等于完整物理设计或量产验证。值得追问：AI 的价值是否从写 RTL 转向与 EDA 约束、形式/仿真验证形成可复现优化闭环？"
  status: "candidate"
  imageUrl: null
  imageSourceUrl: "https://openai.com/index/advancing-chip-design-with-our-models/"
