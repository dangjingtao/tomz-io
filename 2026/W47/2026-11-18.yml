- title: "AI 安全扫描的反例：9791 个线索，最终只向维护者交付 99 份私密报告"
  url: "https://github.blog/open-source/maintainers/maintainers-dont-need-more-ai-bug-reports-they-need-fixes/"
  source: "GitHub / Microsoft Codename MDASH 项目复盘（2026-11-17）"
  radar: "开源 / 科技新闻 / 创业失败与反例"
  topic: "Codename MDASH、开源维护者、AI 漏洞报告、人工验证、修复"
  discoveredAt: "2026-11-18"
  origin: "radar"
  note: "GitHub 与 Microsoft 11 月 17 日披露 Codename MDASH 试点：六个参与项目（含 Caddy、Express、ImageMagick）扫描出 9791 个潜在线索，经 AI 分流及七名研究人员人工复核后，向维护者私密提交 99 份附建议修复的报告；截至 11 月 15 日已修复 55 项，其中 14 项已进入发行版本。参与项目事先同意扫描；研究人员每个项目约花两天核验。上述为项目方披露的试点结果，不代表普遍 AI 漏洞检测准确率，也不代表所有 9791 项都是实际漏洞。编辑价值：发现能力廉价化之后，人工验证、沟通与修复仍是瓶颈；不能让维护者替扫描者承担垃圾报告成本。"
  status: "candidate"
  kind: "news"
  opportunityNote: "商业机会可能在高质量复现、人工复核、修复 PR 与验证闭环，而不是廉价批量扫描；但七人团队的复核成本也构成反证，小团队需要验证单位经济性与开源维护者是否愿意付费。"
  imageUrl: null
  imageSourceUrl: "https://github.blog/open-source/maintainers/maintainers-dont-need-more-ai-bug-reports-they-need-fixes/"
  imageSource: "GitHub / Microsoft Codename MDASH 项目复盘（2026-11-17）"
