- title: "GPT-6.2 API 与异步推理折扣：等待时间第一次成为明确的模型定价维度"
  url: "https://developers.openai.com/api/docs/changelog"
  source: "OpenAI API Changelog（2026-11-17）"
  radar: "AI 业界 / 科技新闻 / 能力拐点"
  topic: "GPT-6.2 Astra、Sol、Responses API、background completion、模型成本"
  discoveredAt: "2026-11-18"
  origin: "radar"
  note: "OpenAI 11 月 17 日在 API 更新日志公布 GPT-6.2 Astra 和 Sol，可经 Responses API 与 Chat Completions 使用，工具调用要求 Responses API；同日公开测试两小时与八小时 background completion 窗口，模型 token 费率相对 Standard 分别降低 30% 与 40%。折扣是官方定价/功能声明，未说明端到端任务成本、排队延迟分布或所有模型可用性；具体限制应以文档和计费表为准。观察问题：允许等待的研究、批处理、资料整理是否能与即时交互分层，形成新一轮成本结构变化？"
  status: "candidate"
  kind: "capability"
  opportunityNote: "可探索低时效内容生产、批量评估、长期研究任务的延迟感知调度；中国市场需核验 API 可用性、数据跨境合规、异步结果可靠性和总成本。官方折扣不等于独立产品有盈利空间。"
