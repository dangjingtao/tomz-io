- title: "GitHub AI Scan 支持一次扫描二十个仓库：安全检查开始变成按需服务"
  url: "https://github.blog/changelog/2026-11-16-bulk-start-ai-scan-for-repositories/"
  source: "GitHub Changelog（2026-11-16）"
  radar: "科技新闻 / AI 产品 / 开发工具"
  topic: "GitHub AI Scan、代码安全、组织仓库、按需扫描"
  discoveredAt: "2026-11-17"
  origin: "radar"
  note: "GitHub 11 月 16 日宣布 AI Scan for repositories 可一次启动最多 20 个仓库的扫描，覆盖 CodeQL 不支持的语言，并与现有 code scanning backlog 合并结果；处于公开预览，扫描针对默认分支，不要求 Copilot 许可证。结合 11 月 13 日 REST API 管理能力，观察从 PR 安全检查扩展到整个仓库的组织级按需检查。扫描覆盖范围是官方能力声明，不代表已验证的漏洞检出率或误报率。"
  status: "candidate"
  kind: "capability"
  opportunityNote: "面向中小团队的跨平台安全扫描编排、结果去重和修复验证可能有机会，但 GitHub 本身正扩张此功能；要验证真实成本、误报与客户付费意愿。"
