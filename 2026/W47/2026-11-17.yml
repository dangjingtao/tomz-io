- title: "Git 2.56.1 修复六项漏洞：递归克隆与合并不再只是代码卫生问题"
  url: "https://github.blog/open-source/git/git-security-vulnerabilities-announced-7/"
  source: "GitHub Blog / Git project（2026-11-10）"
  radar: "科技新闻 / 开源安全 / 开发工具"
  topic: "Git 2.56.1、递归克隆、供应链安全、恶意仓库"
  discoveredAt: "2026-11-17"
  origin: "radar"
  note: "Git 项目 11 月 10 日发布修复六项安全漏洞的版本，涉及递归克隆恶意仓库可能触发任意代码执行、意外文件写入以及 merge/二进制 patch 处理中的内存破坏。GitHub 公告列出 Git 2.56.1 及多个维护分支补丁版本，并提醒升级嵌入 Git 的应用。事实为官方安全公告；不能推断所有 CI 环境已修复。编辑问题：自动化代理越来越频繁克隆外部仓库，源代码仓库本身是否已经成为新的输入攻击面？"
  status: "candidate"
  kind: "news"
  opportunityNote: "小团队可探索开发环境和 CI 的 Git 版本审计、隔离克隆与依赖安全基线，但成熟安全工具竞争强，未见独立市场需求验证。"
