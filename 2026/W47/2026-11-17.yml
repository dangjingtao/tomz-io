- title: "GitHub Copilot 11 月 16 日退役三款模型：模型依赖正在变成产品维护成本"
  url: "https://github.blog/changelog/2026-11-16-github-copilot-models-deprecated-on-november-16-2026/"
  source: "GitHub Changelog（2026-11-16）"
  radar: "AI 业界 / 平台政策 / 开发者生态"
  topic: "GitHub Copilot、模型退役、兼容性、平台依赖"
  discoveredAt: "2026-11-17"
  origin: "radar"
  note: "GitHub 11 月 16 日公告 Claude Opus 4.8、Claude Opus 5 与 GPT-5.6 Terra 在大部分 Copilot 使用场景退役，并提供替代模型建议；部分年付个人订阅例外，Claude Opus 5 仍可用于授权范围内的运行时拒绝回退。注意这是 GitHub Copilot 平台内的型号调整，不代表底层模型在所有服务商全面下线。编辑问题：模型更新频繁时，依赖固定型号的提示词、评测与产品质量如何保持可追溯？"
  status: "candidate"
  kind: "news"
  opportunityNote: "跨供应商模型兼容性测试和回归监测存在可研究空间，但模型路由平台已高度竞争；尚无小团队收入证据。"
