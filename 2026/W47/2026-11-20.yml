- title: "Azure DevOps 到 GitHub 的不停工迁移：开发平台转换开始像数据库切换"
  url: "https://github.blog/changelog/2026-11-19-enterprise-live-migrations-from-azure-devops-generally-available/"
  source: "GitHub Changelog（2026-11-19）"
  radar: "科技新闻 / 企业开发平台 / 工程基础设施"
  topic: "Enterprise Live Migrations、Azure DevOps、GitHub Enterprise Cloud、增量同步、迁移切换"
  discoveredAt: "2026-11-20"
  origin: "radar"
  note: "GitHub 11 月 19 日宣布 Azure DevOps Services 到 GitHub Enterprise Cloud（含数据驻留）的 Enterprise Live Migrations 正式可用；官方称迁移期间持续同步提交、分支、PR 等，团队可以继续工作，最后按计划短时切换，并可保留 Azure Boards/Pipelines 连接。此为厂商公布的适用范围和能力，未核验实际停机时间、历史数据完整率、迁移成本及大型组织失败案例。编辑问题：开发平台迁移是否从一次性停机导入变成持续同步与可控 cutover？"
  status: "candidate"
  kind: "news"
  opportunityNote: "企业迁移的验证、身份映射、权限/审计与回滚服务可能存在垂直机会，但 GitHub 已提供官方迁移工具；中国企业还受平台可达性、数据驻留、合规及迁移预算约束，不应推断普遍小团队需求。"
