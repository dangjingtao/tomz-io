- title: "Cloudflare Spend Management：云端预算从事后报警变成运行时限额"
  url: "https://blog.cloudflare.com/spend-management/"
  source: "Cloudflare 官方工程博客（2026-11-13）"
  radar: "科技新闻 / 开发者平台 / 创业产品 / 能力拐点"
  topic: "Cloudflare Workers、Durable Objects、spending caps、计量与成本治理"
  discoveredAt: "2026-11-20"
  origin: "radar"
  note: "Cloudflare 11 月 13 日发布 Spend Management，提供可选的 Workers 与 Durable Objects 支出上限，区别于此前仅在事后发出使用量通知的预算告警。官方工程文章讨论将计量数据用于运行时控制的架构。该消息发生于 11 月 13 日，本次为本周补采而非 11 月 20 日新品；平台自报超过一千万开发者不等于付费用户或功能采用人数。编辑问题：用量计费基础设施能否从可观测性迈向强制预算边界？需核实限额生效粒度、超额时请求行为、计费延迟与实际可覆盖产品，不能推断所有账单均已硬封顶。"
  status: "candidate"
  kind: "capability"
  opportunityNote: "对小团队和按量收费的 AI/云应用，预算硬限制可能比纯成本看板更重要；中国市场需比较阿里云、腾讯云及第三方网关既有预算能力、停机副作用和告警延迟。平台功能发布并不证明独立 SaaS 市场空白。"
  imageUrl: null
  imageSourceUrl: "https://blog.cloudflare.com/spend-management/"
  imageSource: "Cloudflare 官方工程博客"
  imageNote: "未核实原站配图复用授权，仅保存来源；未下载或上传 R2。"
  imageStatus: "none"

- title: "开源不止是 AI：Replica 与 ACCESSIBILITY.md 将设计和无障碍带进协作基础设施"
  url: "https://github.blog/open-source/maintainers/the-best-things-in-open-source-are-built-together/"
  source: "GitHub 官方博客（2026-11-19）"
  radar: "设计文化 / 开源 / 科技新闻 / 人的现场"
  topic: "Replica、Open Source Accessibility Framework、ACCESSIBILITY.md、设计原型、开源协作"
  discoveredAt: "2026-11-20"
  origin: "radar"
  note: "GitHub 11 月 19 日介绍两个已在此前推出的开源项目：Replica 让设计师在设计系统内创建和迭代 AI 原型，并通过 Replica Hub 协作；Open Source Accessibility Framework 与 ACCESSIBILITY.md 将无障碍目标、已知障碍、贡献规则和反馈渠道变成可追踪的项目约定。文章还提供设计师从艺术背景进入开源协作的第一人称经验。注意 11 月 19 日是总结文章发表日期，Replica 并非当天首次发布；'系统会从交互中学习' 属厂商描述，尚无独立效果验证。编辑价值在于让设计质量与可访问性进入工程协作，而非再次炒作生成式原型。"
  status: "candidate"
  kind: "product"
  opportunityNote: "中文设计团队或开源项目可研究低门槛设计系统原型与无障碍验收工作流，但需要核对 Replica 真实许可证、部署成本、中文设计系统兼容性与现有 Figma/国产工具能力；尚无用户留存或营收证据。"
  imageUrl: null
  imageSourceUrl: "https://github.blog/open-source/maintainers/the-best-things-in-open-source-are-built-together/"
  imageSource: "GitHub 官方博客"
