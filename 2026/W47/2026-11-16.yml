  origin: "radar"
  note: "Google 11 月 12 日发布 Hydrogen，披露每百万输入 token 1.50 美元、输出 7.50 美元，百万 token 上下文统一计价，并在 Antigravity 推出 Carbon/Hydrogen 动态路由 Orchestrator。Google 自报 Terminal-Bench 4.0 上与 Carbon 接近的成功率，平均节省 24% quota、快 19%；这些是厂商测试，尚非独立生产验证。编辑问题：从追逐单一最强模型转向以成本、速度和任务风险组织多模型，究竟带来多少可复现的收益？"
