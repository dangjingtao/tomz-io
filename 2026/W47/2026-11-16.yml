- title: "Spacefast：AI 做出应用后，部署与长期托管成为新的产品层"
  url: "https://automattic.com/2026/11/09/meet-spacefast/"
  source: "Automattic 官方博客（2026-11-09）"
  radar: "全球创新产品 / 创业机会 / 开发工具"
  topic: "Spacefast、AI 应用部署、SQL 数据库、MCP、应用交付"
  discoveredAt: "2026-11-16"
  origin: "radar"
  note: "Automattic 11 月 9 日宣布 Spacefast 面向所有人开放，支持既有 AI 工具通过 API、CLI、MCP 发布应用，提供托管、SQL 数据库、版本固定链接、回滚、访问控制与评论协作；内置应用认证仍标为即将推出。产品起点是创始人观察非技术朋友用 AI 造出项目后仍不会处理 GitHub 和部署，先做静态托管后扩展后端。公开材料为公司介绍，未提供可独立核验的付费用户、留存或营收。"
  status: "candidate"
  kind: "product"
  opportunityNote: "机会可能不在再造代码生成器，而在 AI 作品发布后的域名、认证、数据库、审计、回滚和协作。中国市场需核对备案、国内托管、微信登录与支付、内容合规及与现有云平台的差异；暂不视为已验证创业机会。"
