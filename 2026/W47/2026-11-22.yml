- title: "个人造芯片：Expresso 四端口以太网交换 ASIC 与共享晶圆的门槛变化"
  url: "https://essenceia.github.io/projects/expresso/"
  source: "Tales on the Wire 作者原文、Expresso ASIC 上游 README、wafer.space 官方网站"
  radar: "硬件 / 能力拐点 / 独立开发者"
  topic: "Expresso ASIC、共享晶圆、GF180MCU、开放硬件"
  note: "本周从阮一峰周刊第420期补采，非今日发布。作者记录个人设计四端口100Mbps交换芯片的过程；上游仓库说明采用180nm开放PDK、参与第二次共享晶圆批次，设计采用CERN-OHL-S v2，且作者声明未使用AI。该批次得到赞助。wafer.space官网列出1000颗裸片2000美元的第三批次早鸟价，早鸟已于9月30日结束，正常价不能沿用；购位截止12月9日，预计2027年第二季度交货。尚未核实成品测试与真实总成本，不将流片设计等同于量产。上游：https://github.com/Essenceia/Expresso_ASIC_Chip ；价格：https://wafer.space/ 。"
  status: "candidate"
  kind: "capability"
  opportunityNote: "共享晶圆降低原型制造门槛可能催生教育、验证与小批量专用芯片服务；封装、测试、设计能力、出口与交付条件仍需调查，尚无中国市场需求验证。"
