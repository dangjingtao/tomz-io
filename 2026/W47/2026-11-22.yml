  note: "上游 README 显示工作簿把单元格、Markdown笔记、图表、控件和动作写入普通 .workbook.py 文件，支持依赖更新、Git diff、本地浏览器编辑与命令行运行，要求Python 3.12+，MIT许可证。piwheels列出0.1.0发布于11月17日：https://www.piwheels.org/project/reaktiv-workbook/ 。尚未实际安装测试；Python文件本身可执行，不应把陌生工作簿视为安全数据文件。值得观察电子表格与可版本化业务逻辑的结合。"
