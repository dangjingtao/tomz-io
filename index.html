    try {
      const theme = localStorage.getItem("mira-color-theme");
      if (["claude", "apple", "supabase"].includes(theme)) {
        document.documentElement.dataset.theme = theme;
      }
      const darkMode = localStorage.getItem("mira-theme");
      if (darkMode === "dark") {
        document.documentElement.classList.add("dark");
      }
    } catch {}
  </script>
