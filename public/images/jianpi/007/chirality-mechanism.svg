<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d">
<title id="t">从几乎对称，到一边赢下比赛</title><desc id="d">手性、Kagan 非线性放大与 Soai 自催化示意图</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f8f5ff"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7040e8"/></marker></defs>
<rect width="1400" height="900" fill="url(#bg)"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" fill="#222">
<text x="80" y="88" font-size="42" font-weight="700">从几乎对称，到一边赢下比赛</text><text x="80" y="126" font-size="22" fill="#666">手性、非线性放大与自催化的直观示意</text>
<g transform="translate(80 180)"><rect width="380" height="260" rx="24" fill="#fff" stroke="#e8e2ff"/><text x="28" y="42" font-size="27" font-weight="700">1. 镜像分子像左右手</text><text x="28" y="78" font-size="19" fill="#666">结构互为镜像，却不能完全重合</text><path d="M75 178c-28-35-28-95 4-99 18-2 22 24 25 46 4-38 10-75 34-70 22 5 18 47 18 66 7-39 15-68 37-62 24 7 10 61 3 80 17-35 32-51 48-38 17 14-4 72-34 94-31 23-93 18-135-17z" fill="#7040e8" opacity=".88"/><path d="M306 178c28-35 28-95-4-99-18-2-22 24-25 46-4-38-10-75-34-70-22 5-18 47-18 66-7-39-15-68-37-62-24 7-10 61-3 80-17-35-32-51-48-38-17 14 4 72 34 94 31 23 93 18 135-17z" fill="#ff8b5e" opacity=".88"/><text x="108" y="232" font-size="20" fill="#5830b6">左手</text><text x="258" y="232" font-size="20" fill="#a84f2c">右手</text><text x="188" y="174" font-size="28" fill="#999">≠</text></g>
<g transform="translate(500 180)"><rect width="380" height="260" rx="24" fill="#fff" stroke="#e8e2ff"/><text x="28" y="42" font-size="27" font-weight="700">2. Kagan：偏差会被放大</text><text x="28" y="78" font-size="19" fill="#666">催化剂只偏一点，产物却可能偏很多</text><line x1="58" y1="210" x2="330" y2="210" stroke="#666" stroke-width="2"/><line x1="58" y1="210" x2="58" y2="104" stroke="#666" stroke-width="2"/><line x1="70" y1="198" x2="315" y2="110" stroke="#bbb" stroke-width="3" stroke-dasharray="8 8"/><path d="M70 198C125 190 165 170 200 140s70-60 115-88" fill="none" stroke="#7040e8" stroke-width="6"/><text x="235" y="75" font-size="18" fill="#7040e8">非线性放大</text><text x="175" y="242" font-size="17" fill="#666">催化剂对映体过量</text></g>
<g transform="translate(920 180)"><rect width="400" height="260" rx="24" fill="#fff" stroke="#e8e2ff"/><text x="28" y="42" font-size="27" font-weight="700">3. Soai：产物催化自己</text><text x="28" y="78" font-size="19" fill="#666">一点点领先，可能滚成近乎单一手性</text><g font-size="20" text-anchor="middle"><rect x="35" y="130" width="90" height="42" rx="10" fill="#efe7ff"/><text x="80" y="158">50.01</text><rect x="35" y="188" width="90" height="42" rx="10" fill="#fff0e8"/><text x="80" y="216">49.99</text><text x="151" y="181" font-size="28" fill="#7040e8">→</text><rect x="180" y="130" width="70" height="42" rx="10" fill="#efe7ff"/><text x="215" y="158">70</text><rect x="180" y="188" width="70" height="42" rx="10" fill="#fff0e8"/><text x="215" y="216">30</text><text x="281" y="181" font-size="28" fill="#7040e8">→</text><rect x="305" y="130" width="80" height="42" rx="10" fill="#efe7ff"/><text x="345" y="158">99.99</text><rect x="305" y="188" width="80" height="42" rx="10" fill="#fff0e8"/><text x="345" y="216">0.01</text></g></g>
<g transform="translate(80 500)"><rect width="1240" height="290" rx="24" fill="#fff" stroke="#e8e2ff"/><text x="30" y="48" font-size="28" font-weight="700">文章里最需要说清的边界</text><g font-size="22" fill="#333"><text x="42" y="100">• L / D 是构型命名，不等于“左旋 / 右旋”。</text><text x="42" y="150">• Kagan：不对称催化里的小偏差，可以被非线性效应放大。</text><text x="42" y="200">• Soai：产物可以自催化，微小差异能滚成接近单一手性。</text><text x="42" y="250">• 这仍不是地球生命为何选择今天这套手性的最终答案。</text></g><path d="M950 95C1050 120 1130 165 1210 225" fill="none" stroke="#7040e8" stroke-width="5" marker-end="url(#a)"/><text x="955" y="75" font-size="20" fill="#7040e8">从微小偏差，到明显偏向</text></g>
</g></svg>