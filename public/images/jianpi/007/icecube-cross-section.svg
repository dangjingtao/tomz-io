<g><rect x="80" y="800" width="1240" height="70" rx="20" fill="#fff" opacity=".94"/><text x="105" y="830" font-size="20" font-weight="700" fill="#1c2b3b">为什么要做到一立方公里？</text><text x="105" y="858" font-size="18" fill="#445">因为中微子几乎不和任何东西发生作用。体积足够大，才有机会等到足够多真正来自宇宙深处的事件。</text></g></g></svg>