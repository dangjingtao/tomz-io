<svg xmlns="http://www.w3.org/2000/svg" width="440" height="450" viewBox="0 0 440 450" role="img" aria-labelledby="title desc">
<title id="title">Blackboard · 黑板</title><desc id="desc">多个 Agent 读写共享证据状态，由程序控制版本、预算和终止。</desc>
<style>
svg{color:#344654;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
text{fill:#344654;font-size:18px;text-anchor:middle}
.small{font-size:15px;fill:#526573}.heading{font-size:21px;font-weight:600}
.agent{fill:#eaf1f8;stroke:#7694b0}.data{fill:#e6f2ed;stroke:#5b9881}.plain{fill:#f5f5f2;stroke:#a0a8ac}.warn{fill:#fbefdf;stroke:#bd8c46}
.node{stroke-width:1.5}.edge{stroke:#657c8b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}.dash{stroke-dasharray:5 5}
@media(prefers-color-scheme:dark){svg{color:#e3e9ef}text{fill:#e3e9ef}.small{fill:#b9c6cf}.agent{fill:#202f40;stroke:#7598bd}.data{fill:#1d3832;stroke:#6ea58d}.plain{fill:#2b3035;stroke:#89949b}.warn{fill:#3c3022;stroke:#c4a06a}.edge{stroke:#a5b6c4}}
</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#8095a4"/></marker></defs>
