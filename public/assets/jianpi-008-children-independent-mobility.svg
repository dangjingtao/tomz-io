<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 285" width="840" height="285" role="img" aria-labelledby="title desc"><title id="title">孩子独自上学的自由，曾经减少得很快</title><desc id="desc">1971 年80%；1990 年9%。英国受调查的 7—8 岁儿童；历史样本，不代表今日世界。</desc><rect width="840" height="285" fill="#f7f5ef"/><text x="45" y="44" fill="#252e38" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700">孩子独自上学的自由，曾经减少得很快</text><text x="45" y="73" fill="#68727b" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="11">Hillman 等 · 1990 年英国调查（1971 与 1990 对照）</text><g transform="translate(45,99)"><rect width="368" height="107" rx="5" fill="#e7ebe7"/><text x="20" y="61" fill="#252e38" font-size="43" font-weight="700" font-family="Arial,sans-serif">80%</text><text x="20" y="91" fill="#52616c" font-size="13" font-family="Arial,Noto Sans CJK SC,sans-serif">1971 年</text></g><g transform="translate(429,99)"><rect width="368" height="107" rx="5" fill="#f4e4db"/><text x="20" y="61" fill="#a34f38" font-size="43" font-weight="700" font-family="Arial,sans-serif">9%</text><text x="20" y="91" fill="#52616c" font-size="13" font-family="Arial,Noto Sans CJK SC,sans-serif">1990 年</text></g><line x1="45" x2="797" y1="231" y2="231" stroke="#d2d4cb"/><text x="45" y="255" fill="#63717d" font-size="11" font-family="Arial,Noto Sans CJK SC,sans-serif">英国受调查的 7—8 岁儿童；历史样本，不代表今日世界。</text><text x="45" y="271" fill="#63717d" font-size="10" font-family="Arial,Noto Sans CJK SC,sans-serif">《见π》编辑制图 · 请结合正文理解统计口径</text></svg>