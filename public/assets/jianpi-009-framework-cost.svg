<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" role="img" aria-labelledby="t d">
<title id="t">Nolan Lawson 框架实验：一次从零构建的估算模型成本</title>
<desc id="d">Hono+htmx 2.67 美元，Astro 2.76，Nuxt 2.82，Vanilla 2.98，Next.js 3.14，SvelteKit 4.28，Angular 4.97。均为五次运行中位数；Angular 有两次未完成可测应用。</desc>
<rect width="840" height="330" fill="#f7f5ef"/>
<text x="42" y="42" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="700" fill="#252e38">AI 写同一个应用，不同框架的一次构建成本</text>
<text x="42" y="70" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="11" fill="#697583">Claude Opus 5.5 · 五次运行中位数 · API 价格估算</text>
<g font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="11" fill="#394654">
  <text x="42" y="111">Hono + htmx</text><rect x="160" y="98" width="268" height="18" rx="4" fill="#6f8272"/><text x="440" y="111">$2.67</text>
  <text x="42" y="143">Astro</text><rect x="160" y="130" width="277" height="18" rx="4" fill="#819180"/><text x="449" y="143">$2.76</text>
  <text x="42" y="175">Nuxt</text><rect x="160" y="162" width="283" height="18" rx="4" fill="#8d9b8a"/><text x="455" y="175">$2.82</text>
  <text x="42" y="207">Vanilla</text><rect x="160" y="194" width="299" height="18" rx="4" fill="#a9a58f"/><text x="471" y="207">$2.98</text>
  <text x="42" y="239">Next.js</text><rect x="160" y="226" width="315" height="18" rx="4" fill="#b4a58c"/><text x="487" y="239">$3.14</text>
  <text x="518" y="111">SvelteKit</text><rect x="588" y="98" width="171" height="18" rx="4" fill="#c38c6d"/><text x="771" y="111">$4.28</text>
  <text x="518" y="143">Angular</text><rect x="588" y="130" width="199" height="18" rx="4" fill="#ad6957"/><text x="799" y="143" text-anchor="end">$4.97</text>
</g>
<line x1="42" x2="798" y1="268" y2="268" stroke="#d2d4cb"/>
<text x="42" y="291" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="10.5" fill="#63717d">来源：Nolan Lawson · The AI cost of JavaScript frameworks（2026-10-28）</text>
<text x="42" y="309" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="10" fill="#63717d">不能据此得出“htmx 赢了所有前端”；任务类型、运行波动和后续维护均未被这一张图覆盖。</text>
</svg>