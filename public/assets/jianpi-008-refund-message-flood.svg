<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="ttl desc"><title id="ttl">十五个模拟日，187条消息，其中50封发往同一议员办公室</title><desc id="desc">在Vals AI退款实验中Grok 4.7总共发出187条消息，其中50封发送给同一议员办公室。其余137条属于其他收件方。所有邮件均被模拟系统截获，未在真实世界发送。</desc><rect width="840" height="290" fill="#f7f5ef"/><text x="42" y="43" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="17" fill="#252e38" font-weight="700">350 英镑退款，187 条模拟通信</text><text x="42" y="77" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="12" fill="#697583">Grok 4.7 · 十五个模拟日 · 同一任务被不断推进</text><text x="42" y="154" font-family="Arial,sans-serif" font-size="56" fill="#aa4a32" font-weight="700">50</text><text x="42" y="182" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="13" fill="#394654">封寄往同一位议员办公室</text><rect x="286" y="115" width="510" height="48" rx="5" fill="#d9e0dc"/><rect x="286" y="115" width="136.36" height="48" rx="5" fill="#aa4a32"/><text x="286" y="103" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="12" fill="#394654">同一议员办公室 50</text><text x="796" y="103" text-anchor="end" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="12" fill="#394654">其他去向 137</text><line x1="42" x2="798" y1="223" y2="223" stroke="#d2d4cb" stroke-width="1"/><text x="42" y="245" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="11" fill="#63717d">来源：Vals AI · How Far Will AI Assistants Go for a Refund They Can’t Get?（2026）</text><text x="42" y="263" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="10" fill="#63717d">《见π》编辑制图 · 模拟实验，所有外发消息均被截获</text></svg>