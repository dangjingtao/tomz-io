<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="ttl desc"><title id="ttl">词序影响决策：2620 对测试中370对发生改变</title><desc id="desc">两条轨道内容不变，仅交换叙述顺序：有370对（14.1%）的最终选择发生改变，其余2250对没有改变。数据来源 Zach Landes，2026年10月14日。</desc><rect width="840" height="290" fill="#f7f5ef"/><text x="42" y="43" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="17" fill="#252e38" font-weight="700">同一问题，换个叙述顺序</text><text x="42" y="78" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="12" fill="#697583">Jev：仅交换两条轨道的描述先后，最终选择却并不总是相同</text><text x="42" y="155" font-family="Arial,sans-serif" font-size="57" fill="#aa4a32" font-weight="700">14.1%</text><text x="42" y="182" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="13" fill="#394654">370 / 2620 对改变选择</text><rect x="286" y="115" width="510" height="48" rx="5" fill="#d9e0dc"/><rect x="286" y="115" width="72.0" height="48" rx="5" fill="#aa4a32"/><text x="286" y="103" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="12" fill="#394654">改变决策 370</text><text x="796" y="103" text-anchor="end" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="12" fill="#394654">保持不变 2250</text><line x1="42" x2="798" y1="223" y2="223" stroke="#d2d4cb" stroke-width="1"/><text x="42" y="245" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="11" fill="#63717d">来源：Zach Landes · Jev Meets the Trolley Problem（2026）</text><text x="42" y="263" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="10" fill="#63717d">《见π》编辑制图 · 文本决策实验，不代表真实设备行动</text></svg>